<style>
/* Layout: unidades como pestañas arriba; a la izquierda la pregunta, a la derecha el tablero
   de la unidad (puntaje y una grilla de celdas tipo Gantt con el estado de cada pregunta). */
:root {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --ink: #17202c;
  --muted: #586374;
  --line: #d9dfe8;
  --accent: #2457a6;
  --accent-soft: #e4ecf8;
  --ok: #1d7a4b;
  --ok-soft: #e2f3ea;
  --bad: #b4382c;
  --bad-soft: #fbe6e3;
  --cell: #e7ebf1;
  --font-ui: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --panel: #1a2029; --ink: #e5e9ef; --muted: #9aa5b5; --line: #2c3542;
    --accent: #7aa7ec; --accent-soft: #1f2c42; --ok: #5cc08c; --ok-soft: #173326;
    --bad: #f08b7e; --bad-soft: #3a1f1c; --cell: #262e3a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --panel: #1a2029; --ink: #e5e9ef; --muted: #9aa5b5; --line: #2c3542;
  --accent: #7aa7ec; --accent-soft: #1f2c42; --ok: #5cc08c; --ok-soft: #173326;
  --bad: #f08b7e; --bad-soft: #3a1f1c; --cell: #262e3a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 span { color: var(--muted); font-weight: 500; }
.overall { font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }

nav.units { display: flex; flex-wrap: wrap; gap: 8px; }
.unit-btn {
  font: inherit; font-size: 0.86rem; cursor: pointer; text-align: left;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 8px; padding: 7px 11px; display: grid; gap: 1px; min-width: 0;
}
.unit-btn .code { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.04em; }
.unit-btn .mini { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.unit-btn[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }
.unit-btn:hover { border-color: var(--accent); }
@media (max-width: 640px) {
  nav.units { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
  .unit-btn { flex: 0 0 auto; scroll-snap-align: start; }
}
button:focus-visible, .opt:focus-visible, .cell:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; min-width: 0; }
.qhead { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); letter-spacing: 0.03em; text-transform: uppercase; }
.qtext { font-family: var(--font-read); font-size: 1.22rem; line-height: 1.45; margin: 12px 0 18px; text-wrap: pretty; max-width: 62ch; }
.opts { display: grid; gap: 10px; }
.opt {
  font: inherit; text-align: left; cursor: pointer; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 11px 12px;
  transition: border-color .15s, background-color .15s;
}
.opt:hover:not([disabled]) { border-color: var(--accent); background: var(--accent-soft); }
.opt .key { font-family: var(--font-mono); font-size: 0.8rem; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; border: 1px solid var(--line); color: var(--muted); }
.opt[disabled] { cursor: default; }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.correct .key { background: var(--ok); border-color: var(--ok); color: var(--panel); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); border-color: var(--bad); color: var(--panel); }
.opt.dim { opacity: 0.6; }

.feedback { margin-top: 16px; border-radius: 8px; padding: 12px 14px; border: 1px solid var(--line); display: grid; gap: 4px; }
.feedback.ok { border-color: var(--ok); background: var(--ok-soft); }
.feedback.bad { border-color: var(--bad); background: var(--bad-soft); }
.feedback strong { font-size: 0.95rem; }
.feedback p { margin: 0; color: var(--ink); max-width: 68ch; }

.controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; justify-content: space-between; align-items: center; }
.controls .group { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer; border-radius: 8px; padding: 9px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.btn:hover:not([disabled]) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: var(--panel); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.hint { font-size: 0.78rem; color: var(--muted); margin-top: 12px; }

aside.board { display: grid; gap: 14px; }
.score { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { display: grid; gap: 2px; }
.stat .v { font-family: var(--font-mono); font-size: 1.35rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.bar { height: 8px; border-radius: 4px; background: var(--cell); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .g { background: var(--ok); } .bar .r { background: var(--bad); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.75rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.grid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.cell { font: inherit; font-family: var(--font-mono); font-size: 0.66rem; cursor: pointer; aspect-ratio: 1; max-width: 100%; border-radius: 4px; border: 1px solid transparent; background: var(--cell); color: var(--muted); padding: 0; font-variant-numeric: tabular-nums; }
.cell.ok { background: var(--ok); color: var(--panel); }
.cell.bad { background: var(--bad); color: var(--panel); }
.cell.cur { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.board h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0; font-weight: 600; }
.stack { display: grid; gap: 8px; }

.done { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 8px; }
.done h2 { margin: 0; font-size: 1.1rem; }
.done .big { font-family: var(--font-mono); font-size: 2rem; font-variant-numeric: tabular-nums; }

table.sum { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
table.sum th, table.sum td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.sum th { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
table.sum td.num { font-family: var(--font-mono); }
table.sum tr.total td { font-weight: 700; border-bottom: none; }
.linkbtn { font: inherit; background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const UNITS = [{"id":"u1","nombre":"Robótica, roboética y legislación","tp":"TP5","qs":[{"q":"¿Dónde surgió la palabra «robot»?","o":["En la obra de teatro checa R.U.R., de Karel Čapek (1921)","En el libro El hombre bicentenario, de Asimov (1976)","En la leyenda del Golem de Praga (siglo XVI)","En la novela Yo, robot, de Isaac Asimov (1950)"],"a":0,"e":"La palabra aparece en Rossum's Universal Robots (R.U.R.), estrenada en 1921. Asimov y el Golem también figuran en las diapositivas, pero como ficción posterior o mito previo. (Robótica, «La palabra robot»)"},{"q":"¿Qué significa la palabra checa «robota», de la que deriva «robot»?","o":["Máquina o mecanismo","Trabajo o labor","Razón o entendimiento","Hombre artificial"],"a":1,"e":"«Robota» es trabajo o labor (el período que un siervo trabajaba para su señor). «Razón» es «rozum», el juego de palabras con el apellido Rossum. (Robótica, «La palabra robot»)"},{"q":"¿Cómo eran los robots de la obra R.U.R.?","o":["Personas esclavizadas por la compañía fabricante","Entidades biológicas que se ensamblaban en lugar de nacer","Máquinas metálicas controladas a distancia por sus dueños","Autómatas mecánicos de relojería, sin capacidad de razonar"],"a":1,"e":"En R.U.R. los robots eran máquinas biológicas que se confundían con humanos, pero no nacían: eran ensamblados. (Robótica, «Robótica – Historia»)"},{"q":"¿Cuál NO es uno de los cuatro aspectos centrales con que la cátedra (citando a COMEST) caracteriza a los robots contemporáneos?","o":["Autonomía","Movilidad","Interactividad","Aprendizaje"],"a":3,"e":"Los cuatro aspectos son movilidad, interactividad, comunicación y autonomía. El aprendizaje aparece al hablar de las máquinas cognitivas, pero no es uno de los cuatro. (Robótica, «Una definición de robot»)"},{"q":"Según la definición de robot de la cátedra, la interactividad es posible gracias a…","o":["Interfaces de reconocimiento y de síntesis de voz para hablar con personas","La capacidad de razonar y decidir por sí mismo, sin control externo directo","Ruedas, piernas o hélices para desplazarse por entornos humanos","Sensores que recogen datos del entorno y efectores que actúan sobre él"],"a":3,"e":"Interactividad = sensores + efectores. Las interfaces de voz son la comunicación; razonar sin control externo es la autonomía; desplazarse es la movilidad. (Robótica, «Una definición de robot»)"},{"q":"En la definición de robot de la cátedra, la autonomía es…","o":["La capacidad de funcionar largo tiempo sin recargar su batería ni recibir mantenimiento","La capacidad de aprender de la experiencia sin necesidad de datos etiquetados","La capacidad de moverse en entornos humanos o peligrosos para los humanos","La capacidad de razonar y tomar sus propias decisiones sin control externo directo"],"a":3,"e":"Autonomía, en el sentido de «razonar» por sí mismo y actuar sin control externo directo. Moverse en entornos peligrosos corresponde a la movilidad. (Robótica, «Una definición de robot»)"},{"q":"¿Cuál de estos elementos es un efector de un robot?","o":["Un sonar","Un GPS","Un acelerómetro","Una pinza"],"a":3,"e":"Los efectores actúan sobre el mundo (piernas, ruedas, brazos, pinzas, hélices). Sonar, GPS, cámara y acelerómetro son sensores. (Robótica, «Agentes físicos»)"},{"q":"¿Cuál es la diferencia principal entre un robot y un agente de software?","o":["La complejidad: el entorno de un agente de software es siempre más simple","La autonomía: un agente de software no toma decisiones propias","El entorno: el robot percibe y actúa sobre el mundo físico","La percepción: un agente de software no tiene sensores"],"a":2,"e":"Los dos son agentes con sensores y efectores; cambia el entorno. Un agente de software en Internet puede tener un entorno tan complejo como el mundo físico. (Robótica, «Agentes físicos»; TP5, ej. 1)"},{"q":"¿Qué limitaciones tiene típicamente el entorno de un robot real?","o":["Es determinista, pero tiene demasiados estados para buscar","Es estático, pero los sensores no tienen suficiente precisión","Es totalmente observable, pero los efectores son lentos","Es parcialmente observable, estocástico, dinámico y continuo"],"a":3,"e":"La cámara no ve detrás de una esquina (parcialmente observable), los motores patinan (estocástico), el mundo cambia mientras el robot decide (dinámico) y las posiciones son continuas. (TP5, ej. 1)"},{"q":"Según el reporte de COMEST, ¿cuál es la característica principal de las «máquinas cognitivas»?","o":["Operan solamente en entornos industriales o en aplicaciones militares","Ejecutan un programa fijo, completamente previsto por el fabricante","Deciden de forma impredecible, según el azar y la experiencia","Imitan la apariencia y los gestos de una persona hasta confundirse con ella"],"a":2,"e":"Al basarse en IA, sus decisiones son impredecibles y dependen de situaciones estocásticas y de la experiencia. Un robot determinista, en cambio, está preprogramado. (Robótica, «Máquinas cognitivas que inducen cambios sociales»)"},{"q":"Como las decisiones de las máquinas cognitivas son impredecibles, COMEST considera crucial la cuestión de…","o":["La seguridad informática de sus comunicaciones","La velocidad con que toman decisiones en tiempo real","La responsabilidad por las acciones de los robots","La capacidad de explicar su razonamiento"],"a":2,"e":"Si nadie programó explícitamente una acción, ¿quién responde por ella? Por eso la responsabilidad (accountability) es la cuestión central. (Robótica, «Máquinas cognitivas que inducen cambios sociales»)"},{"q":"Según COMEST, ¿cómo cambió el uso de los robots desde mediados del siglo XX?","o":["Pasaron del entretenimiento y los juguetes a las aplicaciones militares","Pasaron de la exploración espacial a la industria automotriz y la logística","Pasaron de la investigación académica a la agricultura y la minería","Pasaron de la industria y lo militar al transporte, la salud y el hogar"],"a":3,"e":"Inicialmente se usaban sobre todo en aplicaciones industriales y militares; ahora surgen en transporte, salud, educación y entorno doméstico. (Robótica, «Máquinas cognitivas que inducen cambios sociales»)"},{"q":"¿Qué problemas investiga la robótica cognitiva?","o":["El diseño mecánico de articulaciones, motores y actuadores de precisión","El procesamiento de bajo nivel de las señales que entregan los sensores","Funciones de alto nivel: conocimiento, razonamiento, planificación","La interacción emocional entre los robots y las personas que los usan"],"a":2,"e":"Representación de conocimiento, razonadores, planificadores, razonamiento sobre acciones y cambio, revisión de conocimiento y arquitecturas de agentes: muchos temas de la materia. (Robótica, «Robótica cognitiva»)"},{"q":"¿Qué propone el reporte de COMEST como respuesta a los problemas éticos de los robots cognitivos?","o":["Concientizar y promover un diálogo público e inclusivo","Dejar la regulación en manos de los fabricantes","Exigir que todo robot sea controlado a distancia","Prohibir el uso de robots autónomos dentro de los hogares"],"a":0,"e":"El reporte busca crear conciencia y promover la consideración pública y el diálogo inclusivo: las decisiones éticas sobre robots no deberían quedar solo en manos de expertos. (TP5, ej. 6)"},{"q":"¿Por qué la sonda OSIRIS-REx fue programada para actuar con autonomía?","o":["Porque la NASA prohíbe el control remoto de las sondas","Porque el polvo del asteroide Bennu bloquea las señales de radio","Porque la comunicación con la Tierra tiene minutos de retardo","Porque no tiene antena para comunicarse con la Tierra"],"a":2,"e":"A esa distancia, una orden desde la Tierra tarda minutos en llegar (la luz tarda unos 8 minutos del Sol a la Tierra), así que la sonda tiene que decidir según su percepción y sus metas. (Robótica, «Dominios de aplicación: exploración»)"},{"q":"¿En qué tres categorías agrupa la cátedra a la mayoría de los robots actuales?","o":["Industriales, de servicio y militares","Reactivos, deliberativos e híbridos","Terrestres, aéreos y submarinos","Manipuladores, móviles e híbridos"],"a":3,"e":"Manipuladores (anclados a su lugar de trabajo), móviles (se mueven por su entorno) e híbridos (móviles con manipuladores, y humanoides). Reactivo/deliberativo es una clasificación de agentes, no de robots. (Robótica, «Robots – categorías»)"},{"q":"Un robot humanoide pertenece a la categoría de robots…","o":["Móviles","Autónomos","Híbridos","Manipuladores"],"a":2,"e":"Los híbridos son robots móviles con manipuladores, y la cátedra incluye ahí a los humanoides. (Robótica, «Robots – categorías»)"},{"q":"Un brazo robot que suelda piezas en una línea de montaje es un robot…","o":["Híbrido","Humanoide","Móvil","Manipulador"],"a":3,"e":"Los manipuladores (brazos robot) están anclados a su lugar de trabajo. (Robótica, «Robots – categorías»)"},{"q":"Según la cátedra, ¿qué distingue a la ética de la moral?","o":["La moral busca principios universales; la ética se basa en las costumbres de cada cultura","La ética busca principios universales; la moral se basa en las costumbres de cada cultura","La ética se aplica a las máquinas; la moral se aplica solamente a las personas","La ética la fijan las leyes del Estado; la moral la fija la religión de cada persona"],"a":1,"e":"La ética es la rama de la filosofía que reflexiona críticamente sobre lo correcto y busca principios universales; la moral es el conjunto de normas y valores de una sociedad, basada en costumbres. (Robótica, «Ética y Moral»)"},{"q":"Según la cátedra, la moral es…","o":["Universal y basada en la filosofía","Personal y distinta en cada individuo","Rígida y específica de cada cultura","Flexible y sujeta a revisión crítica"],"a":2,"e":"La moral es conservadora y particular de cada sociedad. Flexible, crítica y universal describe a la ética. (Robótica, «Ética y Moral»)"},{"q":"¿Qué es la COMEST?","o":["Un órgano asesor de la UNESCO sobre ética de la ciencia y la tecnología","Un consorcio internacional de fabricantes que fija estándares de robótica","Una subsecretaría argentina que emitió recomendaciones para una IA fiable","Una comisión del Parlamento Europeo que redactó normas de derecho civil sobre robótica"],"a":0,"e":"La Comisión Mundial de Ética del Conocimiento Científico y la Tecnología fue creada por la UNESCO en 1998 como órgano asesor y foro de reflexión. En 2017 presentó su reporte sobre ética robótica. (Robótica, «Reporte de COMEST en Robo-ética»)"},{"q":"¿Qué establece la ley «respetar el rechazo de la atención por parte de un robot» del derecho civil europeo?","o":["Que una persona puede negarse a ser cuidada por un robot","Que un hospital puede rechazar robots no certificados","Que un robot puede negarse a cumplir una orden dañina","Que un robot debe detenerse si comete un error médico"],"a":0,"e":"Es el derecho de una persona a negarse a ser cuidada por un robot, por ejemplo cuando su presencia le resulta insoportable (robots que dan de comer a personas mayores). (Robótica, «Ley civil Europea: leyes en robótica»)"},{"q":"Un robot de cuidado le impide a una persona tomar alcohol, «por su bien». ¿Qué ley del derecho civil europeo vulnera?","o":["Proteger contra la manipulación por robots","Evitar la disolución de los vínculos sociales","Proteger a los humanos de los daños de robots","Proteger la libertad humana frente a los robots"],"a":3,"e":"Es el ejemplo de la propia norma: un robot no puede imponer comportamientos, debe respetar la autonomía de decisión de la persona. (Robótica, «Ley civil Europea: leyes en robótica»)"},{"q":"Un robot de compañía simula emociones y la persona desarrolla un vínculo afectivo con él. ¿Qué principio del derecho civil europeo apunta a ese riesgo?","o":["Respetar el rechazo de la atención por parte de un robot","Proteger a la humanidad contra la manipulación por robots","Proteger la privacidad frente a los robots","Garantizar la igualdad de acceso al progreso en robótica"],"a":1,"e":"La norma advierte que la empatía artificial es un peligro: cuando un robot simula emociones, la persona puede desarrollar un vínculo y quedar expuesta a ser manipulada. (Robótica, «Ley civil Europea: leyes en robótica»)"},{"q":"¿Por qué el derecho civil europeo propone restringir el acceso humano a las tecnologías de mejora?","o":["Para que los exoesqueletos solo se usen bajo estricta supervisión médica","Porque las prótesis robóticas son demasiado caras para la salud pública","Para evitar cyborgs que obliguen a los humanos a mejorarse o desaparecer","Porque los implantes con sensores ponen en riesgo los datos personales"],"a":2,"e":"Parece contradictorio con la igualdad de acceso, pero apunta a la creación de criaturas híbridas (cyborgs) que dejarían en el olvido a los humanos en su forma actual. (Robótica, «Ley civil Europea: leyes en robótica»)"},{"q":"¿Por qué el derecho civil europeo considera crucial la gestión de los datos personales que procesan los robots?","o":["Porque al comunicarse entre sí pueden intercambiar datos de forma imperceptible","Porque sus sensores siguen registrando datos aun cuando el robot está apagado","Porque un robot no puede distinguir entre datos personales y datos públicos","Porque la ley exige guardar todos los datos en servidores dentro de la Unión Europea"],"a":0,"e":"Los robots recopilan grandes volúmenes de datos y, cuando se comunican, esa comunicación puede ser imperceptible para los humanos. (Robótica, «Ley civil Europea: leyes en robótica»)"},{"q":"Según la ley «evitar la disolución de los vínculos sociales», un robot que asiste a personas mayores debería…","o":["Reemplazar al personal de salud en las tareas de cuidado repetitivas y nocturnas","Ser usado solo cuando la persona no tenga familiares que puedan cuidarla","Ayudarlas a ser más independientes, sin aislarlas ni reemplazar a los humanos","Avisar a la familia cada vez que la persona pase demasiado tiempo sola"],"a":2,"e":"El robot debe mejorar la calidad de vida sin aislar al paciente: actuar como un agente que ayuda a ser más independiente, pero que no puede sustituir a los humanos por completo. (Robótica, «Ley civil Europea: leyes en robótica»)"},{"q":"Según la Carta de los Derechos Fundamentales de la UE, citada en las normas de derecho civil sobre robótica, ¿qué es el fundamento de todos los derechos?","o":["La protección de la vida","La igualdad ante la ley","La dignidad humana","La libertad individual"],"a":2,"e":"La Carta (7 de diciembre de 2000) establece la dignidad humana como fundamento de todos los derechos; la cátedra la cita junto a la primera ley, proteger a los humanos de los daños causados por robots. (Robótica, «Ley civil Europea: leyes en robótica»)"},{"q":"Según los considerandos del Parlamento Europeo, ¿cómo debería ser la definición de robot y de inteligencia artificial?","o":["Distinta en cada Estado miembro, según su industria local","Basada en la forma física del robot y en su grado de autonomía","Técnica y precisa, para no dejar lugar a dudas en los tribunales","Generalmente aceptada y flexible, para no frenar la innovación"],"a":3,"e":"Considerando C: crear una definición generalmente aceptada de robot y de IA que sea flexible y no lastre la innovación. (Robótica, «Normas de Derecho civil sobre robótica»)"},{"q":"¿Cuál de estas afirmaciones describe a la Recomendación sobre la ética de la IA de la UNESCO (2021)?","o":["Es una ley de cumplimiento obligatorio en la Unión Europea","Fue redactada por la COMEST como parte de su reporte de 2017","Clasifica los sistemas de IA según su nivel de riesgo","Fue adoptada por los 193 Estados miembros de la UNESCO"],"a":3,"e":"La adoptaron los 193 Estados miembros en noviembre de 2021. La clasificación por riesgo es de la Ley de IA europea (2024). (Robótica, «Recomendación sobre la ética de la IA»)"},{"q":"¿Por qué la Recomendación de la UNESCO interpreta la IA en un sentido amplio?","o":["Porque una definición fija quedaría obsoleta por el rápido cambio tecnológico","Porque los Estados miembros no lograron acordar una definición técnica común","Porque los principios éticos deben aplicarse por igual a cualquier software","Porque así abarca también a los robots físicos y no solamente a los programas"],"a":0,"e":"Define a la IA como sistemas con capacidad de procesar datos de forma similar a un comportamiento inteligente; una definición estrecha haría inviables las políticas a futuro. (Robótica, «Recomendación sobre la ética de la IA»)"},{"q":"¿Cuál NO es uno de los cuatro valores fundamentales de la Recomendación de la UNESCO sobre la ética de la IA?","o":["Derechos humanos y dignidad humana","Florecimiento del medio ambiente y los ecosistemas","Competitividad e innovación tecnológica","Garantizar la diversidad y la inclusión"],"a":2,"e":"Los cuatro valores son: derechos humanos y dignidad humana, vivir en sociedades pacíficas, garantizar la diversidad y la inclusión, y florecimiento del medio ambiente y los ecosistemas. (Robótica, «Recomendación sobre la ética de la IA»)"},{"q":"Según el principio de «supervisión y decisión humanas» de la UNESCO…","o":["Todo sistema de IA debe poder apagarse a distancia ante una falla de funcionamiento","Una persona debe aprobar una por una todas las decisiones que tome un sistema de IA","La IA solo puede usarse como apoyo a la decisión, nunca para automatizar tareas","Siempre debe poder atribuirse la responsabilidad a personas físicas o jurídicas"],"a":3,"e":"El principio pide que siempre sea posible atribuir la responsabilidad a personas físicas o a entidades jurídicas existentes; no exige aprobar cada decisión. (Robótica, «Diez principios básicos»)"},{"q":"¿Qué principio de la UNESCO establece que el uso de un sistema de IA no debe ir más allá de lo necesario para alcanzar un objetivo legítimo?","o":["Seguridad y protección","Proporcionalidad e inocuidad","Sostenibilidad","Responsabilidad y rendición de cuentas"],"a":1,"e":"Proporcionalidad e inocuidad: no ir más allá de lo necesario, y evaluar riesgos para prevenir daños. Seguridad y protección habla de evitar daños no deseados y vulnerabilidades a ataques. (Robótica, «Diez principios básicos»)"},{"q":"Según la UNESCO, el nivel de transparencia y explicabilidad de un sistema de IA…","o":["Debe adecuarse al contexto, porque puede chocar con la privacidad o la seguridad","Solo es exigible a los sistemas de alto riesgo antes de que se puedan comercializar","Debe ser el máximo posible, porque es la única base de la confianza en un sistema de IA","Queda a criterio de cada empresa, para proteger sus secretos comerciales y algoritmos"],"a":0,"e":"El nivel de T&E debe ser adecuado al contexto: puede haber tensiones entre T&E y otros principios como la privacidad, la seguridad y la protección. (Robótica, «Diez principios básicos»)"},{"q":"¿Qué agrega la Recomendación de la UNESCO, además de valores y principios, para llevarlos a la práctica?","o":["Siete requisitos técnicos que deben certificar los fabricantes","Once ámbitos de acción política, como datos, género o educación","Un calendario de prohibiciones que se aplican entre 6 y 36 meses","Una clasificación de los sistemas de IA en cuatro niveles de riesgo"],"a":1,"e":"Los once ámbitos de acción política permiten traducir los principios en estrategias prácticas. Los niveles de riesgo y el calendario son de la Ley de IA europea; los siete requisitos, de las Directrices Éticas europeas. (Robótica, «Once ámbitos de acción política»)"},{"q":"¿Qué son las «Recomendaciones para una Inteligencia Artificial Fiable» (2023)?","o":["El primer acto regulatorio de IA del Sector Público Nacional argentino","La primera ley integral sobre IA del mundo, aprobada por la Unión Europea","El reporte de la COMEST sobre la ética de los robots presentado a la UNESCO","La declaración sobre seguridad de la IA firmada por 28 países en Bletchley Park"],"a":0,"e":"Las publicó en junio de 2023 la Subsecretaría de Tecnologías de la Información (Jefatura de Gabinete); se basan, entre otras, en la Recomendación de la UNESCO. (Robótica, «Recomendaciones para una IA Fiable»)"},{"q":"Según las recomendaciones argentinas para una IA fiable, ¿por qué no se le puede atribuir responsabilidad a un algoritmo?","o":["Porque no tiene discernimiento, intención ni libertad para decidir","Porque su código lo escribe un equipo y no una sola persona","Porque no tiene patrimonio propio con el que responder por daños","Porque sus decisiones son estadísticas y pueden equivocarse"],"a":0,"e":"La responsabilidad jurídica requiere discernimiento, intención y libertad. Un algoritmo ejecuta, pero la decisión, y por lo tanto la responsabilidad, debe recaer sobre una persona. (Robótica, «¿Cómo es recomendable concebir a la inteligencia artificial?»)"},{"q":"¿Cómo recomiendan las pautas argentinas concebir a los productos de IA?","o":["Como personas electrónicas, con derechos y obligaciones limitados","Como artificios: una tecnología, un medio para lograr objetivos humanos","Como agentes autónomos, responsables de sus propias decisiones","Como colaboradores con el mismo estatus legal que un empleado"],"a":1,"e":"Para evitar antropomorfismos que dificulten la regulación, la IA se concibe como artificio: una cosa, un medio artificial que no debe confundirse con una persona humana. (Robótica, «¿Cómo es recomendable concebir a la inteligencia artificial?»)"},{"q":"En el modelo de adopción «con participación humana» (human in the loop, inteligencia aumentada)…","o":["La máquina reemplaza el trabajo humano y una persona solo verifica que funcione bien","La máquina hace el análisis costoso de los datos y las personas deciden","Las personas etiquetan los datos al principio y después la máquina decide sola","Una persona opera el sistema a distancia y aprueba cada una de sus acciones"],"a":1,"e":"Máquinas y humanos colaboran: la IA aporta, por ejemplo, el pensamiento estadístico sobre grandes volúmenes de datos, y los humanos complementan el análisis y deciden. Sustituir el trabajo humano es el otro modelo, la automatización. (Robótica, «Recomendaciones para una IA Fiable»)"},{"q":"Según las recomendaciones argentinas, en el modelo de automatización la intervención humana…","o":["Sigue siendo indispensable, por ejemplo para detectar si el algoritmo se degrada","Solo hace falta durante el entrenamiento y la validación del modelo","Deja de ser necesaria cuando el sistema alcanza una precisión suficiente","Se limita a reubicar a las personas cuyas tareas fueron automatizadas"],"a":0,"e":"Siempre hace falta: para verificar los procesos, ofrecer una vía personal a quien no tiene medios tecnológicos, evaluar la degradación del algoritmo y detectar solicitudes nuevas. La reubicación es un requisito adicional, previo a automatizar. (Robótica, «Recomendaciones para una IA Fiable»)"},{"q":"Antes de adoptar IA para resolver un problema, ¿qué recomiendan las pautas argentinas?","o":["Empezar automatizando los procesos más críticos, que son los de mayor impacto","Explorar otras tecnologías: puede alcanzar una solución más simple","Contratar a un proveedor externo que asuma la responsabilidad por los resultados","Elegir el modelo de IA con mejor precisión entre los disponibles en el mercado"],"a":1,"e":"No conviene empezar con el único propósito de «usar IA»: a veces otras soluciones de software son más simples, menos riesgosas e igual de eficientes. (Robótica, «Recomendaciones para una IA Fiable», 3.2.3)"},{"q":"Según las recomendaciones argentinas, ¿cómo debería ser el equipo que encara un proyecto de IA?","o":["Reducido, para que las decisiones sobre el modelo se tomen rápido","Diverso y multidisciplinario, que sepa de lo técnico y también de ética","Formado por especialistas en aprendizaje automático y ciencia de datos","Liderado por el proveedor de la tecnología, que conoce mejor sus riesgos"],"a":1,"e":"Recomiendan conformar un equipo humano diverso y multidisciplinario, que sepa del tema técnico y también de ética, control humano, gestión de riesgos e innovación pública. (Robótica, «Recomendaciones para una IA Fiable», 3.2.1)"},{"q":"¿Qué ocurrió en la Cumbre Global sobre Seguridad de la IA de Bletchley Park (2023)?","o":["Los 193 Estados de la UNESCO adoptaron una recomendación sobre ética de la IA","28 países y la UE firmaron una declaración sobre la seguridad de la IA","La Unión Europea aprobó la primera ley integral de IA, con niveles de riesgo","La UNESCO creó la COMEST como órgano asesor sobre ética de la tecnología"],"a":1,"e":"El Reino Unido organizó la cumbre en noviembre de 2023; allí se firmó la Declaración de Bletchley. El lugar fue el centro de descifrado de códigos donde trabajó Alan Turing. (Robótica, «Cumbre de seguridad en IA»)"},{"q":"Según la Ley de IA de la Unión Europea (2024), ¿qué pasa con los sistemas de riesgo inaceptable?","o":["Se regulan con códigos de conducta voluntarios","Están prohibidos","Deben cumplir requisitos estrictos antes de comercializarse","Tienen obligaciones específicas de transparencia"],"a":1,"e":"Inaceptable: prohibidos. Alto: requisitos estrictos antes de comercializarse. Limitado: obligaciones de transparencia. Mínimo o nulo: autorregulación y códigos de conducta. (Robótica, «Ley europea sobre IA»)"},{"q":"Según la Ley de IA europea, los sistemas de riesgo limitado…","o":["No tienen ninguna obligación ni recomendación","Deben pasar requisitos estrictos antes de venderse","Están prohibidos desde febrero de 2025","Tienen obligaciones específicas de transparencia"],"a":3,"e":"Riesgo limitado = obligaciones de transparencia. Los requisitos estrictos son para el riesgo alto; incluso el riesgo mínimo tiene obligaciones mínimas y fomento de códigos de conducta. (Robótica, «Ley europea sobre IA»)"},{"q":"¿Desde cuándo se aplica la prohibición de los sistemas de IA de riesgo inaceptable de la ley europea?","o":["Desde junio de 2026","Desde febrero de 2025","Desde junio de 2024","Desde noviembre de 2023"],"a":1,"e":"La ley se adoptó en junio de 2024 y es plenamente aplicable a los 24 meses, pero la prohibición de los sistemas de riesgo inaceptable empezó antes, el 2 de febrero de 2025. (Robótica, «Calendario de aplicación de la Ley de IA de la UE»)"},{"q":"¿Todo robot debe poseer metas?","o":["Sí: tener metas es uno de los aspectos de la definición de robot","No: un robot reactivo actúa con reglas condición–acción, sin metas","No: solo los robots sociales tienen metas, porque se las dan otros agentes","Sí: sin metas no tendría un criterio para elegir qué acción ejecutar"],"a":1,"e":"Un robot aspiradora simple («si choqué, girar; si no, avanzar») no representa ninguna meta. Las metas aparecen en los agentes deliberativos con creencias y metas. (TP5, ej. 3)"},{"q":"¿Todo robot debe poder comunicarse con otros agentes?","o":["No: un robot no puede comunicarse, solo un agente de software puede","Sí: un robot necesita recibir órdenes de otro agente para poder actuar","Sí: la comunicación es uno de los cuatro aspectos que definen a un robot","No: comunicarse es lo que define a un agente social, y no todo robot lo es"],"a":3,"e":"La comunicación caracteriza a los robots contemporáneos, pero no es un requisito: un brazo soldador en una línea de montaje es un robot y no intercambia mensajes con nadie. (TP5, ej. 3)"},{"q":"¿Por qué conviene que un robot combine control reactivo y deliberativo?","o":["El reactivo planifica a largo plazo y el deliberativo resuelve las emergencias","El reactivo responde enseguida pero no anticipa; el deliberativo planifica pero es lento","Hacen lo mismo, y se combinan para tener redundancia en caso de que uno de los dos falle","El deliberativo solo sirve en simulación y el reactivo solo en el mundo real"],"a":1,"e":"Las fortalezas de uno cubren las debilidades del otro: frenar ante un peatón exige reacción inmediata; elegir una ruta alternativa con varios pedidos exige deliberar. (TP5, ej. 4)"},{"q":"Un robot de delivery tiene tres paquetes para distintos barrios y encuentra la calle principal cortada. ¿Qué control es indispensable en esa situación?","o":["Reactivo: esquivar el corte en el momento con una regla condición–acción","Ninguno: el robot debe esperar a que un operador humano le indique qué hacer","Reactivo: volver al comercio, que es la acción por defecto ante un imprevisto","Deliberativo: revisar creencias, buscar otra ruta y ordenar las entregas"],"a":3,"e":"Ninguna regla sobre lo que percibe en ese momento resuelve el problema: necesita razonar sobre su mapa y sus metas. El reactivo es indispensable, en cambio, ante un peatón que se cruza. (TP5, ej. 4)"},{"q":"El robot de delivery del TP5 recibe pedidos, se coordina con el empleado para la carga y con el cliente para la entrega. ¿Qué tipo de agente es?","o":["Un agente social, pero sin metas","Un agente reactivo con estado interno","Un agente con metas, pero no social","Un agente con metas y social"],"a":3,"e":"Tiene una meta (que el paquete llegue) y elige cómo lograrla; y es social porque percibe y envía mensajes a otros agentes, sin lo cual no podría cumplir su meta. (TP5, ej. 5)"},{"q":"Un robot creía que el pasillo estaba libre y ahora percibe un obstáculo. ¿Qué operador de cambio de creencias necesita?","o":["Contracción","Expansión","Actualización","Revisión"],"a":3,"e":"La información nueva contradice lo que creía: la revisión la incorpora manteniendo la consistencia. La expansión solo agrega sin chequear consistencia, y la contracción solo olvida. (TP5, ej. 2)"}]},{"id":"u2","nombre":"Aprendizaje automático","tp":"TP6","qs":[{"q":"¿Quién acuñó el término «machine learning», y cuándo?","o":["Geoffrey Hinton, en 1986","Alan Turing, en 1950","Tom Mitchell, en 2006","Arthur Samuel, en 1959"],"a":3,"e":"Samuel, pionero de los juegos de computadora y la IA, acuñó el término en 1959. Mitchell figura en la bibliografía (2006) y Hinton es coautor del artículo de 1986 sobre backpropagation. (Ep. VII, parte 1)"},{"q":"¿En qué tipo de problemas se emplea el aprendizaje automático?","o":["Donde hay pocos datos y la respuesta tiene que ser siempre exacta","Donde programar a mano un algoritmo eficaz es difícil o imposible","Donde cada decisión tiene que poder justificarse con una regla explícita","Donde las reglas del dominio son conocidas, estables y fáciles de escribir"],"a":1,"e":"Se usa cuando diseñar y programar algoritmos explícitos con buen rendimiento es difícil o imposible (p. ej. reconocer dígitos escritos a mano). (Ep. VII, parte 1, «Aprendizaje automático»)"},{"q":"¿Qué disciplinas aportan las herramientas del aprendizaje automático, según la cátedra?","o":["La lógica matemática y la filosofía del lenguaje","La matemática discreta y la teoría de juegos","La neurociencia y la psicología cognitiva","La estadística y las ciencias de la computación"],"a":3,"e":"El ML está dentro de la IA y requiere herramientas tanto de estadística como de ciencias de la computación. (Ep. VII, parte 1)"},{"q":"Según la definición de la cátedra, los algoritmos de aprendizaje automático, a partir de datos de entrenamiento…","o":["Reciben reglas de un experto y las aplican a los casos que van llegando","Memorizan los ejemplos y los devuelven tal cual cuando vuelven a aparecer","Buscan en un grafo de estados un camino desde el inicio hasta la meta","Reconocen patrones, construyen un modelo y predicen sobre datos no vistos antes"],"a":3,"e":"Reconocen patrones, construyen un modelo y con él reconocen o predicen sobre datos no vistos. Recibir reglas de un experto describe más bien un SBC. (Ep. VII, parte 1, «Machine Learning – aprendizaje automático»)"},{"q":"En aprendizaje automático, ¿qué es lo que se entrena?","o":["El algoritmo","El software","El modelo","Los datos"],"a":2,"e":"Lo que se entrena o construye es el modelo. Los algoritmos los diseñan de antemano equipos de científicos, y el software que los implementa hace el trabajo de entrenar. (Ep. VII, parte 1, «Modelo»)"},{"q":"La cátedra usa la fórmula T = distancia/velocidad como ejemplo de…","o":["Una métrica para medir la precisión de otros modelos de tránsito","Un modelo: simplifica la realidad, pero resulta útil","Un conjunto de entrenamiento con un único atributo numérico","Un algoritmo de aprendizaje que se ajusta con datos de viajes"],"a":1,"e":"Es un modelo: una abstracción que ignora semáforos y tráfico, pero cumple un propósito práctico. Sabiendo que es un modelo, se lo usa con cuidado aunque tenga errores. (Ep. VII, parte 1, «Modelo»)"},{"q":"En el contexto de machine learning, un modelo es…","o":["El procedimiento que define cómo se aprende a partir de los datos","El conjunto de datos etiquetados con el que se hace el entrenamiento","La medida del porcentaje de aciertos sobre los datos nuevos","Una estructura matemática que relaciona las entradas (datos) con las salidas"],"a":3,"e":"El modelo representa la relación entre entradas (datos) y salidas (predicciones), y permite generalizar. El procedimiento es el algoritmo de aprendizaje; el porcentaje de aciertos es una métrica. (Ep. VII, parte 1, «Modelo»)"},{"q":"¿Qué diferencia a los modelos de aprendizaje automático de los de muchas otras disciplinas?","o":["Se expresan siempre como una fórmula cerrada que puede leer una persona","Son exactos, mientras que los de otras disciplinas simplifican la realidad","No pueden equivocarse sobre ninguno de los ejemplos con que se entrenaron","Los genera un algoritmo a partir de datos, no una persona"],"a":3,"e":"En muchas disciplinas los modelos los escriben personas (una fórmula, un texto); en ML los genera un algoritmo a partir de un conjunto de datos de entrenamiento. (Ep. VII, parte 1, «Modelo»)"},{"q":"De las tres etapas de creación de un modelo, ¿cuál es automática?","o":["La segunda: el algoritmo recorre los ejemplos y ajusta el modelo","Ninguna: los especialistas ajustan el modelo a mano en cada paso","La tercera: el sistema decide si el modelo es bueno para la tarea","La primera: el sistema elige el algoritmo y los datos más adecuados"],"a":0,"e":"1) los especialistas eligen algoritmo y datos; 2) el algoritmo crea el modelo automáticamente; 3) los especialistas deciden si el resultado es satisfactorio. (Ep. VII, parte 1, «Modelo»)"},{"q":"En la creación de un modelo, ¿quién decide si el resultado del entrenamiento es satisfactorio?","o":["El equipo de especialistas, en la tercera y última etapa","El algoritmo, cuando el error deja de disminuir","El conjunto de prueba, sin intervención humana","Los usuarios finales, después del despliegue"],"a":0,"e":"La tercera etapa es humana: los especialistas deciden si el modelo sirve para la tarea (reconocer personas, generar texto, etc.). (Ep. VII, parte 1, «Modelo»)"},{"q":"Según la cátedra, ¿qué relación hay entre los datos de entrenamiento y el resultado del aprendizaje?","o":["El resultado es el mismo con imágenes, audio, texto o datos tabulares","El resultado muchas veces es tan bueno como los datos de entrenamiento","El resultado mejora siempre que se agregan más atributos a los datos","El resultado depende sobre todo del algoritmo elegido, casi nada de los datos"],"a":1,"e":"Los datos son el combustible del aprendizaje: el tipo de datos puede afectar mucho la precisión y la eficacia del modelo. (Ep. VII, parte 1, «Los datos de entrenamiento»)"},{"q":"¿Qué distingue a los tres paradigmas clásicos (supervisado, no supervisado y por refuerzo)?","o":["El tipo de retroalimentación que recibe el que aprende","La cantidad de datos de entrenamiento que necesitan","El tipo de modelo que producen: árbol, red o reglas","Si el modelo se entrena una sola vez o de forma continua"],"a":0,"e":"Supervisado: pares entrada–salida etiquetados. No supervisado: ninguna retroalimentación explícita. Por refuerzo: recompensas o castigos. (TP6, ej. 1.d)"},{"q":"Un sistema agrupa clientes con hábitos de compra parecidos, sin ejemplos etiquetados. ¿Qué tipo de aprendizaje es?","o":["No supervisado","Supervisado de regresión","Por refuerzo","Supervisado de clasificación"],"a":0,"e":"No recibe etiquetas: descubre patrones en la entrada. La tarea más común del no supervisado es justamente el clustering. (TP6, ej. 1.d)"},{"q":"Un agente aprende a jugar al ajedrez recibiendo solo puntos cuando gana una partida. ¿Qué tipo de aprendizaje es?","o":["No supervisado","Semisupervisado","Supervisado","Por refuerzo"],"a":3,"e":"Aprende de recompensas que llegan después de una secuencia de acciones, y tiene que deducir cuáles fueron responsables. (TP6, ej. 1.d)"},{"q":"El asistente de impresión aprende de ejemplos que traen la decisión tomada (inkjet o laser). ¿Qué tipo de aprendizaje es?","o":["Supervisado, de regresión","Supervisado, de clasificación","Por refuerzo, con recompensas","No supervisado, de clustering"],"a":1,"e":"Cada ejemplo trae su etiqueta (supervisado) y la salida es una clase de un conjunto finito (clasificación). Regresión sería predecir un número real. (Ep. VII, parte 2)"},{"q":"Un árbol de decisión que predice la cantidad de días de internación de un paciente es un árbol de…","o":["Clasificación","Regresión","Búsqueda","Asociación"],"a":1,"e":"Árboles de clasificación: el resultado es una clase. Árboles de regresión: el resultado es un número real (el precio de una casa, los días en un hospital). (Ep. VII, parte 2, «Algoritmos de Aprendizaje con Árboles de Decisión»)"},{"q":"¿Qué diferencia a los algoritmos ID3 y CART?","o":["CART solo acepta atributos binarios; ID3 acepta atributos de cualquier tipo","ID3 sirve para clasificación y regresión; CART, principalmente para clasificación","ID3 construye varios árboles y los combina; CART construye un único árbol","CART sirve para clasificación y regresión; ID3, principalmente para clasificación"],"a":3,"e":"ID3 (Quinlan, 1986) está pensado para variables objetivo categóricas; CART (Breiman y otros, 1984) maneja variables objetivo categóricas y numéricas. (Ep. VII, parte 2)"},{"q":"¿Qué hace un clasificador Random Forest?","o":["Usa varios árboles de decisión a la vez para mejorar la tasa de clasificación","Combina un árbol de decisión con una red neuronal en la misma salida","Elige al azar el atributo de cada nodo de un único árbol de decisión","Poda un único árbol grande para reducir el sobreajuste a los datos"],"a":0,"e":"Es una técnica que construye más de un árbol de decisión para clasificar mejor. (Ep. VII, parte 2, «Algoritmos de Aprendizaje con Árboles de Decisión»)"},{"q":"En un árbol de decisión, ¿con qué se etiquetan las hojas?","o":["Con valores de atributos","Con clasificaciones","Con ejemplos","Con atributos"],"a":1,"e":"Nodos internos: atributos. Arcos: valores del atributo del nodo. Hojas: clasificaciones (p. ej. laser / inkjet). (Ep. VII, parte 2, «Árbol de decisión»)"},{"q":"En un árbol de decisión, los arcos que salen de un nodo etiquetado con el atributo A se etiquetan con…","o":["Cada uno de los valores posibles de A","Los atributos que todavía no se usaron","Cada una de las clasificaciones posibles","La cantidad de ejemplos que siguen ese arco"],"a":0,"e":"Un arco por cada valor posible del atributo A; las clasificaciones van en las hojas. (Ep. VII, parte 2, «Árbol de decisión»)"},{"q":"¿Qué se asume sobre los atributos en la definición de árbol de decisión de la cátedra?","o":["Que todos tienen la misma cantidad de valores","Que tienen un rango de valores finito y discreto","Que son estadísticamente independientes entre sí","Que son numéricos y toman valores continuos"],"a":1,"e":"Se asume que los atributos tienen un rango de valores finito y discreto (día: L-V/Finde; hora: mañana/tarde/noche…). (Ep. VII, parte 2, «Árbol de decisión»)"},{"q":"¿Cuándo un conjunto de entrenamiento NO es adecuado para construir un árbol de decisión?","o":["Cuando dos ejemplos con iguales atributos tienen distinta clase","Cuando hay muchos más ejemplos de una clase que de la otra","Cuando algún valor de un atributo no aparece en ninguno de los ejemplos","Cuando algunos atributos resultan irrelevantes para la decisión"],"a":0,"e":"Si dos ejemplos concuerdan en los atributos pero dan distinta clasificación, ningún árbol puede clasificar bien a los dos. (Ep. VII, parte 2, «Árbol de decisión»)"},{"q":"Al conjunto de la impresora se le agrega e15 = (L-V, mañana, pocas, pdf, grande) con decisión laser. ¿Qué pasa?","o":["Deja de ser adecuado: e1 tiene esos mismos atributos y es inkjet","La hoja de páginas = pocas pasa a decir laser, porque e15 es más reciente","El algoritmo agrega un nodo con el atributo tipo para separar los dos casos","Nada: e15 es un ejemplo más y el árbol se reconstruye igual que antes"],"a":0,"e":"e1 = (L-V, mañana, pocas, pdf, grande) → inkjet. Con e15 hay dos ejemplos iguales en todos los atributos y con distinta clase: ningún árbol los separa, ni siquiera agregando nodos. (TP6, ej. 3.b)"},{"q":"¿Qué decide el árbol para el pedido (Finde, tarde, muchas, xls, grande)? (árbol de la cátedra para la impresora: páginas = pocas → inkjet; páginas = muchas → hora; hora = noche → inkjet; hora = mañana o tarde → día; día = L-V → laser; día = Finde → inkjet)","o":["laser, consultando páginas, hora y día","laser, consultando solo páginas y hora","inkjet, consultando solo páginas y hora","inkjet, consultando páginas, hora y día"],"a":3,"e":"páginas = muchas → hora = tarde → día = Finde → inkjet. Con hora tarde hay que mirar el día; tipo y tamaño no se consultan. (Ep. VII, parte 2, «Uso del árbol de decisión»)"},{"q":"¿Qué decide el árbol para el pedido (L-V, noche, muchas, doc, mediano)? (árbol de la cátedra para la impresora: páginas = pocas → inkjet; páginas = muchas → hora; hora = noche → inkjet; hora = mañana o tarde → día; día = L-V → laser; día = Finde → inkjet)","o":["inkjet, consultando páginas, hora y día","laser, consultando solo páginas y hora","laser, consultando páginas, hora y día","inkjet, consultando solo páginas y hora"],"a":3,"e":"páginas = muchas → hora = noche → inkjet: la rama noche llega a una hoja sin consultar el día. Es el ejemplo e4 del conjunto de entrenamiento. (Ep. VII, parte 2)"},{"q":"¿Qué decide el árbol para el pedido (L-V, mañana, muchas, doc, chico)? (árbol de la cátedra para la impresora: páginas = pocas → inkjet; páginas = muchas → hora; hora = noche → inkjet; hora = mañana o tarde → día; día = L-V → laser; día = Finde → inkjet)","o":["inkjet, porque el tamaño es chico","inkjet, porque el tipo es doc","laser, porque el día es L-V","inkjet, porque la hora es mañana"],"a":2,"e":"páginas = muchas → hora = mañana → día = L-V → laser. Es n1 en la diapositiva. Tamaño y tipo no están en el árbol, y con hora = mañana todavía hay que mirar el día. (Ep. VII, parte 2, «Uso del árbol de decisión»)"},{"q":"En el árbol de la impresora no figuran los atributos tipo y tamaño. ¿Qué significa?","o":["Que el algoritmo los descartó porque no estaban en todos los ejemplos","Que se consultan solo cuando un pedido nuevo no llega a ninguna de las hojas","Que tienen demasiados valores posibles como para usarse en un árbol de decisión","Que, según esos datos, no influyen: se pudo clasificar todo sin ellos"],"a":3,"e":"El algoritmo pudo clasificar los 14 ejemplos sin usarlos; según esos datos son irrelevantes para elegir la impresora (no necesariamente en la realidad). (TP6, ej. 3.c)"},{"q":"Un clasificador de señales dice que una imagen es una señal de velocidad máxima, y no lo es. ¿Qué tipo de error comete?","o":["Falso positivo","Verdadero negativo","Falso negativo","Sobreajuste"],"a":0,"e":"Dice «sí» cuando la respuesta correcta es «no»: falso positivo. Falso negativo sería decir que no es una señal cuando sí lo es. (Ep. VII, parte 1, «Machine Learning – aprendizaje automático»)"},{"q":"¿Qué es el sobreajuste (overfitting)?","o":["Un entrenamiento que tarda demasiado por tener un exceso de ejemplos","Un modelo que clasifica mal el entrenamiento y bien los datos nuevos","Un modelo que acierta mucho en el entrenamiento y falla con datos nuevos","Un conjunto de entrenamiento con más atributos que ejemplos"],"a":2,"e":"El modelo se ajusta a distinciones que aparecen en el entrenamiento (coincidencias o ruido) pero no en los datos no vistos. (TP6, ej. 2)"},{"q":"¿Cómo se detecta el sobreajuste al aumentar la complejidad del modelo?","o":["Los dos errores, de entrenamiento y sobre datos nuevos, bajan juntos y se estabilizan","El error de entrenamiento sigue bajando mientras el error sobre datos nuevos sube","El error de entrenamiento empieza a subir mientras el error sobre datos nuevos baja","El error sobre datos nuevos es cero desde el comienzo y el de entrenamiento no"],"a":1,"e":"Se comparan los dos errores: hay sobreajuste cuando el de entrenamiento queda en casi cero pero el de los datos no vistos empieza a crecer. (TP6, ej. 2)"},{"q":"¿Por qué hay que distinguir el desempeño sobre el conjunto de entrenamiento del desempeño sobre el de prueba?","o":["Porque entrenar con todos los datos haría el entrenamiento muy lento","Porque las métricas solo se calculan sobre datos sin etiqueta","Porque las etiquetas de prueba son más confiables que las de entrenamiento","Porque el modelo ya vio esos ejemplos; lo que importa es cómo predice casos nuevos"],"a":3,"e":"Un error bajo en el entrenamiento no garantiza que el modelo generalice; eso se estima con datos que el modelo no vio. (TP6, ej. 2)"},{"q":"¿Por qué los árboles de decisión tienden al sobreajuste cuando crecen sin restricciones?","o":["Siguen partiendo hasta clasificar todo, aunque sea por ruido o coincidencia","Necesitan atributos continuos, y discretizarlos introduce errores en las hojas","Consultan siempre todos los atributos en cada camino, aunque sean irrelevantes","Solo pueden representar funciones lineales de los atributos, y se quedan cortos"],"a":0,"e":"Sin restricciones el árbol se vuelve consistente con todos los ejemplos, y las hojas profundas se apoyan en muy pocos ejemplos: memoriza coincidencias. (TP6, ej. 3.d)"},{"q":"¿Cómo se evalúa una RNA, según la cátedra?","o":["Se cuenta cuántas neuronas de la capa oculta se activan para cada ejemplo","Se comparan sus pesos con los de otra red ya validada para la misma tarea","Se mide el porcentaje de aciertos sobre los mismos ejemplos con los que se entrenó","Se reservan datos que no se usan para entrenar y se mide con una métrica"],"a":3,"e":"Una parte del conjunto de datos se usa para entrenar y otra se reserva para la evaluación con alguna métrica. (Ep. VII, parte 3, «¿Qué tan buena es mi RNA?»)"},{"q":"Estructuralmente, ¿qué es una red neuronal artificial?","o":["Un grafo dirigido de neuronas artificiales conectadas por arcos con pesos","Un árbol cuyas hojas son las clases posibles de la salida","Una base de reglas condición–acción sobre los datos de entrada","Una tabla que asocia cada entrada posible con su salida"],"a":0,"e":"Es un grafo dirigido de nodos (neuronas artificiales) interconectados por arcos; cada arco guarda un peso w. (Ep. VII, parte 3, «Redes Neuronales Artificiales»)"},{"q":"Las capas ocultas de una RNA…","o":["Reciben el estímulo del exterior antes de que llegue a la capa de entrada","Contienen las neuronas que se descartan una vez terminado el entrenamiento","Guardan los ejemplos de entrenamiento para consultarlos al predecir","Están entre la capa de entrada y la de salida, sin contacto con el exterior de la red"],"a":3,"e":"La capa de entrada recibe el estímulo del exterior, la de salida envía la respuesta, y las ocultas quedan en el medio. (Ep. VII, parte 3, «Redes Neuronales Artificiales»)"},{"q":"En la red de la cátedra para reconocer dígitos escritos a mano en imágenes de 28×28 píxeles, ¿cuántas neuronas tiene la capa de entrada?","o":["10, una por dígito posible","28, una por fila de la imagen","784, una por píxel","15, igual que la capa oculta"],"a":2,"e":"28 × 28 = 784 neuronas de entrada, que codifican los valores de los píxeles. La capa de salida tiene 10 (una por dígito) y la oculta, 15. (Ep. VII, parte 3)"},{"q":"Una red tiene 784 neuronas de entrada, 15 ocultas y 10 de salida, y cada neurona de una capa se conecta con todas las de la siguiente. ¿Cuántos arcos tiene?","o":["11.760","809","11.910","117.600"],"a":2,"e":"784 × 15 + 15 × 10 = 11.760 + 150 = 11.910. 809 es la suma de neuronas; 117.600 multiplica las tres capas; 11.760 olvida los arcos de la oculta a la salida. (Ep. VII, parte 3)"},{"q":"Un perceptrón con w1 = w2 = −2 y b = 3 recibe x1 = 1 y x2 = 1. ¿Qué devuelve?","o":["1, porque −2 − 2 + 3 = −1 es distinto de 0","1, porque el sesgo b = 3 es mayor que 0","0, porque −2 − 2 + 3 = −1 no es mayor que 0","−1, que es el valor de la suma ponderada de la neurona"],"a":2,"e":"El perceptrón devuelve 1 si w·x + b > 0, y 0 en otro caso. Acá la suma es −1, así que devuelve 0. (Ep. VII, parte 3, «Ejemplo»)"},{"q":"¿Qué función booleana implementa un perceptrón con w1 = w2 = −2 y b = 3?","o":["OR","AND","NAND","XOR"],"a":2,"e":"Las sumas son f(0,0) = 3, f(0,1) = f(1,0) = 1 y f(1,1) = −1, así que la salida es 1, 1, 1, 0: la NAND. (Ep. VII, parte 3, «Ejemplo»)"},{"q":"¿Qué diferencia a una neurona sigmoide de un perceptrón?","o":["El perceptrón tiene una salida por entrada; la sigmoide, una sola","La sigmoide da una salida continua entre 0 y 1; el perceptrón, 0 o 1","El perceptrón da una salida continua entre 0 y 1; la sigmoide, 0 o 1","La sigmoide no usa pesos en sus entradas; el perceptrón, sí"],"a":1,"e":"Las dos combinan las entradas con pesos y sesgo; el perceptrón aplica un escalón (0 o 1) y la sigmoide, una versión suave del escalón. (Ep. VII, parte 3, «Neuronas Artificiales»)"},{"q":"¿Qué significa que una RNA está entrenada?","o":["Que se eligió la cantidad de capas ocultas óptima para resolver la tarea","Que se encontraron valores de pesos y umbrales con los que predice bien","Que memorizó las imágenes del conjunto de entrenamiento con su etiqueta","Que se agregaron las neuronas necesarias para cubrir todos los ejemplos vistos"],"a":1,"e":"Entrenada = se encontraron valores adecuados para los pesos w de todos los arcos y los umbrales de cada nodo. La cantidad de capas se elige antes de entrenar. (Ep. VII, parte 3, «Redes Neuronales Artificiales»)"},{"q":"¿Qué se decide antes de entrenar una RNA?","o":["Qué ejemplos nuevos se van a clasificar después","Los valores finales de los pesos de cada arco","El porcentaje de aciertos que tendrá sobre datos nuevos","La configuración de la red y la función matemática de cada nodo"],"a":3,"e":"Primero se elige la forma de la red y la función de cada nodo; después se asignan valores iniciales a los arcos y el entrenamiento los va ajustando. (Ep. VII, parte 3)"},{"q":"¿El entrenamiento de una RNA modifica las conexiones entre neuronas?","o":["Sí: cambia la función de activación de las neuronas que más se equivocan","Sí: agrega y quita conexiones entre neuronas según el error que comete la red","No: los pesos se fijan al elegir la red, y el entrenamiento ajusta la topología","Solo cambia sus valores (pesos y umbrales); la topología se fija antes"],"a":3,"e":"La topología se fija al elegir la configuración; el entrenamiento ajusta numéricamente los pesos w (intensidad y signo de cada conexión) y los sesgos b. (TP6, ej. 4.c)"},{"q":"¿Cómo se formula el aprendizaje de una red neuronal?","o":["Como satisfacer un conjunto de restricciones lógicas entre las neuronas","Como buscar los parámetros que minimizan el error cuadrático de la salida","Como maximizar la cantidad de neuronas que se activan en la capa de salida","Como encontrar el camino más corto entre la capa de entrada y la de salida"],"a":1,"e":"Es un problema de minimización: dado un conjunto de ejemplos, encontrar los parámetros que minimicen el error cuadrático. (Ep. VII, parte 3, «Neuronas Artificiales»)"},{"q":"¿Qué diferencia hay entre hill climbing y el descenso de gradiente?","o":["Hill climbing minimiza una función; el descenso de gradiente, en cambio, la maximiza","Hill climbing sigue la pendiente local; el descenso de gradiente evalúa todos los vecinos","Hill climbing evalúa todos los vecinos; el descenso de gradiente sigue la pendiente local","Hill climbing requiere una función continua; el descenso de gradiente, una discreta"],"a":2,"e":"Hill climbing evalúa la función en cada vecino y va al mejor (maximiza, sirve para problemas discretos). El descenso de gradiente mira la pendiente y va hacia la más pronunciada (minimiza, requiere una función continua con gradiente). (Ep. VII, parte 3)"},{"q":"Comparado con hill climbing, el descenso de gradiente…","o":["Garantiza llegar al mínimo global, pero a cambio es bastante más lento","Suele ser mucho más eficiente, pero sirve para menos tipos de problemas","Sirve para más tipos de problemas, pero en general es mucho menos eficiente","Puede optimizar problemas discretos, pero necesita mucha más memoria"],"a":1,"e":"Por lo general es mucho más eficiente que la escalada ingenua, pero supone una función continua con gradiente calculable. (Ep. VII, parte 3, «Stochastic gradient descent vs. Hill climbing»)"},{"q":"¿Qué papel cumple backpropagation en el entrenamiento de una RNA?","o":["Evalúa el modelo final con los datos que se reservaron para la prueba","Elige la cantidad de capas y de neuronas antes de empezar a entrenar","Calcula el gradiente del error, que necesita el descenso de gradiente","Reemplaza al descenso de gradiente por un método de búsqueda más rápido"],"a":2,"e":"El descenso de gradiente estocástico busca el mínimo; para calcular el gradiente que necesita se usa backpropagation. (Ep. VII, parte 3)"},{"q":"En el esquema de backpropagation de la cátedra, en cada repetición…","o":["Se evalúan todos los ejemplos y se sortean nuevos pesos al azar","Se evalúa un ejemplo hacia atrás y se calculan los errores hacia adelante","Se evalúa un ejemplo hacia adelante y después se calculan los errores hacia atrás","Se agrega una neurona por cada ejemplo que la red clasificó mal"],"a":2,"e":"Se asignan pesos iniciales al azar y se repite hasta un umbral: un ejemplo hacia adelante (forward) y los errores hacia atrás (backward). El azar es solo para los valores iniciales. (Ep. VII, parte 3, «Backpropagation»)"},{"q":"¿Qué ocurrió con backpropagation en 1986?","o":["Un artículo de Rumelhart, Hinton y Williams mostró toda su importancia","Quedó reemplazado por el descenso de gradiente estocástico, más rápido","Arthur Samuel lo usó por primera vez en su programa de damas","Ross Quinlan lo adaptó para construir árboles de decisión ID3"],"a":0,"e":"Se introdujo en la década de 1970, pero su importancia no se apreció hasta ese artículo, que mostró que era mucho más rápido que los enfoques anteriores. (Ep. VII, parte 3, «Backpropagation»)"},{"q":"Una vez satisfechos con el entrenamiento (por ejemplo, 97% de aciertos), ¿qué hace falta para usar la red?","o":["La red junto con el algoritmo de backpropagation","La red junto con el conjunto de entrenamiento","La red junto con los datos reservados para prueba","Solo la red con los pesos de los arcos"],"a":3,"e":"El conocimiento aprendido quedó en los pesos; los datos y el algoritmo ya no hacen falta para predecir. (Ep. VII, parte 3, «¿Cómo uso mi RNA?»)"},{"q":"¿Cómo es una red neuronal feed-forward?","o":["Cada neurona se conecta con todas las demás de la red, incluida ella misma","Conexiones en un solo sentido, sin ciclos, de la entrada a la salida","Las señales van hacia adelante y los pesos se fijan sin entrenar","La salida se realimenta a la entrada para darle memoria a la red"],"a":1,"e":"Es un grafo dirigido acíclico: la señal va siempre hacia adelante y la salida depende solo de la entrada actual. Realimentar la salida describe una red recurrente. (TP6, ej. 4.d)"}]},{"id":"u3","nombre":"SBC: arquitectura, Prolog y explicaciones","tp":"TP7","qs":[{"q":"Según la cátedra, las conclusiones, recomendaciones o decisiones de un agente con razonamiento automático dependen de…","o":["Solo de las reglas, porque los datos se fijan al construir el agente","Solo de los datos percibidos, sin necesidad de reglas para razonar","Los ejemplos etiquetados con los que se lo entrenó previamente","La información que tiene en ese momento y las reglas de que dispone"],"a":3,"e":"Las conclusiones dependen tanto de la información percibida en el momento como de las reglas para razonar. (Ep. VIII, «Aplicaciones con razonamiento automático»)"},{"q":"¿Cuáles son los módulos de la arquitectura básica de un SBC?","o":["Base de conocimiento, algoritmo de aprendizaje y modelo","Base de conocimiento, máquina de inferencia e interface","Sensores, efectores y controlador","Hechos, reglas y consultas del usuario"],"a":1,"e":"KB, máquina de inferencia e interface, que se comunica con el entorno. Hechos y reglas son el contenido de la KB, no módulos. (Ep. VIII, «Sistema Basado en Conocimiento (SBC)»)"},{"q":"Según la cátedra, la arquitectura de un sistema es…","o":["El hardware sobre el que se ejecutan los módulos del sistema","El lenguaje en el que se programa la máquina de inferencia","Un modelo conceptual de los elementos del sistema y de cómo se relacionan","El conjunto de reglas y hechos que forman la base de conocimiento del sistema"],"a":2,"e":"Es un modelo conceptual que define la estructura del sistema, indicando (generalmente en forma gráfica) sus elementos y cómo se relacionan. (Ep. VIII, «Sistema Basado en Conocimiento (SBC)»)"},{"q":"En un SBC, ¿qué hace la interface?","o":["Saca conclusiones aplicando las reglas de la KB a los hechos percibidos","Se comunica con el entorno: procesa percepciones y muestra resultados","Guarda las reglas y los hechos del dominio de aplicación","Traduce las reglas de la KB al código de la máquina de inferencia"],"a":1,"e":"La interface muestra sugerencias, procesa percepciones, busca en la web, interpreta comandos de voz, etc. Depende mucho del dominio y de los sensores y acciones del agente. (Ep. VIII)"},{"q":"¿Qué ventaja da que la base de conocimiento sea un módulo independiente del mecanismo de inferencia?","o":["La KB puede escribirse sin tener en cuenta qué mecanismo de inferencia se use","La interface puede sacar conclusiones sin consultar la KB","Se pueden agregar o quitar reglas sin cambiar el código de la inferencia","La máquina de inferencia puede ejecutarse en otra computadora"],"a":2,"e":"La modularidad permite agregar o quitar reglas y hechos dinámicamente y reusar el mecanismo en otros dominios. Pero la representación tiene que estar en sintonía con el mecanismo de inferencia. (Ep. VIII, «SBC que usa la máquina de inferencia de Prolog»)"},{"q":"Si se usa el intérprete de Prolog como máquina de inferencia, la base de conocimiento…","o":["Tiene que descargarse de Internet cada vez que se hace una consulta","Tiene que ser un programa Prolog, para estar en sintonía con el intérprete","Puede escribirse en lenguaje natural, porque el top-level la traduce","Conviene escribirla en otro lenguaje, para mantener la modularidad"],"a":1,"e":"La representación del conocimiento debe estar en completa sintonía con el mecanismo de inferencia: con Prolog, la KB es un programa Prolog. (Ep. VIII, «¿Cómo se implementa un SBC?»)"},{"q":"Al usar Prolog para armar un SBC, ¿qué hace de interface rudimentaria?","o":["El operador \\+","El predicado clause/2","El programa de reglas y hechos","El top-level del intérprete"],"a":3,"e":"En el top-level se escriben consultas y se obtienen respuestas. El programa con reglas y hechos es la KB. (Ep. VIII, «SBC que usa la máquina de inferencia de Prolog»)"},{"q":"¿Puede considerarse al intérprete de Prolog como un SBC?","o":["Sí: ya trae la máquina de inferencia, la interface y la base de conocimiento","Sí, pero solo si se le agrega un operador de negación fuerte","No por sí solo: le falta la base de conocimiento, que es un programa Prolog","No: Prolog no sirve como máquina de inferencia de un SBC"],"a":2,"e":"El intérprete aporta la máquina de inferencia y una interface rudimentaria (el top-level); la KB hay que escribirla para cada dominio. (TP7, ej. 3)"},{"q":"¿Qué tipo de agente utiliza un SBC?","o":["Social, sin creencias","Reactivo","Reactivo con reglas condición–acción","Deliberativo"],"a":3,"e":"Un agente deliberativo, que saca conclusiones o toma decisiones con la información percibida y lo que infiere razonando. Un agente reactivo no mantiene creencias ni razona. (TP7, ej. 2)"},{"q":"En el ciclo de un agente deliberativo, ¿qué paso es el corazón del SBC?","o":["Actuar, ejecutando en el entorno la acción elegida","Razonar sobre el conocimiento, con la máquina de inferencia","Percibir el entorno, con los sensores de la interface","Revisar las creencias, borrando lo que las contradice"],"a":1,"e":"El SBC interviene en todo el ciclo, pero el razonamiento lo hace la máquina de inferencia con las reglas y hechos de la KB. Percibir y actuar pasan por la interface. (TP7, ej. 2)"},{"q":"En el agente Okaeri, chance(lluvia,80) y mínima(8) son…","o":["Reglas que la máquina de inferencia usa para concluir","Consultas que el usuario le hace al sistema","Conclusiones que la interface le muestra al usuario","Hechos percibidos del entorno que pasan a la KB"],"a":3,"e":"Son datos percibidos (por ejemplo, de una página del clima). La máquina de inferencia los combina con reglas como «chance(lluvia, X) y X > 50 → recomendar(paraguas)». (Ep. VIII)"},{"q":"Con la KB de Okaeri en Prolog (recomendar(paraguas) :- chance(lluvia,X), X > 50. recomendar(abrigo) :- minima(T), T < 10. recomendar(sombrero) :- verano. y los hechos chance(lluvia,80) y minima(8); con los hechos de hemisferio y mes, verano no se cumple), ¿qué responde ?- recomendar(X)?","o":["X = paraguas, y nada más","X = paraguas ; X = abrigo","X = paraguas ; X = abrigo ; X = sombrero","no, porque falta saber si es verano"],"a":1,"e":"80 > 50 da paraguas y 8 < 10 da abrigo. verano no se deriva, así que sombrero no sale; eso no impide las otras dos respuestas. (Ep. VIII)"},{"q":"En el agente Mer-val, ¿de dónde salen las reglas y de dónde los hechos?","o":["Las dos, de un algoritmo que aprende a partir de precios históricos","Reglas, de sitios especializados de Internet; hechos, de expertos del mercado","Reglas, del usuario que consulta; hechos, de las empresas que cotizan","Reglas, de expertos del mercado; hechos, de sitios especializados de Internet"],"a":3,"e":"Las reglas contienen conocimiento recolectado de expertos; los hechos (buen_precio_web, listado_fusiones_web, rumores_deuda_web) se obtienen automáticamente de sitios especializados. (Ep. VIII, «Agente de recomendación Mer-val»)"},{"q":"¿Cuál NO es una de las cuestiones que, según la cátedra, hay que abordar en un SBC?","o":["Aprendizaje de reglas nuevas a partir de datos","Manejo de información incompleta","Explicabilidad de las conclusiones","Manejo de información contradictoria"],"a":0,"e":"Las cuestiones son: derivación de nuevo conocimiento, explicabilidad, información incompleta, dinámica de la información e información contradictoria. (Ep. VIII, «Cuestiones que hay que abordar en SBC»)"},{"q":"En un SBC, la explicabilidad significa que…","o":["Las razones que llevan a una conclusión deberían poder auditarse","El sistema debería responder siempre en lenguaje natural","El usuario debería poder modificar las reglas de la base","Toda conclusión debería tener un valor de certeza asociado"],"a":0,"e":"Es una de las cuestiones de un SBC: las razones de una conclusión o decisión deberían poder auditarse. (Ep. VIII, «Cuestiones que hay que abordar en SBC»)"},{"q":"Según la cátedra, el conjunto de reglas que permite inferir una conclusión…","o":["Solo sirve para que el programador depure la KB","Garantiza que esa conclusión ya no pueda ser contradicha por otra","Explica cómo se llegó a ella y es además una razón a su favor","Conviene ocultarlo al usuario para no confundirlo"],"a":2,"e":"La derivación da una explicación de cómo se llegó a la conclusión y una razón a favor de ella. Una razón puede tener otra en contra: no garantiza nada. (Ep. VIII, «Consultando por una recomendación»)"},{"q":"¿Qué predicado predefinido de Prolog usa deriv/2 para encontrar una regla cuya cabeza coincide con la consulta?","o":["member/2","call/1","clause/2","append/3"],"a":2,"e":"deriv(Cabeza, [(Cabeza :- Cuerpo) | L1]) :- clause(Cabeza, Cuerpo), deriv(Cuerpo, L1). append/3 se usa para juntar las derivaciones de una conjunción. (Ep. VIII, «Extendiendo la interface»)"},{"q":"Cuando deriv/2 recibe una conjunción (X,Y)…","o":["Busca con clause/2 una regla cuya cabeza sea (X,Y)","Deriva solo X, porque Y se deduce a partir de X","Devuelve la lista vacía, porque se prueba trivialmente","Deriva X, después Y, y concatena las dos derivaciones"],"a":3,"e":"Los tres casos: true → lista vacía; (X,Y) → deriva X, deriva Y y hace append; consulta simple → clause/2 y deriva el cuerpo. (Ep. VIII, «Extendiendo la interface»)"},{"q":"¿Qué permite, con poco esfuerzo, un «top-level extendido» como el del agente Oki?","o":["Escribir reglas con negación en la cabeza, cosa que Prolog no permite","Resolver qué conclusión prevalece cuando dos conclusiones se contradicen","Interacción más natural, explicar respuestas y sugerir sin consultas","Aprender reglas nuevas a partir de las consultas que hacen los usuarios"],"a":2,"e":"Extender la interface permite una interacción más elaborada, explicar cómo se llegó a cada respuesta y ser proactivo. Resolver contradicciones requiere extender el mecanismo de inferencia. (Ep. VIII)"},{"q":"En Prolog, ¿cuándo tiene éxito la consulta \\+ p?","o":["Cuando la derivación de p tiene éxito","Cuando la derivación de p falla","Cuando p es falso en el mundo","Cuando hay una derivación de ~p"],"a":1,"e":"Negación por falla: \\+p tiene éxito cuando la derivación de p falla, y falla cuando la de p tiene éxito. No dice nada sobre el mundo, solo sobre lo derivable. (Ep. VIII, «Negación por falla en Prolog»)"},{"q":"¿Dónde puede usarse el operador \\+ en Prolog?","o":["En la cabeza de una regla o en un hecho","En cualquier parte del programa o de la consulta","Solo en el cuerpo de una regla o en una consulta","En los hechos y en el cuerpo de las reglas"],"a":2,"e":"Por sus características, no se permite usar \\+ en la cabeza de una regla ni en un hecho. (Ep. VIII, «Negación por falla en Prolog»)"},{"q":"¿Cuál de estas cláusulas NO está permitida en Prolog?","o":["peligroso(X) :- animal(X), \\+ inofensivo(X).","\\+ abierta(universidad).","abierta(X) :- \\+ cerrada(X).","inocente(P) :- \\+ culpable(P)."],"a":1,"e":"Es un hecho con \\+: no está permitido. Las otras usan \\+ en el cuerpo de una regla, que sí se permite. (Ep. VIII, «Negación por falla en Prolog»)"},{"q":"¿Para qué tipo de información resulta especialmente útil la negación por falla?","o":["Información incompleta","Información de varios informantes","Información contradictoria","Información con certeza numérica"],"a":0,"e":"Si algo no se puede derivar, se asume falso: es útil para trabajar con información incompleta. Para información contradictoria hace falta negación fuerte. (Ep. VIII, «Negación por falla en Prolog»)"},{"q":"Con el programa culpable(acusado2). inocente(P) :- \\+ culpable(P)., ¿qué responde ?- inocente(acusado1).?","o":["false, porque no hay un hecho inocente(acusado1)","Error, porque \\+ no puede ir en el cuerpo de una regla","false, porque acusado1 no figura en el programa","true, porque no se puede derivar culpable(acusado1)"],"a":3,"e":"culpable(acusado1) falla, así que \\+ culpable(acusado1) tiene éxito. En cambio, inocente(acusado2) da false. (Ep. VIII, «Negación por falla en Prolog»)"},{"q":"Con el programa inofensivo(koala). animal(koala). animal(wallaby). peligroso(X) :- animal(X), \\+ inofensivo(X)., ¿qué responde ?- peligroso(wallaby).?","o":["false: no se puede probar que wallaby sea peligroso","false: no hay un hecho peligroso(wallaby) en el programa","true: es un animal y no se deriva inofensivo(wallaby)","Error: \\+ solo puede usarse en una consulta"],"a":2,"e":"animal(wallaby) tiene éxito y inofensivo(wallaby) falla, así que \\+ inofensivo(wallaby) tiene éxito. (Ep. VIII, «Negación por falla en Prolog»)"},{"q":"Con el programa inofensivo(koala). animal(koala). animal(wallaby). peligroso(X) :- animal(X), \\+ inofensivo(X)., ¿qué responde ?- peligroso(emu).?","o":["true: emu no figura como inofensivo","false: animal(emu) no se puede derivar","true: no se deriva inofensivo(emu)","Error: emu no aparece en el programa"],"a":1,"e":"El primer literal del cuerpo, animal(emu), falla, así que la regla no se aplica. En cambio, ?- \\+ inofensivo(emu). sí daría true. (Ep. VIII, «Negación por falla en Prolog»)"},{"q":"¿Qué le falta a Prolog estándar para un SBC con información contradictoria?","o":["Reglas con más de un literal en el cuerpo","Negación por falla y reglas con variables en la cabeza o en el cuerpo","Negación fuerte y un mecanismo para manejar la contradicción","Un top-level en el que se puedan hacer consultas"],"a":2,"e":"Prolog estándar no tiene negación fuerte ni un mecanismo para manejar adecuadamente la información contradictoria. (Ep. VIII, «Extender el mecanismo de inferencia»)"},{"q":"En el Mer-val original (sin ~), ¿qué responde Prolog a ?- comprar_acciones(acme). y a ?- no_comprar_acciones(acme).?","o":["true a las dos: hay una derivación para cada una","Un error, porque las dos conclusiones se contradicen","true a la primera y false a la segunda, por el orden de las reglas","false a las dos, porque Prolog detecta la contradicción"],"a":0,"e":"acme tiene buen precio según la web y también está en fusión: Prolog encuentra las dos derivaciones. Para Prolog son predicados distintos, no sabe que se contradicen. (Ep. VIII, «Consulta: ¿comprar acciones de acme?»)"},{"q":"¿Qué propiedad deseable de un SBC menciona la cátedra al hablar de conclusiones contradictorias?","o":["Que las conclusiones no cambien cuando se agrega información","Que la inferencia no concluya a la vez algo y exactamente lo contrario","Que toda consulta tenga al menos una derivación en la KB","Que cada conclusión tenga una única derivación posible"],"a":1,"e":"Es la propiedad de coherencia o consistencia. Que las conclusiones no cambien al agregar información es la monotonía, que justamente se pierde con estos mecanismos. (Ep. VIII, «¿Cuál conclusión debería prevalecer?»)"},{"q":"Pa
