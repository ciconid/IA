con tapa). Los mensajes son comunicación; sin operador, autonomía; desplazarse, movilidad. (TP5, ej. 5)"},{"h":"ec134a26","q":"Un robot de cuidado graba todo lo que pasa en la casa y comparte esos datos con otras máquinas sin que nadie lo note. ¿Qué leyes del derecho civil europeo mejoran esa situación?","o":["Igualdad de acceso a la robótica y restringir las tecnologías de mejora","Proteger la privacidad y gestionar los datos personales procesados por robots","Proteger contra la manipulación y evitar la disolución de los vínculos sociales","Proteger la libertad humana y respetar el rechazo de la atención de un robot"],"a":1,"e":"Las leyes 4 (privacidad) y 5 (gestión de datos personales): el robot solo registraría lo necesario y la comunicación entre máquinas dejaría de ser imperceptible. (TP5, ej. 7.d)"},{"h":"553e8236","q":"¿Qué ley del derecho civil europeo cubre la pérdida de empleos causada por robots que aprenden tareas cada vez más complejas?","o":["Proteger a los humanos de los daños de robots","Evitar la disolución de los vínculos sociales","Ninguna: haría falta una ley nueva","Igualdad de acceso al progreso en robótica"],"a":2,"e":"Ninguna la cubre: la de igualdad de acceso habla del acceso a la robótica, no del trabajo. Una ley nueva de transición laboral pediría capacitar y reubicar antes de automatizar, como las recomendaciones argentinas. (TP5, ej. 7.d)"}]},{"id":"u2","nombre":"Aprendizaje automático","tp":"TP6","qs":[{"h":"25c0790d","q":"¿En qué tipo de problemas se emplea el aprendizaje automático?","o":["Donde hay pocos datos y la respuesta tiene que ser siempre exacta","Donde programar a mano un algoritmo eficaz es difícil o imposible","Donde cada decisión tiene que poder justificarse con una regla explícita","Donde las reglas del dominio son conocidas, estables y fáciles de escribir"],"a":1,"e":"Se usa cuando diseñar y programar algoritmos explícitos con buen rendimiento es difícil o imposible (p. ej. reconocer dígitos escritos a mano). (Ep. VII, parte 1, «Aprendizaje automático»)"},{"h":"3b080a03","q":"¿Qué disciplinas aportan las herramientas del aprendizaje automático, según la cátedra?","o":["La lógica matemática y la filosofía del lenguaje","La matemática discreta y la teoría de juegos","La neurociencia y la psicología cognitiva","La estadística y las ciencias de la computación"],"a":3,"e":"El ML está dentro de la IA y requiere herramientas tanto de estadística como de ciencias de la computación. (Ep. VII, parte 1)"},{"h":"d00344ec","q":"Según la definición de la cátedra, los algoritmos de aprendizaje automático, a partir de datos de entrenamiento…","o":["Reciben reglas de un experto y las aplican a los casos que van llegando","Memorizan los ejemplos y los devuelven tal cual cuando vuelven a aparecer","Buscan en un grafo de estados un camino desde el inicio hasta la meta","Reconocen patrones, construyen un modelo y predicen sobre datos no vistos antes"],"a":3,"e":"Reconocen patrones, construyen un modelo y con él reconocen o predicen sobre datos no vistos. Recibir reglas de un experto describe más bien un SBC. (Ep. VII, parte 1, «Machine Learning – aprendizaje automático»)"},{"h":"81a90184","q":"En aprendizaje automático, ¿qué es lo que se entrena?","o":["El algoritmo","El software","El modelo","Los datos"],"a":2,"e":"Lo que se entrena o construye es el modelo. Los algoritmos los diseñan de antemano equipos de científicos, y el software que los implementa hace el trabajo de entrenar. (Ep. VII, parte 1, «Modelo»)"},{"h":"2a47e9bb","q":"La cátedra usa la fórmula T = distancia/velocidad como ejemplo de…","o":["Una métrica para medir la precisión de otros modelos de tránsito","Un modelo: simplifica la realidad, pero resulta útil","Un conjunto de entrenamiento con un único atributo numérico","Un algoritmo de aprendizaje que se ajusta con datos de viajes"],"a":1,"e":"Es un modelo: una abstracción que ignora semáforos y tráfico, pero cumple un propósito práctico. Sabiendo que es un modelo, se lo usa con cuidado aunque tenga errores. (Ep. VII, parte 1, «Modelo»)"},{"h":"41a79104","q":"En el contexto de machine learning, un modelo es…","o":["El procedimiento que define cómo se aprende a partir de los datos","El conjunto de datos etiquetados con el que se hace el entrenamiento","La medida del porcentaje de aciertos sobre los datos nuevos","Una estructura matemática que relaciona las entradas (datos) con las salidas"],"a":3,"e":"El modelo representa la relación entre entradas (datos) y salidas (predicciones), y permite generalizar. El procedimiento es el algoritmo de aprendizaje; el porcentaje de aciertos es una métrica. (Ep. VII, parte 1, «Modelo»)"},{"h":"8125a27a","q":"¿Qué diferencia a los modelos de aprendizaje automático de los de muchas otras disciplinas?","o":["Se expresan siempre como una fórmula cerrada que puede leer una persona","Son exactos, mientras que los de otras disciplinas simplifican la realidad","No pueden equivocarse sobre ninguno de los ejemplos con que se entrenaron","Los genera un algoritmo a partir de datos, no una persona"],"a":3,"e":"En muchas disciplinas los modelos los escriben personas (una fórmula, un texto); en ML los genera un algoritmo a partir de un conjunto de datos de entrenamiento. (Ep. VII, parte 1, «Modelo»)"},{"h":"053ee1c9","q":"De las tres etapas de creación de un modelo, ¿cuál es automática?","o":["La segunda: el algoritmo recorre los ejemplos y ajusta el modelo","Ninguna: los especialistas ajustan el modelo a mano en cada paso","La tercera: el sistema decide si el modelo es bueno para la tarea","La primera: el sistema elige el algoritmo y los datos más adecuados"],"a":0,"e":"1) los especialistas eligen algoritmo y datos; 2) el algoritmo crea el modelo automáticamente; 3) los especialistas deciden si el resultado es satisfactorio. (Ep. VII, parte 1, «Modelo»)"},{"h":"0053f8c0","q":"En la creación de un modelo, ¿quién decide si el resultado del entrenamiento es satisfactorio?","o":["El equipo de especialistas, en la tercera y última etapa","El algoritmo, cuando el error deja de disminuir","El conjunto de prueba, sin intervención humana","Los usuarios finales, después del despliegue"],"a":0,"e":"La tercera etapa es humana: los especialistas deciden si el modelo sirve para la tarea (reconocer personas, generar texto, etc.). (Ep. VII, parte 1, «Modelo»)"},{"h":"fbfd306d","q":"Según la cátedra, ¿qué relación hay entre los datos de entrenamiento y el resultado del aprendizaje?","o":["El resultado es el mismo con imágenes, audio, texto o datos tabulares","El resultado muchas veces es tan bueno como los datos de entrenamiento","El resultado mejora siempre que se agregan más atributos a los datos","El resultado depende sobre todo del algoritmo elegido, casi nada de los datos"],"a":1,"e":"Los datos son el combustible del aprendizaje: el tipo de datos puede afectar mucho la precisión y la eficacia del modelo. (Ep. VII, parte 1, «Los datos de entrenamiento»)"},{"h":"8164ddb7","q":"¿Cómo define la cátedra a la Inteligencia Artificial?","o":["La ciencia e ingeniería de construir artefactos inteligentes, en especial programas","La rama de la estadística que construye modelos predictivos a partir de los datos","El área que estudia algoritmos que aprenden patrones a partir de datos de entrenamiento","La disciplina que simula en una computadora el funcionamiento del cerebro humano"],"a":0,"e":"«Es la Ciencia e Ingeniería de construir artefactos inteligentes, en especial programas inteligentes de computadora». Aprender patrones de los datos es la definición de machine learning, un área de la IA. (Ep. VII, parte 1, «(Algunas) áreas de Inteligencia Artificial»)"},{"h":"304d4eb9","q":"Según la definición de la cátedra, además de construir artefactos inteligentes, la IA se relaciona con…","o":["El uso de computadoras para entender la inteligencia humana","La creación de computadoras cada vez más rápidas y de menor consumo","El diseño de robots indistinguibles de los seres humanos","La automatización de todas las tareas del trabajo humano"],"a":0,"e":"«También se relaciona con el uso de computadoras para entender la inteligencia humana». (Ep. VII, parte 1, «(Algunas) áreas de Inteligencia Artificial»)"},{"h":"5127cf0f","q":"¿Cuál NO es una de las áreas de la Inteligencia Artificial que muestra la cátedra?","o":["Sistemas de recomendación","Compiladores y lenguajes de programación","Procesamiento de lenguaje humano","Sistemas multiagente"],"a":1,"e":"Áreas: resolución automática de problemas, sistemas basados en conocimiento, aprendizaje automático, procesamiento de lenguaje humano, razonamiento automático, sistemas multiagente, representación de conocimiento, agentes inteligentes, sistemas para toma de decisiones, sistemas de recomendación, planificación automática y robótica. (Ep. VII, parte 1, «(Algunas) áreas de Inteligencia Artificial»)"},{"h":"9db84884","q":"¿Cuál de estas NO figura entre las áreas de la IA de la cátedra?","o":["Bases de datos relacionales","Sistemas para toma de decisiones","Planificación automática","Representación de conocimiento"],"a":0,"e":"Planificación, representación de conocimiento y sistemas para toma de decisiones son áreas de la IA en el esquema de la cátedra; las bases de datos, no. (Ep. VII, parte 1, «(Algunas) áreas de Inteligencia Artificial»)"},{"h":"06bf38fb","q":"¿Cuál de estas NO es un área de la IA en el esquema de la cátedra?","o":["Robótica","Razonamiento automático","Criptografía","Agentes inteligentes"],"a":2,"e":"Robótica, razonamiento automático y agentes inteligentes figuran en el esquema; la criptografía no. (Ep. VII, parte 1, «(Algunas) áreas de Inteligencia Artificial»)"},{"h":"9186b4bf","q":"¿Cuál NO es una de las técnicas de machine learning que enumera la cátedra?","o":["Merge sort","Support vector machines","Inductive logic programming","Association rule learning"],"a":0,"e":"Técnicas: decision trees, artificial neural networks, deep learning, association rule learning, Bayesian networks, clustering, genetic algorithms, support vector machines, inductive logic programming, reinforcement learning, representation learning, rule-based machine learning, similarity and metric learning, sparse dictionary learning. (Ep. VII, parte 1, «(Algunas) técnicas de Machine Learning»)"},{"h":"bfb8d79e","q":"¿Cuál de estas NO figura entre las técnicas de machine learning de la cátedra?","o":["Bayesian networks","Genetic algorithms","Búsqueda A*","Clustering"],"a":2,"e":"A* es un algoritmo de búsqueda, no una técnica de aprendizaje. Bayesian networks, genetic algorithms y clustering sí están en la lista. (Ep. VII, parte 1, «(Algunas) técnicas de Machine Learning»)"},{"h":"07733c41","q":"¿Cuál de estas NO es una técnica de machine learning de la lista de la cátedra?","o":["Sparse dictionary learning","Minimax con poda alfa-beta","Representation learning","Similarity and metric learning"],"a":1,"e":"Minimax es un algoritmo de juegos. Similarity and metric learning, sparse dictionary learning y representation learning están en la lista. (Ep. VII, parte 1, «(Algunas) técnicas de Machine Learning»)"},{"h":"f2a6e168","q":"En el ejemplo de la cátedra de las señales de velocidad máxima, ¿qué es el dataset etiquetado?","o":["Reglas escritas a mano que describen cómo es cada tipo de señal","Imágenes de señales ordenadas de menor a mayor según su velocidad máxima","Imágenes sin clasificar, que el algoritmo agrupa según su parecido","Imágenes donde cada una indica si es o no una señal de velocidad máxima"],"a":3,"e":"Un dataset de imágenes donde cada una está etiquetada indicando si es una señal de velocidad máxima o no. (Ep. VII, parte 1, «Machine Learning – aprendizaje automático»)"},{"h":"421c6871","q":"En los datos de entrenamiento de dígitos escritos a mano, ¿qué es la «etiqueta del resultado» de cada ejemplo?","o":["El dígito que representa la imagen","La predicción que hace el modelo","El número de orden del ejemplo","La cantidad de píxeles de la imagen"],"a":0,"e":"Cada ejemplo de entrenamiento (una imagen) va acompañado de la etiqueta del resultado: el dígito que es. La predicción la produce el modelo después. (Ep. VII, parte 1, «Machine Learning – aprendizaje automático»)"},{"h":"c1412979","q":"Un clasificador de señales dice que una imagen NO es una señal de velocidad máxima, pero sí lo es. ¿Qué tipo de error comete?","o":["Un verdadero negativo","Un falso positivo","Un falso negativo","Un sobreajuste"],"a":2,"e":"Predice «no» y la respuesta correcta era «sí»: falso negativo. Decir «sí» cuando no lo es sería un falso positivo. (Ep. VII, parte 1, «Machine Learning – aprendizaje automático»)"},{"h":"18389fdb","q":"Ante los falsos positivos y falsos negativos de un modelo, ¿qué pregunta plantea la cátedra?","o":["¿Cómo lograr un modelo que no cometa ningún fallo de clasificación?","¿Cuántos fallos estamos dispuestos a aceptar en las clasificaciones?","¿Quién es legalmente responsable por cada fallo que comete el modelo?","¿Qué algoritmo comete menos fallos en cualquier tipo de problema?"],"a":1,"e":"«Surge la pregunta: ¿Cuántos fallos estamos dispuestos a aceptar en las clasificaciones del modelo?». (Ep. VII, parte 1, «Machine Learning – aprendizaje automático»)"},{"h":"235b79c4","q":"Según la cátedra, en general, un modelo es…","o":["Un conjunto de datos de entrenamiento etiquetados con el resultado que se espera","Una copia exacta de un sistema real, que reproduce todos sus detalles y sus factores","Un procedimiento paso a paso para resolver de forma automática un problema dado","Una representación simplificada de un objeto, sistema, fenómeno o proceso real"],"a":3,"e":"Modelo: representación simplificada de un objeto, sistema, fenómeno o proceso de la realidad, creada para comprenderlo, analizarlo, explicarlo, predecirlo o simularlo. El procedimiento es el algoritmo; los datos etiquetados, el conjunto de entrenamiento. (Ep. VII, parte 1, «Modelo»)"},{"h":"83d761b1","q":"¿Cuál NO es uno de los fines con que se crea un modelo, según la definición de la cátedra?","o":["Simularlo","Explicarlo","Predecirlo","Venderlo"],"a":3,"e":"Un modelo se crea con el fin de comprender, analizar, explicar, predecir o simular un objeto, sistema, fenómeno o proceso. (Ep. VII, parte 1, «Modelo»)"},{"h":"ce2e2c14","q":"¿Cuál de estos NO es un fin de un modelo, según la definición de la cátedra?","o":["Copiarlo","Simularlo","Analizarlo","Comprenderlo"],"a":0,"e":"Comprender, analizar, explicar, predecir o simular. Un modelo es una representación simplificada: no busca reproducir la realidad con exactitud. (Ep. VII, parte 1, «Modelo»)"},{"h":"4b9fed5a","q":"Según la cátedra, ¿cómo puede ser la representación de un modelo?","o":["Solo matemática, porque siempre tiene que poder calcularse","Determinista o probabilística, pero nunca física","Abstracta, conceptual, física, matemática o computacional","Solo computacional, porque la genera un algoritmo"],"a":2,"e":"Dicha representación puede ser abstracta, conceptual, física, matemática o computacional. Que la genere un algoritmo es lo propio del aprendizaje automático, no de todo modelo. (Ep. VII, parte 1, «Modelo»)"},{"h":"2137cf28","q":"¿Qué es el algoritmo de aprendizaje?","o":["El método o procedimiento para aprender de los datos y obtener un modelo","La estructura matemática que relaciona las entradas con las salidas predichas","La métrica que mide qué tan bien predice el modelo sobre datos nuevos","El conjunto de ejemplos etiquetados con el que se entrena el modelo"],"a":0,"e":"El algoritmo de aprendizaje define el método o procedimiento particular que se usará para aprender a partir de los datos y obtener como resultado un modelo. La estructura matemática es el modelo. (Ep. VII, parte 1, «Etapa de entrenamiento: construcción del modelo»)"},{"h":"cb8f2fa7","q":"¿Cuál es el esquema de la etapa de entrenamiento, según la cátedra?","o":["MODELO → algoritmo de aprendizaje → DATOS","DATOS → MODELO → algoritmo de aprendizaje","algoritmo de aprendizaje → DATOS → MODELO","DATOS → algoritmo de aprendizaje → MODELO"],"a":3,"e":"El algoritmo de aprendizaje toma los datos de entrenamiento y produce el modelo. (Ep. VII, parte 1, «Etapa de entrenamiento: construcción del modelo»)"},{"h":"c6a52bce","q":"Según la cátedra, ¿cómo se denomina el conjunto de reglas o patrones aprendidos?","o":["Modelo","Algoritmo de aprendizaje","Conjunto de entrenamiento","Métrica"],"a":0,"e":"«El conjunto de reglas o patrones aprendidos se denomina modelo». (Ep. VII, parte 1, «Creación del modelo»)"},{"h":"57960bb6","q":"¿Por qué un modelo de machine learning permite hacer predicciones sobre datos nuevos?","o":["Porque guarda todos los ejemplos de entrenamiento y busca el más parecido","Porque contiene reglas escritas a mano por expertos del dominio","Porque es una abstracción de los datos de entrenamiento que generaliza","Porque se vuelve a entrenar desde cero con cada dato nuevo que recibe"],"a":2,"e":"El modelo es una abstracción de los datos de entrenamiento que permite hacer generalizaciones y realizar predicciones sobre nuevos datos. (Ep. VII, parte 1, «Creación del modelo»)"},{"h":"88e1ecea","q":"En la primera etapa de creación de un modelo, ¿qué decide el equipo de especialistas?","o":["Cuántos fallos puede cometer el modelo una vez en producción","Qué patrones tiene que encontrar el algoritmo en los datos","Qué algoritmo de entrenamiento usar y con qué conjunto de datos","Si el modelo resultante es bueno para la tarea que va a realizar"],"a":2,"e":"Etapa 1, casi todo trabajo humano: decidir qué algoritmo de entrenamiento se usará y con qué conjunto de datos. Decidir si el modelo es bueno es la etapa 3. Los patrones los busca el algoritmo, en la etapa 2. (Ep. VII, parte 1, «Modelo»)"},{"h":"f96a2651","q":"Según la cátedra, ¿quién hace el trabajo computacional de entrenar al modelo?","o":["El usuario final, que corrige el modelo cada vez que se equivoca","Los científicos, que ajustan a mano el modelo con cada dato nuevo","El software que implementa el algoritmo diseñado por científicos","El propio modelo, que elige con qué algoritmo aprender"],"a":2,"e":"Los algoritmos son diseñados previamente por equipos de científicos, y el software que los implementa hace el trabajo computacional automático de entrenar al modelo. (Ep. VII, parte 1, «Modelo»)"},{"h":"40b554b3","q":"¿Cuál NO es uno de los tipos de datos de entrenamiento que menciona la cátedra?","o":["Video","Texto plano en algún lenguaje natural","Programas ejecutables","Audio"],"a":2,"e":"Los datos de entrenamiento pueden ser imágenes, audio, video, texto plano en algún lenguaje natural y datos tabulares. (Ep. VII, parte 1, «Los datos de entrenamiento»)"},{"h":"6dcb8b11","q":"Según la cátedra, ¿qué son los datos tabulares?","o":["Imágenes de tablas impresas que el modelo aprende a leer y transcribir","Tablas que distinguen en su estructura atributos para cada ejemplo","Texto plano en lenguaje natural, organizado en párrafos numerados","Listas de etiquetas de resultado, sin atributos para cada ejemplo"],"a":1,"e":"Datos tabulares: tablas que diferencian en su estructura distintos atributos para cada ejemplo del conjunto de entrenamiento, como el conjunto de la impresora. (Ep. VII, parte 1, «Los datos de entrenamiento»)"},{"h":"16e6ef1c","q":"Según la cátedra, el tipo de datos de entrenamiento que se usa puede afectar significativamente…","o":["La cantidad de especialistas necesarios","El lenguaje en que se programa el algoritmo","La precisión y la eficacia del modelo","La cantidad de etapas del entrenamiento"],"a":2,"e":"El tipo de datos de entrenamiento puede afectar significativamente la precisión y la eficacia del modelo. (Ep. VII, parte 1, «Los datos de entrenamiento»)"},{"h":"1e95bb5b","q":"¿Qué distingue a los tres paradigmas clásicos (supervisado, no supervisado y por refuerzo)?","o":["El tipo de retroalimentación que recibe el que aprende","La cantidad de datos de entrenamiento que necesitan","El tipo de modelo que producen: árbol, red o reglas","Si el modelo se entrena una sola vez o de forma continua"],"a":0,"e":"Supervisado: pares entrada–salida etiquetados. No supervisado: ninguna retroalimentación explícita. Por refuerzo: recompensas o castigos. (TP6, ej. 1.d)"},{"h":"692366c0","q":"Un sistema agrupa clientes con hábitos de compra parecidos, sin ejemplos etiquetados. ¿Qué tipo de aprendizaje es?","o":["No supervisado","Supervisado de regresión","Por refuerzo","Supervisado de clasificación"],"a":0,"e":"No recibe etiquetas: descubre patrones en la entrada. La tarea más común del no supervisado es justamente el clustering. (TP6, ej. 1.d)"},{"h":"a0b7ebef","q":"Un agente aprende a jugar al ajedrez recibiendo solo puntos cuando gana una partida. ¿Qué tipo de aprendizaje es?","o":["No supervisado","Semisupervisado","Supervisado","Por refuerzo"],"a":3,"e":"Aprende de recompensas que llegan después de una secuencia de acciones, y tiene que deducir cuáles fueron responsables. (TP6, ej. 1.d)"},{"h":"2e940d3b","q":"El asistente de impresión aprende de ejemplos que traen la decisión tomada (inkjet o laser). ¿Qué tipo de aprendizaje es?","o":["Supervisado, de regresión","Supervisado, de clasificación","Por refuerzo, con recompensas","No supervisado, de clustering"],"a":1,"e":"Cada ejemplo trae su etiqueta (supervisado) y la salida es una clase de un conjunto finito (clasificación). Regresión sería predecir un número real. (Ep. VII, parte 2)","x":"<div class=\"ctx-tit\">Conjunto de entrenamiento del asistente de impresión<\/div><div class=\"ctx-scroll\"><table class=\"ctx-tabla\"><thead><tr><th><\/th><th>día<\/th><th>hora<\/th><th>páginas<\/th><th>tipo<\/th><th>tamaño<\/th><th>decisión<\/th><\/tr><\/thead><tbody><tr><td>e1<\/td><td>L-V<\/td><td>mañana<\/td><td>pocas<\/td><td>pdf<\/td><td>grande<\/td><td>inkjet<\/td><\/tr><tr><td>e2<\/td><td>L-V<\/td><td>tarde<\/td><td>muchas<\/td><td>doc<\/td><td>mediano<\/td><td>laser<\/td><\/tr><tr><td>e3<\/td><td>L-V<\/td><td>tarde<\/td><td>muchas<\/td><td>xls<\/td><td>chico<\/td><td>laser<\/td><\/tr><tr><td>e4<\/td><td>L-V<\/td><td>noche<\/td><td>muchas<\/td><td>doc<\/td><td>mediano<\/td><td>inkjet<\/td><\/tr><tr><td>e5<\/td><td>L-V<\/td><td>mañana<\/td><td>muchas<\/td><td>pdf<\/td><td>grande<\/td><td>laser<\/td><\/tr><tr><td>e6<\/td><td>L-V<\/td><td>tarde<\/td><td>pocas<\/td><td>xls<\/td><td>chico<\/td><td>inkjet<\/td><\/tr><tr><td>e7<\/td><td>L-V<\/td><td>noche<\/td><td>muchas<\/td><td>xls<\/td><td>chico<\/td><td>inkjet<\/td><\/tr><tr><td>e8<\/td><td>L-V<\/td><td>tarde<\/td><td>muchas<\/td><td>doc<\/td><td>chico<\/td><td>laser<\/td><\/tr><tr><td>e9<\/td><td>L-V<\/td><td>tarde<\/td><td>pocas<\/td><td>doc<\/td><td>chico<\/td><td>inkjet<\/td><\/tr><tr><td>e10<\/td><td>L-V<\/td><td>noche<\/td><td>muchas<\/td><td>pdf<\/td><td>grande<\/td><td>inkjet<\/td><\/tr><tr><td>e11<\/td><td>L-V<\/td><td>mañana<\/td><td>muchas<\/td><td>xls<\/td><td>chico<\/td><td>laser<\/td><\/tr><tr><td>e12<\/td><td>Finde<\/td><td>mañana<\/td><td>muchas<\/td><td>pdf<\/td><td>grande<\/td><td>inkjet<\/td><\/tr><tr><td>e13<\/td><td>Finde<\/td><td>tarde<\/td><td>muchas<\/td><td>doc<\/td><td>chico<\/td><td>inkjet<\/td><\/tr><tr><td>e14<\/td><td>Finde<\/td><td>mañana<\/td><td>pocas<\/td><td>doc<\/td><td>grande<\/td><td>inkjet<\/td><\/tr><\/tbody><\/table><\/div>"},{"h":"2765dd6b","q":"¿Qué caracteriza al aprendizaje supervisado?","o":["Aprende una función de pares entrada–salida etiquetados por un «maestro»","Aprende de recompensas o castigos que llegan después de varias acciones","Aplica reglas que un experto escribe a mano para cada caso posible","Descubre patrones en las entradas sin ninguna retroalimentación explícita"],"a":0,"e":"Supervisado: observa pares entrada–salida (ejemplos etiquetados) y aprende una función de la entrada a la salida. Sin retroalimentación es no supervisado; con recompensas, por refuerzo. (TP6, ej. 1.d)"},{"h":"89000647","q":"¿Qué caracteriza al aprendizaje no supervisado?","o":["Sin retroalimentación explícita, descubre patrones en las entradas","Aprende de recompensas o castigos que recibe después de actuar","Necesita que un «maestro» corrija cada una de sus predicciones","Aprende una función a partir de pares entrada–salida etiquetados por un maestro"],"a":0,"e":"No supervisado: no recibe ninguna retroalimentación explícita; descubre patrones en la entrada, como agrupar ejemplos parecidos (clustering). (TP6, ej. 1.d)"},{"h":"53f56869","q":"¿Qué caracteriza al aprendizaje por refuerzo?","o":["Recibe la salida correcta inmediatamente después de cada una de sus acciones","Aprende una función a partir de pares entrada–salida etiquetados por un «maestro»","Descubre grupos de ejemplos parecidos sin ninguna retroalimentación explícita","Aprende de recompensas o castigos, que suelen llegar tras varias acciones"],"a":3,"e":"Por refuerzo: aprende de una serie de recompensas o castigos, que a menudo llegan después de una secuencia de acciones (la propina del taxi, los puntos por ganar una partida). (TP6, ej. 1.d)"},{"h":"fc9b4261","q":"En el aprendizaje por refuerzo, ¿qué es el problema de asignación de crédito (credit assignment)?","o":["Repartir los ejemplos etiquetados entre el entrenamiento y la prueba","Decidir cuánta recompensa le corresponde a cada acción correcta del agente","Deducir cuáles de sus acciones causaron la recompensa o el castigo","Elegir qué atributo conviene poner en la raíz de un árbol de decisión"],"a":2,"e":"Como la recompensa llega después de una secuencia de acciones, el agente tiene que deducir cuáles de ellas fueron responsables. (TP6, ej. 1.d)"},{"h":"0d36a4e4","q":"¿Cuál es la tarea más común del aprendizaje no supervisado?","o":["Planificación: armar una secuencia de acciones","Regresión: predecir un número real","Clasificación: asignar una clase a cada ejemplo","Clustering: agrupar ejemplos parecidos"],"a":3,"e":"La tarea más común del no supervisado es el clustering. Clasificación y regresión son tareas de aprendizaje supervisado. (TP6, ej. 1.d)"},{"h":"a0ec1fc6","q":"Un árbol de decisión que predice la cantidad de días de internación de un paciente es un árbol de…","o":["Clasificación","Regresión","Búsqueda","Asociación"],"a":1,"e":"Árboles de clasificación: el resultado es una clase. Árboles de regresión: el resultado es un número real (el precio de una casa, los días en un hospital). (Ep. VII, parte 2, «Algoritmos de Aprendizaje con Árboles de Decisión»)"},{"h":"a13cd2c9","q":"¿Qué diferencia a los algoritmos ID3 y CART?","o":["CART solo acepta atributos binarios; ID3 acepta atributos de cualquier tipo","ID3 sirve para clasificación y regresión; CART, principalmente para clasificación","ID3 construye varios árboles y los combina; CART construye un único árbol","CART sirve para clasificación y regresión; ID3, principalmente para clasificación"],"a":3,"e":"ID3 (Quinlan, 1986) está pensado para variables objetivo categóricas; CART (Breiman y otros, 1984) maneja variables objetivo categóricas y numéricas. (Ep. VII, parte 2)"},{"h":"c45bb262","q":"¿Qué hace un clasificador Random Forest?","o":["Usa varios árboles de decisión a la vez para mejorar la tasa de clasificación","Combina un árbol de decisión con una red neuronal en la misma salida","Elige al azar el atributo de cada nodo de un único árbol de decisión","Poda un único árbol grande para reducir el sobreajuste a los datos"],"a":0,"e":"Es una técnica que construye más de un árbol de decisión para clasificar mejor. (Ep. VII, parte 2, «Algoritmos de Aprendizaje con Árboles de Decisión»)"},{"h":"a7f0a8f9","q":"En un árbol de decisión, ¿con qué se etiquetan las hojas?","o":["Con valores de atributos","Con clasificaciones","Con ejemplos","Con atributos"],"a":1,"e":"Nodos internos: atributos. Arcos: valores del atributo del nodo. Hojas: clasificaciones (p. ej. laser / inkjet). (Ep. VII, parte 2, «Árbol de decisión»)"},{"h":"b966c249","q":"En un árbol de decisión, los arcos que salen de un nodo etiquetado con el atributo A se etiquetan con…","o":["Cada uno de los valores posibles de A","Los atributos que todavía no se usaron","Cada una de las clasificaciones posibles","La cantidad de ejemplos que siguen ese arco"],"a":0,"e":"Un arco por cada valor posible del atributo A; las clasificaciones van en las hojas. (Ep. VII, parte 2, «Árbol de decisión»)"},{"h":"b782435b","q":"¿Qué se asume sobre los atributos en la definición de árbol de decisión de la cátedra?","o":["Que todos tienen la misma cantidad de valores","Que tienen un rango de valores finito y discreto","Que son estadísticamente independientes entre sí","Que son numéricos y toman valores continuos"],"a":1,"e":"Se asume que los atributos tienen un rango de valores finito y discreto (día: L-V/Finde; hora: mañana/tarde/noche…). (Ep. VII, parte 2, «Árbol de decisión»)"},{"h":"ea17c518","q":"¿Cuándo un conjunto de entrenamiento NO es adecuado para construir un árbol de decisión?","o":["Cuando dos ejemplos con iguales atributos tienen distinta clase","Cuando hay muchos más ejemplos de una clase que de la otra","Cuando algún valor de un atributo no aparece en ninguno de los ejemplos","Cuando algunos atributos resultan irrelevantes para la decisión"],"a":0,"e":"Si dos ejemplos concuerdan en los atributos pero dan distinta clasificación, ningún árbol puede clasificar bien a los dos. (Ep. VII, parte 2, «Árbol de decisión»)"},{"h":"67dc395c","q":"Al conjunto de la impresora se le agrega e15 = (L-V, mañana, pocas, pdf, grande) con decisión laser. ¿Qué pasa?","o":["Deja de ser adecuado: e1 tiene esos mismos atributos y es inkjet","La hoja de páginas = pocas pasa a decir laser, porque e15 es más reciente","El algoritmo agrega un nodo con el atributo tipo para separar los dos casos","Nada: e15 es un ejemplo más y el árbol se reconstruye igual que antes"],"a":0,"e":"e1 = (L-V, mañana, pocas, pdf, grande) → inkjet. Con e15 hay dos ejemplos iguales en todos los atributos y con distinta clase: ningún árbol los separa, ni siquiera agregando nodos. (TP6, ej. 3.b)","x":"<div class=\"ctx-tit\">Conjunto de entrenamiento del asistente de impresión<\/div><div class= 3\" class=\"nodo\"/><text x=\"200\" y=\"27\" class=\"tn\">páginas<\/text><rect x=\"48.0\" y=\"79\" width=\"64\" height=\"26\" rx=\"4\" class=\"hoja\"/><text x=\"80\" y=\"97\" class=\"th\">inkjet<\/text><rect x=\"293.0\" y=\"79\" width=\"74\" height=\"26\" rx=\"13\" class=\"nodo\"/><text x=\"330\" y=\"97\" class=\"tn\">hora<\/text><rect x=\"163.0\" y=\"149\" width=\"74\" height=\"26\" rx=\"13\" class=\"nodo\"/><text x=\"200\" y=\"167\" class=\"tn\">día<\/text><rect x=\"343.0\" y=\"149\" width=\"74\" height=\"26\" rx=\"13\" class=\"nodo\"/><text x=\"380\" y=\"167\" class=\"tn\">día<\/text><rect x=\"468.0\" y=\"149\" width=\"64\" height=\"26\" rx=\"4\" class=\"hoja\"/><text x=\"500\" y=\"167\" class=\"th\">inkjet<\/text><rect x=\"118.0\" y=\"219\" width=\"64\" height=\"26\" rx=\"4\" class=\"hoja\"/><text x=\"150\" y=\"237\" class=\"th\">laser<\/text><rect x=\"218.0\" y=\"219\" width=\"64\" height=\"26\" rx=\"4\" class=\"hoja\"/><text x=\"250\" y=\"237\" class=\"th\">inkjet<\/text><rect x=\"298.0\" y=\"219\" width=\"64\" height=\"26\" rx=\"4\" class=\"hoja\"/><text x=\"330\" y=\"237\" class=\"th\">laser<\/text><rect x=\"398.0\" y=\"219\" width=\"64\" height=\"26\" rx=\"4\" class=\"hoja\"/><text x=\"430\" y=\"237\" class=\"th\">inkjet<\/text><\/svg>"},{"h":"cc7d29a9","q":"En un árbol de decisión, ¿con qué se etiquetan los nodos internos?","o":["Con clasificaciones, como laser o inkjet","Con los valores posibles de un atributo","Con atributos que caracterizan a los datos","Con los ejemplos del entrenamiento"],"a":2,"e":"Nodos internos: atributos. Arcos: los valores posibles del atributo del nodo del que salen. Hojas: clasificaciones. (Ep. VII, parte 2, «Árbol de decisión»)"},{"h":"f2072a82","q":"Según la cátedra, ¿qué vincula un árbol de decisión?","o":["Los atributos relevantes de cada observación con la decisión tomada","Todos los atributos de los datos con la cantidad de ejemplos de cada clase","Cada ejemplo del entrenamiento con el ejemplo nuevo que más se le parece","Las decisiones tomadas en el entrenamiento con las reglas escritas por un experto"],"a":0,"e":"El árbol establece un vínculo entre los atributos relevantes de cada observación y la respuesta o decisión que fue tomada en el conjunto de entrenamiento. (Ep. VII, parte 2, «Árbol de decisión»)"},{"h":"70f36fcd","q":"Una vez construido a partir del conjunto de entrenamiento, ¿para qué se usa un árbol de decisión?","o":["Para decidir qué atributos conviene recolectar en los próximos datos","Para volver a etiquetar los ejemplos del conjunto de entrenamiento","Para medir qué tan adecuado es el conjunto de entrenamiento usado","Como modelo, para dar una respuesta o tomar una decisión en el futuro"],"a":3,"e":"Una vez construido, el árbol es un modelo que se puede usar en el futuro para dar una respuesta o tomar una decisión. (Ep. VII, parte 2, «Árbol de decisión»)"},{"h":"79ee9980","q":"¿Cómo se clasifica una observación nueva con un árbol de decisión ya construido?","o":["Desde las hojas, subiendo hasta la raíz por los arcos que coinciden con sus valores","Desde la raíz, siguiendo en cada nodo el arco de su valor, hasta llegar a una hoja","Comparándola con todos los ejemplos y copiando la clase del que más se le parece","Recorriendo todos los caminos y eligiendo la clase que aparece en más hojas"],"a":1,"e":"Se parte de la raíz; en cada nodo se sigue el arco que corresponde al valor de la observación en ese atributo, hasta una hoja, cuya etiqueta es la clasificación. (TP6, ej. 3.c)"},{"h":"382f4b36","q":"Además de que el conjunto sea adecuado, ¿qué deben cumplir los datos para construir un árbol de decisión?","o":["Cada clase debe tener la misma cantidad de ejemplos","Ningún ejemplo puede repetir un valor de atributo","Todos los atributos tienen que ser numéricos y de rango continuo","Todos los ejemplos tienen los mismos atributos y su clasificación"],"a":3,"e":"Datos tabulares: todos los ejemplos se describen con los mismos atributos y traen su etiqueta; los atributos tienen rango finito y discreto; y el conjunto es adecuado. (TP6, ej. 3.a)"},{"h":"59a47500","q":"¿Por qué nada impide que un árbol de decisión sin restricciones memorice el conjunto de entrenamiento?","o":["Porque puede representar cualquier función de los atributos","Porque se entrena varias veces con los mismos ejemplos","Porque usa todos los atributos en cada uno de sus caminos","Porque guarda una copia de cada ejemplo en sus hojas"],"a":0,"e":"Los árboles pueden representar cualquier función de los atributos, y sin restricciones se siguen partiendo hasta clasificar todo el entrenamiento, incluidos el ruido y las coincidencias. (TP6, ej. 3.d)"},{"h":"565fc77a","q":"¿Cuándo es más probable que un modelo sobreajuste?","o":["Con un árbol de pocas hojas, cada una apoyada en muchos ejemplos","Con menos atributos o un espacio de hipótesis menor, y con más ejemplos","Con más atributos o un espacio de hipótesis mayor, y con menos ejemplos","Con más ejemplos de entrenamiento, sin importar cuántos atributos haya"],"a":2,"e":"El sobreajuste es más probable cuanto más grande es el espacio de hipótesis y cuantos más atributos hay, y menos probable cuantos más ejemplos de entrenamiento hay. (TP6, ej. 3.d)"},{"h":"462d878c","q":"Un clasificador de señales dice que una imagen es una señal de velocidad máxima, y no lo es. ¿Qué tipo de error comete?","o":["Falso positivo","Verdadero negativo","Falso negativo","Sobreajuste"],"a":0,"e":"Dice «sí» cuando la respuesta correcta es «no»: falso positivo. Falso negativo sería decir que no es una señal cuando sí lo es. (Ep. VII, parte 1, «Machine Learning – aprendizaje automático»)"},{"h":"5f53a1da","q":"¿Qué es el sobreajuste (overfitting)?","o":["Un entrenamiento que tarda demasiado por tener un exceso de ejemplos","Un modelo que clasifica mal el entrenamiento y bien los datos nuevos","Un modelo que acierta mucho en el entrenamiento y falla con datos nuevos","Un conjunto de entrenamiento con más atributos que ejemplos"],"a":2,"e":"El modelo se ajusta a distinciones que aparecen en el entrenamiento (coincidencias o ruido) pero no en los datos no vistos. (TP6, ej. 2)"},{"h":"126a99c4","q":"¿Cómo se detecta el sobreajuste al aumentar la complejidad del modelo?","o":["Los dos errores, de entrenamiento y sobre datos nuevos, bajan juntos y se estabilizan","El error de entrenamiento sigue bajando mientras el error sobre datos nuevos sube","El error de entrenamiento empieza a subir mientras el error sobre datos nuevos baja","El error sobre datos nuevos es cero desde el comienzo y el de entrenamiento no"],"a":1,"e":"Se comparan los dos errores: hay sobreajuste cuando el de entrenamiento queda en casi cero pero el de los datos no vistos empieza a crecer. (TP6, ej. 2)"},{"h":"fc7e748b","q":"¿Por qué hay que distinguir el desempeño sobre el conjunto de entrenamiento del desempeño sobre el de prueba?","o":["Porque entrenar con todos los datos haría el entrenamiento muy lento","Porque las métricas solo se calculan sobre datos sin etiqueta","Porque las etiquetas de prueba son más confiables que las de entrenamiento","Porque el modelo ya vio esos ejemplos; lo que importa es cómo predice casos nuevos"],"a":3,"e":"Un error bajo en el entrenamiento no garantiza que el modelo generalice; eso se estima con datos que el modelo no vio. (TP6, ej. 2)"},{"h":"83390543","q":"¿Por qué los árboles de decisión tienden al sobreajuste cuando crecen sin restricciones?","o":["Siguen partiendo hasta clasificar todo, aunque sea por ruido o coincidencia","Necesitan atributos continuos, y discretizarlos introduce errores en las hojas","Consultan siempre todos los atributos en cada camino, aunque sean irrelevantes","Solo pueden representar funciones lineales de los atributos, y se quedan cortos"],"a":0,"e":"Sin restricciones el árbol se vuelve consistente con todos los ejemplos, y las hojas profundas se apoyan en muy pocos ejemplos: memoriza coincidencias. (TP6, ej. 3.d)"},{"h":"fe1dc4e6","q":"¿Cómo se evalúa una RNA, según la cátedra?","o":["Se cuenta cuántas neuronas de la capa oculta se activan para cada ejemplo","Se comparan sus pesos con los de otra red ya validada para la misma tarea","Se mide el porcentaje de aciertos sobre los mismos ejemplos con los que se entrenó","Se reservan datos que no se usan para entrenar y se mide con una métrica"],"a":3,"e":"Una parte del conjunto de datos se usa para entrenar y otra se reserva para la evaluación con alguna métrica. (Ep. VII, parte 3, «¿Qué tan buena es mi RNA?»)"},{"h":"3011cccf","q":"¿Para qué se usa una métrica durante el entrenamiento?","o":["Para decidir si el modelo final es satisfactorio para la tarea","Para elegir el algoritmo y los datos de entrenamiento","Para etiquetar los ejemplos que no tienen clase","Para guiar el ajuste del modelo y como criterio de corte"],"a":3,"e":"En el entrenamiento, la métrica guía el ajuste (se minimiza el error) y sirve de criterio de corte: se entrena hasta un error aceptable, p. ej. 97% de aciertos. Decidir si el modelo es satisfactorio es su uso en la evaluación. (TP6, ej. 2)"},{"h":"193cca57","q":"¿Para qué se usa una métrica en la evaluación de un modelo?","o":["Para elegir qué ejemplos se reservan para la prueba","Para guiar el ajuste de los pesos de la red durante el entrenamiento","Para decidir cuándo cortar el entrenamiento del modelo","Para decidir con datos reservados si el modelo es satisfactorio"],"a":3,"e":"En la evaluación, la métrica se calcula sobre datos reservados y sirve para decidir si el modelo es satisfactorio: cuántos fallos estamos dispuestos a aceptar. (TP6, ej. 2)"},{"h":"a8174524","q":"Estructuralmente, ¿qué es una red neuronal artificial?","o":["Un grafo dirigido de neuronas artificiales conectadas por arcos con pesos","Un árbol cuyas hojas son las clases posibles de la salida","Una base de reglas condición–acción sobre los datos de entrada","Una tabla que asocia cada entrada posible con su salida"],"a":0,"e":"Es un grafo dirigido de nodos (neuronas artificiales) interconectados por arcos; cada arco guarda un peso w. (Ep. VII, parte 3, «Redes Neuronales Artificiales»)"},{"h":"285049e8","q":"Las capas ocultas de una RNA…","o":["Reciben el estímulo del exterior antes de que llegue a la capa de entrada","Contienen las neuronas que se descartan una vez terminado el entrenamiento","Guardan los ejemplos de entrenamiento para consultarlos al predecir","Están entre la capa de entrada y la de salida, sin contacto con el exterior de la red"],"a":3,"e":"La capa de entrada recibe el estímulo del exterior, la de salida envía la respuesta, y las ocultas quedan en el medio. (Ep. VII, parte 3, «Redes Neuronales Artificiales»)"},{"h":"e6d7a516","q":"En la red de la cátedra para reconocer dígitos escritos a mano en imágenes de 28×28 píxeles, ¿cuántas neuronas tiene la capa de entrada?","o":["10, una por dígito posible","28, una por fila de la imagen","784, una por píxel","15, igual que la capa oculta"],"a":2,"e":"28 × 28 = 784 neuronas de entrada, que codifican los valores de los píxeles. La capa de salida tiene 10 (una por dígito) y la oculta, 15. (Ep. VII, parte 3)"},{"h":"f592777d","q":"Una red tiene 784 neuronas de entrada, 15 ocultas y 10 de salida, y cada neurona de una capa se conecta con todas las de la siguiente. ¿Cuántos arcos tiene?","o":["11.760","809","11.910","117.600"],"a":2,"e":"784 × 15 + 15 × 10 = 11.760 + 150 = 11.910. 809 es la suma de neuronas; 117.600 multiplica las tres capas; 11.760 olvida los arcos de la oculta a la salida. (Ep. VII, parte 3)","x":"<div class=\"ctx-tit\">Red de la cátedra para reconocer dígitos (se dibujan solo algunas neuronas)<\/div><svg class=\"ctx-svg\" viewBox=\"0 0 520 250\" role=\"img\" aria-label=\"Red con capas de 784 (entrada), 15 (oculta), 10 (salida), cada neurona conectada con todas las de la capa siguiente\"><line x1=\"90.0\" y1=\"38.0\" x2=\"260.0\" y2=\"38.0\" class=\"arco\"/><line x1=\"90.0\" y1=\"38.0\" x2=\"260.0\" y2=\"67.0\" class=\"arco\"/><line x1=\"90.0\" y1=\"38.0\" x2=\"260.0\" y2=\"96.0\" clas "tn\">⋮<\/text><text x=\"260.0\" y=\"18\" class=\"tn\">oculta<\/text><text x=\"260.0\" y=\"242\" class=\"et2\">15 neuronas<\/text><circle cx=\"430.0\" cy=\"38.0\" r=\"7\" class=\"neu\"/><circle cx=\"430.0\" cy=\"81.5\" r=\"7\" class=\"neu\"/><circle cx=\"430.0\" cy=\"168.5\" r=\"7\" class=\"neu\"/><circle cx=\"430.0\" cy=\"212.0\" r=\"7\" class=\"neu\"/><text x=\"430.0\" y=\"130.0\" class=\"tn\">⋮<\/text><text x=\"430.0\" y=\"18\" class=\"tn\">salida<\/text><text x=\"430.0\" y=\"242\" class=\"et2\">10 neuronas<\/text><\/svg>"},{"h":"37d15386","q":"Un perceptrón con w1 = w2 = −2 y b = 3 recibe x1 = 1 y x2 = 1. ¿Qué devuelve?","o":["1, porque −2 − 2 + 3 = −1 es distinto de 0","1, porque el sesgo b = 3 es mayor que 0","0, porque −2 − 2 + 3 = −1 no es mayor que 0","−1, que es el valor de la suma ponderada de la neurona"],"a":2,"e":"El perceptrón devuelve 1 si w·x + b > 0, y 0 en otro caso. Acá la suma es −1, así que devuelve 0. (Ep. VII, parte 3, «Ejemplo»)","x":"<div class=\"ctx-tit\">Perceptrón de la pregunta<\/div><svg class=\"ctx-svg\" viewBox=\"20 0 480 200\" role=\"img\" aria-label=\"Perceptrón con entradas x1 de peso w1 = −2, x2 de peso w2 = −2 y sesgo b = 3\"><defs><marker id=\"fl\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"punta\"/><\/marker><\/defs><rect x=\"40\" y=\"39.0\" width=\"96\" height=\"32\" rx=\"16\" class=\"nodo\"/><text x=\"88\" y=\"60.0\" class=\"tn\">x1 = 1<\/text><line x1=\"136\" y1=\"55.0\" x2=\"256\" y2=\"88.75\" class=\"ar\" marker-end=\"url(#fl)\"/><text x=\"196.0\" y=\"64.875\" class=\"et\">w1 = −2<\/text><rect x=\"40\" y=\"129.0\" width=\"96\" height=\"32\" rx=\"16\" class=\"nodo\"/><text x=\"88\" y=\"150.0\" class=\"tn\">x2 = 1<\/text><line x1=\"136\" y1=\"145.0\" x2=\"256\" y2=\"111.25\" class=\"ar\" marker-end=\"url(#fl)\"/><text x=\"196.0\" y=\"121.125\" class=\"et\">w2 = −2<\/text><circle cx=\"300\" cy=\"100\" r=\"42\" class=\"neu\"/><text x=\"300\" y=\"96\" class=\"tn\">perceptrón<\/text><text x=\"300\" y=\"115\" class=\"et2\">b = 3<\/text><line x1=\"342\" y1=\"100\" x2=\"428\" y2=\"100\" class=\"ar\" marker-end=\"url(#fl)\"/><text x=\"438\" y=\"105\" class=\"tn\" style=\"text-anchor:start\">salida<\/text><\/svg>"},{"h":"5ae5f973","q":"¿Qué función booleana implementa un perceptrón con w1 = w2 = −2 y b = 3?","o":["OR","AND","NAND","XOR"],"a":2,"e":"Las sumas son f(0,0) = 3, f(0,1) = f(1,0) = 1 y f(1,1) = −1, así que la salida es 1, 1, 1, 0: la NAND. (Ep. VII, parte 3, «Ejemplo»)","x":"<div class=\"ctx-tit\">Perceptrón de la pregunta<\/div><svg class=\"ctx-svg\" viewBox=\"20 0 480 200\" role=\"img\" aria-label=\"Perceptrón con entradas x1 de peso w1 = −2, x2 de peso w2 = −2 y sesgo b = 3\"><defs><marker id=\"fl\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"punta\"/><\/marker><\/defs><rect x=\"40\" y=\"39.0\" width=\"96\" height=\"32\" rx=\"16\" class=\"nodo\"/><text x=\"88\" y=\"60.0\" class=\"tn\">x1<\/text><line x1=\"136\" y1=\"55.0\" x2=\"256\" y2=\"88.75\" class=\"ar\" marker-end=\"url(#fl)\"/><text x=\"196.0\" y=\"64.875\" class=\"et\">w1 = −2<\/text><rect x=\"40\" y=\"129.0\" width=\"96\" height=\"32\" rx=\"16\" class=\"nodo\"/><text x=\"88\" y=\"150.0\" class=\"tn\">x2<\/text><line x1=\"136\" y1=\"145.0\" x2=\"256\" y2=\"111.25\" class=\"ar\" marker-end=\"url(#fl)\"/><text x=\"196.0\" y=\"121.125\" class=\"et\">w2 = −2<\/text><circle cx=\"300\" cy=\"100\" r=\"42\" class=\"neu\"/><text x=\"300\" y=\"96\" class=\"tn\">perceptrón<\/text><text x=\"300\" y=\"115\" class=\"et2\">b = 3<\/text><line x1=\"342\" y1=\"100\" x2=\"428\" y2=\"100\" class=\"ar\" marker-end=\"url(#fl)\"/><text x=\"438\" y=\"105\" class=\"tn\" style=\"text-anchor:start\">salida<\/text><\/svg>"},{"h":"24d7fca5","q":"¿Qué diferencia a una neurona sigmoide de un perceptrón?","o":["El perceptrón tiene una salida por entrada; la sigmoide, una sola","La sigmoide da una salida continua entre 0 y 1; el perceptrón, 0 o 1","El perceptrón da una salida continua entre 0 y 1; la sigmoide, 0 o 1","La sigmoide no usa pesos en sus entradas; el perceptrón, sí"],"a":1,"e":"Las dos combinan las entradas con pesos y sesgo; el perceptrón aplica un escalón (0 o 1) y la sigmoide, una versión suave del escalón. (Ep. VII, parte 3, «Neuronas Artificiales»)"},{"h":"734fbe1f","q":"¿Qué significa que una RNA está entrenada?","o":["Que se eligió la cantidad de capas ocultas óptima para resolver la tarea","Que se encontraron valores de pesos y umbrales con los que predice bien","Que memorizó las imágenes del conjunto de entrenamiento con su etiqueta","Que se agregaron las neuronas necesarias para cubrir todos los ejemplos vistos"],"a":1,"e":"Entrenada = se encontraron valores adecuados para los pesos w de todos los arcos y los umbrales de cada nodo. La cantidad de capas se elige antes de entrenar. (Ep. VII, parte 3, «Redes Neuronales Artificiales»)"},{"h":"d384337c","q":"¿Qué se decide antes de entrenar una RNA?","o":["Qué ejemplos nuevos se van a clasificar después","Los valores finales de los pesos de cada arco","El porcentaje de aciertos que tendrá sobre datos nuevos","La configuración de la red y la función matemática de cada nodo"],"a":3,"e":"Primero se elige la forma de la red y la función de cada nodo; después se asignan valores iniciales a los arcos y el entrenamiento los va ajustando. (Ep. VII, parte 3)"},{"h":"c7cb0349","q":"¿El entrenamiento de una RNA modifica las conexiones entre neuronas?","o":["Sí: cambia la función de activación de las neuronas que más se equivocan","Sí: agrega y quita conexiones entre neuronas según el error que comete la red","No: los pesos se fijan al elegir la red, y el entrenamiento ajusta la topología","Solo cambia sus valores (pesos y umbrales); la topología se fija antes"],"a":3,"e":"La topología se fija al elegir la configuración; el entrenamiento ajusta numéricamente los pesos w (intensidad y signo de cada conexión) y los sesgos b. (TP6, ej. 4.c)"},{"h":"0ffde291","q":"¿Cómo se formula el aprendizaje de una red neuronal?","o":["Como satisfacer un conjunto de restricciones lógicas entre las neuronas","Como buscar los parámetros que minimizan el error cuadrático de la salida","Como maximizar la cantidad de neuronas que se activan en la capa de salida","Como encontrar el camino más corto entre la capa de entrada y la de salida"],"a":1,"e":"Es un problema de minimización: dado un conjunto de ejemplos, encontrar los parámetros que minimicen el error cuadrático. (Ep. VII, parte 3, «Neuronas Artificiales»)"},{"h":"8d2e172f","q":"¿Qué diferencia hay entre hill climbing y el descenso de gradiente?","o":["Hill climbing minimiza una función; el descenso de gradiente, en cambio, la maximiza","Hill climbing sigue la pendiente local; el descenso de gradiente evalúa todos los vecinos","Hill climbing evalúa todos los vecinos; el descenso de gradiente sigue la pendiente local","Hill climbing requiere una función continua; el descenso de gradiente, una discreta"],"a":2,"e":"Hill climbing evalúa la función en cada vecino y va al mejor (maximiza, sirve para problemas discretos). El descenso de gradiente mira la pendiente y va hacia la más pronunciada (minimiza, requiere una función continua con gradiente). (Ep. VII, parte 3)"},{"h":"5faab886","q":"Comparado con hill climbing, el descenso de gradiente…","o":["Garantiza llegar al mínimo global, pero a cambio es bastante más lento","Suele ser mucho más eficiente, pero sirve para menos tipos de problemas","Sirve para más tipos de problemas, pero en general es mucho menos eficiente","Puede optimizar problemas discretos, pero necesita mucha más memoria"],"a":1,"e":"Por lo general es mucho más eficiente que la escalada ingenua, pero supone una función continua con gradiente calculable. (Ep. VII, parte 3, «Stochastic gradient descent vs. Hill climbing»)"},{"h":"57364955","q":"¿Qué papel cumple backpropagation en el entrenamiento de una RNA?","o":["Evalúa el modelo final con los datos que se reservaron para la prueba","Elige la cantidad de capas y de neuronas antes de empezar a entrenar","Calcula el gradiente del error, que necesita el descenso de gradiente","Reemplaza al descenso de gradiente por un método de búsqueda más rápido"],"a":2,"e":"El descenso de gradiente estocástico busca el mínimo; para calcular el gradiente que necesita se usa backpropagation. (Ep. VII, parte 3)"},{"h":"1855904a","q":"En el esquema de backpropagation de la cátedra, en cada repetición…","o":["Se evalúan todos los ejemplos y se sortean nuevos pesos al azar","Se evalúa un ejemplo hacia atrás y se calculan los errores hacia adelante","Se evalúa un ejemplo hacia adelante y después se calculan los errores hacia atrás","Se agrega una neurona por cada ejemplo que la red clasificó mal"],"a":2,"e":"Se asignan pesos iniciales al azar y se repite hasta un umbral: un ejemplo hacia adelante (forward) y los errores hacia atrás (backward). El azar es solo para los valores iniciales. (Ep. VII, parte 3, «Backpropagation»)"},{"h":"d03a54e4","q":"Una vez satisfechos con el entrenamiento (por ejemplo, 97% de aciertos), ¿qué hace falta para usar la red?","o":["La red junto con el algoritmo de backpropagation","La red junto con el conjunto de entrenamiento","La red junto con los datos reservados para prueba","Solo la red con los pesos de los arcos"],"a":3,"e":"El conocimiento aprendido quedó en los pesos; los datos y el algoritmo ya no hacen falta para predecir. (Ep. VII, parte 3, «¿Cómo uso mi RNA?»)"},{"h":"4e1d6a98","q":"¿Cómo es una red neuronal feed-forward?","o":["Cada neurona se conecta con todas las demás de la red, incluida ella misma","Conexiones en un solo sentido, sin ciclos, de la entrada a la salida","Las señales van hacia adelante y los pesos se fijan sin entrenar","La salida se realimenta a la entrada para darle memoria a la red"],"a":1,"e":"Es un grafo dirigido acíclico: la señal va siempre hacia adelante y la salida depende solo de la entrada actual. Realimentar la salida describe una red recurrente. (TP6, ej. 4.d)"},{"h":"c3e7c6b8","q":"¿Qué hace cada neurona artificial (NA) de una RNA?","o":["Elige por cuál de sus arcos salientes enviar el valor, según cuál tiene el mayor peso almacenado","Combina con sus pesos lo que recibe por sus arcos entrantes y lo envía por los salientes","Recibe valores solo de la capa de entrada y envía su resultado directamente al exterior de la red","Guarda uno de los ejemplos de entrenamiento y lo compara con cada entrada nueva que recibe la red"],"a":1,"e":"Cada NA recibe valores de sus arcos entrantes, computa un valor con el peso (w) de cada arco y envía ese valor a otras neuronas por todos sus arcos salientes. (Ep. VII, parte 3, «Redes Neuronales Artificiales»)"},{"h":"ede1bff3","q":"Según la cátedra, una neurona artificial es…","o":["Una capa completa de la red, que recibe el estímulo exterior y lo pasa a la capa siguiente","Un ejemplo del entrenamiento que la red almacena para compararlo con las entradas nuevas","Una función matemática: una unidad elemental que da una salida a partir de sus entradas","Un arco del grafo de la red, que guarda el peso aprendido durante todo el entrenamiento"],"a":2,"e":"Las NA son unidades elementales de una RNA: cada una recibe una o más entradas y realiza un cómputo para producir una salida. Una NA es una función matemática. (Ep. VII, parte 3, «Neuronas Artificiales»)"},{"h":"0a8bd7dc","q":"En una RNA, ¿qué hace la capa de entrada?","o":["Guarda los pesos aprendidos por la red","Calcula el error de cada predicción","Recibe el estímulo del exterior de la red","Envía la respuesta al exterior de la red"],"a":2,"e":"Capa de entrada (input layer): recibe el estímulo del exterior. Capa de salida (output layer): envía la respuesta al exterior. En el medio, las capas ocultas. (Ep. VII, parte 3, «Redes Neuronales Artificiales»)"},{"h":"47b8bddd","q":"En una RNA, ¿qué hace la capa de salida?","o":["Ajusta los pesos de las capas anteriores","Codifica los píxeles de la imagen","Recibe el estímulo del exterior de la red","Envía una respuesta al exterior de la red"],"a":3,"e":"La capa de salida envía una respuesta al exterior de la red; la de entrada recibe el estímulo (en el ejemplo de dígitos, codifica los píxeles). (Ep. VII, parte 3, «Redes Neuronales Artificiales»)"},{"h":"a7c8c457","q":"Si un perceptrón se expresa con el producto escalar w·x + b en lugar de un umbral, ¿qué relación hay entre b y el umbral?","o":["b = 1 / umbral","b = umbral","b = −umbral","b = umbral − 1"],"a":2,"e":"Otra forma de expresar un perceptrón: −b = threshold. Así, «w·x > umbral» equivale a «w·x + b > 0». (Ep. VII, parte 3, «Neuronas Artificiales»)"},{"h":"720b4c77","q":"¿Qué devuelve un perceptrón con pesos w y sesgo b ante una entrada x?","o":["−1 o 1, según el signo del sesgo b","El valor de w·x + b, sin transformar","σ(w·x + b), un valor entre 0 y 1","1 si w·x + b > 0, y 0 en otro caso"],"a":3,"e":"El perceptrón devuelve 0 si w·x + b ≤ 0 y 1 si w·x + b > 0. σ(w·x + b) es la salida de una neurona sigmoide. (Ep. VII, parte 3, «Neuronas Artificiales»)"},{"h":"29ceaee1","q":"¿Cuál es la función sigmoide σ(z) que usa una neurona sigmoide?","o":["e^(−z) / (1 + z)","1 / (1 + e^(−z))","máx(0, z)","1 / (1 − e^(−z))"],"a":1,"e":"La neurona sigmoide devuelve σ(w·x + b), con σ(z) = 1 / (1 + e^(−z)): una versión suave del escalón del perceptrón, con salida entre 0 y 1. (Ep. VII, parte 3, «Neuronas Artificiales»; TP6, ej. 4.a)"},{"h":"f9dfd351","q":"¿Con qué datos se entrena una RNA para una tarea como reconocer dígitos escritos a mano?","o":["Con ejemplos sin etiqueta, que la red agrupa según cuánto se parecen","Con recompensas que recibe al acertar varias veces seguidas","Con ejemplos etiquetados con su resultado, como su clasificación","Con reglas que un experto escribe para reconocer cada dígito"],"a":2,"e":"Una vez elegida la RNA para una tarea T, se entrena con un conjunto de ejemplos etiquetados con su resultado (ej. una clasificación): es aprendizaje supervisado. (Ep. VII, parte 3, «Redes Neuronales Artificiales»)"},{"h":"e7cf11fd","q":"En una RNA, ¿qué tipo de modelo matemático obtiene el algoritmo de aprendizaje?","o":["Un grafo","Una lista de reglas","Una tabla","Un árbol"],"a":0,"e":"En una RNA el algoritmo obtiene como resultado un modelo matemático que es un grafo (con los pesos en sus arcos). En los árboles de decisión, el modelo es un árbol. (Ep. VII, parte 3, «Algoritmo de aprendizaje y modelo»)"},{"h":"f601d56f","q":"¿De qué depende el valor de salida de una neurona artificial dentro de una red?","o":["Solo de los valores que recibe la capa de entrada de la red","De los w y b de cada neurona que influye sobre ella","Solo de los w y b de la propia neurona, no de las anteriores","De la cantidad de capas ocultas que tiene la red completa"],"a":1,"e":"El valor de salida de una NA dependerá de los valores de w1, w2 y b asignados a cada NA de la red que influye sobre ella. (Ep. VII, parte 3, «Neuronas Artificiales»)"},{"h":"88398654","q":"Según la cátedra, ¿con qué método se encuentran los valores adecuados de los pesos de una RNA?","o":["Búsqueda A*, con una heurística basada en el error de la salida de la red","Minimax, que trata a los datos de entrenamiento como si fueran un adversario","Backpropagation, un método de búsqueda que encuentra el máximo de una función","Stochastic gradient descent, un método de búsqueda similar a hill climbing"],"a":3,"e":"Con un método de búsqueda similar a hill climbing: stochastic gradient descent, que busca el mínimo del error. Backpropagation no busca: calcula el gradiente que el SGD necesita. (Ep. VII, parte 3, «Redes Neuronales Artificiales»)"},{"h":"f7bac9a1","q":"Según la cátedra, ¿qué hace hill climbing con la función y qué hace el descenso de gradiente?","o":["Hill climbing la minimiza; el descenso de gradiente la maximiza","Hill climbing la maximiza; el descenso de gradiente la minimiza","Los dos la maximizan, pero con distintas estrategias de búsqueda","Los dos la minimizan, pero con distintas estrategias de búsqueda"],"a":1,"e":"Una diferencia superficial: en hill climbing se maximiza una función, mientras que en el descenso de gradiente se minimiza. (Ep. VII, parte 3, «Stochastic gradient descent vs. Hill climbing»)"},{"h":"b5e956a1","q":"¿Qué tipo de problemas puede optimizar hill climbing y qué supone el descenso de gradiente?","o":["Los dos optimizan solo problemas discretos, sin necesidad de calcular un gradiente","Hill climbing, solo funciones continuas; el descenso de gradiente, problemas discretos","Hill climbing, problemas discretos; el gradiente supone una función continua","Los dos suponen una función continua y la posibilidad de calcular su gradiente"],"a":2,"e":"Hill climbing puede optimizar problemas discretos. Gradient descent supone que optimiza una función continua y que puede calcular su gradiente en un estado. (Ep. VII, parte 3, «Stochastic gradient descent vs. Hill climbing»)"},{"h":"f7627a65","q":"En hill climbing, ¿cómo se elige el próximo estado?","o":["Se elige un vecino al azar y se acepta aunque sea peor","Se mira la pendiente local y se va hacia la más pronunciada","Se expande el vecino con menor costo más su heurística","Se evalúa la función en todos los vecinos y se va al mejor"],"a":3,"e":"Hill climbing observa todos los estados vecinos, evalúa la función en cada uno y se mueve al mejor. Seguir la pendiente más pronunciada es el descenso de gradiente. (Ep. VII, parte 3, «Stochastic gradient descent vs. Hill climbing»)"},{"h":"9f929c6c","q":"Según la cátedra, ¿por qué fue tan importante el algoritmo backpropagation?","o":["Garantiza encontrar el mínimo global del error en cualquier red neuronal artificial","Elimina la necesidad de contar con ejemplos etiquetados para entrenar una red neuronal","Fue el primer algoritmo capaz de construir árboles de decisión a partir de datos reales","Es mucho más rápido que los anteriores y permitió resolver problemas antes insolubles"],"a":3,"e":"Backpropagation funciona mucho más rápido que enfoques anteriores de aprendizaje, lo que hace posible usar RNA para resolver problemas que antes eran insolubles. (Ep. VII, parte 3, «Backpropagation»)"},{"h":"8b2c1160","q":"En el descenso de gradiente estocástico, ¿qué significa «estocástico»?","o":["Que considera un ejemplo por vez y da un paso después de cada uno","Que repite el entrenamiento completo varias veces con los datos","Que acepta pasos que empeoran el error, con cierta probabilidad","Que elige al azar la dirección hacia la que se mueve en cada paso"],"a":0,"e":"Es estocástico porque considera un solo ejemplo de entrenamiento por vez y da un paso después de cada uno. La dirección no es al azar: es la de mayor descenso. (TP6, ej. 4.b)"},{"h":"38ea98da","q":"¿Por qué backpropagation calcula los errores hacia atrás, de la salida a la entrada?","o":["Porque las conexiones de una red feed-forward van de la salida hacia la entrada","Porque los pesos de la capa de entrada son los únicos que se pueden ajustar","Porque así se evita tener que evaluar los ejemplos hacia adelante por la red","Porque el error solo se conoce en la salida, no en las neuronas ocultas"],"a":3,"e":"En la capa de salida el error se conoce (salida esperada menos obtenida), pero los datos no dicen qué valor deberían tener las neuronas ocultas; por eso el error se propaga desde la salida hacia atrás. (TP6, ej. 4.b)"},{"h":"e5ea7116","q":"En una RNA, ¿qué determina el peso de una conexión?","o":["La capa a la que pertenece la neurona de destino","La intensidad y el signo de la influencia entre las dos neuronas","Si la conexión existe o no en la topología de la red","La cantidad de ejemplos de entrenamiento que pasaron por esa conexión"],"a":1,"e":"El peso determina la intensidad y el signo de la conexión. El entrenamiento cambia los pesos, no qué conexiones existen. (TP6, ej. 4.c)"},{"h":"3d0f940a","q":"En una red feed-forward organizada en capas, ¿de dónde recibe entradas cada unidad?","o":["De la capa siguiente, por realimentación","Solo de la capa inmediatamente anterior","Solo de la capa de entrada de la red","De todas las capas, anteriores y posteriores"],"a":1,"e":"En una red feed-forward en capas, cada unidad recibe entradas solo de la capa inmediatamente anterior; recibir de la siguiente sería realimentación (red recurrente). (TP6, ej. 4.d)"},{"h":"c5a0cd6a","q":"En una red feed-forward, ¿de qué depende la salida?","o":["De la entrada actual y también de las salidas que produjo antes","Del orden en que se le presentan las sucesivas entradas","Solo de la entrada actual: no tiene memoria aparte de los pesos","De todas las entradas que recibió desde que se entrenó"],"a":2,"e":"Como no hay ciclos, la salida es función solo de la entrada actual: la red no tiene estado interno aparte de los pesos. (TP6, ej. 4.d)"}]},{"id":"u3","nombre":"SBC: arquitectura, Prolog y explicaciones","tp":"TP7","qs":[{"h":"df4cc1a7","q":"Según la cátedra, las conclusiones, recomendaciones o decisiones de un agente con razonamiento automático dependen de…","o":["Solo de las reglas, porque los datos se fijan al construir el agente","Solo de los datos percibidos, sin necesidad de reglas para razonar","Los ejemplos etiquetados con los que se lo entrenó previamente","La información que tiene en ese momento y las reglas de que dispone"],"a":3,"e":"Las conclusiones dependen tanto de la información percibida en el momento como de las reglas para razonar. (Ep. VIII, «Aplicaciones con razonamiento automático»)"},{"h":"9f77e41e","q":"¿Cuáles son los módulos de la arquitectura básica de un SBC?","o":["Base de conocimiento, algoritmo de aprendizaje y modelo","Base de conocimiento, máquina de inferencia e interface","Sensores, efectores y controlador","Hechos, reglas y consultas del usuario"],"a":1,"e":"KB, máquina de inferencia e interface, que se comunica con el entorno. Hechos y reglas son el contenido de la KB, no módulos. (Ep. VIII, «Sistema Basado en Conocimiento (SBC)»)"},{"h":"5b89406c","q":"Según la cátedra, la arquitectura de un sistema es…","o":["El hardware sobre el que se ejecutan los módulos del sistema","El lenguaje en el que se programa la máquina de inferencia","Un modelo conceptual de los elementos del sistema y de cómo se relacionan","El conjunto de reglas y hechos que forman la base de conocimiento del sistema"],"a":2,"e":"Es un modelo conceptual que define la estructura del sistema, indicando (generalmente en forma gráfica) sus elementos y cómo se relacionan. (Ep. VIII, «Sistema Basado en Conocimiento (SBC)»)"},{"h":"3ca37e75","q":"En un SBC, ¿qué hace la interface?","o":["Saca conclusiones aplicando las reglas de la KB a los hechos percibidos","Se comunica con el entorno: procesa percepciones y muestra resultados","Guarda las reglas y los hechos del dominio de aplicación","Traduce las reglas de la KB al código de la máquina de inferencia"],"a":1,"e":"La interface muestra sugerencias, procesa percepciones, busca en la web, interpreta comandos de voz, etc. Depende mucho del dominio y de los sensores y acciones del agente. (Ep. VIII)"},{"h":"0b595d93","q":"¿Qué ventaja da que la base de conocimiento sea un módulo independiente del mecanismo de inferencia?","o":["La KB puede escribirse sin tener en cuenta qué mecanismo de inferencia se use","La interface puede sacar conclusiones sin consultar la KB","Se pueden agregar o quitar reglas sin cambiar el código de la inferencia","La máquina de inferencia puede ejecutarse en otra computadora"],"a":2,"e":"La modularidad permite agregar o quitar reglas y hechos dinámicamente y reusar el mecanismo en otros dominios. Pero la representación tiene que estar en sintonía con el mecanismo de inferencia. (Ep. VIII, «SBC que usa la máquina de inferencia de Prolog»)"},{"h":"039dfbba","q":"Si se usa el intérprete de Prolog como máquina de inferencia, la base de conocimiento…","o":["Tiene que descargarse de Internet cada vez que se hace una consulta","Tiene que ser un programa Prolog, para estar en sintonía con el intérprete","Puede escribirse en lenguaje natural, porque el top-level la traduce","Conviene escribirla en otro lenguaje, para mantener la modularidad"],"a":1,"e":"La representación del conocimiento debe estar en completa sintonía con el mecanismo de inferencia: con Prolog, la KB es un programa Prolog. (Ep. VIII, «¿Cómo se implementa un SBC?»)"},{"h":"390323d3","q":"Al usar Prolog para armar un SBC, ¿qué hace de interface rudimentaria?","o":["El operador \\+","El predicado clause/2","El programa de reglas y hechos","El top-level del intérprete"],"a":3,"e":"En el top-level se escriben consultas y se obtienen respuestas. El programa con reglas y hechos es la KB. (Ep. VIII, «SBC que usa la máquina de inferencia de Prolog»)"},{"h":"6eaa0d52","q":"¿Puede considerarse al intérprete de Prolog como un SBC?","o":["Sí: ya trae la máquina de inferencia, la interface y la base de conocimiento","Sí, pero solo si se le agrega un operador de negación fuerte","No por sí solo: le falta la base de conocimiento, que es un programa Prolog","No: Prolog no sirve como máquina de inferencia de un SBC"],"a":2,"e":"El intérprete aporta la máquina de inferencia y una interface rudimentaria (el top-level); la KB hay que escribirla para cada dominio. (TP7, ej. 3)"},{"h":"91a80fa8","q":"¿Qué tipo de agente utiliza un SBC?","o":["Social, sin creencias","Reactivo","Reactivo con reglas condición–acción","Deliberativo"],"a":3,"e":"Un agente deliberativo, que saca conclusiones o toma decisiones con la información percibida y lo que infiere razonando. Un agente reactivo no mantiene creencias ni razona. (TP7, ej. 2)"},{"h":"3a4b31ca","q":"En el ciclo de un agente deliberativo, ¿qué paso es el corazón del SBC?","o":["Actuar, ejecutando en el entorno la acción elegida","Razonar sobre el conocimiento, con la máquina de inferencia","Percibir el entorno, con los sensores de la interface","Revisar las creencias, borrando lo que las contradice"],"a":1,"e":"El SBC interviene en todo el ciclo, pero el razonamiento lo hace la máquina de inferencia con las reglas y hechos de la KB. Percibir y actuar pasan por la interface. (TP7, ej. 2)"},{"h":"a54b2132","q":"En el agente Okaeri, chance(lluvia,80) y mínima(8) son…","o":["Reglas que la máquina de inferencia usa para concluir","Consultas que el usuario le hace al sistema","Conclusiones que la interface le muestra al usuario","Hechos percibidos del entorno que pasan a la KB"],"a":3,"e":"Son datos percibidos (por ejemplo, de una página del clima). La máquina de inferencia los combina con reglas como «chance(lluvia, X) y X > 50 → recomendar(paraguas)». (Ep. VIII)","x":"<div class=\"ctx-tit\">El agente Okaeri (Ep. VIII)<\/div><p>Agente de compañía con un SBC: le sugiere a su usuario qué llevar según el clima («No te olvides de llevar un paraguas», «A la noche refrescará. Llevá abrigo»).<\/p>"},{"h":"5f1d084e","q":"Con la KB de Okaeri, ¿qué responde ?- recomendar(X)?","o":["X = paraguas, y nada más","X = paraguas ; X = abrigo","X = paraguas ; X = abrigo ; X = sombrero","no, porque falta saber si es verano"],"a":1,"e":"80 > 50 da paraguas y 8 < 10 da abrigo. verano no se deriva, así que sombrero no sale; eso no impide las otras dos respuestas. (Ep. VIII)","x":"<div class=\"ctx-tit\">KB de Okaeri en Prolog (Ep. VIII)<\/div><pre>recomendar(paraguas) :- chance(lluvia,X), X &gt; 50.\nrecomendar(abrigo) :- minima(T), T &lt; 10.\nrecomendar(sombrero) :- verano.\nchance(lluvia,80).\nminima(8).\n% con los hechos de hemisferio y mes que tiene la KB, verano no se cumple<\/pre>"},{"h":"8a588a49","q":"En el agente Mer-val, ¿de dónde salen las reglas y de dónde los hechos?","o":["Las dos, de un algoritmo que aprende a partir de precios históricos","Reglas, de sitios especializados de Internet; hechos, de expertos del mercado","Reglas, del usuario que consulta; hechos, de las empresas que cotizan","Reglas, de expertos del mercado; hechos, de sitios especializados de Internet"],"a":3,"e":"Las reglas contienen conocimiento recolectado de expertos; los hechos (buen_precio_web, listado_fusiones_web, rumores_deuda_web) se obtienen automáticamente de sitios especializados. (Ep. VIII, «Agente de recomendación Mer-val»)","x":"<div class=\"ctx-tit\">El agente Mer-val (Ep. VIII)<\/div><p>Agente de recomendación para el mercado bursátil: responde consultas sobre la compra de acciones de una empresa, con un SBC que usa Prolog como máquina de inferencia y el top-level como interface.<\/p>"},{"h":"1359bbf8","q":"¿Cuál NO es una de las cuestiones que, según la cátedra, hay que abordar en un SBC?","o":["Aprendizaje de reglas nuevas a partir de datos","Manejo de información incompleta","Explicabilidad de las conclusiones","Manejo de información contradictoria"],"a":0,"e":"Las cuestiones son: derivación de nuevo conocimiento, explicabilidad, información incompleta, dinámica de la información e información contradictoria. (Ep. VIII, «Cuestiones que hay que abordar en SBC»)"},{"h":"7d316a7c","q":"En un SBC, la explicabilidad significa que…","o":["Las razones que llevan a una conclusión deberían poder auditarse","El sistema debería responder siempre en lenguaje natural","El usuario debería poder modificar las reglas de la base","Toda conclusión debería tener un valor de certeza asociado"],"a":0,"e":"Es una de las cuestiones de un SBC: las razones de una conclusión o decisión deberían poder auditarse. (Ep. VIII, «Cuestiones que hay que abordar en SBC»)"},{"h":"b09bf738","q":"Según la cátedra, el conjunto de reglas que permite inferir una conclusión…","o":["Solo sirve para que el programador depure la KB","Garantiza que esa conclusión ya no pueda ser contradicha por otra","Explica cómo se llegó a ella y es además una razón a su favor","Conviene ocultarlo al usuario para no confundirlo"],"a":2,"e":"La derivación da una explicación de cómo se llegó a la conclusión y una razón a favor de ella. Una razón puede tener otra en contra: no garantiza nada. (Ep. VIII, «Consultando por una recomendación»)"},{"h":"265c8eb5","q":"¿Qué predicado predefinido de Prolog usa deriv/2 para encontrar una regla cuya cabeza coincide con la consulta?","o":["member/2","call/1","clause/2","append/3"],"a":2,"e":"deriv(Cabeza, [(Cabeza :- Cuerpo) | L1]) :- clause(Cabeza, Cuerpo), deriv(Cuerpo, L1). append/3 se usa para juntar las derivaciones de una conjunción. (Ep. VIII, «Extendiendo la interface»)"},{"h":"fa6f95c0","q":"Cuando deriv/2 recibe una conjunción (X,Y)…","o":["Busca con clause/2 una regla cuya cabeza sea (X,Y)","Deriva solo X, porque Y se deduce a partir de X","Devuelve la lista vacía, porque se prueba trivialmente","Deriva X, después Y, y concatena las dos derivaciones"],"a":3,"e":"Los tres casos: true → lista vacía; (X,Y) → deriva X, deriva Y y hace append; consulta simple → clause/2 y deriva el cuerpo. (Ep. VIII, «Extendiendo la interface»)"},{"h":"c4a0c016","q":"¿Qué permite, con poco esfuerzo, un «top-level extendido» como el del agente Oki?","o":["Escribir reglas con negación en la cabeza, cosa que Prolog no permite","Resolver qué conclusión prevalece cuando dos conclusiones se contradicen","Interacción más natural, explicar respuestas y sugerir sin consultas","Aprender reglas nuevas a partir de las consultas que hacen los usuarios"],"a":2,"e":"Extender la interface permite una interacción más elaborada, explicar cómo se llegó a cada respuesta y ser proactivo. Resolver contradicciones requiere extender el mecanismo de inferencia. (Ep. VIII)"},{"h":"97c7df87","q":"¿Cuál de estas aplicaciones actuales es un sistema basado en conocimiento?","o":["Alertas de interacciones entre medicamentos en las historias clínicas electrónicas","Recomendación de películas según lo que miraron usuarios con gustos parecidos","Agrupamiento de clientes según sus hábitos de compra, sin datos etiquetados","Reconocimiento de rostros con una red neuronal entrenada con miles de fotos"],"a":0,"e":"Las alertas clínicas tienen una KB con reglas sobre combinaciones peligrosas de medicamentos, hechos con los datos del paciente, una máquina de inferencia que los cruza y una interface que avisa al médico. Las otras opciones son aprendizaje automático. (TP7, ej. 4)"},{"h":"f1f88993","q":"En un SBC de alertas de medicamentos, ¿qué son los medicamentos que ya toma el paciente y sus alergias?","o":["Las reglas de la base de conocimiento","La interface con el médico que receta","La máquina de inferencia del sistema","Los hechos de la base de conocimiento"],"a":3,"e":"La KB tiene reglas sobre combinaciones peligrosas; los hechos son los datos del paciente (lo que toma, sus alergias, lo que se le receta). La máquina de inferencia cruza unos con otros. (TP7, ej. 4)"},{"h":"b15cf037","q":"¿Por qué la legislación (por ejemplo, el cálculo de un impuesto) se presta para un SBC como el lenguaje Catala?","o":["Porque las leyes nunca se contradicen, así que alcanza con una inferencia monotónica","Porque las leyes son reglas generales con excepciones, y los datos de cada caso son hechos","Porque las leyes se pueden aprender automáticamente a partir de fallos judiciales anteriores","Porque cada ley tiene asociado un valor de certeza que fija el propio legislador"],"a":1,"e":"Catala imita la estructura de la ley: reglas generales con excepciones. La KB es el texto legal formalizado, los hechos son los datos del contribuyente y la inferencia calcula cuánto corresponde pagar o cobrar. (TP7, ej. 4)"},{"h":"d7c08642","q":"En Prolog, ¿cuándo tiene éxito la consulta \\+ p?","o":["Cuando la derivación de p tiene éxito","Cuando la derivación de p falla","Cuando p es falso en el mundo","Cuando hay una derivación de ~p"],"a":1,"e":"Negación por falla: \\+p tiene éxito cuando la derivación de p falla, y falla cuando la de p tiene éxito. No dice nada sobre el mundo, solo sobre lo derivable. (Ep. VIII, «Negación por falla en Prolog»)"},{"h":"3ede3ea9","q":"¿Dónde puede usarse el operador \\+ en Prolog?","o":["En la cabeza de una regla o en un hecho","En cualquier parte del programa o de la consulta","Solo en el cuerpo de una regla o en una consulta","En los hechos y en el cuerpo de las reglas"],"a":2,"e":"Por sus características, no se permite usar \\+ en la cabeza de una regla ni en un hecho. (Ep. VIII, «Negación por falla en Prolog»)"},{"h":"244ad59f","q":"¿Cuál de estas cláusulas NO está permitida en Prolog?","o":["peligroso(X) :- animal(X), \\+ inofensivo(X).","\\+ abierta(universidad).","abierta(X) :- \\+ cerrada(X).","inocente(P) :- \\+ culpable(P)."],"a":1,"e":"Es un hecho con \\+: no está permitido. Las otras usan \\+ en el cuerpo de una regla, que sí se permite. (Ep. VIII, «Negación por falla en Prolog»)"},{"h":"d5d0c5e6","q":"¿Para qué tipo de información resulta especialmente útil la negación por falla?","o":["Información incompleta","Información de varios informantes","Información contradictoria","Información con certeza numérica"],"a":0,"e":"Si algo no se puede derivar, se asume falso: es útil para trabajar con información incompleta. Para información contradictoria hace falta negación fuerte. (Ep. VIII, «Negación por falla en Prolog»)"},{"h":"2d3ad54c","q":"Con el programa culpable(acusado2). inocente(P) :- \\+ culpable(P)., ¿qué responde ?- inocente(acusado1).?","o":["false, porque no hay un hecho inocente(acusado1)","Error, porque \\+ no puede ir en el cuerpo de una regla","false, porque acusado1 no figura en el programa","true, porque no se puede derivar culpable(acusado1)"],"a":3,"e":"culpable(acusado1) falla, así que \\+ culpable(acusado1) tiene éxito. En cambio, inocente(acusado2) da false. (Ep. VIII, «Negación por falla en Prolog»)"},{"h":"a667deca","q":"Con el programa inofensivo(koala). animal(koala). animal(wallaby). peligroso(X) :- animal(X), \\+ inofensivo(X)., ¿qué responde ?- peligroso(wallaby).?","o":["false: no se puede probar que wallaby sea peligroso","false: no hay un hecho peligroso(wallaby) en el programa","true: es un animal y no se deriva inofensivo(wallaby)","Error: \\+ solo puede usarse en una consulta"],"a":2,"e":"animal(wallaby) tiene éxito y inofensivo(wallaby) falla, así que \\+ inofensivo(wallaby) tiene éxito. (Ep. VIII, «Negación por falla en Prolog»)"},{"h":"2d0dfdd1","q":"Con el programa inofensivo(koala). animal(koala). animal(wallaby). peligroso(X) :- animal(X), \\+ inofensivo(X)., ¿qué responde ?- peligroso(emu).?","o":["true: emu no figura como inofensivo","false: animal(emu) no se puede derivar","true: no se deriva inofensivo(emu)","Error: emu no aparece en el programa"],"a":1,"e":"El primer literal del cuerpo, animal(emu), falla, así que la regla no se aplica. En cambio, ?- \\+ inofensivo(emu). sí daría true. (Ep. VIII, «Negación por falla en Prolog»)"},{"h":"cfb5da31","q":"¿Qué le falta a Prolog estándar para un SBC con información contradictoria?","o":["Reglas con más de un literal en el cuerpo","Negación por falla y reglas con variables en la cabeza o en el cuerpo","Negación fuerte y un mecanismo para manejar la contradicción","Un top-level en el que se puedan hacer consultas"],"a":2,"e":"Prolog estándar no tiene negación fuerte ni un mecanismo para manejar adecuadamente la información contradictoria. (Ep. VIII, «Extender el mecanismo de inferencia»)"},{"h":"f5a1d82c","q":"En el Mer-val original (sin ~), ¿qué responde Prolog a ?- comprar_acciones(acme). y a ?- no_comprar_acciones(acme).?","o":["true a las dos: hay una derivación para cada una","Un error, porque las dos conclusiones se contradicen","true a la primera y false a la segunda, por el orden de las reglas","false a las dos, porque Prolog detecta la contradicción"],"a":0,"e":"acme tiene buen precio según la web y también está en fusión: Prolog encuentra las dos derivaciones. Para Prolog son predicados distintos, no sabe que se contradicen. (Ep. VIII, «Consulta: ¿comprar acciones de acme?»)","x":"<div class=\"ctx-tit\">Mer-val original, sin negación fuerte (Ep. VIII)<\/div><pre>comprar_acciones(X) :- buen_precio(X).\nbuen_precio(X) :- buen_precio_web(X).\nno_comprar_acciones(X) :- riesg
