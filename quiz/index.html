ra que el mecanismo de inferencia no concluya algo y su contrario, ¿qué dos caminos plantea la cátedra?","o":["No concluir ninguna de las dos, o decidir cuál prevalece","Preguntarle al usuario, o mostrarle las dos conclusiones","Elegir la derivación más corta, o la que se encontró primero","Borrar la regla más nueva, o borrar la más vieja"],"a":0,"e":"La inferencia puede ser cauta (ninguna de las dos) o decidir cuál prevalece comparando la calidad de la información. (Ep. VIII, «¿Cuál conclusión debería prevalecer?»)"},{"q":"Con el operador ~ y el predicado complemento/2 de la cátedra, ¿cuál es el complemento de ~comprar_acciones(acme)?","o":["no_comprar_acciones(acme)","\\+ comprar_acciones(acme)","~~comprar_acciones(acme)","comprar_acciones(acme)"],"a":3,"e":"complemento(~X, X) y complemento(X, ~X): el complemento de ~c es c, y el de c es ~c. (Ep. VIII, «Extendiendo el mecanismo de inferencia»)"},{"q":"Con la primera inferencia cauta de la cátedra (respuestas si / no), ¿qué responde a comprar_acciones(acme)? (KB de Mer-val con negación fuerte: comprar_acciones(X) :- buen_precio(X). buen_precio(X) :- buen_precio_web(X). buen_precio_web(skynet). buen_precio_web(acme). ~comprar_acciones(X) :- riesgosa(X). riesgosa(X) :- en_fusion(X,Y). riesgosa(X) :- rumores_deuda_web(X). en_fusion(X,Y) :- listado_fusiones_web(X,Y). listado_fusiones_web(acme,strong). rumores_deuda_web(acme). rumores_deuda_web(usrobotics).)","o":["indeciso, porque se derivan la consulta y su complemento","no, porque también se deriva ~comprar_acciones(acme)","si, porque hay una derivación de comprar_acciones(acme)","desconozco, porque la KB es contradictoria para acme"],"a":1,"e":"La primera versión responde si solo cuando deriva Q y no su complemento; en cualquier otro caso responde no. «indeciso» aparece recién en la versión detallada. (Ep. VIII, «Extendiendo el mecanismo de inferencia»)"},{"q":"Con la primera inferencia cauta de la cátedra (respuestas si / no), la respuesta «no» puede significar…","o":["Que se deriva el complemento, ambos o ninguno de los dos","Solo que la consulta no tiene ninguna derivación en la KB","Solo que se deriva el complemento de la consulta y no la consulta","Que la consulta tiene una derivación con poca certeza"],"a":0,"e":"respuesta(Q, no) es el caso por defecto: cubre todo lo que no es «deriva Q y no su complemento». Por eso la versión detallada separa no, indeciso y desconozco. (Ep. VIII)"},{"q":"Con la inferencia cauta detallada (si / no / indeciso / desconozco), ¿qué responde a comprar_acciones(acme)? (KB de Mer-val con negación fuerte: comprar_acciones(X) :- buen_precio(X). buen_precio(X) :- buen_precio_web(X). buen_precio_web(skynet). buen_precio_web(acme). ~comprar_acciones(X) :- riesgosa(X). riesgosa(X) :- en_fusion(X,Y). riesgosa(X) :- rumores_deuda_web(X). en_fusion(X,Y) :- listado_fusiones_web(X,Y). listado_fusiones_web(acme,strong). rumores_deuda_web(acme). rumores_deuda_web(usrobotics).)","o":["indeciso","no","desconozco","si"],"a":0,"e":"Se deriva comprar_acciones(acme) (buen precio en la web) y también ~comprar_acciones(acme) (riesgosa por fusión o rumores de deuda). (Ep. VIII)"},{"q":"Con la inferencia cauta detallada (si / no / indeciso / desconozco), ¿qué responde a comprar_acciones(fakecorp)? (KB de Mer-val con negación fuerte: comprar_acciones(X) :- buen_precio(X). buen_precio(X) :- buen_precio_web(X). buen_precio_web(skynet). buen_precio_web(acme). ~comprar_acciones(X) :- riesgosa(X). riesgosa(X) :- en_fusion(X,Y). riesgosa(X) :- rumores_deuda_web(X). en_fusion(X,Y) :- listado_fusiones_web(X,Y). listado_fusiones_web(acme,strong). rumores_deuda_web(acme). rumores_deuda_web(usrobotics).)","o":["desconozco","si","no","indeciso"],"a":0,"e":"No hay derivación ni para comprar_acciones(fakecorp) ni para ~comprar_acciones(fakecorp). (Ep. VIII)"},{"q":"Con la inferencia cauta detallada (si / no / indeciso / desconozco), ¿qué responde a ~comprar_acciones(usrobotics)? (KB de Mer-val con negación fuerte: comprar_acciones(X) :- buen_precio(X). buen_precio(X) :- buen_precio_web(X). buen_precio_web(skynet). buen_precio_web(acme). ~comprar_acciones(X) :- riesgosa(X). riesgosa(X) :- en_fusion(X,Y). riesgosa(X) :- rumores_deuda_web(X). en_fusion(X,Y) :- listado_fusiones_web(X,Y). listado_fusiones_web(acme,strong). rumores_deuda_web(acme). rumores_deuda_web(usrobotics).)","o":["si","indeciso","desconozco","no"],"a":0,"e":"~comprar_acciones(usrobotics) se deriva por riesgosa (rumores de deuda), y su complemento comprar_acciones(usrobotics) no se deriva (no hay buen_precio_web(usrobotics)). (Ep. VIII)"},{"q":"Con la inferencia cauta detallada (si / no / indeciso / desconozco), ¿qué responde a ~comprar_acciones(skynet)? (KB de Mer-val con negación fuerte: comprar_acciones(X) :- buen_precio(X). buen_precio(X) :- buen_precio_web(X). buen_precio_web(skynet). buen_precio_web(acme). ~comprar_acciones(X) :- riesgosa(X). riesgosa(X) :- en_fusion(X,Y). riesgosa(X) :- rumores_deuda_web(X). en_fusion(X,Y) :- listado_fusiones_web(X,Y). listado_fusiones_web(acme,strong). rumores_deuda_web(acme). rumores_deuda_web(usrobotics).)","o":["desconozco","indeciso","no","si"],"a":2,"e":"~comprar_acciones(skynet) no se deriva (skynet no es riesgosa), pero su complemento comprar_acciones(skynet) sí: la respuesta es no. (Ep. VIII)"},{"q":"Si hay conclusiones en conflicto y se quiere elegir la mejor, ¿cómo propone la cátedra compararlas?","o":["Eligiendo la conclusión que tiene más derivaciones a su favor","Comparando la calidad de la información que sustenta cada derivación","Eligiendo la conclusión que la máquina de inferencia derivó primero","Eligiendo la conclusión cuya derivación usa menos reglas"],"a":1,"e":"Se compara la calidad de la información de cada derivación; en el episodio siguiente: valores de certeza (cuantitativo), informantes (cualitativo) y argumentación. (Ep. VIII, «Eligiendo la mejor conclusión para recomendar»)"},{"q":"¿Qué ventaja tiene exigir que la base de conocimiento sea consistente?","o":["Permite representar opiniones opuestas de distintos expertos","Alcanza con una inferencia monotónica estándar, como Modus Ponens","Evita tener que revisar la base cuando llega información nueva","Permite responder «indeciso» cuando dos reglas entran en conflicto"],"a":1,"e":"Con una base consistente basta Modus Ponens y se evita la explosión. Representar opiniones opuestas es justamente lo que se pierde. (TP7, ej. 6)"},{"q":"¿Qué desventaja tiene exigir que la base de conocimiento sea consistente?","o":["Ya no puede usarse Prolog como máquina de inferencia del sistema","Cada contradicción obliga a revisarla, y puede perderse información","Las respuestas pasan a ser si, no, indeciso o desconozco","La inferencia se vuelve no monotónica y mucho más costosa de calcular"],"a":1,"e":"Hay que decidir qué eliminar para recuperar la consistencia (con operadores como los de AGM), y lo eliminado ya no puede usarse como razón. (TP7, ej. 6)"},{"q":"En lógica proposicional, ¿qué se puede derivar de un conjunto de sentencias inconsistente?","o":["Solo las dos sentencias contradictorias","Ninguna sentencia del lenguaje","Solo los hechos, no las conclusiones","Cualquier sentencia del lenguaje"],"a":3,"e":"Es la explosión: de un conjunto inconsistente se deriva todo («¿aprobé? sí», «¿desaprobé? sí»). Por eso Modus Ponens exige una base consistente. (TP7, ej. 6)"}]},{"id":"u4","nombre":"Información contradictoria y valores de certeza","tp":"TP7","qs":[{"q":"Para no inferir conclusiones contradictorias, la opción (a) de la cátedra mantiene la base de creencias consistente y usa…","o":["Una inferencia monotónica como Modus Ponens (p. ej., modelo AGM)","Negación por falla para descartar lo que no se puede derivar","Una inferencia no monotónica que decide ante cada contradicción","Factores de certeza para elegir la mejor de las dos conclusiones"],"a":0,"e":"Opción (a): base libre de contradicciones + inferencia monotónica (Modus Ponens), por ejemplo con la teoría del cambio de AGM. La inferencia que decide es la opción (b). (Ep. IX, «Bases de creencias inconsistentes: dos grandes opciones»)"},{"q":"¿En qué consiste la opción (b) para manejar contradicciones, la que se desarrolla en el Episodio IX?","o":["Admitir contradicciones y usar una inferencia no monotónica que decida","Revisar la base con operadores AGM cada vez que llega información","Prohibir las reglas que tienen negación fuerte en la cabeza","Asignar a todas las reglas el mismo valor de certeza"],"a":0,"e":"Opción (b): mantener la base con potenciales contradicciones y disponer de una inferencia (no monotónica) que permita decidir ante una contradicción. (Ep. IX, «Bases de creencias inconsistentes: dos grandes opciones»)"},{"q":"En la propuesta de la cátedra, el factor de certeza (CF) de un elemento de la KB es…","o":["Un número real en el intervalo [0, 1]","Una probabilidad que suma 1 con la de su complemento","Un número real en el intervalo [−1, 1]","Un número entero entre 0 y 100"],"a":2,"e":"Se usa una idea simple y usual: un valor real en [−1, 1]. Cerca de 1, más certeza de que es verdadero; cerca de −1, más certeza de que es falso. (Ep. IX, «Conocimiento con valores de certeza»)"},{"q":"¿Qué representa un CF igual a 0?","o":["La misma certeza de que sea verdadero o de que sea falso","Certeza total de que el elemento es falso","Que el elemento no figura en la base de conocimiento","Que la regla asociada nunca puede usarse en una derivación"],"a":0,"e":"CF = 1: certeza total de verdadero; CF = −1: certeza total de falso; CF = 0: la misma certeza de que sea verdadero o falso. (Ep. IX, «Conocimiento con valores de certeza»)"},{"q":"¿Qué representa un CF igual a −1?","o":["Certeza total de que el elemento es falso","Que el elemento no tiene ninguna certeza asociada","Certeza total de que el elemento es verdadero, negado","Que el elemento es el complemento de otro con CF 1"],"a":0,"e":"El valor −1 representa certeza total de que sea falso. (Ep. IX, «Conocimiento con valores de certeza»)"},{"q":"Con la estrategia MYCIN de la cátedra, ¿cómo se calcula el CF de una conjunción P1, …, PN?","o":["El máximo de los CF de los elementos","El mínimo de los CF de los elementos","El producto de los CF de los elementos","El promedio de los CF de los elementos"],"a":1,"e":"CF(P1, …, PN) = mínimo(CF(P1), …, CF(PN)). Ejemplo: CF(listado_fusiones_web(acme,strong), listado_fuertes_web(strong)) = mín(0.9, 0.8) = 0.8. (Ep. IX, «Computando el valor de certeza de las conclusiones»)"},{"q":"Con la estrategia MYCIN de la cátedra, si la regla Q ← P tiene CF(Q ← P) y CF(P) es positivo, ¿cuánto vale CF(Q)?","o":["mín(CF(P), CF(Q ← P))","máx(CF(P), CF(Q ← P))","CF(P) · CF(Q ← P)","CF(P) + CF(Q ← P) − 1"],"a":2,"e":"CF(Q) = CF(P) · CF(Q ← P) cuando CF(P) es positivo; si es negativo o cero, CF(Q) = 0. El mínimo se usa para las conjunciones del cuerpo, no para la regla. (Ep. IX)"},{"q":"Con la estrategia MYCIN de la cátedra, si CF(P) = −0.5 y la regla Q ← P tiene CF 0.8, ¿cuánto vale CF(Q)?","o":["0.3","−0.4","0","0.8"],"a":2,"e":"Cuando CF(P) es negativo o cero, CF(Q) = 0. −0.4 sale de multiplicar igual; 0.3 de sumar. (Ep. IX, «Computando el valor de certeza de las conclusiones»)"},{"q":"Si una conclusión tiene varias derivaciones, ¿qué CF se le asigna?","o":["La suma de los CF de sus derivaciones, acotada a 1","El promedio de los CF de sus derivaciones","El mínimo de los CF de sus derivaciones","El máximo de los CF de sus derivaciones"],"a":3,"e":"Se puede tomar el máximo: cada derivación es una razón alternativa. En el ejemplo, a tiene derivaciones con 0.38 y 0.63, y CF(a) = 0.63. (Ep. IX, «¿Qué hacer si existe más de una derivación para una conclusión?»)"},{"q":"Con la estrategia MYCIN de la cátedra, con 0.9 fuerte(X) ← listado_fuertes_web(X). y 0.8 listado_fuertes_web(strong)., ¿cuánto vale CF(fuerte(strong))?","o":["0.9","0.72","0.8","0"],"a":1,"e":"CF(fuerte(strong)) = CF(cuerpo) · CF(regla) = 0.8 · 0.9 = 0.72. 0.8 sería tomar el mínimo entre la regla y el hecho. (Ep. IX)"},{"q":"Con la estrategia MYCIN de la cátedra, con 0.7 ~riesgosa(acme) ← en_fusion(acme,strong), fuerte(strong)., CF(en_fusion(acme,strong)) = 0.9 y CF(fuerte(strong)) = 0.72, ¿cuánto vale CF(~riesgosa(acme))?","o":["0.63","0.72","0.4536","0.504"],"a":3,"e":"mín(0.9, 0.72) · 0.7 = 0.72 · 0.7 = 0.504. 0.4536 multiplica todo (0.9 · 0.72 · 0.7); 0.63 usa el máximo del cuerpo; 0.72 olvida el CF de la regla. (Ep. IX)"},{"q":"En el ejemplo de la cátedra, CF(comprar_acciones(acme)) = 0.441 y CF(~comprar_acciones(acme)) = 0.504. ¿Qué hace el SBC?","o":["Elige comprar_acciones(acme), porque se derivó primero","Elige ~comprar_acciones(acme): recomienda no comprar","Responde indeciso, porque se derivan las dos conclusiones","Elige comprar_acciones(acme), porque 0.441 está más lejos de 1"],"a":1,"e":"Se comparan los CF de las dos conclusiones contradictorias y se elige la de mayor CF: 0.504 > 0.441. (Ep. IX, «Resolución del conflicto con información numérica»)"},{"q":"Con la estrategia MYCIN de la cátedra, con 0.7 a ← b. 0.6 b ← p, g. 1 p. 0.9 g., ¿cuánto vale el CF de a en esa derivación?","o":["0.54","0.63","0.42","0.378"],"a":3,"e":"CF(p, g) = mín(1, 0.9) = 0.9; CF(b) = 0.9 · 0.6 = 0.54; CF(a) = 0.54 · 0.7 = 0.378. 0.54 olvida la regla de a; 0.63 es la otra derivación de a (por b ← h). (Ep. IX)"},{"q":"Con la estrategia MYCIN de la cátedra, con 0.7 ~a ← d. 0.8 d ← k. −0.5 k., ¿cuánto vale el CF de ~a en esa derivación?","o":["−0.4","0.28","−0.28","0"],"a":3,"e":"CF(k) = −0.5 es negativo, así que CF(d) = 0, y como CF(d) no es positivo, CF(~a) = 0. −0.28 sale de multiplicar todo sin aplicar esa regla. (Ep. IX)"},{"q":"En el ejemplo de la cátedra, la KB tiene la regla 0.9 a ← c, pero ninguna derivación de a la usa. ¿Por qué?","o":["Porque c no se puede derivar: no hay hechos ni reglas para c","Porque su CF es mayor que el de las otras reglas con cabeza a","Porque una regla solo se usa si tiene CF igual a 1","Porque c es el complemento de una conclusión ya derivada"],"a":0,"e":"Para usar la regla hay que derivar su cuerpo, y c no aparece como hecho ni como cabeza de ninguna regla. Por eso la consulta c tiene respuesta «desconocido». (Ep. IX)"},{"q":"En el ejemplo de la cátedra, CF(a) = 0.63 y CF(~a) = 0.5. ¿Qué responde el SBC a la consulta ~a?","o":["indeciso","desconocido","no","sí"],"a":2,"e":"Hay derivaciones para ~a y para su complemento a, y CF(~a) < CF(a): la respuesta es no. A la consulta a respondería sí. (Ep. IX, «¿Qué respuesta dar?»)"},{"q":"En el ejemplo de la cátedra, m es un hecho con CF 0.8 y no hay reglas con cabeza ~m. ¿Qué responde el SBC a la consulta ~m?","o":["sí","desconocido","no","indeciso"],"a":2,"e":"No hay derivación para ~m, pero sí para su complemento m: la respuesta es no. «Desconocido» sería si tampoco se derivara m. (Ep. IX, «¿Qué respuesta dar?»)"},{"q":"Con valores de certeza, ¿cuándo la respuesta a una consulta Q es «indeciso»?","o":["Cuando hay derivaciones para los dos, cualesquiera sean sus CF","Cuando no hay derivación ni para Q ni para su complemento","Cuando hay derivaciones para Q y su complemento, con el mismo CF","Cuando los CF de Q y de su complemento son negativos"],"a":2,"e":"Indeciso: derivaciones para ambos y CF(Q) = CF(complemento). Si no hay derivación para ninguno, la respuesta es «desconocido». (Ep. IX, «¿Qué respuesta dar?»)"},{"q":"Q tiene una única derivación, con CF 0.2, y su complemento no tiene ninguna. ¿Qué responde el SBC a la consulta Q?","o":["sí: el complemento no tiene derivación","indeciso, porque la certeza de Q es baja","no, porque 0.2 está más cerca de 0 que de 1","desconocido, porque el CF no alcanza 0.5"],"a":0,"e":"Sí: hay una derivación para Q y ninguna para el complemento. Los CF se comparan solo cuando hay derivaciones para los dos. (Ep. IX, «¿Qué respuesta dar?»)"},{"q":"Con la estrategia MYCIN de la cátedra, con la KB 0.9 a ← b, c. 0.6 a ← d. 1 ~a ← b. 0.5 b. 1 c. 0.7 d., ¿qué responde el SBC a la consulta a?","o":["no, porque CF(~a) = 0.5 supera a CF(a) = 0.45","indeciso, porque se derivan tanto a como ~a","sí, porque a tiene dos derivaciones y ~a una sola","sí, porque CF(a) = 0.87 al sumar sus dos derivaciones"],"a":0,"e":"a: máx(0.9 · mín(0.5, 1), 0.6 · 0.7) = máx(0.45, 0.42) = 0.45. ~a: 1 · 0.5 = 0.5. Gana ~a. Es el Ejemplo SBC de la cátedra (sin la regla ~a ← e, que da 0). (Ejemplo SBC)"},{"q":"Con la estrategia MYCIN de la cátedra, con 0.6 ~a ← e. 0.1 e ← c, ~d. 0.5 ~d ← f. 1 c. −0.3 f., ¿cuánto vale el CF de ~a en esa derivación?","o":["−0.009","0.03","0.06","0"],"a":3,"e":"CF(f) = −0.3, así que CF(~d) = 0; mín(1, 0) = 0, así que CF(e) = 0 y CF(~a) = 0. 0.06 tomaría el mínimo como 1 (olvidando ~d). Es el Ejemplo SBC de la cátedra. (Ejemplo SBC)"},{"q":"Con la estrategia MYCIN de la cátedra, con 0.9 cruza_lago(X) ← vuela(X). 0.7 vuela(X) ← ave(X). 1 ave(X) ← gallina(X). −0.3 gallina(petete). 0.5 ave(petete)., ¿cuánto vale CF(cruza_lago(petete))?","o":["−0.189","0","0.315","0.45"],"a":2,"e":"Por h5: ave = 0.5, vuela = 0.35, cruza_lago = 0.315. Por gallina (−0.3): ave = 0 y cruza_lago = 0. El máximo es 0.315. 0.45 olvida la regla de vuela. (TP7, ej. 7)"},{"q":"En el ejercicio 7 del TP7 (estrategia MYCIN), ¿quiénes cruzan el lago?","o":["turuleca y petete, pero no donald","Solo turuleca, que es la única gallina","Los tres: turuleca, petete y donald","Ninguno: el SBC queda indeciso con los tres"],"a":2,"e":"Para los tres CF(cruza_lago) > CF(~cruza_lago): 0.63 > 0.448 (turuleca), 0.315 > 0 (petete) y 0.63 > 0.504 (donald). (TP7, ej. 7)"},{"q":"¿Cuál es la principal ventaja de usar información numérica en un SBC, según la cátedra?","o":["No hace falta decidir qué valor se asocia a cada regla de la base","Los valores surgen de forma objetiva a partir de los datos del dominio","Las computadoras calculan con facilidad y hay mucho sustento matemático","Permiten comparar solo algunos pares de elementos, con un orden parcial"],"a":2,"e":"La facilidad de las computadoras para el cómputo y el sustento matemático ya estudiado. Decidir los valores es, justamente, la desventaja. (Ep. IX, «Uso de valores de certeza en un SBC»)"},{"q":"¿Cuál es la principal desventaja de usar valores de certeza numéricos en un SBC, según la cátedra?","o":["Que solo funcionan cuando la base de conocimiento es consistente","Que no permiten comparar dos conclusiones que se contradicen","Decidir qué valor asociar a cada sentencia y en qué se fundamenta","Que las computadoras no manejan con precisión los números reales"],"a":2,"e":"¿De dónde surge el valor? ¿Quién lo decide? ¿Cómo elegir entre 0.7 y 0.71? (Ep. IX, «Uso de valores de certeza en un SBC»)"},{"q":"¿Qué problema ilustra la cátedra al comparar CF(a) = 0.21114 con CF(~a) = 0.21119?","o":["Que el redondeo de la computadora puede invertir el resultado","Que no está claro si una diferencia tan chica es significativa","Que dos CF casi iguales obligan a responder «desconocido»","Que con valores cercanos a 0 hay que usar el mínimo y no el máximo"],"a":1,"e":"Es una de las preguntas abiertas del enfoque numérico: ¿una diferencia así se considera significativa? (Ep. IX, «Uso de valores de certeza en un SBC»)"},{"q":"Comparados con los informantes, los enfoques con información numérica…","o":["Permiten tanto un orden total como uno parcial","Imponen un orden total entre los elementos de la base","No permiten comparar dos derivaciones distintas","Solo pueden comparar elementos del mismo experto"],"a":1,"e":"Con números, cualquier par de elementos es comparable (orden total). Los enfoques cualitativos, como el de informantes, admiten también un orden parcial. (Ep. IX, informantes, «Resolución del conflicto basado en informantes»)"},{"q":"Según la cátedra, la forma de propagar los CF basada en MYCIN…","o":["Es la única correcta, porque está demostrada matemáticamente","Es obligatoria en cualquier SBC que use negación fuerte","Es la que usa por defecto el intérprete de Prolog estándar","Es una forma simple entre muchas; se puede usar otra según el dominio"],"a":3,"e":"Hay muchas maneras de computar el CF de una conclusión; la de la cátedra es muy simple y sirve para mostrar la idea. Al implementar un sistema se puede elegir otra. (Ep. IX, «Computando el valor de certeza de las conclusiones»)"},{"q":"¿Qué fue MYCIN?","o":["Un robot quirúrgico guiado por factores de certeza","Uno de los primeros SBC, para infecciones de la sangre","El primer intérprete de Prolog con negación fuerte","Un algoritmo para entrenar redes neuronales por capas"],"a":1,"e":"MYCIN fue uno de los primeros SBC, desarrollado para recomendar tratamientos para infecciones en la sangre; de él viene la forma de propagar los CF. (Ep. IX, nota al pie)"}]},{"id":"u5","nombre":"Informantes","tp":"TP7","qs":[{"q":"En el enfoque cualitativo de la cátedra, ¿qué se asocia a cada elemento de la base de conocimiento?","o":["La probabilidad de que el elemento sea verdadero","La cantidad de veces que fue usado","Una etiqueta con su informante o fuente","Un número real entre −1 y 1"],"a":2,"e":"Cada regla o hecho se etiqueta con su informante (e1, e2, w1…), un elemento de un conjunto discreto. El número en [−1, 1] es el CF del enfoque cuantitativo. (Ep. IX, informantes, «Conocimiento etiquetado con su fuente de información»)"},{"q":"Según la cátedra, ¿en qué situación es muy común que un agente reciba información de varios informantes?","o":["En un entorno sin percepciones","En un entorno estático","En un entorno determinista","En un entorno multi-agente"],"a":3,"e":"En un entorno multi-agente el agente recibe información de otros agentes; por ejemplo, Mer-val podría recibirla de los expertos e1, e2 y e3 y de los sitios web w1 y w2. (Ep. IX, informantes, «Múltiples informantes con diferente credibilidad»)"},{"q":"Con la estrategia del «eslabón más débil», ¿qué confianza se le asocia a la conclusión de una derivación?","o":["La del informante menos creíble de los elementos usados","La del informante más creíble de los elementos usados","La del informante que más veces aparece en la derivación","La del informante de la regla cuya cabeza es la conclusión"],"a":0,"e":"Es una estrategia cauta: la conclusión queda tan respaldada como su elemento menos creíble. (Ep. IX, informantes, «Resolución del conflicto con información simbólica»)"},{"q":"¿Por qué se usa el informante más débil (el mínimo) como confianza de una derivación?","o":["Porque así se prefiere la conclusión que tiene más derivaciones","Porque es la única forma de obtener un orden total de conclusiones","Porque el informante menos creíble suele ser el más actualizado","Porque la derivación necesita a todos sus elementos para existir"],"a":3,"e":"La derivación es una conjunción: si falla cualquiera de sus elementos, la derivación no existe. (Ep. IX, informantes, «Resolución del conflicto basado en informantes»)"},{"q":"Si una conclusión tiene varias derivaciones, ¿por qué es razonable usar la de máxima credibilidad?","o":["Porque cada una es una razón alternativa: alcanza con cualquiera","Porque así se compensa haber tomado el mínimo dentro de cada derivación","Porque la más creíble es siempre la derivación que usa menos reglas","Porque las derivaciones menos creíbles se eliminan de la base"],"a":0,"e":"La existencia de la conclusión depende de cualquiera de sus derivaciones (una disyunción), así que se toma la mejor. (Ep. IX, informantes, «Resolución del conflicto basado en informantes»)"},{"q":"Con el orden e3 > e1 > e2 > w2 > w1, la derivación [e1] comprar_acciones(acme) ← buen_precio(acme). [e2] buen_precio(acme) ← buen_precio_web(acme). [w1] buen_precio_web(acme). ¿qué confianza le da a comprar_acciones(acme)?","o":["w1","w2","e1","e2"],"a":0,"e":"mínimo({e1, e2, w1}) = w1, el menos creíble. e1 sería tomar el informante de la regla de la conclusión. (Ep. IX, informantes)"},{"q":"Con el orden e3 > e1 > e2 > w2 > w1, confianza(comprar_acciones(acme)) = w1 y confianza(~comprar_acciones(acme)) = w2. ¿Qué conclusión prefiere la máquina de inferencia?","o":["~comprar_acciones(acme), porque usa a e3, el mejor","comprar_acciones(acme), porque su regla es de e1","~comprar_acciones(acme), porque w2 > w1","Ninguna, porque las dos usan informantes web"],"a":2,"e":"Se comparan las confianzas de las dos conclusiones: w2 es más creíble que w1. Que una derivación use a e3 no importa: cuenta su eslabón más débil. (Ep. IX, informantes)"},{"q":"Con el orden e3 > e1 > e2 > w3 > w2 > w1, ¿qué confianza tiene la derivación de a que usa b ← p, g? (KB de la cátedra: [e1] a ← b. [e3] a ← c. [e2] ~a ← d. [e1] ~a ← e. [e1] ~a ← p, f. [e2] b ← p, g. [e1] b ← h. [e2] d ← k. [e3] f ← m. [w3] p. [w1] e. [w1] g. [w3] h. [w2] k. [w2] m.)","o":["e1","w3","w1","e2"],"a":2,"e":"Usa [e1] a ← b, [e2] b ← p, g, [w3] p y [w1] g: mínimo({e1, e2, w3, w1}) = w1. (Ep. IX, informantes)"},{"q":"Con el orden e3 > e1 > e2 > w3 > w2 > w1, a tiene dos derivaciones, con confianzas w1 y w3. ¿Qué confianza tiene a?","o":["w1","e1","w3","{w1, w3}"],"a":2,"e":"Con varias derivaciones se usa la de máxima credibilidad: w3 > w1. Tomar un conjunto de informantes es lo que se hace con un orden parcial, no acá. (Ep. IX, informantes)"},{"q":"Con el orden e3 > e1 > e2 > w3 > w2 > w1, confianza(a) = w3 y las tres derivaciones de ~a valen w2, w1 y w2. ¿Qué responde el SBC a la consulta ~a?","o":["indeciso","desconocido","sí","no"],"a":3,"e":"confianza(~a) = máx(w2, w1, w2) = w2, y w3 > w2: se prefiere a, así que la respuesta a ~a es no. (Ep. IX, informantes)"},{"q":"El agente descubre que w3 es su fuente menos creíble y cambia el orden a e3 > e1 > e2 > w2 > w1 > w3. ¿Qué conclusión se prefiere ahora? (KB de la cátedra: [e1] a ← b. [e3] a ← c. [e2] ~a ← d. [e1] ~a ← e. [e1] ~a ← p, f. [e2] b ← p, g. [e1] b ← h. [e2] d ← k. [e3] f ← m. [w3] p. [w1] e. [w1] g. [w3] h. [w2] k. [w2] m.)","o":["~a: su mejor derivación vale w2, y las de a valen w3","a: sigue valiendo w3, el máximo de sus derivaciones","Ninguna: primero hay que reetiquetar la base","a: cambiar el orden no cambia las derivaciones"],"a":0,"e":"Las dos derivaciones de a usan w3 (p o h), que ahora es el mínimo: las dos valen w3. Las de ~a valen w2, w1 y w2. Como w2 > w3, se prefiere ~a. (Ep. IX, informantes, «El orden de credibilidad puede cambiar dinámicamente»)"},{"q":"¿Qué característica del enfoque de informantes muestra el ejemplo en que cambia la credibilidad de w3?","o":["Se puede cambiar el orden sin reasignar las etiquetas de la base","Una conclusión ya elegida no cambia aunque cambie el orden","El orden se recalcula solo a partir de las derivaciones","Se pueden agregar reglas sin modificar la máquina de inferencia"],"a":0,"e":"Si el agente descubre un cambio en la credibilidad de sus fuentes, cambia el orden y deja la KB como estaba; con eso puede preferirse otra conclusión. (Ep. IX, informantes, «El orden de credibilidad puede cambiar dinámicamente»)"},{"q":"¿Qué tipo de orden entre informantes admite el enfoque cualitativo?","o":["Ninguno: se cuentan los informantes","Solo parcial, sin comparaciones","Total o parcial","Solo total, como con los CF"],"a":2,"e":"Los enfoques numéricos imponen un orden total; el de informantes puede usar un orden total o uno parcial (con informantes incomparables). (Ep. IX, informantes, «Resolución del conflicto basado en informantes»)"},{"q":"Si el orden de credibilidad es parcial, ¿cómo puede definirse la confianza de un literal derivado?","o":["Como el conjunto de todos los informantes involucrados","Como el informante menos creíble de la derivación","Como el informante de la última regla aplicada","Como la cantidad de informantes distintos que usa"],"a":0,"e":"Con un orden parcial puede no haber un único mínimo; por eso la confianza se define como el conjunto de informantes, y después se comparan conjuntos. (Ep. IX, informantes)"},{"q":"Con el orden parcial Orden2 = {e2 > e3, e2 > e1, e2 > w2, w3 > w1, w1 > w2}, ¿por qué {e1, e2, w1, w3} >> {e2, w2}?","o":["Porque e2 está en los dos conjuntos y es el más creíble de todo el orden","w1, que no está en el segundo, supera a w2, y w2 no supera a nadie del primero","Porque w3 está en el primero y es el más creíble de los informantes web","Porque el primer conjunto tiene más informantes que el segundo, así que pesa más"],"a":1,"e":"Condición 1: hay a1 en S1 y no en S2 (w1) y a2 en S2 y no en S1 (w2) con a1 > a2. Condición 2: ningún elemento exclusivo de S2 supera a uno exclusivo de S1. Los elementos comunes (e2) no cuentan. (Ep. IX, informantes, «Preferencia entre conjuntos de informantes»)"},{"q":"Según la cátedra, ¿cuál es una ventaja de usar informantes en lugar de valores numéricos?","o":["No hace falta establecer ningún orden de credibilidad entre fuentes","Siempre se obtiene un orden total entre todas las conclusiones posibles","Asignar etiquetas es más simple y fácil de justificar que asignar números","La propagación de la confianza está muy estudiada y es simple de calcular"],"a":2,"e":"La asignación de etiquetas de un conjunto discreto es más simple y justificable; además el orden puede ser parcial. La propagación, en cambio, es su punto débil. (Ep. IX, informantes, «Uso de confianza cualitativa en un SBC»)"},{"q":"Según la cátedra, ¿cuál es una de las principales desventajas del enfoque de informantes?","o":["No permite que existan informantes incomparables entre sí","La propagación de la confianza no es simple y sigue siendo un tema abierto","Cuesta mucho justificar qué etiqueta se le asigna a cada elemento de la KB","Obliga a mantener la base de conocimiento libre de contradicciones"],"a":1,"e":"Al no ser numérico, el cómputo para propagar la confianza no es tan simple ni está tan estudiado. Justificar las etiquetas es, al revés, una ventaja. (Ep. IX, informantes, «Uso de confianza cualitativa en un SBC»)"},{"q":"Dado un conjunto de informantes I y un orden total C, ¿cómo define la cátedra min(I)?","o":["El informante que etiqueta menos reglas en la KB","El a de I tal que no hay ningún b en I con a > b en C","El a de I tal que no hay ningún b en I con b > a en C","El informante que aparece primero en la derivación"],"a":1,"e":"min(I) es el elemento de I que no es más creíble que ningún otro de I. La primera incorrecta define el máximo. (Ep. IX, informantes, «Resolución del conflicto con información simbólica»)"},{"q":"En el Ejemplo SBC, con At < Av < Ai < Ar < Ap, las derivaciones de a usan {At, Ap, Ap} y {Av, Ai}, y las de ~a usan {Ar, Ap} y {Av, Ai, Ar, Ap, Ar}. ¿Qué elige el SBC?","o":["a: tiene dos derivaciones y la mejor vale Ai","~a: su mejor derivación vale Ar, y la de a vale Av","Indeciso: a y ~a tienen una derivación de Av","~a: su mejor derivación vale Ap, el más creíble"],"a":1,"e":"Mínimos: a → At y Av (máximo Av); ~a → Ar y Av (máximo Ar). Como Ar > Av, gana ~a. Ap no cuenta porque la derivación vale su eslabón más débil. (Ejemplo SBC)"},{"q":"Con el orden Av < Ar < Ap < At < Ai < Ac y el eslabón más débil, ¿qué decide el agente sobre viajar? (KB del TP7, ej. 8: [At] ~camino_abierto ← nieve. [Av] ~viaje ← ~camino_abierto. [Av] viaje ← camino_abierto. [Ar] camino_abierto. [Ap] camino_abierto. [Ai] camino_abierto ← ~nieve. [Ai] ~nieve. [Ap] ~nieve. [Ai] nieve.)","o":["Viaja: viaje tiene cuatro derivaciones y ~viaje una","No viaja: ~viaje usa nieve, que es de Ai","Viaja: camino_abierto vale Ai y su complemento At","Queda indeciso: viaje y ~viaje valen Av"],"a":3,"e":"Todas las derivaciones de viaje usan r3 y la de ~viaje usa r2, las dos de Av, el menos creíble: todas valen Av. La cantidad de derivaciones no importa. (TP7, ej. 8.a)"},{"q":"¿Con cuál de estos órdenes el agente decide viajar? (KB del TP7, ej. 8: [At] ~camino_abierto ← nieve. [Av] ~viaje ← ~camino_abierto. [Av] viaje ← camino_abierto. [Ar] camino_abierto. [Ap] camino_abierto. [Ai] camino_abierto ← ~nieve. [Ai] ~nieve. [Ap] ~nieve. [Ai] nieve.)","o":["Ar < Av < Ap < At < Ai < Ac","Av < Ar < Ap < Ai < At < Ac","At < Av < Ar < Ap < Ai < Ac","Av < At < Ar < Ap < Ai < Ac"],"a":2,"e":"Con At al final, ~viaje vale At (usa r1) y viaje sigue valiendo Av: Av > At. En los otros órdenes Av es el mínimo de ~viaje y también es el máximo que alcanza viaje, así que quedan empatados. (TP7, ej. 8.b)"},{"q":"Con esa misma KB del TP7 (ej. 8) y el eslabón más débil, ¿con qué orden total el agente decide NO viajar? (KB del TP7, ej. 8: [At] ~camino_abierto ← nieve. [Av] ~viaje ← ~camino_abierto. [Av] viaje ← camino_abierto. [Ar] camino_abierto. [Ap] camino_abierto. [Ai] camino_abierto ← ~nieve. [Ai] ~nieve. [Ap] ~nieve. [Ai] nieve.)","o":["Con cualquier orden en que At sea el informante más creíble de todos","Con ninguno: una derivación de viaje usa solo informantes que usa ~viaje","Con cualquier orden en que Ai sea el informante menos creíble de todos","Con cualquier orden en que Av sea el informante más creíble de todos"],"a":1,"e":"~viaje usa {Av, At, Ai} y la derivación viaje ← camino_abierto ← ~nieve usa {Av, Ai}. El mínimo de un subconjunto nunca es menor que el del conjunto: lo mejor que logra ~viaje es empatar. (TP7, ej. 8)"}]},{"id":"u6","nombre":"Razonamiento basado en argumentos","tp":"TP7","qs":[{"q":"Ante una consulta c, ¿qué caracteriza al camino «orientado por la consulta»?","o":["Evaluar por demanda solo el conocimiento relacionado con c","Calcular todas las conclusiones posibles y después ver si c quedó aceptada","Responder con la primera derivación que se encuentra, sin mirar conflictos","Usar solo los hechos, sin aplicar ninguna de las reglas de la base"],"a":0,"e":"Hay dos caminos: el exhaustivo (calcular todas las conclusiones desde los hechos, analizar conflictos y ver si c quedó aceptada) y el orientado por la consulta, que es el que se siguió en clase. (Ep. X, parte 1, «Conclusiones aceptadas o rechazadas»)"},{"q":"En el ejemplo de acme, d1 concluye comprar_acciones(acme) y d2 concluye ~comprar_acciones(acme). ¿Por qué están en conflicto?","o":["Porque sustentan conclusiones complementarias: c(a) y ~c(a)","Porque las dos usan el hecho buen_precio_web(acme)","Porque d1 tiene menos reglas que d2 y la contradice","Porque d2 ataca el punto intermedio buen_precio(acme)"],"a":0,"e":"d2 sustenta ~c(a), el complemento de la conclusión de d1. Cada derivación es una razón en contra de la otra. Los ataques a puntos intermedios aparecen después, con d3. (Ep. X, parte 1, «Conclusiones en conflicto»)"},{"q":"Para dar una respuesta coherente y consistente a una consulta, ¿qué razones hay que tener en cuenta?","o":["Solo las razones en contra, para no concluir de más","Solo la primera razón a favor que encuentra la inferencia","Todas, tanto las que están a favor como las que están en contra","Solo las razones que no tienen ningún conflicto con otras"],"a":2,"e":"Deben tenerse en cuenta todas las razones o argumentos, a favor y en contra, incluidas las que están en conflicto con puntos internos de una derivación. (Ep. X, parte 1, «Conclusiones en conflicto»)"},{"q":"d2 concluye ~comprar_acciones(acme) pasando por riesgosa(acme), y d3 concluye ~riesgosa(acme). ¿Qué relación hay entre d3 y d2?","o":["d3 refuerza a d2, porque las dos se refieren al riesgo de acme","Ninguna: sus conclusiones finales son distintas y no chocan","d3 ataca a d2 en un punto intermedio y así defiende la compra","d3 ataca directamente a la derivación de comprar_acciones(acme)"],"a":2,"e":"d3 está en conflicto con la conclusión intermedia r(a) de d2, así que la ataca; al atacar a d2, defiende indirectamente a d1 y a c(a). (Ep. X, parte 1, «Conflicto en puntos internos a una derivación»)"},{"q":"La derivación d4 concluye riesgosa(acme) por los rumores de deuda, y ataca a d3 (que concluye ~riesgosa(acme)). ¿Qué efecto tiene d4 sobre la compra de acciones?","o":["Ninguno: no comparte ninguna conclusión con la compra","Defiende a la compra, porque ataca a uno de sus atacantes","Ataca directamente a la compra, porque concluye riesgosa(acme)","Defiende a d2 y, por eso, ataca indirectamente a la compra"],"a":3,"e":"d4 ataca a d3, que atacaba a d2: así defiende a d2 (la de no comprar) y queda indirectamente en contra de d1 (la de comprar). (Ep. X, parte 1)"},{"q":"En el ejemplo de acme, ¿en qué se basa la explicación de la respuesta «no» (no comprar)?","o":["En el análisis exhaustivo de los argumentos relacionados, a favor y en contra","En la única derivación que encontró la máquina de inferencia para la consulta","En el informante más creíble entre los que aportaron hechos sobre acme","En el valor de certeza más alto entre las reglas usadas en las derivaciones"],"a":0,"e":"La explicación detallada es el análisis de todos los argumentos relacionados: buen precio, riesgosa por fusión, no riesgosa por fusión con una fuerte, y riesgosa por rumores de deuda. (Ep. X, parte 1, «Brindando una explicación detallada»)"},{"q":"¿Con qué dos elementos se caracteriza generalmente un sistema argumentativo?","o":["Un conjunto de informantes y un orden de credibilidad","Un conjunto de reglas y un valor de certeza para cada una","Una base consistente y una inferencia como Modus Ponens","Un conjunto de argumentos y una relación de derrota entre ellos"],"a":3,"e":"Argumentos que expresan razones para conclusiones, y una relación que dice cuándo un argumento derrota a otro. Los otros pares son los de los enfoques cuantitativo, cualitativo y monotónico. (Ep. X, parte 1, «Sistema argumentativo»)"},{"q":"¿Para qué hacen los sistemas argumentativos un análisis exhaustivo?","o":["Para eliminar de la base las reglas que generan contradicciones","Para asignar un valor de certeza a cada argumento de la base","Para encontrar la derivación más corta de cada una de las conclusiones","Para determinar qué argumentos quedan aceptados y cuáles rechazados"],"a":3,"e":"El análisis exhaustivo determina cuáles son los argumentos aceptados y rechazados; los aceptados dan una garantía para las conclusiones que sustentan. (Ep. X, parte 1, «Sistema argumentativo»)"},{"q":"Según la cátedra, ¿qué argumentos deberían quedar aceptados?","o":["Los que derrotan al menos a otro argumento del sistema","Los que tienen más argumentos a favor que en contra","Los derrotados solo por argumentos no derrotados","Los no derrotados, y los derrotados solo por argumentos rechazados"],"a":3,"e":"Los no derrotados se aceptan; los derrotados por uno aceptado se rechazan; los derrotados por uno rechazado se aceptan. (Ep. X, parte 1, «Sistema argumentativo»)"},{"q":"B derrota a A, C derrota a B, y nadie derrota a C. ¿Qué argumentos quedan aceptados?","o":["C y A","C y B","Solo A","Solo C"],"a":0,"e":"C no está derrotado: aceptado. B está derrotado por un aceptado: rechazado. A está derrotado solo por B, que está rechazado: aceptado. (Ep. X, parte 1)"},{"q":"B derrota a A, C derrota a B, D derrota a C, y nadie derrota a D. ¿Cómo queda A?","o":["Rechazado: es el último de la cadena","Rechazado: B queda aceptado y lo derrota","Aceptado: D lo defiende de forma indirecta","Aceptado: hay un número par de derrotas"],"a":1,"e":"D aceptado → C rechazado → B aceptado → A rechazado. D defiende a B, no a A. (Ep. X, parte 1)"},{"q":"B y C derrotan a A; D derrota a B, y nadie derrota a C ni a D. ¿Cómo queda A?","o":["Rechazado, porque C queda aceptado","Aceptado, porque D derrota a B","Aceptado, porque uno de sus dos derrotadores cae","Rechazado, porque tiene dos derrotadores"],"a":0,"e":"D aceptado → B rechazado; pero C no está derrotado, así que queda aceptado, y alcanza con un derrotador aceptado para rechazar a A. (Ep. X, parte 1)"},{"q":"¿Qué aportan los argumentos aceptados de un sistema argumentativo?","o":["Una garantía para las conclusiones que sustentan","Un orden de credibilidad entre sus informantes","La lista de reglas que hay que borrar de la base","Un valor de certeza para cada una de sus reglas"],"a":0,"e":"Los argumentos aceptados determinan una garantía para las conclusiones que sustentan. (Ep. X, parte 1, «Sistema argumentativo»)"}]},{"id":"u7","nombre":"DeLP","tp":"TP8","qs":[{"q":"¿Qué provee DeLP?","o":["Un lenguaje para representar información tentativa y potencialmente en conflicto","Un lenguaje para representar información con valores de certeza numéricos","Un intérprete de Prolog que agrega la negación por falla al lenguaje","Un método para mantener la base de conocimiento libre de contradicciones"],"a":0,"e":"DeLP representa información tentativa (reglas generales con excepciones) y potencialmente en conflicto (posturas de distintas fuentes), con una inferencia argumentativa. (Ep. X, parte 2, «Defeasible Logic Programing (DeLP)»)"},{"q":"En DeLP, ¿qué permite expresar la representación de información tentativa?","o":["Reglas con un valor de certeza asociado entre −1 y 1","Hechos que el agente todavía no percibió, pero espera percibir","Reglas generales que valen en la mayoría de los casos, y sus excepciones","Opiniones de distintas fuentes, cada una con su propia credibilidad"],"a":2,"e":"Lo tentativo son las reglas generales con excepciones. Las posturas de distintas fuentes se expresan con la información potencialmente en conflicto. (Ep. X, parte 2)"},{"q":"¿Cuál de estas NO es una característica de DeLP según la cátedra?","o":["Es posible dar una explicación detallada de las respuestas","Las conclusiones se sustentan con valores de certeza numéricos","Las respuestas salen de analizar todos los argumentos relacionados","La preferencia entre argumentos puede adaptarse al dominio"],"a":1,"e":"Las conclusiones están sustentadas con argumentos, no con números. El criterio para comparar argumentos se puede adaptar (podría usar CF o informantes). (Ep. X, parte 2, resumen de DeLP)"},{"q":"¿Cómo está formado un programa lógico rebatible (Π, Δ)?","o":["Π tiene las reglas y Δ los hechos, todos con un informante","Δ tiene las reglas rebatibles; Π, las reglas estrictas y los hechos","Δ tiene las reglas de Prolog y Π el operador de negación fuerte","Π tiene las reglas rebatibles; Δ, las reglas estrictas y los hechos"],"a":1,"e":"Un PLR es un conjunto Δ de reglas rebatibles y un conjunto Π de reglas estrictas y hechos; también se escribe Π ∪ Δ. (Ep. X, parte 2, «Sintaxis del lenguaje»)"},{"q":"¿Cómo se lee la regla rebatible «conclusión -< antecedente»?","o":["Si el antecedente es verdadero, entonces la conclusión es verdadera siempre","El antecedente implica la conclusión con una certeza parcial asociada","Si el antecedente no se puede derivar, entonces se asume la conclusión","Si hay razones para creer el antecedente, hay una razón rebatible para la conclusión"],"a":3,"e":"La conexión vale en muchos casos pero puede tener excepciones. «Siempre» describe una regla estricta; «si no se deriva» describe la negación por falla. (Ep. X, parte 2, «Reglas rebatibles»)"},{"q":"¿Qué diferencia una regla estricta de una rebatible en DeLP?","o":["La estricta no admite excepciones; la rebatible, sí","La estricta pertenece a Δ; la rebatible, a Π","La rebatible no admite excepciones; la estricta, sí","La estricta no puede tener variables; la rebatible, sí"],"a":0,"e":"Sintácticamente solo cambia la flecha (← o -<), pero la estricta representa información segura y la rebatible, información tentativa. (Ep. X, parte 2, «Reglas estrictas»)"},{"q":"¿Quién decide si una regla se representa como estricta o como rebatible?","o":["El intérprete de DeLP, según aparezcan contradicciones","La persona que codifica el conocimiento, según el dominio","El orden de preferencia que se define entre las reglas","Nadie: las reglas con negación fuerte son siempre estrictas"],"a":1,"e":"Depende del dominio de aplicación y es responsabilidad de quien codifica el conocimiento: si hay excepciones, debe ser rebatible. (Ep. X, parte 2, «Reglas estrictas»)"},{"q":"Con Δc = {~cruzar -< semaforo(rojo). cruzar -< semaforo(rojo), emergencia. ~cruzar -< semaforo(rojo), emergencia, hay_peligro.}, la segunda regla es…","o":["Una regla que se aplica con cualquier semáforo en rojo","Una excepción a la primera regla","Una regla inválida, porque contradice a la primera","Una regla estricta, por tener más condiciones"],"a":1,"e":"La primera dice que el rojo es una buena razón para no cruzar; la segunda es una excepción (emergencia) y la tercera, una excepción a la excepción. Cuáles se pueden usar depende de los hechos percibidos. (Ep. X, parte 2, «Reglas rebatibles»)"},{"q":"En DeLP, ¿qué es un hecho?","o":["Una regla estricta con variables","Una regla rebatible sin cuerpo","Un literal fijo, sin variables","Un literal que puede tener variables"],"a":2,"e":"Los hechos deben estar completamente instanciados, y son los que propagan esas instancias en las derivaciones. (Ep. X, parte 2, «Hechos»)"},{"q":"¿Cómo conviene representar «si es de noche, generalmente no hay luz» en DeLP?","o":["~luz ← noche, una regla estricta","~luz, un hecho del programa","luz -< ~noche, una regla rebatible","~luz -< noche, una regla rebatible"],"a":3,"e":"«Generalmente» indica que puede haber excepciones (por ejemplo, luna llena): es información tentativa. (TP8, ej. 1.d)"},{"q":"¿Cómo conviene representar «si la linterna está apagada, entonces no está encendida» en DeLP?","o":["~encendida -< apagada, una regla rebatible","encendida -< ~apagada, una regla rebatible","apagada ← ~encendida, una regla estricta","~encendida ← apagada, una regla estricta"],"a":3,"e":"Es una conexión que vale siempre, sin excepciones (apagada y encendida son opuestos): información segura. (TP8, ej. 1.d)"},{"q":"Con Π = {fusiones_web(acme,strong). en_fusion(X,Y) ← fusiones_web(X,Y).} y Δ = {riesgosa(X) -< en_fusion(X,Y). ~comprar_acciones(X) -< riesgosa(X).}, ¿cuál es una derivación rebatible de ~comprar_acciones(acme)?","o":["en_fusion(acme,strong), riesgosa(acme), ~comprar_acciones(acme), fusiones_web(acme,strong)","fusiones_web(acme,strong), riesgosa(acme), en_fusion(acme,strong), ~comprar_acciones(acme)","fusiones_web(acme,strong), en_fusion(acme,strong), riesgosa(acme), ~comprar_acciones(acme)","~comprar_acciones(acme), riesgosa(acme), en_fusion(acme,strong), fusiones_web(acme,strong)"],"a":2,"e":"Cada literal debe ser un hecho o la cabeza de una regla instanciada cuyo cuerpo ya apareció antes en la secuencia. Es el ejemplo 3 de la cátedra: usa reglas de los dos tipos. (Ep. X, parte 2, «Derivaciones rebatibles»)"},{"q":"¿Cuándo una derivación es estricta?","o":["Cuando no hay derivación del complemento","Cuando solo usa hechos y reglas estrictas","Cuando su conclusión es un literal negado","Cuando usa al menos una regla estricta"],"a":1,"e":"Una derivación estricta usa solo elementos de Π; por ejemplo, la de ~riesgosa(strong) con listado_fuertes_web(strong) y dos reglas estrictas. (Ep. X, parte 2, «Derivaciones rebatibles»)"},{"q":"¿Cuándo un conjunto de hechos y reglas es contradictorio en DeLP?","o":["Cuando tiene dos reglas distintas con la misma cabeza","Cuando tiene reglas rebatibles con la cabeza negada","Cuando permite derivar un literal y también su complemento","Cuando no tiene ningún hecho a partir del cual derivar"],"a":2,"e":"Un conjunto S es contradictorio si de S se obtienen derivaciones rebatibles para p y para ~p. Por ejemplo, Πm ∪ Δm deriva comprar_acciones(acme) y ~comprar_acciones(acme). (Ep. X, parte 2, «Conjunto de reglas contradictorio»)"},{"q":"¿Es válido en DeLP el conjunto Π = {~en_casa ← en_supermercado. en_supermercado. en_casa.}?","o":["Sí: un conjunto con solo dos hechos nunca llega a ser contradictorio","No: Π no puede tener reglas cuya cabeza sea un literal negado","Sí: las contradicciones se resuelven después con árboles de dialéctica","No: Π deriva en_casa y ~en_casa, y Π no puede ser contradictorio"],"a":3,"e":"En todo PLR se asume que Π no es contradictorio: los hechos y las reglas estrictas no pueden inferir conclusiones contradictorias. Solo Π ∪ Δ puede serlo. (Ep. X, parte 2, «Conjunto de reglas contradictorio»)"},{"q":"¿Qué tres condiciones debe cumplir A para que <A, h> sea un argumento?","o":["Derivación, consistencia y minimalidad","Derivación, completitud y maximalidad","Consistencia, monotonía y minimalidad","Derivación, preferencia y garantía"],"a":0,"e":"(1) A ∪ Π deriva h; (2) A ∪ Π no es contradictorio; (3) ningún subconjunto propio de A cumple (1) y (2). (Ep. X, parte 2, «Argumentos»)"},{"q":"En un argumento <A, h>, el conjunto A contiene…","o":["Reglas rebatibles de Δ con sus variables","Solo reglas rebatibles instanciadas de Δ","Todas las reglas usadas en la derivación de h","Los hechos y las reglas estrictas de Π que usa"],"a":1,"e":"El conjunto solo incluye reglas rebatibles instanciadas; los elementos de Π se usan para derivar pero no forman parte de A. (Ep. X, parte 2, «Observaciones importantes»)"},{"q":"¿Cuál es el argumento para un literal que es un hecho del programa?","o":["El que tiene el conjunto vacío de reglas","Ninguno: los hechos no tienen argumentos en DeLP","El que tiene el propio hecho como única regla","El formado por las reglas estrictas que lo derivan"],"a":0,"e":"El argumento para un hecho es el conjunto vacío; por ejemplo <G, ~riesgosa(strong)> con G = { }, porque se deriva solo con Π. (Ep. X, parte 2)"},{"q":"¿Por qué R = {en_casa -< de_noche} no es un argumento para en_casa? (Πn = {~en_casa ← en_supermercado. en_supermercado. de_noche. festejo.}; Δn = {en_casa -< de_noche. preparo_cena -< de_noche. ~preparo_cena -< festejo. acuesto_tarde -< festejo. en_oficina -< trabajando.})","o":["Porque R no es mínimo: el conjunto vacío también deriva en_casa","Porque R ∪ Πn es contradictorio: deriva en_casa y ~en_casa","Porque la regla de R tiene un antecedente que es un hecho","Porque R ∪ Πn no permite derivar el literal en_casa"],"a":1,"e":"Falla la condición (2), consistencia: Πn deriva ~en_casa (por en_supermercado) y R agrega en_casa. (Ep. X, parte 2, «Algunos detalles sobre las condiciones de los argumentos»)"},{"q":"¿Por qué S = {~preparo_cena -< festejo. acuesto_tarde -< festejo.} no es un argumento para ~preparo_cena? (Πn = {~en_casa ← en_supermercado. en_supermercado. de_noche. festejo.}; Δn = {en_casa -< de_noche. preparo_cena -< de_noche. ~preparo_cena -< festejo. acuesto_tarde -< festejo. en_oficina -< trabajando.})","o":["Porque un argumento no puede tener dos reglas con el mismo cuerpo","Porque S ∪ Πn es contradictorio para preparo_cena","Porque no es mínimo: B = {~preparo_cena -< festejo} ya alcanza","Porque S ∪ Πn no permite derivar ~preparo_cena"],"a":2,"e":"Falla la condición (3), minimalidad: B ⊂ S también cumple derivación y consistencia. La regla acuesto_tarde está de más. (Ep. X, parte 2)"},{"q":"¿Por qué Q = {en_oficina -< trabajando} no es un argumento para en_oficina? (Πn = {~en_casa ← en_supermercado. en_supermercado. de_noche. festejo.}; Δn = {en_casa -< de_noche. preparo_cena -< de_noche. ~preparo_cena -< festejo. acuesto_tarde -< festejo. en_oficina -< trabajando.})","o":["Porque Q no es mínimo: el conjunto vacío deriva en_oficina","Porque Q ∪ Πn no deriva en_oficina: trabajando no se puede derivar","Porque Q ∪ Πn es contradictorio, ya que deriva ~en_casa","Porque en_oficina no aparece en ninguna regla estricta de Πn"],"a":1,"e":"Falla la condición (1), derivación: no hay ningún hecho trabajando en Πn. (Ep. X, parte 2)"},{"q":"¿Por qué no existe un argumento que use la regla b -< h5? (programa de la «Resolución con DeLP»: Π = {h1. h2. h3. h4.}; Δ = {a -< h1. a -< b. ~a -< c. b -< h2. b -< h5. ~b -< h4. c -< h2. ~c -< d. d -< h3. ~d -< h4.}; orden: (~a -< c) > (a -< h1), (b -< h2) > (~b -< h4), (~c -< d) > (c -< h2))","o":["Porque b -< h2 ya deriva b y entonces no sería mínimo","Porque b -< h5 contradice a ~b -< h4, que está en Δ","Porque b -< h5 no tiene prioridad sobre ninguna regla","Porque h5 no es un hecho ni se deriva en el programa"],"a":3,"e":"Sin h5 no hay derivación de b por esa regla: falla la condición de derivación. La minimalidad se evalúa dentro de cada argumento, no entre argumentos distintos. (Resolución con DeLP)"},{"q":"En DeLP, ¿cuándo <S, q> es un sub-argumento de <A, h>?","o":["Cuando S ∪ A es contradictorio","Cuando q = h","Cuando A ⊆ S","Cuando S ⊆ A"],"a":3,"e":"Un sub-argumento usa una parte de las reglas del argumento; por ejemplo, <F, c> con F = {c -< h2} es sub-argumento de <C, ~a>. (Resolución con DeLP)"},{"q":"Con el criterio de prioridad entre reglas, ¿cuándo <B, f> es preferido a <A, g>?","o":["B tiene al menos una regla mejor que alguna de A, sin otra condición","B tiene una regla mejor que alguna de A, y A ninguna mejor que una de B","B tiene más reglas rebatibles que A, y las dos derivan su conclusión","Todas las reglas de B son mejores que todas las reglas de A"],"a":1,"e":"Hacen falta las dos condiciones. Si cada uno tiene alguna regla mejor que el otro, o ninguno tiene, no son comparables. (Resolución con DeLP)"},{"q":"<X, p> ataca a <Y, h> en el sub-argumento de desacuerdo <S, q>, y <X, p> no es comparable con <S, q>. ¿Qué es <X, p>?","o":["Un derrotador propio de <Y, h>","Un contra-argumento que no lo derrota","Un sub-argumento de desacuerdo de <Y, h>","Un derrotador por bloqueo de <Y, h>"],"a":3,"e":"Si X es preferido a S, es derrotador propio; si no son comparables, es derrotador por bloqueo. Si S fuera preferido a X, no habría derrota. (Resolución con DeLP)"},{"q":"Con A = {a -< h1} y C = {~a -< c, c -< h2}, ¿qué relación hay entre <C, ~a> y <A, a>? (programa de la «Resolución con DeLP»: Π = {h1. h2. h3. h4.}; Δ = {a -< h1. a -< b. ~a -< c. b -< h2. b -< h5. ~b -< h4. c -< h2. ~c -< d. d -< h3. ~d -< h4.}; orden: (~a -< c) > (a -< h1), (b -< h2) > (~b -< h4), (~c -< d) > (c -< h2))","o":["Se derrotan por bloqueo uno al otro","<C, ~a> es derrotador por bloqueo de <A, a>","<A, a> es derrotador propio de <C, ~a>","<C, ~a> es derrotador propio de <A, a>"],"a":3,"e":"Están en conflicto (a y ~a), y C tiene la regla ~a -< c, mejor que a -< h1, mientras que A no tiene ninguna regla mejor: C es preferido. (Resolución con DeLP)"},{"q":"Con B = {a -< b, b -< h2} y C = {~a -< c, c -< h2}, ¿qué relación hay entre <B, a> y <C, ~a>? (programa de la «Resolución con DeLP»: Π = {h1. h2. h3. h4.}; Δ = {a -< h1. a -< b. ~a -< c. b -< h2. b -< h5. ~b -< h4. c -< h2. ~c -< d. d -< h3. ~d -< h4.}; orden: (~a -< c) > (a -< h1), (b -< h2) > (~b -< h4), (~c -< d) > (c -< h2))","o":["<C, ~a> es derrotador propio de <B, a>","Se derrotan por bloqueo uno al otro","Ninguna: no hay prioridad entre sus reglas","<B, a> es derrotador propio de <C, ~a>"],"a":1,"e":"Están en conflicto, pero ninguna regla de uno es mejor que una del otro: no son comparables, así que cada uno es derrotador por bloqueo del otro. (Resolución con DeLP)"},{"q":"¿Por qué <G, ~c>, con G = {~c -< d, d -< h3}, derrota a <C, ~a> si no concluye a? (programa de la «Resolución con DeLP»: Π = {h1. h2. h3. h4.}; Δ = {a -< h1. a -< b. ~a -< c. b -< h2. b -< h5. ~b -< h4. c -< h2. ~c -< d. d -< h3. ~d -< h4.}; orden: (~a -< c) > (a -< h1), (b -< h2) > (~b -< h4), (~c -< d) > (c -< h2))","o":["Porque los dos argumentos usan reglas con la cabeza negada","Porque ataca a su sub-argumento <F, c>, con una regla preferida","Porque G tiene más reglas que el argumento C","Porque ~c y ~a son literales que se contradicen entre sí"],"a":1,"e":"El ataque puede ser a un sub-argumento: ~c está en conflicto con c, y (~c -< d) > (c -< h2), así que es derrotador propio. (Resolución con DeLP)"},{"q":"En un árbol de dialéctica de DeLP, todo nodo salvo la raíz es…","o":["Un argumento a favor de la raíz","Un sub-argumento de su padre","Una regla rebatible del programa","Un derrotador de su nodo padre"],"a":3,"e":"DeLP construye un argumento para la consulta, después sus derrotadores, los derrotadores de esos, y así sucesivamente. (Ep. X, parte 2, «Micro-adelanto del proceso de argumentación dialéctica»)"},{"q":"En el marcado de un árbol de dialéctica, ¿cuándo un nodo interno se marca D?","o":["Cuando al menos uno de sus hijos está marcado D","Cuando todos sus hijos están marcados U","Cuando al menos uno de sus hijos está marcado U","Cuando tiene más hijos marcados D que U"],"a":2,"e":"Toda hoja es U; un nodo interno es D si tiene al menos un hijo U, y U si todos sus hijos son D. (Ep. X, parte 2, «Árbol de dialéctica marcado»)"},{"q":"En un árbol de dialéctica, la raíz A tiene un único hijo B, y B tiene un único hijo C, que es hoja. ¿Cómo quedan marcados?","o":["A: D, B: D, C: U","A: U, B: D, C: U","A: D, B: U, C: U","A: U, B: U, C: D"],"a":1,"e":"C es hoja: U. B tiene un hijo U: D. A tiene todos sus hijos D: U. (Ep. X, parte 2)"},{"q":"La raíz A tiene dos hijos: B, que es hoja, y C, cuyo único hijo E es hoja. ¿Cómo queda marcada A?","o":["U, porque la mitad de sus hijos queda D","U, porque E derrota a C y así defiende a A","D, porque B es hoja y queda marcada U","D, porque C queda marcado U"],"a":2,"e":"B y E son hojas: U. C tiene un hijo U: D. A tiene un hijo U (B): D. Que E defienda a A frente a C no alcanza, porque B sigue sin ser derrotado. (Ep. X, parte 2)"},{"q":"¿Para qué sirve la «poda» durante el marcado de un árbol de dialéctica?","o":["Para no explorar líneas que no cambian la marca del nodo padre","Para explorar solo los argumentos que están a favor de la consulta","Para descartar los argumentos que no cumplen la minimalidad","Para eliminar del programa las reglas que nunca se usan"],"a":0,"e":"Hay partes del árbol que se pueden podar sin afectar el resultado; qué se poda depende del orden en que se recorre el árbol. (Ep. X, parte 2, «Árbol de dialéctica marcado con poda»)"},{"q":"¿Cuándo una conclusión c está garantizada por un programa DeLP?","o":["Si todos los árboles de argumentos para c tienen la raíz marcada U","Si hay más argumentos para c que argumentos para su complemento","Si no existe ningún argumento para el complemento de c","Si algún árbol de un argumento para c tiene la raíz marcada U"],"a":3,"e":"Alcanza con al menos un árbol de dialéctica para un argumento que sustenta c cuya raíz quede U. (Ep. X, parte 2, «Conclusión garantizada»)"},{"q":"¿Cuándo responde «unknown» un intérprete DeLP a la consulta c?","o":["Cuando ni c ni ~c están garantizados","Cuando la raíz del árbol de c es D","Cuando c no tiene ningún argumento","Cuando c no pertenece al programa"],"a":3,"e":"c pertenece a P si c o su com const KEY = "ia-uns-2026-quiz-v1";
const LETTERS = ["A", "B", "C", "D"];

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.s) return s; } catch (e) {}
  return { u: UNITS[0].id, s: {} };
}
let state = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function us(id) { if (!state.s[id]) state.s[id] = { i: 0, r: {} }; return state.s[id]; }
function unitById(id) { return UNITS.find(u => u.id === id); }
function stats(u) {
  const r = us(u.id).r; let ok = 0, bad = 0;
  for (const k in r) { if (r[k] === u.qs[k].a) ok++; else bad++; }
  return { ok, bad, ans: ok + bad, total: u.qs.length };
}
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);

  for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(k));
  return n;
};

function renderNav() {
  const nav = document.getElementById("units"); nav.replaceChildren();
  UNITS.forEach((u, i) => {
    const s = stats(u);
    nav.append(el("button", { class: "unit-btn", "aria-current": String(state.u === u.id), onclick: () => go(u.id) },
      el("span", { class: "code" }, `U${i + 1} · ${u.tp}`),
      el("span", {}, u.nombre),
      el("span", { class: "mini" }, `${s.ok}/${s.total} correctas`)));
  });
  nav.append(el("button", { class: "unit-btn", "aria-current": String(state.u === "resumen"), onclick: () => go("resumen") },
    el("span", { class: "code" }, "TODAS"), el("span", {}, "Resumen general"), el("span", { class: "mini" }, "puntaje por unidad")));
  const cur = nav.querySelector('[aria-current="true"]');
  if (cur && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = cur.offsetLeft - nav.offsetLeft - 8;
  let ok = 0, ans = 0, total = 0;
  UNITS.forEach(u => { const s = stats(u); ok += s.ok; ans += s.ans; total += s.total; });
  document.getElementById("overall").textContent = `${ans}/${total} respondidas · ${ok} correctas · ${pct(ok, ans)}% de acierto`;
}
function go(id) { state.u = id; save(); render(); window.scrollTo({ top: 0 }); }

let armed = null, armTimer = null;
function arm(name, fn, btn) {
  if (armed === name) { clearTimeout(armTimer); armed = null; fn(); return; }
  armed = name; render();
  armTimer = setTimeout(() => { armed = null; render(); }, 4000);
}

function answer(u, k, choice) {
  const st = us(u.id); if (st.r[k] !== undefined) return;
  st.r[k] = choice; save(); render();
}
function move(u, d) {
  const st = us(u.id); st.i = Math.min(u.qs.length - 1, Math.max(0, st.i + d)); save(); render();
}

function renderUnit(u) {
  const st = us(u.id); const k = st.i; const q = u.qs[k]; const chosen = st.r[k]; const answered = chosen !== undefined;
  const s = stats(u);
  const card = el("section", { class: "card", "aria-live": "polite" });

  if (s.ans === s.total) {
    const p = pct(s.ok, s.total);
    card.append(el("div", { class: "done" },
      el("h2", {}, "Terminaste la unidad"),
      el("div", { class: "big" }, `${s.ok}/${s.total} · ${p}%`),
      el("p", { style: "margin:0" }, p >= 80 ? "Muy bien. Repasá las incorrectas para cerrar los huecos." : p >= 60 ? "Bien. Volvé sobre las incorrectas y releé esas diapositivas." : "Conviene releer las diapositivas de esta unidad y reintentar las incorrectas."),
      el("div", { class: "group", style: "display:flex;gap:8px;flex-wrap:wrap" },
        el("button", { class: "btn primary", disabled: s.bad === 0, onclick: () => retryWrong(u) }, `Reintentar las ${s.bad} incorrectas`),
        el("button", { class: "btn danger" + (armed === "reset" + u.id ? " armed" : ""), onclick: () => arm("reset" + u.id, () => resetUnit(u)) }, armed === "reset" + u.id ? "Confirmar: borrar respuestas" : "Reiniciar la unidad"))));
    card.append(el("div", { style: "height:16px" }));
  }

  card.append(el("div", { class: "qhead" }, el("span", {}, `Pregunta ${k + 1} de ${u.qs.length}`), el("span", {}, answered ? (chosen === q.a ? "Correcta" : "Incorrecta") : "Sin responder")));
  card.append(el("p", { class: "qtext" }, q.q));
  const opts = el("div", { class: "opts", role: "group", "aria-label": "Opciones" });
  q.o.forEach((o, j) => {
    let cls = "opt";
    if (answered) { if (j === q.a) cls += " correct"; else if (j === chosen) cls += " wrong"; else cls += " dim"; }
    opts.append(el("button", { class: cls, disabled: answered, onclick: () => answer(u, k, j) }, el("span", { class: "key" }, LETTERS[j]), el("span", {}, o)));
  });
  card.append(opts);
  if (answered) {
    const ok = chosen === q.a;
    card.append(el("div", { class: "feedback " + (ok ? "ok" : "bad") },
      el("strong", {}, ok ? "Correcto" : `Incorrecto. La respuesta correcta es la ${LETTERS[q.a]}.`), el("p", {}, q.e)));
  }
  card.append(el("div", { class: "controls" },
    el("div", { class: "group" },
      el("button", { class: "btn", disabled: k === 0, onclick: () => move(u, -1) }, "← Anterior"),
      el("button", { class: "btn primary", disabled: k === u.qs.length - 1, onclick: () => move(u, 1) }, "Siguiente →")),
    el("div", { class: "group" },
      answered ? el("button", { class: "btn", onclick: () => { delete st.r[k]; save(); render(); } }, "Volver a intentar esta") : null)));
  card.append(el("p", { class: "hint" }, "Atajos: A–D o 1–4 para responder, flechas ← → para moverte."));

  const nextOpen = u.qs.findIndex((_, i) => st.r[i] === undefined);
  const board = el("aside", { class: "board card", "aria-label": "Tablero de la unidad" },
    el("h2", {}, `U${UNITS.indexOf(u) + 1} · ${u.nombre}`),
    el("div", { class: "score" },
      el("div", { class: "stat" }, el("span", { class: "v" }, `${s.ok}/${s.ans}`), el("span", { class: "l" }, "correctas")),
      el("div", { class: "stat" }, el("span", { class: "v" }, `${pct(s.ok, s.ans)}%`), el("span", { class: "l" }, "acierto")),
      el("div", { class: "stat" }, el("span", { class: "v" }, `${s.ans}/${s.total}`), el("span", { class: "l" }, "respondidas"))),
    el("div", { class: "bar", role: "img", "aria-label": `${s.ok} correctas y ${s.bad} incorrectas de ${s.total}` },
      el("i", { class: "g", style: `width:${100 * s.ok / s.total}%` }), el("i", { class: "r", style: `width:${100 * s.bad / s.total}%` })),
    el("div", { class: "legend" }, el("span", { style: "--c:var(--ok)" }, "correcta"), el("span", { style: "--c:var(--bad)" }, "incorrecta"), el("span", { style: "--c:var(--cell)" }, "sin responder")),
    el("div", { class: "grid" }, u.qs.map((qq, i) => {
      const r = st.r[i]; let cls = "cell";
      if (r !== undefined) cls += r === qq.a ? " ok" : " bad";
      if (i === k) cls += " cur";
      return el("button", { class: cls, "aria-label": `Ir a la pregunta ${i + 1}`, onclick: () => { st.i = i; save(); render(); } }, String(i + 1));
    })),
    el("div", { class: "stack" },
      el("button", { class: "btn", disabled: nextOpen < 0, onclick: () => { st.i = nextOpen; save(); render(); } }, "Ir a la próxima sin responder"),
      el("button", { class: "btn", disabled: s.bad === 0, onclick: () => retryWrong(u) }, `Reintentar las incorrectas (${s.bad})`),
      el("button", { class: "btn danger" + (armed === "reset" + u.id ? " armed" : ""), onclick: () => arm("reset" + u.id, () => resetUnit(u)) }, armed === "reset" + u.id ? "Confirmar: borrar respuestas" : "Reiniciar la unidad")));

  return el("div", { class: "layout" }, card, board);
}
function retryWrong(u) {
  const st = us(u.id); const wrong = Object.keys(st.r).map(Number).filter(i => st.r[i] !== u.qs[i].a);
  wrong.forEach(i => delete st.r[i]); if (wrong.length) st.i = Math.min(...wrong); save(); render();
}
function resetUnit(u) { state.s[u.id] = { i: 0, r: {} }; save(); render(); }

function renderSummary() {
  let tot = { ok: 0, bad: 0, ans: 0, total: 0 };
  const rows = UNITS.map((u, i) => {
    const s = stats(u); for (const k in tot) tot[k] += s[k];
    return el("tr", {},
      el("td", {}, el("button", { class: "linkbtn", onclick: () => go(u.id) }, `U${i + 1} · ${u.nombre}`)),
      el("td", { class: "num" }, `${s.ans}/${s.total}`), el("td", { class: "num" }, String(s.ok)), el("td", { class: "num" }, String(s.bad)),
      el("td", { class: "num" }, s.ans ? `${pct(s.ok, s.ans)}%` : "—"), el("td", { class: "num" }, `${pct(s.ok, s.total)}%`));
  });
  const table = el("table", { class: "sum" },
    el("thead", {}, el("tr", {}, ["Unidad", "Respondidas", "Correctas", "Incorrectas", "Acierto", "Nota sobre el total"].map(h => el("th", {}, h)))),
    el("tbody", {}, rows, el("tr", { class: "total" }, el("td", {}, "Total"), el("td", { class: "num" }, `${tot.ans}/${tot.total}`),
      el("td", { class: "num" }, String(tot.ok)), el("td", { class: "num" }, String(tot.bad)),
      el("td", { class: "num" }, tot.ans ? `${pct(tot.ok, tot.ans)}%` : "—"), el("td", { class: "num" }, `${pct(tot.ok, tot.total)}%`))));
  return el("section", { class: "card" },
    el("div", { class: "qhead" }, el("span", {}, "Resumen general"), el("span", {}, `${UNITS.length} unidades`)),
    el("p", { class: "qtext" }, "Puntaje acumulado de todas las unidades. \"Acierto\" es sobre las respondidas; \"nota sobre el total\" cuenta las no respondidas como incorrectas."),
    el("div", { class: "tablewrap" }, table),
    el("div", { class: "controls" }, el("span", {}),
      el("button", { class: "btn danger" + (armed === "resetall" ? " armed" : ""), onclick: () => arm("resetall", () => { state.s = {}; save(); render(); }) }, armed === "resetall" ? "Confirmar: borrar todo" : "Reiniciar todas las unidades")));
}

function render() {
  if (state.u !== "resumen" && !unitById(state.u)) state.u = UNITS[0].id;
  renderNav();
  const main = document.getElementById("main");
  main.replaceChildren(state.u === "resumen" ? renderSummary() : renderUnit(unitById(state.u)));
}
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || state.u === "resumen") return;
  const u = unitById(state.u); if (!u) return; const st = us(u.id);
  const map = { a: 0, b: 1, c: 2, d: 3, "1": 0, "2": 1, "3": 2, "4": 3 };
  const key = e.key.toLowerCase();
  if (key in map) { answer(u, st.i, map[key]); }
  else if (e.key === "ArrowRight") move(u, 1);
  else if (e.key === "ArrowLeft") move(u, -1);
});
render();
</script>
