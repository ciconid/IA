osa(X).\nriesgosa(X) :- en_fusion(X,Y).\nen_fusion(X,Y) :- listado_fusiones_web(X,Y).\nriesgosa(X) :- rumores_deuda_web(X).\nno_riesgosa(X) :- en_fusion(X,Y), fuerte(Y).\nno_riesgosa(X) :- fuerte(X).\nfuerte(X) :- listado_fuertes_web(X).\nbuen_precio_web(skynet).\nbuen_precio_web(acme).\nlistado_fusiones_web(acme, strong).\nrumores_deuda_web(acme).\nrumores_deuda_web(usrobotics).\nlistado_fuertes_web(strong).<\/pre>"},{"h":"6db82bf1","q":"¿Qué propiedad deseable de un SBC menciona la cátedra al hablar de conclusiones contradictorias?","o":["Que las conclusiones no cambien cuando se agrega información","Que la inferencia no concluya a la vez algo y exactamente lo contrario","Que toda consulta tenga al menos una derivación en la KB","Que cada conclusión tenga una única derivación posible"],"a":1,"e":"Es la propiedad de coherencia o consistencia. Que las conclusiones no cambien al agregar información es la monotonía, que justamente se pierde con estos mecanismos. (Ep. VIII, «¿Cuál conclusión debería prevalecer?»)"},{"h":"2fdc7283","q":"Para que el mecanismo de inferencia no concluya algo y su contrario, ¿qué dos caminos plantea la cátedra?","o":["No concluir ninguna de las dos, o decidir cuál prevalece","Preguntarle al usuario, o mostrarle las dos conclusiones","Elegir la derivación más corta, o la que se encontró primero","Borrar la regla más nueva, o borrar la más vieja"],"a":0,"e":"La inferencia puede ser cauta (ninguna de las dos) o decidir cuál prevalece comparando la calidad de la información. (Ep. VIII, «¿Cuál conclusión debería prevalecer?»)"},{"h":"c735990e","q":"Con el operador ~ y el predicado complemento/2 de la cátedra, ¿cuál es el complemento de ~comprar_acciones(acme)?","o":["no_comprar_acciones(acme)","\\+ comprar_acciones(acme)","~~comprar_acciones(acme)","comprar_acciones(acme)"],"a":3,"e":"complemento(~X, X) y complemento(X, ~X): el complemento de ~c es c, y el de c es ~c. (Ep. VIII, «Extendiendo el mecanismo de inferencia»)"},{"h":"365c570d","q":"Con la primera inferencia cauta de la cátedra (respuestas si / no), ¿qué responde a comprar_acciones(acme)?","o":["indeciso, porque se derivan la consulta y su complemento","no, porque también se deriva ~comprar_acciones(acme)","si, porque hay una derivación de comprar_acciones(acme)","desconozco, porque la KB es contradictoria para acme"],"a":1,"e":"La primera versión responde si solo cuando deriva Q y no su complemento; en cualquier otro caso responde no. «indeciso» aparece recién en la versión detallada. (Ep. VIII, «Extendiendo el mecanismo de inferencia»)","x":"<div class=\"ctx-tit\">KB de Mer-val con negación fuerte<\/div><pre>comprar_acciones(X) :- buen_precio(X).\nbuen_precio(X) :- buen_precio_web(X).\nbuen_precio_web(skynet).\nbuen_precio_web(acme).\n~comprar_acciones(X) :- riesgosa(X).\nriesgosa(X) :- en_fusion(X,Y).\nriesgosa(X) :- rumores_deuda_web(X).\nen_fusion(X,Y) :- listado_fusiones_web(X,Y).\nlistado_fusiones_web(acme,strong).\nrumores_deuda_web(acme).\nrumores_deuda_web(usrobotics).<\/pre>"},{"h":"db9c7a79","q":"Con la primera inferencia cauta de la cátedra (respuestas si / no), la respuesta «no» puede significar…","o":["Que se deriva el complemento, ambos o ninguno de los dos","Solo que la consulta no tiene ninguna derivación en la KB","Solo que se deriva el complemento de la consulta y no la consulta","Que la consulta tiene una derivación con poca certeza"],"a":0,"e":"respuesta(Q, no) es el caso por defecto: cubre todo lo que no es «deriva Q y no su complemento». Por eso la versión detallada separa no, indeciso y desconozco. (Ep. VIII)"},{"h":"244d23df","q":"Con la inferencia cauta detallada (si / no / indeciso / desconozco), ¿qué responde a comprar_acciones(acme)?","o":["indeciso","no","desconozco","si"],"a":0,"e":"Se deriva comprar_acciones(acme) (buen precio en la web) y también ~comprar_acciones(acme) (riesgosa por fusión o rumores de deuda). (Ep. VIII)","x":"<div class=\"ctx-tit\">KB de Mer-val con negación fuerte<\/div><pre>comprar_acciones(X) :- buen_precio(X).\nbuen_precio(X) :- buen_precio_web(X).\nbuen_precio_web(skynet).\nbuen_precio_web(acme).\n~comprar_acciones(X) :- riesgosa(X).\nriesgosa(X) :- en_fusion(X,Y).\nriesgosa(X) :- rumores_deuda_web(X).\nen_fusion(X,Y) :- listado_fusiones_web(X,Y).\nlistado_fusiones_web(acme,strong).\nrumores_deuda_web(acme).\nrumores_deuda_web(usrobotics).<\/pre>"},{"h":"637450b4","q":"Con la inferencia cauta detallada (si / no / indeciso / desconozco), ¿qué responde a comprar_acciones(fakecorp)?","o":["desconozco","si","no","indeciso"],"a":0,"e":"No hay derivación ni para comprar_acciones(fakecorp) ni para ~comprar_acciones(fakecorp). (Ep. VIII)","x":"<div class=\"ctx-tit\">KB de Mer-val con negación fuerte<\/div><pre>comprar_acciones(X) :- buen_precio(X).\nbuen_precio(X) :- buen_precio_web(X).\nbuen_precio_web(skynet).\nbuen_precio_web(acme).\n~comprar_acciones(X) :- riesgosa(X).\nriesgosa(X) :- en_fusion(X,Y).\nriesgosa(X) :- rumores_deuda_web(X).\nen_fusion(X,Y) :- listado_fusiones_web(X,Y).\nlistado_fusiones_web(acme,strong).\nrumores_deuda_web(acme).\nrumores_deuda_web(usrobotics).<\/pre>"},{"h":"4170f0d8","q":"Con la inferencia cauta detallada (si / no / indeciso / desconozco), ¿qué responde a ~comprar_acciones(usrobotics)?","o":["si","indeciso","desconozco","no"],"a":0,"e":"~comprar_acciones(usrobotics) se deriva por riesgosa (rumores de deuda), y su complemento comprar_acciones(usrobotics) no se deriva (no hay buen_precio_web(usrobotics)). (Ep. VIII)","x":"<div class=\"ctx-tit\">KB de Mer-val con negación fuerte<\/div><pre>comprar_acciones(X) :- buen_precio(X).\nbuen_precio(X) :- buen_precio_web(X).\nbuen_precio_web(skynet).\nbuen_precio_web(acme).\n~comprar_acciones(X) :- riesgosa(X).\nriesgosa(X) :- en_fusion(X,Y).\nriesgosa(X) :- rumores_deuda_web(X).\nen_fusion(X,Y) :- listado_fusiones_web(X,Y).\nlistado_fusiones_web(acme,strong).\nrumores_deuda_web(acme).\nrumores_deuda_web(usrobotics).<\/pre>"},{"h":"96d08775","q":"Con la inferencia cauta detallada (si / no / indeciso / desconozco), ¿qué responde a ~comprar_acciones(skynet)?","o":["desconozco","indeciso","no","si"],"a":2,"e":"~comprar_acciones(skynet) no se deriva (skynet no es riesgosa), pero su complemento comprar_acciones(skynet) sí: la respuesta es no. (Ep. VIII)","x":"<div class=\"ctx-tit\">KB de Mer-val con negación fuerte<\/div><pre>comprar_acciones(X) :- buen_precio(X).\nbuen_precio(X) :- buen_precio_web(X).\nbuen_precio_web(skynet).\nbuen_precio_web(acme).\n~comprar_acciones(X) :- riesgosa(X).\nriesgosa(X) :- en_fusion(X,Y).\nriesgosa(X) :- rumores_deuda_web(X).\nen_fusion(X,Y) :- listado_fusiones_web(X,Y).\nlistado_fusiones_web(acme,strong).\nrumores_deuda_web(acme).\nrumores_deuda_web(usrobotics).<\/pre>"},{"h":"56407bab","q":"Si hay conclusiones en conflicto y se quiere elegir la mejor, ¿cómo propone la cátedra compararlas?","o":["Eligiendo la conclusión que tiene más derivaciones a su favor","Comparando la calidad de la información que sustenta cada derivación","Eligiendo la conclusión que la máquina de inferencia derivó primero","Eligiendo la conclusión cuya derivación usa menos reglas"],"a":1,"e":"Se compara la calidad de la información de cada derivación; en el episodio siguiente: valores de certeza (cuantitativo), informantes (cualitativo) y argumentación. (Ep. VIII, «Eligiendo la mejor conclusión para recomendar»)"},{"h":"84809e2b","q":"¿Qué ventaja tiene exigir que la base de conocimiento sea consistente?","o":["Permite representar opiniones opuestas de distintos expertos","Alcanza con una inferencia monotónica estándar, como Modus Ponens","Evita tener que revisar la base cuando llega información nueva","Permite responder «indeciso» cuando dos reglas entran en conflicto"],"a":1,"e":"Con una base consistente basta Modus Ponens y se evita la explosión. Representar opiniones opuestas es justamente lo que se pierde. (TP7, ej. 6)"},{"h":"3e0c0744","q":"¿Qué desventaja tiene exigir que la base de conocimiento sea consistente?","o":["Ya no puede usarse Prolog como máquina de inferencia del sistema","Cada contradicción obliga a revisarla, y puede perderse información","Las respuestas pasan a ser si, no, indeciso o desconozco","La inferencia se vuelve no monotónica y mucho más costosa de calcular"],"a":1,"e":"Hay que decidir qué eliminar para recuperar la consistencia (con operadores como los de AGM), y lo eliminado ya no puede usarse como razón. (TP7, ej. 6)"},{"h":"9c5324ea","q":"En lógica proposicional, ¿qué se puede derivar de un conjunto de sentencias inconsistente?","o":["Solo las dos sentencias contradictorias","Ninguna sentencia del lenguaje","Solo los hechos, no las conclusiones","Cualquier sentencia del lenguaje"],"a":3,"e":"Es la explosión: de un conjunto inconsistente se deriva todo («¿aprobé? sí», «¿desaprobé? sí»). Por eso Modus Ponens exige una base consistente. (TP7, ej. 6)"}]},{"id":"u4","nombre":"Información contradictoria y valores de certeza","tp":"TP7","qs":[{"h":"214d6ae8","q":"Para no inferir conclusiones contradictorias, la opción (a) de la cátedra mantiene la base de creencias consistente y usa…","o":["Una inferencia monotónica como Modus Ponens (p. ej., modelo AGM)","Negación por falla para descartar lo que no se puede derivar","Una inferencia no monotónica que decide ante cada contradicción","Factores de certeza para elegir la mejor de las dos conclusiones"],"a":0,"e":"Opción (a): base libre de contradicciones + inferencia monotónica (Modus Ponens), por ejemplo con la teoría del cambio de AGM. La inferencia que decide es la opción (b). (Ep. IX, «Bases de creencias inconsistentes: dos grandes opciones»)"},{"h":"c96c17df","q":"¿En qué consiste la opción (b) para manejar contradicciones, la que se desarrolla en el Episodio IX?","o":["Admitir contradicciones y usar una inferencia no monotónica que decida","Revisar la base con operadores AGM cada vez que llega información","Prohibir las reglas que tienen negación fuerte en la cabeza","Asignar a todas las reglas el mismo valor de certeza"],"a":0,"e":"Opción (b): mantener la base con potenciales contradicciones y disponer de una inferencia (no monotónica) que permita decidir ante una contradicción. (Ep. IX, «Bases de creencias inconsistentes: dos grandes opciones»)"},{"h":"fca7de95","q":"En la propuesta de la cátedra, el factor de certeza (CF) de un elemento de la KB es…","o":["Un número real en el intervalo [0, 1]","Una probabilidad que suma 1 con la de su complemento","Un número real en el intervalo [−1, 1]","Un número entero entre 0 y 100"],"a":2,"e":"Se usa una idea simple y usual: un valor real en [−1, 1]. Cerca de 1, más certeza de que es verdadero; cerca de −1, más certeza de que es falso. (Ep. IX, «Conocimiento con valores de certeza»)"},{"h":"bf2c2df6","q":"¿Qué representa un CF igual a 0?","o":["La misma certeza de que sea verdadero o de que sea falso","Certeza total de que el elemento es falso","Que el elemento no figura en la base de conocimiento","Que la regla asociada nunca puede usarse en una derivación"],"a":0,"e":"CF = 1: certeza total de verdadero; CF = −1: certeza total de falso; CF = 0: la misma certeza de que sea verdadero o falso. (Ep. IX, «Conocimiento con valores de certeza»)"},{"h":"8cb16d6b","q":"¿Qué representa un CF igual a −1?","o":["Certeza total de que el elemento es falso","Que el elemento no tiene ninguna certeza asociada","Certeza total de que el elemento es verdadero, negado","Que el elemento es el complemento de otro con CF 1"],"a":0,"e":"El valor −1 representa certeza total de que sea falso. (Ep. IX, «Conocimiento con valores de certeza»)"},{"h":"5f30330b","q":"Con la estrategia MYCIN de la cátedra, ¿cómo se calcula el CF de una conjunción P1, …, PN?","o":["El máximo de los CF de los elementos","El mínimo de los CF de los elementos","El producto de los CF de los elementos","El promedio de los CF de los elementos"],"a":1,"e":"CF(P1, …, PN) = mínimo(CF(P1), …, CF(PN)). Ejemplo: CF(listado_fusiones_web(acme,strong), listado_fuertes_web(strong)) = mín(0.9, 0.8) = 0.8. (Ep. IX, «Computando el valor de certeza de las conclusiones»)"},{"h":"d75de8d1","q":"Con la estrategia MYCIN de la cátedra, si la regla Q ← P tiene CF(Q ← P) y CF(P) es positivo, ¿cuánto vale CF(Q)?","o":["mín(CF(P), CF(Q ← P))","máx(CF(P), CF(Q ← P))","CF(P) · CF(Q ← P)","CF(P) + CF(Q ← P) − 1"],"a":2,"e":"CF(Q) = CF(P) · CF(Q ← P) cuando CF(P) es positivo; si es negativo o cero, CF(Q) = 0. El mínimo se usa para las conjunciones del cuerpo, no para la regla. (Ep. IX)"},{"h":"564b49b0","q":"Con la estrategia MYCIN de la cátedra, si CF(P) = −0.5 y la regla Q ← P tiene CF 0.8, ¿cuánto vale CF(Q)?","o":["0.3","−0.4","0","0.8"],"a":2,"e":"Cuando CF(P) es negativo o cero, CF(Q) = 0. −0.4 sale de multiplicar igual; 0.3 de sumar. (Ep. IX, «Computando el valor de certeza de las conclusiones»)"},{"h":"cd1f49cc","q":"Si una conclusión tiene varias derivaciones, ¿qué CF se le asigna?","o":["La suma de los CF de sus derivaciones, acotada a 1","El promedio de los CF de sus derivaciones","El mínimo de los CF de sus derivaciones","El máximo de los CF de sus derivaciones"],"a":3,"e":"Se puede tomar el máximo: cada derivación es una razón alternativa. En el ejemplo, a tiene derivaciones con 0.38 y 0.63, y CF(a) = 0.63. (Ep. IX, «¿Qué hacer si existe más de una derivación para una conclusión?»)"},{"h":"609cc0bd","q":"Con la estrategia MYCIN de la cátedra, con esta KB, ¿cuánto vale CF(fuerte(strong))?","o":["0.9","0.72","0.8","0"],"a":1,"e":"CF(fuerte(strong)) = CF(cuerpo) · CF(regla) = 0.8 · 0.9 = 0.72. 0.8 sería tomar el mínimo entre la regla y el hecho. (Ep. IX)","x":"<div class=\"ctx-tit\">KB<\/div><pre>0.9  fuerte(X) ← listado_fuertes_web(X).\n0.8  listado_fuertes_web(strong).<\/pre>"},{"h":"57a9072c","q":"Con la estrategia MYCIN de la cátedra, con esta regla y estos CF, ¿cuánto vale CF(~riesgosa(acme))?","o":["0.63","0.72","0.4536","0.504"],"a":3,"e":"mín(0.9, 0.72) · 0.7 = 0.72 · 0.7 = 0.504. 0.4536 multiplica todo (0.9 · 0.72 · 0.7); 0.63 usa el máximo del cuerpo; 0.72 olvida el CF de la regla. (Ep. IX)","x":"<div class=\"ctx-tit\">KB<\/div><pre>0.7  ~riesgosa(acme) ← en_fusion(acme,strong), fuerte(strong).\n\nCF(en_fusion(acme,strong)) = 0.9\nCF(fuerte(strong)) = 0.72<\/pre>"},{"h":"b987d1ae","q":"Si CF(comprar_acciones(acme)) = 0.441 y CF(~comprar_acciones(acme)) = 0.504, ¿qué hace el SBC?","o":["Elige comprar_acciones(acme), porque se derivó primero","Elige ~comprar_acciones(acme): recomienda no comprar","Responde indeciso, porque se derivan las dos conclusiones","Elige comprar_acciones(acme), porque 0.441 está más lejos de 1"],"a":1,"e":"Se comparan los CF de las dos conclusiones contradictorias y se elige la de mayor CF: 0.504 > 0.441. (Ep. IX, «Resolución del conflicto con información numérica»)"},{"h":"4cf648a5","q":"Con la estrategia MYCIN de la cátedra, con esta derivación, ¿cuánto vale el CF de a?","o":["0.54","0.63","0.42","0.378"],"a":3,"e":"CF(p, g) = mín(1, 0.9) = 0.9; CF(b) = 0.9 · 0.6 = 0.54; CF(a) = 0.54 · 0.7 = 0.378. 0.54 olvida la regla de a; 0.63 es la otra derivación de a (por b ← h). (Ep. IX)","x":"<div class=\"ctx-tit\">KB<\/div><pre>0.7  a ← b.\n0.6  b ← p, g.\n1    p.\n0.9  g.<\/pre>"},{"h":"3fad7f10","q":"Con la estrategia MYCIN de la cátedra, con esta derivación, ¿cuánto vale el CF de ~a?","o":["−0.4","0.28","−0.28","0"],"a":3,"e":"CF(k) = −0.5 es negativo, así que CF(d) = 0, y como CF(d) no es positivo, CF(~a) = 0. −0.28 sale de multiplicar todo sin aplicar esa regla. (Ep. IX)","x":"<div class=\"ctx-tit\">KB<\/div><pre>0.7  ~a ← d.\n 0.8  d ← k.\n−0.5  k.<\/pre>"},{"h":"acc34833","q":"Esta KB tiene la regla 0.9 a ← c, pero ninguna derivación de a la usa. ¿Por qué?","o":["Porque c no se puede derivar: no hay hechos ni reglas para c","Porque su CF es mayor que el de las otras reglas con cabeza a","Porque una regla solo se usa si tiene CF igual a 1","Porque c es el complemento de una conclusión ya derivada"],"a":0,"e":"Para usar la regla hay que derivar su cuerpo, y c no aparece como hecho ni como cabeza de ninguna regla. Por eso la consulta c tiene respuesta «desconocido». (Ep. IX)","x":"<div class=\"ctx-tit\">KB del ejemplo de la cátedra, con valores de certeza (Ep. IX)<\/div><pre>0.7  a ← b.\n 0.9  a ← c.\n 0.7 ~a ← d.\n 0.8 ~a ← e.\n 0.7 ~a ← p, f.\n 0.6  b ← p, g.\n 1    b ← h.\n 0.8  d ← k.\n 0.9  f ← m.\n 1    p.\n 0.4  e.\n 0.9  g.\n 0.9  h.\n-0.5  k.\n 0.8  m.<\/pre>"},{"h":"f663e08a","q":"Con esta KB, CF(a) = 0.63 y CF(~a) = 0.5. ¿Qué responde el SBC a la consulta ~a?","o":["indeciso","desconocido","no","sí"],"a":2,"e":"Hay derivaciones para ~a y para su complemento a, y CF(~a) < CF(a): la respuesta es no. A la consulta a respondería sí. (Ep. IX, «¿Qué respuesta dar?»)","x":"<div class=\"ctx-tit\">KB del ejemplo de la cátedra, con valores de certeza (Ep. IX)<\/div><pre>0.7  a ← b.\n 0.9  a ← c.\n 0.7 ~a ← d.\n 0.8 ~a ← e.\n 0.7 ~a ← p, f.\n 0.6  b ← p, g.\n 1    b ← h.\n 0.8  d ← k.\n 0.9  f ← m.\n 1    p.\n 0.4  e.\n 0.9  g.\n 0.9  h.\n-0.5  k.\n 0.8  m.<\/pre>"},{"h":"af181ba8","q":"En esta KB, m es un hecho con CF 0.8 y no hay reglas con cabeza ~m. ¿Qué responde el SBC a la consulta ~m?","o":["sí","desconocido","no","indeciso"],"a":2,"e":"No hay derivación para ~m, pero sí para su complemento m: la respuesta es no. «Desconocido» sería si tampoco se derivara m. (Ep. IX, «¿Qué respuesta dar?»)","x":"<div class=\"ctx-tit\">KB del ejemplo de la cátedra, con valores de certeza (Ep. IX)<\/div><pre>0.7  a ← b.\n 0.9  a ← c.\n 0.7 ~a ← d.\n 0.8 ~a ← e.\n 0.7 ~a ← p, f.\n 0.6  b ← p, g.\n 1    b ← h.\n 0.8  d ← k.\n 0.9  f ← m.\n 1    p.\n 0.4  e.\n 0.9  g.\n 0.9  h.\n-0.5  k.\n 0.8  m.<\/pre>"},{"h":"51f956ad","q":"Con valores de certeza, ¿cuándo la respuesta a una consulta Q es «indeciso»?","o":["Cuando hay derivaciones para los dos, cualesquiera sean sus CF","Cuando no hay derivación ni para Q ni para su complemento","Cuando hay derivaciones para Q y su complemento, con el mismo CF","Cuando los CF de Q y de su complemento son negativos"],"a":2,"e":"Indeciso: derivaciones para ambos y CF(Q) = CF(complemento). Si no hay derivación para ninguno, la respuesta es «desconocido». (Ep. IX, «¿Qué respuesta dar?»)"},{"h":"4e2d380b","q":"Q tiene una única derivación, con CF 0.2, y su complemento no tiene ninguna. ¿Qué responde el SBC a la consulta Q?","o":["sí: el complemento no tiene derivación","indeciso, porque la certeza de Q es baja","no, porque 0.2 está más cerca de 0 que de 1","desconocido, porque el CF no alcanza 0.5"],"a":0,"e":"Sí: hay una derivación para Q y ninguna para el complemento. Los CF se comparan solo cuando hay derivaciones para los dos. (Ep. IX, «¿Qué respuesta dar?»)"},{"h":"53da5d95","q":"Con la estrategia MYCIN de la cátedra, con esta KB, ¿qué responde el SBC a la consulta a?","o":["no, porque CF(~a) = 0.5 supera a CF(a) = 0.45","indeciso, porque se derivan tanto a como ~a","sí, porque a tiene dos derivaciones y ~a una sola","sí, porque CF(a) = 0.87 al sumar sus dos derivaciones"],"a":0,"e":"a: máx(0.9 · mín(0.5, 1), 0.6 · 0.7) = máx(0.45, 0.42) = 0.45. ~a: 1 · 0.5 = 0.5. Gana ~a. Es el Ejemplo SBC de la cátedra (sin la regla ~a ← e, que da 0). (Ejemplo SBC)","x":"<div class=\"ctx-tit\">KB<\/div><pre>0.9  a ← b, c.\n0.6  a ← d.\n1    ~a ← b.\n0.5  b.\n1    c.\n0.7  d.<\/pre>"},{"h":"566fbaa6","q":"Con la estrategia MYCIN de la cátedra, con estas reglas y hechos, ¿cuánto vale el CF de ~a?","o":["−0.009","0.03","0.06","0"],"a":3,"e":"CF(f) = −0.3, así que CF(~d) = 0; mín(1, 0) = 0, así que CF(e) = 0 y CF(~a) = 0. 0.06 tomaría el mínimo como 1 (olvidando ~d). Es el Ejemplo SBC de la cátedra. (Ejemplo SBC)","x":"<div class=\"ctx-tit\">KB<\/div><pre>0.6  ~a ← e.\n 0.1  e ← c, ~d.\n 0.5  ~d ← f.\n 1    c.\n−0.3  f.<\/pre>"},{"h":"c63d70c8","q":"Con la estrategia MYCIN de la cátedra, con esta KB, ¿cuánto vale CF(cruza_lago(petete))?","o":["−0.189","0","0.315","0.45"],"a":2,"e":"Por h5: ave = 0.5, vuela = 0.35, cruza_lago = 0.315. Por gallina (−0.3): ave = 0 y cruza_lago = 0. El máximo es 0.315. 0.45 olvida la regla de vuela. (TP7, ej. 7)","x":"<div class=\"ctx-tit\">KB<\/div><pre>0.9  cruza_lago(X) ← vuela(X).\n 0.7  vuela(X) ← ave(X).\n 1    ave(X) ← gallina(X).\n−0.3  gallina(petete).\n 0.5  ave(petete).<\/pre>"},{"h":"53ca805d","q":"Con la estrategia MYCIN de la cátedra y esta KB, ¿quiénes (turuleca, petete, donald) cruzan el lago?","o":["turuleca y petete, pero no donald","Solo turuleca, que es la única gallina","Los tres: turuleca, petete y donald","Ninguno: el SBC queda indeciso con los tres"],"a":2,"e":"Para los tres CF(cruza_lago) > CF(~cruza_lago): 0.63 > 0.448 (turuleca), 0.315 > 0 (petete) y 0.63 > 0.504 (donald). (TP7, ej. 7)","x":"<div class=\"ctx-tit\">KB del TP7, ej. 7 (valores de certeza)<\/div><pre>h1   1    gallina(turuleca).\nh2  -0.3  gallina(petete).\nh3  -1    gallina(donald).\nh4   1    pato(donald).\nh5   0.5  ave(petete).\nr1   1    ave(X) ← pato(X).\nr2   1    ave(X) ← gallina(X).\nr3   0.8  anida_suelo(X) ← gallina(X).\nr4   0.9  anida_suelo(X) ← pato(X).\nr5   0.7  ~vuela(X) ← anida_suelo(X), ave(X).\nr6   0.8  ~cruza_lago(X) ← ~vuela(X), ave(X).\nr7   0.9  cruza_lago(X) ← vuela(X).\nr8   0.7  vuela(X) ← ave(X).<\/pre>"},{"h":"2dda4502","q":"Con la estrategia MYCIN de la cátedra, con esta KB, ¿cuánto vale CF(cruza_lago(turuleca))?","o":["0.9","0.448","0.63","0.7"],"a":2,"e":"Única derivación: gallina(turuleca) [1] → ave [1 · 1 = 1] → vuela [1 · 0.7 = 0.7] → cruza_lago [0.7 · 0.9 = 0.63]. 0.7 olvida la regla r7; 0.448 es CF(~cruza_lago(turuleca)). (TP7, ej. 7)","x":"<div class=\"ctx-tit\">KB del TP7, ej. 7 (valores de certeza)<\/div><pre>h1   1    gallina(turuleca).\nh2  -0.3  gallina(petete).\nh3  -1    gallina(donald).\nh4   1    pato(donald).\nh5   0.5  ave(petete).\nr1   1    ave(X) ← pato(X).\nr2   1    ave(X) ← gallina(X).\nr3   0.8  anida_suelo(X) ← gallina(X).\nr4   0.9  anida_suelo(X) ← pato(X).\nr5   0.7  ~vuela(X) ← anida_suelo(X), ave(X).\nr6   0.8  ~cruza_lago(X) ← ~vuela(X), ave(X).\nr7   0.9  cruza_lago(X) ← vuela(X).\nr8   0.7  vuela(X) ← ave(X).<\/pre>"},{"h":"fd5ca763","q":"Con la estrategia MYCIN de la cátedra, con esta KB, ¿cuánto vale CF(~vuela(turuleca))?","o":["0.392","0.8","0.7","0.56"],"a":3,"e":"anida_suelo(turuleca) = 1 · 0.8 = 0.8 y ave(turuleca) = 1; ~vuela = 0.7 · mín(0.8, 1) = 0.56. 0.8 olvida la regla r5; 0.392 multiplica por 0.7 dos veces. (TP7, ej. 7)","x":"<div class=\"ctx-tit\">KB del TP7, ej. 7 (valores de certeza)<\/div><pre>h1   1    gallina(turuleca).\nh2  -0.3  gallina(petete).\nh3  -1    gallina(donald).\nh4   1    pato(donald).\nh5   0.5  ave(petete).\nr1   1    ave(X) ← pato(X).\nr2   1    ave(X) ← gallina(X).\nr3   0.8  anida_suelo(X) ← gallina(X).\nr4   0.9  anida_suelo(X) ← pato(X).\nr5   0.7  ~vuela(X) ← anida_suelo(X), ave(X).\nr6   0.8  ~cruza_lago(X) ← ~vuela(X), ave(X).\nr7   0.9  cruza_lago(X) ← vuela(X).\nr8   0.7  vuela(X) ← ave(X).<\/pre>"},{"h":"a543f17a","q":"Con la estrategia MYCIN de la cátedra, con esta KB, ¿cuánto vale CF(~cruza_lago(turuleca))?","o":["0.392","0.56","0.448","0.504"],"a":2,"e":"~cruza_lago = 0.8 · mín(CF(~vuela), CF(ave)) = 0.8 · mín(0.56, 1) = 0.448. Como 0.63 > 0.448, turuleca cruza el lago. 0.504 es el valor de donald. (TP7, ej. 7)","x":"<div class=\"ctx-tit\">KB del TP7, ej. 7 (valores de certeza)<\/div><pre>h1   1    gallina(turuleca).\nh2  -0.3  gallina(petete).\nh3  -1    gallina(donald).\nh4   1    pato(donald).\nh5   0.5  ave(petete).\nr1   1    ave(X) ← pato(X).\nr2   1    ave(X) ← gallina(X).\nr3   0.8  anida_suelo(X) ← gallina(X).\nr4   0.9  anida_suelo(X) ← pato(X).\nr5   0.7  ~vuela(X) ← anida_suelo(X), ave(X).\nr6   0.8  ~cruza_lago(X) ← ~vuela(X), ave(X).\nr7   0.9  cruza_lago(X) ← vuela(X).\nr8   0.7  vuela(X) ← ave(X).<\/pre>"},{"h":"0fe21398","q":"Con la estrategia MYCIN de la cátedra, con esta KB, ¿cuánto vale CF(ave(donald))?","o":["0.5","1","0","−1"],"a":1,"e":"Dos derivaciones: por pato(donald) [1] da 1; por gallina(donald) [−1], como el cuerpo es negativo, da 0. Se toma el máximo: 1. (TP7, ej. 7)","x":"<div class=\"ctx-tit\">KB del TP7, ej. 7 (valores de certeza)<\/div><pre>h1   1    gallina(turuleca).\nh2  -0.3  gallina(petete).\nh3  -1    gallina(donald).\nh4   1    pato(donald).\nh5   0.5  ave(petete).\nr1   1    ave(X) ← pato(X).\nr2   1    ave(X) ← gallina(X).\nr3   0.8  anida_suelo(X) ← gallina(X).\nr4   0.9  anida_suelo(X) ← pato(X).\nr5   0.7  ~vuela(X) ← anida_suelo(X), ave(X).\nr6   0.8  ~cruza_lago(X) ← ~vuela(X), ave(X).\nr7   0.9  cruza_lago(X) ← vuela(X).\nr8   0.7  vuela(X) ← ave(X).<\/pre>"},{"h":"97469b29","q":"Con la estrategia MYCIN de la cátedra, con esta KB, ¿cuánto vale CF(~cruza_lago(donald))?","o":["0.504","0","0.448","0.63"],"a":0,"e":"Por pato: anida_suelo = 0.9, ~vuela = 0.7 · mín(0.9, 1) = 0.63, ~cruza_lago = 0.8 · 0.63 = 0.504. Por gallina (CF −1) todo da 0. El máximo es 0.504 < 0.63 = CF(cruza_lago(donald)): donald cruza. (TP7, ej. 7)","x":"<div class=\"ctx-tit\">KB del TP7, ej. 7 (valores de certeza)<\/div><pre>h1   1    gallina(turuleca).\nh2  -0.3  gallina(petete).\nh3  -1    gallina(donald).\nh4   1    pato(donald).\nh5   0.5  ave(petete).\nr1   1    ave(X) ← pato(X).\nr2   1    ave(X) ← gallina(X).\nr3   0.8  anida_suelo(X) ← gallina(X).\nr4   0.9  anida_suelo(X) ← pato(X).\nr5   0.7  ~vuela(X) ← anida_suelo(X), ave(X).\nr6   0.8  ~cruza_lago(X) ← ~vuela(X), ave(X).\nr7   0.9  cruza_lago(X) ← vuela(X).\nr8   0.7  vuela(X) ← ave(X).<\/pre>"},{"h":"4e37b57b","q":"Con la estrategia MYCIN de la cátedra, con esta KB, ¿cuánto vale CF(~cruza_lago(petete))?","o":["0","0.28","−0.168","0.168"],"a":0,"e":"anida_suelo(petete) solo sale de gallina(petete), que vale −0.3: da 0. Entonces ~vuela(petete) = 0 y ~cruza_lago(petete) = 0. −0.168 sale de multiplicar sin aplicar la regla de los cuerpos negativos. (TP7, ej. 7)","x":"<div class=\"ctx-tit\">KB del TP7, ej. 7 (valores de certeza)<\/div><pre>h1   1    gallina(turuleca).\nh2  -0.3  gallina(petete).\nh3  -1    gallina(donald).\nh4   1    pato(donald).\nh5   0.5  ave(petete).\nr1   1    ave(X) ← pato(X).\nr2   1    ave(X) ← gallina(X).\nr3   0.8  anida_suelo(X) ← gallina(X).\nr4   0.9  anida_suelo(X) ← pato(X).\nr5   0.7  ~vuela(X) ← anida_suelo(X), ave(X).\nr6   0.8  ~cruza_lago(X) ← ~vuela(X), ave(X).\nr7   0.9  cruza_lago(X) ← vuela(X).\nr8   0.7  vuela(X) ← ave(X).<\/pre>"},{"h":"a387aa43","q":"En esta KB, ¿cuántas derivaciones distintas tiene el literal a?","o":["3","2","4","5"],"a":3,"e":"a ← b, c: 2 (b es hecho, o sale de b ← c). a ← d: 1. a ← ~b: 2 (~b ← d y ~b ← c). Total: 5. (TP7, ej. 9)","x":"<div class=\"ctx-tit\">KB (sin valores de certeza ni informantes)<\/div><pre>a ← b, c.\na ← d.\na ← ~b.\n~a ← c.\n~a ← b, d.\n~a ← e.\nb ← c.\n~b ← d.\n~b ← c.\nb.\nc.\nd.<\/pre>"},{"h":"35117fb1","q":"En esta KB, ¿cuántas derivaciones distintas tiene el literal ~a?","o":["4","1","3","2"],"a":2,"e":"~a ← c: 1. ~a ← b, d: 2 (b es hecho, o sale de b ← c). ~a ← e: ninguna, porque e no se deriva. Total: 3. (TP7, ej. 9)","x":"<div class=\"ctx-tit\">KB (sin valores de certeza ni informantes)<\/div><pre>a ← b, c.\na ← d.\na ← ~b.\n~a ← c.\n~a ← b, d.\n~a ← e.\nb ← c.\n~b ← d.\n~b ← c.\nb.\nc.\nd.<\/pre>"},{"h":"30785c56","q":"En esta KB, ¿por qué la regla ~a ← e no da ninguna derivación de ~a?","o":["Porque e no es un hecho ni la cabeza de ninguna regla","Porque las reglas con cabeza negada no se derivan","Porque ~a ya tiene otra derivación más corta con c","Porque e aparece con negación fuerte en otra regla"],"a":0,"e":"Para usar una regla hay que derivar su cuerpo, y e no aparece como hecho ni como cabeza de ninguna regla. (TP7, ej. 9)","x":"<div class=\"ctx-tit\">KB (sin valores de certeza ni informantes)<\/div><pre>a ← b, c.\na ← d.\na ← ~b.\n~a ← c.\n~a ← b, d.\n~a ← e.\nb ← c.\n~b ← d.\n~b ← c.\nb.\nc.\nd.<\/pre>"},{"h":"cdebe3e5","q":"En esta KB, ¿cuántas derivaciones tienen b y ~b?","o":["Dos cada uno: b es hecho y sale de b ← c; ~b sale de ~b ← d y de ~b ← c","b tiene dos y ~b ninguna, porque b es un hecho y eso bloquea a ~b","Tres cada uno, contando también las reglas que tienen a b en el cuerpo","Una cada uno: el hecho b, y la regla ~b ← d, que es la única aplicable"],"a":0,"e":"b: el hecho b, y b ← c (c es hecho). ~b: ~b ← d y ~b ← c (d y c son hechos). Las reglas con b en el cuerpo derivan otros literales, no a b. (TP7, ej. 9)","x":"<div class=\"ctx-tit\">KB (sin valores de certeza ni informantes)<\/div><pre>a ← b, c.\na ← d.\na ← ~b.\n~a ← c.\n~a ← b, d.\n~a ← e.\nb ← c.\n~b ← d.\n~b ← c.\nb.\nc.\nd.<\/pre>"},{"h":"93353bf4","q":"Con la estrategia MYCIN de la cátedra, ¿puede a ser preferido a ~a aunque alguna derivación de ~a tenga mayor CF que alguna derivación de a?","o":["Sí, pero solo si a tiene más derivaciones que ~a","No: todas las derivaciones de a deben superar a las de ~a","No: alcanza con una derivación mejor para preferir a ~a","Sí: se compara el máximo de cada literal, no cada derivación"],"a":3,"e":"Con varias derivaciones, el CF del literal es el máximo de sus derivaciones; se comparan esos máximos. Una derivación débil de a puede valer menos que una de ~a sin cambiar la preferencia. (TP7, ej. 9.a)"},{"h":"acc98dbf","q":"Con la estrategia MYCIN de la cátedra, ¿qué hace falta para que no se pueda preferir b sobre ~b ni ~b sobre b?","o":["Que ninguna regla para b ni para ~b tenga CF 1","Que b y ~b tengan la misma cantidad de derivaciones","Que todas las derivaciones de b y de ~b tengan el mismo CF","Que la mejor derivación de b y la mejor de ~b tengan el mismo CF"],"a":3,"e":"Se comparan los CF de los dos literales (el máximo de sus derivaciones): si son iguales, la respuesta es «indeciso». No hace falta que coincidan todas las derivaciones. (TP7, ej. 9.a)"},{"h":"96a24a11","q":"¿Cuál es la principal ventaja de usar información numérica en un SBC, según la cátedra?","o":["No hace falta decidir qué valor se asocia a cada regla de la base","Los valores surgen de forma objetiva a partir de los datos del dominio","Las computadoras calculan con facilidad y hay mucho sustento matemático","Permiten comparar solo algunos pares de elementos, con un orden parcial"],"a":2,"e":"La facilidad de las computadoras para el cómputo y el sustento matemático ya estudiado. Decidir los valores es, justamente, la desventaja. (Ep. IX, «Uso de valores de certeza en un SBC»)"},{"h":"05cf6021","q":"¿Cuál es la principal desventaja de usar valores de certeza numéricos en un SBC, según la cátedra?","o":["Que solo funcionan cuando la base de conocimiento es consistente","Que no permiten comparar dos conclusiones que se contradicen","Decidir qué valor asociar a cada sentencia y en qué se fundamenta","Que las computadoras no manejan con precisión los números reales"],"a":2,"e":"¿De dónde surge el valor? ¿Quién lo decide? ¿Cómo elegir entre 0.7 y 0.71? (Ep. IX, «Uso de valores de certeza en un SBC»)"},{"h":"4af6ca4c","q":"¿Qué problema ilustra la cátedra al comparar CF(a) = 0.21114 con CF(~a) = 0.21119?","o":["Que el redondeo de la computadora puede invertir el resultado","Que no está claro si una diferencia tan chica es significativa","Que dos CF casi iguales obligan a responder «desconocido»","Que con valores cercanos a 0 hay que usar el mínimo y no el máximo"],"a":1,"e":"Es una de las preguntas abiertas del enfoque numérico: ¿una diferencia así se considera significativa? (Ep. IX, «Uso de valores de certeza en un SBC»)"},{"h":"c7f7a9b1","q":"Comparados con los informantes, los enfoques con información numérica…","o":["Permiten tanto un orden total como uno parcial","Imponen un orden total entre los elementos de la base","No permiten comparar dos derivaciones distintas","Solo pueden comparar elementos del mismo experto"],"a":1,"e":"Con números, cualquier par de elementos es comparable (orden total). Los enfoques cualitativos, como el de informantes, admiten también un orden parcial. (Ep. IX, informantes, «Resolución del conflicto basado en informantes»)"},{"h":"2fd65f0f","q":"Según la cátedra, la forma de propagar los CF basada en MYCIN…","o":["Es la única correcta, porque está demostrada matemáticamente","Es obligatoria en cualquier SBC que use negación fuerte","Es la que usa por defecto el intérprete de Prolog estándar","Es una forma simple entre muchas; se puede usar otra según el dominio"],"a":3,"e":"Hay muchas maneras de computar el CF de una conclusión; la de la cátedra es muy simple y sirve para mostrar la idea. Al implementar un sistema se puede elegir otra. (Ep. IX, «Computando el valor de certeza de las conclusiones»)"}]},{"id":"u5","nombre":"Informantes","tp":"TP7","qs":[{"h":"97c43f66","q":"En el enfoque cualitativo de la cátedra, ¿qué se asocia a cada elemento de la base de conocimiento?","o":["La probabilidad de que el elemento sea verdadero","La cantidad de veces que fue usado","Una etiqueta con su informante o fuente","Un número real entre −1 y 1"],"a":2,"e":"Cada regla o hecho se etiqueta con su informante (e1, e2, w1…), un elemento de un conjunto discreto. El número en [−1, 1] es el CF del enfoque cuantitativo. (Ep. IX, informantes, «Conocimiento etiquetado con su fuente de información»)"},{"h":"fdd62d11","q":"Según la cátedra, ¿en qué situación es muy común que un agente reciba información de varios informantes?","o":["En un entorno sin percepciones","En un entorno estático","En un entorno determinista","En un entorno multi-agente"],"a":3,"e":"En un entorno multi-agente el agente recibe información de otros agentes; por ejemplo, Mer-val podría recibirla de los expertos e1, e2 y e3 y de los sitios web w1 y w2. (Ep. IX, informantes, «Múltiples informantes con diferente credibilidad»)"},{"h":"72ca1c63","q":"Con la estrategia del «eslabón más débil», ¿qué confianza se le asocia a la conclusión de una derivación?","o":["La del informante menos creíble de los elementos usados","La del informante más creíble de los elementos usados","La del informante que más veces aparece en la derivación","La del informante de la regla cuya cabeza es la conclusión"],"a":0,"e":"Es una estrategia cauta: la conclusión queda tan respaldada como su elemento menos creíble. (Ep. IX, informantes, «Resolución del conflicto con información simbólica»)"},{"h":"e17007e6","q":"¿Por qué se usa el informante más débil (el mínimo) como confianza de una derivación?","o":["Porque así se prefiere la conclusión que tiene más derivaciones","Porque es la única forma de obtener un orden total de conclusiones","Porque el informante menos creíble suele ser el más actualizado","Porque la derivación necesita a todos sus elementos para existir"],"a":3,"e":"La derivación es una conjunción: si falla cualquiera de sus elementos, la derivación no existe. (Ep. IX, informantes, «Resolución del conflicto basado en informantes»)"},{"h":"c0223d32","q":"Si una conclusión tiene varias derivaciones, ¿por qué es razonable usar la de máxima credibilidad?","o":["Porque cada una es una razón alternativa: alcanza con cualquiera","Porque así se compensa haber tomado el mínimo dentro de cada derivación","Porque la más creíble es siempre la derivación que usa menos reglas","Porque las derivaciones menos creíbles se eliminan de la base"],"a":0,"e":"La existencia de la conclusión depende de cualquiera de sus derivaciones (una disyunción), así que se toma la mejor. (Ep. IX, informantes, «Resolución del conflicto basado en informantes»)"},{"h":"28989cf6","q":"Con el orden e3 > e1 > e2 > w2 > w1, ¿qué confianza le da esta derivación a comprar_acciones(acme)?","o":["w1","w2","e1","e2"],"a":0,"e":"mínimo({e1, e2, w1}) = w1, el menos creíble. e1 sería tomar el informante de la regla de la conclusión. (Ep. IX, informantes)","x":"<div class=\"ctx-tit\">Derivación<\/div><pre>[e1]  comprar_acciones(acme) ← buen_precio(acme).\n[e2]  buen_precio(acme) ← buen_precio_web(acme).\n[w1]  buen_precio_web(acme).<\/pre>"},{"h":"781a2fdb","q":"Con el orden e3 > e1 > e2 > w2 > w1, confianza(comprar_acciones(acme)) = w1 y confianza(~comprar_acciones(acme)) = w2. ¿Qué conclusión prefiere la máquina de inferencia?","o":["~comprar_acciones(acme), porque usa a e3, el mejor","comprar_acciones(acme), porque su regla es de e1","~comprar_acciones(acme), porque w2 > w1","Ninguna, porque las dos usan informantes web"],"a":2,"e":"Se comparan las confianzas de las dos conclusiones: w2 es más creíble que w1. Que una derivación use a e3 no importa: cuenta su eslabón más débil. (Ep. IX, informantes)"},{"h":"4a1fb6fc","q":"Con el orden e3 > e1 > e2 > w3 > w2 > w1, ¿qué confianza tiene la derivación de a que usa b ← p, g?","o":["e1","w3","w1","e2"],"a":2,"e":"Usa [e1] a ← b, [e2] b ← p, g, [w3] p y [w1] g: mínimo({e1, e2, w3, w1}) = w1. (Ep. IX, informantes)","x":"<div class=\"ctx-tit\">KB del ejemplo de la cátedra, con informantes (Ep. IX)<\/div><pre>[e1]  a ← b.        [e2]  b ← p, g.\n[e3]  a ← c.        [e1]  b ← h.\n[e2] ~a ← d.        [e2]  d ← k.\n[e1] ~a ← e.        [e3]  f ← m.\n[e1] ~a ← p, f.     [w3]  p.\n                    [w1]  e.\n                    [w1]  g.\n                    [w3]  h.\n                    [w2]  k.\n                    [w2]  m.<\/pre>"},{"h":"ccdbc032","q":"Con el orden e3 > e1 > e2 > w3 > w2 > w1, a tiene dos derivaciones, con confianzas w1 y w3. ¿Qué confianza tiene a?","o":["w1","e1","w3","{w1, w3}"],"a":2,"e":"Con varias derivaciones se usa la de máxima credibilidad: w3 > w1. Tomar un conjunto de informantes es lo que se hace con un orden parcial, no acá. (Ep. IX, informantes)"},{"h":"325c0e22","q":"Con el orden e3 > e1 > e2 > w3 > w2 > w1, confianza(a) = w3 y las tres derivaciones de ~a valen w2, w1 y w2. ¿Qué responde el SBC a la consulta ~a?","o":["indeciso","desconocido","sí","no"],"a":3,"e":"confianza(~a) = máx(w2, w1, w2) = w2, y w3 > w2: se prefiere a, así que la respuesta a ~a es no. (Ep. IX, informantes)"},{"h":"62b4520e","q":"El agente descubre que w3 es su fuente menos creíble y cambia el orden a e3 > e1 > e2 > w2 > w1 > w3. ¿Qué conclusión se prefiere ahora?","o":["~a: su mejor derivación vale w2, y las de a valen w3","a: sigue valiendo w3, el máximo de sus derivaciones","Ninguna: primero hay que reetiquetar la base","a: cambiar el orden no cambia las derivaciones"],"a":0,"e":"Las dos derivaciones de a usan w3 (p o h), que ahora es el mínimo: las dos valen w3. Las de ~a valen w2, w1 y w2. Como w2 > w3, se prefiere ~a. (Ep. IX, informantes, «El orden de credibilidad puede cambiar dinámicamente»)","x":"<div class=\"ctx-tit\">KB del ejemplo de la cátedra, con informantes (Ep. IX)<\/div><pre>[e1]  a ← b.        [e2]  b ← p, g.\n[e3]  a ← c.        [e1]  b ← h.\n[e2] ~a ← d.        [e2]  d ← k.\n[e1] ~a ← e.        [e3]  f ← m.\n[e1] ~a ← p, f.     [w3]  p.\n                    [w1]  e.\n                    [w1]  g.\n                    [w3]  h.\n                    [w2]  k.\n                    [w2]  m.<\/pre>"},{"h":"2267199d","q":"Con esta KB y el orden e3 > e1 > e2 > w3 > w2 > w1 se prefiere a; si el agente pasa w3 al final (e3 > e1 > e2 > w2 > w1 > w3), se prefiere ~a. ¿Qué característica del enfoque de informantes muestra esto?","o":["Se puede cambiar el orden sin reasignar las etiquetas de la base","Una conclusión ya elegida no cambia aunque cambie el orden","El orden se recalcula solo a partir de las derivaciones","Se pueden agregar reglas sin modificar la máquina de inferencia"],"a":0,"e":"Si el agente descubre un cambio en la credibilidad de sus fuentes, cambia el orden y deja la KB como estaba; con eso puede preferirse otra conclusión. (Ep. IX, informantes, «El orden de credibilidad puede cambiar dinámicamente»)","x":"<div class=\"ctx-tit\">KB del ejemplo de la cátedra, con informantes (Ep. IX)<\/div><pre>[e1]  a ← b.        [e2]  b ← p, g.\n[e3]  a ← c.        [e1]  b ← h.\n[e2] ~a ← d.        [e2]  d ← k.\n[e1] ~a ← e.        [e3]  f ← m.\n[e1] ~a ← p, f.     [w3]  p.\n                    [w1]  e.\n                    [w1]  g.\n                    [w3]  h.\n                    [w2]  k.\n                    [w2]  m.<\/pre>"},{"h":"b38ed2b0","q":"¿Qué tipo de orden entre informantes admite el enfoque cualitativo?","o":["Ninguno: se cuentan los informantes","Solo parcial, sin comparaciones","Total o parcial","Solo total, como con los CF"],"a":2,"e":"Los enfoques numéricos imponen un orden total; el de informantes puede usar un orden total o uno parcial (con informantes incomparables). (Ep. IX, informantes, «Resolución del conflicto basado en informantes»)"},{"h":"9b1e7d23","q":"Si el orden de credibilidad es parcial, ¿cómo puede definirse la confianza de un literal derivado?","o":["Como el conjunto de todos los informantes involucrados","Como el informante menos creíble de la derivación","Como el informante de la última regla aplicada","Como la cantidad de informantes distintos que usa"],"a":0,"e":"Con un orden parcial puede no haber un único mínimo; por eso la confianza se define como el conjunto de informantes, y después se comparan conjuntos. (Ep. IX, informantes)"},{"h":"33598ad1","q":"Con este orden parcial, ¿por qué S1 >> S2?","o":["Porque e2 está en los dos conjuntos y es el más creíble de todo el orden","w1, que no está en el segundo, supera a w2, y w2 no supera a nadie del primero","Porque w3 está en el primero y es el más creíble de los informantes web","Porque el primer conjunto tiene más informantes que el segundo, así que pesa más"],"a":1,"e":"Condición 1: hay a1 en S1 y no en S2 (w1) y a2 en S2 y no en S1 (w2) con a1 > a2. Condición 2: ningún elemento exclusivo de S2 supera a uno exclusivo de S1. Los elementos comunes (e2) no cuentan. (Ep. IX, informantes, «Preferencia entre conjuntos de informantes»)","x":"<div class=\"ctx-tit\">Orden parcial y conjuntos<\/div><pre>Orden2:\n  e2 &gt; e3\n  e2 &gt; e1\n  e2 &gt; w2\n  w3 &gt; w1\n  w1 &gt; w2\n\nS1 = {e1, e2, w1, w3}\nS2 = {e2, w2}<\/pre>"},{"h":"88bb9d1a","q":"Según la cátedra, ¿cuál es una ventaja de usar informantes en lugar de valores numéricos?","o":["No hace falta establecer ningún orden de credibilidad entre fuentes","Siempre se obtiene un orden total entre todas las conclusiones posibles","Asignar etiquetas es más simple y fácil de justificar que asignar números","La propagación de la confianza está muy estudiada y es simple de calcular"],"a":2,"e":"La asignación de etiquetas de un conjunto discreto es más simple y justificable; además el orden puede ser parcial. La propagación, en cambio, es su punto débil. (Ep. IX, informantes, «Uso de confianza cualitativa en un SBC»)"},{"h":"9243b392","q":"Según la cátedra, ¿cuál es una de las principales desventajas del enfoque de informantes?","o":["No permite que existan informantes incomparables entre sí","La propagación de la confianza no es simple y sigue siendo un tema abierto","Cuesta mucho justificar qué etiqueta se le asigna a cada elemento de la KB","Obliga a mantener la base de conocimiento libre de contradicciones"],"a":1,"e":"Al no ser numérico, el cómputo para propagar la confianza no es tan simple ni está tan estudiado. Justificar las etiquetas es, al revés, una ventaja. (Ep. IX, informantes, «Uso de confianza cualitativa en un SBC»)"},{"h":"f1ead49a","q":"Dado un conjunto de informantes I y un orden total C, ¿cómo define la cátedra min(I)?","o":["El informante que etiqueta menos reglas en la KB","El a de I tal que no hay ningún b en I con a > b en C","El a de I tal que no hay ningún b en I con b > a en C","El informante que aparece primero en la derivación"],"a":1,"e":"min(I) es el elemento de I que no es más creíble que ningún otro de I. La primera incorrecta define el máximo. (Ep. IX, informantes, «Resolución del conflicto con información simbólica»)"},{"h":"2126620f","q":"Con el orden At < Av < Ai < Ar < Ap, las derivaciones de a y de ~a usan estos informantes. ¿Qué elige el SBC?","o":["a: tiene dos derivaciones y la mejor vale Ai","~a: su mejor derivación vale Ar, y la mejor de a, Av","Indeciso: a y ~a tienen una derivación de Av","~a: su mejor derivación vale Ap, el más creíble"],"a":1,"e":"Mínimos: a → At y Av (máximo Av); ~a → Ar y Av (máximo Ar). Como Ar > Av, gana ~a. Ap no cuenta porque la derivación vale su eslabón más débil. (Ejemplo SBC)","x":"<div class=\"ctx-tit\">Informantes de cada derivación<\/div><pre>a:   {At, Ap, Ap}\na:   {Av, Ai}\n~a:  {Ar, Ap}\n~a:  {Av, Ai, Ar, Ap, Ar}<\/pre>"},{"h":"3264dbc3","q":"Con el orden Av < Ar < Ap < At < Ai < Ac y el eslabón más débil, ¿qué decide el agente sobre viajar?","o":["Viaja: viaje tiene cuatro derivaciones y ~viaje una","No viaja: ~viaje usa nieve, que es de Ai","Viaja: camino_abierto vale Ai y su complemento At","Queda indeciso: viaje y ~viaje valen Av"],"a":3,"e":"Todas las derivaciones de viaje usan r3 y la de ~viaje usa r2, las dos de Av, el menos creíble: todas valen Av. La cantidad de derivaciones no importa. (TP7, ej. 8.a)","x":"<div class=\"ctx-tit\">KB del TP7, ej. 8 (informantes)<\/div><pre>[At] ~camino_abierto ← nieve.\n[Av] ~viaje ← ~camino_abierto.\n[Av] viaje ← camino_abierto.\n[Ar] camino_abierto.\n[Ap] camino_abierto.\n[Ai] camino_abierto ← ~nieve.\n[Ai] ~nieve.\n[Ap] ~nieve.\n[Ai] nieve.<\/pre>"},{"h":"89182b0c","q":"Con esta KB y el eslabón más débil, ¿con cuál de estos órdenes el agente decide viajar?","o":["Ar < Av < Ap < At < Ai < Ac","Av < Ar < Ap < Ai < At < Ac","At < Av < Ar < Ap < Ai < Ac","Av < At < Ar < Ap < Ai < Ac"],"a":2,"e":"Con At al final, ~viaje vale At (usa r1) y viaje sigue valiendo Av: Av > At. En los otros órdenes Av es el mínimo de ~viaje y también es el máximo que alcanza viaje, así que quedan empatados. (TP7, ej. 8.b)","x":"<div class=\"ctx-tit\">KB del TP7, ej. 8 (informantes)<\/div><pre>[At] ~camino_abierto ← nieve.\n[Av] ~viaje ← ~camino_abierto.\n[Av] viaje ← camino_abierto.\n[Ar] camino_abierto.\n[Ap] camino_abierto.\n[Ai] camino_abierto ← ~nieve.\n[Ai] ~nieve.\n[Ap] ~nieve.\n[Ai] nieve.<\/pre>"},{"h":"57bda312","q":"Con esta KB y el eslabón más débil, ¿existe algún orden total entre los informantes con el que el agente decida NO viajar?","o":["Sí: alguno de los órdenes en que At es el informante más creíble de todos","No: una derivación de viaje usa un subconjunto de los informantes de ~viaje","Sí: alguno de los órdenes en que Ai es el informante menos creíble de todos","Sí: alguno de los órdenes en que Av es el informante más creíble de todos"],"a":1,"e":"~viaje usa {Av, At, Ai} y la derivación viaje ← camino_abierto ← ~nieve usa {Av, Ai}. El mínimo de un subconjunto nunca es menor que el del conjunto: lo mejor que logra ~viaje es empatar. (TP7, ej. 8)","x":"<div class=\"ctx-tit\">KB del TP7, ej. 8 (informantes)<\/div><pre>[At] ~camino_abierto ← nieve.\n[Av] ~viaje ← ~camino_abierto.\n[Av] viaje ← camino_abierto.\n[Ar] camino_abierto.\n[Ap] camino_abierto.\n[Ai] camino_abierto ← ~nieve.\n[Ai] ~nieve.\n[Ap] ~nieve.\n[Ai] nieve.<\/pre>"},{"h":"ccb27cad","q":"Con informantes y el eslabón más débil, ¿qué hace falta para que no se pueda preferir b sobre ~b ni ~b sobre b?","o":["Que la mejor derivación de b y la mejor de ~b valgan el mismo informante","Que todas las derivaciones de b y de ~b usen exactamente los mismos informantes","Que ningún hecho venga del informante más creíble del orden","Que b y ~b tengan la misma cantidad de derivaciones en la base"],"a":0,"e":"Cada derivación vale su informante menos creíble y cada literal vale la mejor de sus derivaciones; si los dos valores coinciden, no se puede preferir ninguno. (TP7, ej. 9.c)"},{"h":"32b7db1b","q":"Con informantes y el eslabón más débil, ¿puede ser preferido a sobre ~a aunque alguna derivación de ~a valga más que alguna de a?","o":["No: alcanza una derivación mejor para preferir ~a","No: todas las derivaciones de a deben valer más","Sí: se compara la mejor derivación de cada literal","Sí, pero solo si el orden entre informantes es parcial"],"a":2,"e":"La confianza de un literal es la de su derivación más creíble (el máximo); una derivación débil de a no cambia la preferencia si su mejor derivación supera a la mejor de ~a. (TP7, ej. 9.c)"}]},{"id":"u6","nombre":"Razonamiento basado en argumentos","tp":"TP7","qs":[{"h":"cc3dd3aa","q":"Ante una consulta c, ¿qué caracteriza al camino «orientado por la consulta»?","o":["Evaluar por demanda solo el conocimiento relacionado con c","Calcular todas las conclusiones posibles y después ver si c quedó aceptada","Responder con la primera derivación que se encuentra, sin mirar conflictos","Usar solo los hechos, sin aplicar ninguna de las reglas de la base"],"a":0,"e":"Hay dos caminos: el exhaustivo (calcular todas las conclusiones desde los hechos, analizar conflictos y ver si c quedó aceptada) y el orientado por la consulta, que es el que se siguió en clase. (Ep. X, parte 1, «Conclusiones aceptadas o rechazadas»)"},{"h":"f00f09a9","q":"En estas derivaciones, d1 concluye comprar_acciones(acme) y d2 concluye ~comprar_acciones(acme). ¿Por qué están en conflicto?","o":["Porque sustentan conclusiones complementarias: c(a) y ~c(a)","Porque las dos usan el hecho buen_precio_web(acme)","Porque d1 tiene menos reglas que d2 y la contradice","Porque d2 ataca el punto intermedio buen_precio(acme)"],"a":0,"e":"d2 sustenta ~c(a), el complemento de la conclusión de d1. Cada derivación es una razón en contra de la otra. Los ataques a puntos intermedios aparecen después, con d3. (Ep. X, parte 1, «Conclusiones en conflicto»)","x":"<div class=\"ctx-tit\">KB de Mer-val usada en el Ep. X (c = comprar_acciones, r = riesgosa, a = acme)<\/div><pre>comprar_acciones(X) :- buen_precio(X).\nbuen_precio(X) :- buen_precio_web(X).\n~comprar_acciones(X) :- riesgosa(X).\nriesgosa(X) :- en_fusion(X,Y).\nen_fusion(X,Y) :- listado_fusiones_web(X,Y).\nriesgosa(X) :- rumores_deuda_web(X).\n~riesgosa(X) :- en_fusion(X,Y), fuerte(Y).\n~riesgosa(X) :- fuerte(X).\nfuerte(X) :- listado_fuertes_web(X).\nbuen_precio_web(acme).\nlistado_fusiones_web(acme, strong).\nrumores_deuda_web(acme).\nlistado_fuertes_web(strong).<\/pre><div class=\"ctx-tit\">Derivaciones del ejemplo de acme (Ep. X, parte 1; s = strong)<\/div><div class=\"ctx-scroll\"><svg class=\"ctx-svg ctx-ancho\" viewBox=\"0 0 700 220\" role=\"img\" aria-label=\"d1 concluye c(a); d2 concluye ~c(a) pasando por r(a); d3 concluye ~r(a); d4 concluye r(a)\"><polygon points=\"95,34 43,128 147,128\" class=\"tri\"/><text x=\"95\" y=\"24\" class=\"tn\">c(a)<\/text><text x=\"95\" y=\"148\" class=\"tn\">d1<\/text><text x=\"95\" y=\"170\" class=\"et2\">c(a) ← buen_precio(a)<\/text><text x=\"95\" y=\"185\" class=\"et2\">buen_precio(a) ← web<\/text><polygon points=\"265,34 213,128 317,128\" class=\"tri\"/><text x=\"265\" y=\"24\" class=\"tn\">~c(a)<\/text><polygon points=\"265,74 243,114 287,114\" class=\"tri2\"/><text x=\"265\" y=\"70\" class=\"et2\">r(a)<\/text><text x=\"265\" y=\"148\" class=\"tn\">d2<\/text><text x=\"265\" y=\"170\" class=\"et2\">~c(a) ← r(a)<\/text><text x=\"265\" y=\"185\" class=\"et2\">r(a) ← en_fusion(a,s)<\/text><text x=\"265\" y=\"200\" class=\"et2\">en_fusion ← web<\/text><polygon points=\"435,34 383,128 487,128\" class=\"tri\"/><text x=\"435\" y=\"24\" class=\"tn\">~r(a)<\/text><text x=\"435\" y=\"148\" class=\"tn\">d3<\/text><text x=\"435\" y=\"170\" class=\"et2\">~r(a) ← en_fusion(a,s),<\/text><text x=\"435\" y=\"185\" class=\"et2\">fuerte(s)<\/text><text x=\"435\" y=\"200\" class=\"et2\">en_fusion, fuerte ← web<\/text><polygon points=\"605,34 553,128 657,128\" class=\"tri\"/><text x=\"605\" y=\"24\" class=\"tn\">r(a)<\/text><text x=\"605\" y=\"148\" class=\"tn\">d4<\/text><text x=\"605\" y=\"170\" class=\"et2\">r(a) ← rumores_deuda<\/text><text x=\"605\" y=\"185\" class=\"et2\">_web(a)<\/text><\/svg><\/div>"},{"h":"115048ce","q":"Para dar una respuesta coherente y consistente a una consulta, ¿qué razones hay que tener en cuenta?","o":["Solo las razones en contra, para no concluir de más","Solo la primera razón a favor que encuentra la inferencia","Todas, tanto las que están a favor como las que están en contra","Solo las razones que no tienen ningún conflicto con otras"],"a":2,"e":"Deben tenerse en cuenta todas las razones o argumentos, a favor y en contra, incluidas las que están en conflicto con puntos internos de una derivación. (Ep. X, parte 1, «Conclusiones en conflicto»)"},{"h":"5b84ae70","q":"d2 concluye ~comprar_acciones(acme) pasando por riesgosa(acme), y d3 concluye ~riesgosa(acme). ¿Qué relación hay entre d3 y d2?","o":["d3 refuerza a d2, porque las dos se refieren al riesgo de acme","Ninguna: sus conclusiones finales son distintas y no chocan","d3 ataca a d2 en un punto intermedio y así defiende la compra","d3 ataca directamente a la derivación de comprar_acciones(acme)"],"a":2,"e":"d3 está en conflicto con la conclusión intermedia r(a) de d2, así que la ataca; al atacar a d2, defiende indirectamente a d1 y a c(a). (Ep. X, parte 1, «Conflicto en puntos internos a una derivación»)","x":"<div class=\"ctx-tit\">KB de Mer-val usada en el Ep. X (c = comprar_acciones, r = riesgosa, a = acme)<\/div><pre>comprar_acciones(X) :- buen_precio(X).\nbuen_precio(X) :- buen_precio_web(X).\n~comprar_acciones(X) :- riesgosa(X).\nriesgosa(X) :- en_fusion(X,Y).\nen_fusion(X,Y) :- listado_fusiones_web(X,Y).\nriesgosa(X) :- rumores_deuda_web(X).\n~riesgosa(X) :- en_fusion(X,Y), fuerte(Y).\n~riesgosa(X) :- fuerte(X).\nfuerte(X) :- listado_fuertes_web(X).\nbuen_precio_web(acme).\nlistado_fusiones_web(acme, strong).\nrumores_deuda_web(acme).\nlistado_fuertes_web(strong).<\/pre><div class=\"ctx-tit\">Derivaciones del ejemplo de acme (Ep. X, parte 1; s = strong)<\/div><div class=\"ctx-scroll\"><svg class=\"ctx-svg ctx-ancho\" viewBox=\"0 0 700 220\" role=\"img\" aria-label=\"d1 concluye c(a); d2 concluye ~c(a) pasando por r(a); d3 concluye ~r(a); d4 concluye r(a)\"><polygon points=\"95,34 43,128 147,128\" class=\"tri\"/><text x=\"95\" y=\"24\" class=\"tn\">c(a)<\/text><text x=\"95\" y=\"148\" class=\"tn\">d1<\/text><text x=\"95\" y=\"170\" class=\"et2\">c(a) ← buen_precio(a)<\/text><text x=\"95\" y=\"185\" class=\"et2\">buen_precio(a) ← web<\/text><polygon points=\"265,34 213,128 317,128\" class=\"tri\"/><text x=\"265\" y=\"24\" class=\"tn\">~c(a)<\/text><polygon points=\"265,74 243,114 287,114\" class=\"tri2\"/><text x=\"265\" y=\"70\" class=\"et2\">r(a)<\/text e encontró la máquina de inferencia para la consulta","En el informante más creíble entre los que aportaron hechos sobre acme","En el valor de certeza más alto entre las reglas usadas en las derivaciones"],"a":0,"e":"La explicación detallada es el análisis de todos los argumentos relacionados: buen precio, riesgosa por fusión, no riesgosa por fusión con una fuerte, y riesgosa por rumores de deuda. (Ep. X, parte 1, «Brindando una explicación detallada»)","x":"<div class=\"ctx-tit\">KB de Mer-val usada en el Ep. X (c = comprar_acciones, r = riesgosa, a = acme)<\/div><pre>comprar_acciones(X) :- buen_precio(X).\nbuen_precio(X) :- buen_precio_web(X).\n~comprar_acciones(X) :- riesgosa(X).\nriesgosa(X) :- en_fusion(X,Y).\nen_fusion(X,Y) :- listado_fusiones_web(X,Y).\nriesgosa(X) :- rumores_deuda_web(X).\n~riesgosa(X) :- en_fusion(X,Y), fuerte(Y).\n~riesgosa(X) :- fuerte(X).\nfuerte(X) :- listado_fuertes_web(X).\nbuen_precio_web(acme).\nlistado_fusiones_web(acme, strong).\nrumores_deuda_web(acme).\nlistado_fuertes_web(strong).<\/pre><div class=\"ctx-tit\">Derivaciones del ejemplo de acme (Ep. X, parte 1; s = strong)<\/div><div class=\"ctx-scroll\"><svg class=\"ctx-svg ctx-ancho\" viewBox=\"0 0 700 220\" role=\"img\" aria-label=\"d1 concluye c(a); d2 concluye ~c(a) pasando por r(a); d3 concluye ~r(a); d4 concluye r(a)\"><polygon points=\"95,34 43,128 147,128\" class=\"tri\"/><text x=\"95\" y=\"24\" class=\"tn\">c(a)<\/text><text x=\"95\" y=\"148\" class=\"tn\">d1<\/text><text x=\"95\" y=\"170\" class=\"et2\">c(a) ← buen_precio(a)<\/text><text x=\"95\" y=\"185\" class=\"et2\">buen_precio(a) ← web<\/text><polygon points=\"265,34 213,128 317,128\" class=\"tri\"/><text x=\"265\" y=\"24\" class=\"tn\">~c(a)<\/text><polygon points=\"265,74 243,114 287,114\" class=\"tri2\"/><text x=\"265\" y=\"70\" class=\"et2\">r(a)<\/text><text x=\"265\" y=\"148\" class=\"tn\">d2<\/text><text x=\"265\" y=\"170\" class=\"et2\">~c(a) ← r(a)<\/text><text x=\"265\" y=\"185\" class=\"et2\">r(a) ← en_fusion(a,s)<\/text><text x=\"265\" y=\"200\" class=\"et2\">en_fusion ← web<\/text><polygon points=\"435,34 383,128 487,128\" class=\"tri\"/><text x=\"435\" y=\"24\" class=\"tn\">~r(a)<\/text><text x=\"435\" y=\"148\" class=\"tn\">d3<\/text><text x=\"435\" y=\"170\" class=\"et2\">~r(a) ← en_fusion(a,s),<\/text><text x=\"435\" y=\"185\" class=\"et2\">fuerte(s)<\/text><text x=\"435\" y=\"200\" class=\"et2\">en_fusion, fuerte ← web<\/text><polygon points=\"605,34 553,128 657,128\" class=\"tri\"/><text x=\"605\" y=\"24\" class=\"tn\">r(a)<\/text><text x=\"605\" y=\"148\" class=\"tn\">d4<\/text><text x=\"605\" y=\"170\" class=\"et2\">r(a) ← rumores_deuda<\/text><text x=\"605\" y=\"185\" class=\"et2\">_web(a)<\/text><\/svg><\/div>"},{"h":"018f26b5","q":"¿Con qué dos elementos se caracteriza generalmente un sistema argumentativo?","o":["Un conjunto de informantes y un orden de credibilidad","Un conjunto de reglas y un valor de certeza para cada una","Una base consistente y una inferencia como Modus Ponens","Un conjunto de argumentos y una relación de derrota entre ellos"],"a":3,"e":"Argumentos que expresan razones para conclusiones, y una relación que dice cuándo un argumento derrota a otro. Los otros pares son los de los enfoques cuantitativo, cualitativo y monotónico. (Ep. X, parte 1, «Sistema argumentativo»)"},{"h":"48197dd3","q":"¿Para qué hacen los sistemas argumentativos un análisis exhaustivo?","o":["Para eliminar de la base las reglas que generan contradicciones","Para asignar un valor de certeza a cada argumento de la base","Para encontrar la derivación más corta de cada una de las conclusiones","Para determinar qué argumentos quedan aceptados y cuáles rechazados"],"a":3,"e":"El análisis exhaustivo determina cuáles son los argumentos aceptados y rechazados; los aceptados dan una garantía para las conclusiones que sustentan. (Ep. X, parte 1, «Sistema argumentativo»)"},{"h":"8e382c91","q":"Según la cátedra, ¿qué argumentos deberían quedar aceptados?","o":["Los que der
