<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz de IA · UNS 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: unidades como pestañas arriba; a la izquierda la pregunta, a la derecha el tablero
   de la unidad (puntaje y una grilla de celdas tipo Gantt con el estado de cada pregunta). */
:root {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --ink: #17202c;
  --muted: #586374;
  --line: #d9dfe8;
  --accent: #2457a6;
  --accent-soft: #e4ecf8;
  --ok: #1d7a4b;
  --ok-soft: #e2f3ea;
  --bad: #b4382c;
  --bad-soft: #fbe6e3;
  --cell: #e7ebf1;
  --font-ui: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --panel: #1a2029; --ink: #e5e9ef; --muted: #9aa5b5; --line: #2c3542;
    --accent: #7aa7ec; --accent-soft: #1f2c42; --ok: #5cc08c; --ok-soft: #173326;
    --bad: #f08b7e; --bad-soft: #3a1f1c; --cell: #262e3a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --panel: #1a2029; --ink: #e5e9ef; --muted: #9aa5b5; --line: #2c3542;
  --accent: #7aa7ec; --accent-soft: #1f2c42; --ok: #5cc08c; --ok-soft: #173326;
  --bad: #f08b7e; --bad-soft: #3a1f1c; --cell: #262e3a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 span { color: var(--muted); font-weight: 500; }
.overall { font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }

nav.units { display: flex; flex-wrap: wrap; gap: 8px; }
.unit-btn {
  font: inherit; font-size: 0.86rem; cursor: pointer; text-align: left;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 8px; padding: 7px 11px; display: grid; gap: 1px; min-width: 0;
}
.unit-btn .code { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.04em; }
.unit-btn .mini { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.unit-btn[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }
.unit-btn:hover { border-color: var(--accent); }
@media (max-width: 640px) {
  nav.units { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
  .unit-btn { flex: 0 0 auto; scroll-snap-align: start; }
}
button:focus-visible, .opt:focus-visible, .cell:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; min-width: 0; }
.qhead { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); letter-spacing: 0.03em; text-transform: uppercase; }
.qtext { font-family: var(--font-read); font-size: 1.22rem; line-height: 1.45; margin: 12px 0 18px; text-wrap: pretty; max-width: 62ch; }
.opts { display: grid; gap: 10px; }
/* Contexto de la pregunta: tablas, árboles y programas de los ejemplos de la cátedra */
.ctx { margin: 0 0 18px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); display: grid; gap: 12px; min-width: 0; }
.ctx-tit { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: -6px; }
.ctx-scroll { overflow-x: auto; }
.ctx-tabla { border-collapse: collapse; font-family: var(--font-mono); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.ctx-tabla th, .ctx-tabla td { padding: 2px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ctx-tabla th { color: var(--muted); font-weight: 500; }
.ctx-tabla td:first-child { color: var(--muted); }
.ctx-tabla tr.hl td { background: var(--accent-soft); }
.ctx-svg { width: 100%; max-width: 560px; height: auto; font-family: var(--font-mono); }
.ctx-svg.ctx-ancho { max-width: 700px; min-width: 560px; }
.ctx-svg .punta { fill: var(--muted); }
.ctx-svg .arco { stroke: var(--muted); stroke-width: 0.5; opacity: 0.55; }
.ctx-svg .neu { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.3; }
.ctx-svg .tri { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
.ctx-svg .tri2 { fill: var(--panel); stroke: var(--accent); stroke-dasharray: 3 2; }
.ctx-svg .et2 { font-size: 11px; fill: var(--muted); }
.ctx-svg .ar { stroke: var(--muted); stroke-width: 1.2; }
.ctx-svg .nodo { fill: var(--panel); stroke: var(--accent); stroke-width: 1.5; }
.ctx-svg .hoja { fill: var(--accent-soft); stroke: var(--line); }
.ctx-svg text { text-anchor: middle; font-size: 13px; fill: var(--ink); }
.ctx-svg .tn { font-weight: 600; }
.ctx-svg .et { font-size: 11px; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; }
.ctx pre { margin: 0; font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.ctx p { margin: 0; font-size: 0.92rem; }
.opt {
  font: inherit; text-align: left; cursor: pointer; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 11px 12px;
  transition: border-color .15s, background-color .15s;
}
.opt:hover:not([disabled]) { border-color: var(--accent); background: var(--accent-soft); }
.opt .key { font-family: var(--font-mono); font-size: 0.8rem; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; border: 1px solid var(--line); color: var(--muted); }
.opt[disabled] { cursor: default; }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.correct .key { background: var(--ok); border-color: var(--ok); color: var(--panel); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); border-color: var(--bad); color: var(--panel); }
.opt.dim { opacity: 0.6; }

.feedback { margin-top: 16px; border-radius: 8px; padding: 12px 14px; border: 1px solid var(--line); display: grid; gap: 4px; }
.feedback.ok { border-color: var(--ok); background: var(--ok-soft); }
.feedback.bad { border-color: var(--bad); background: var(--bad-soft); }
.feedback strong { font-size: 0.95rem; }
.feedback p { margin: 0; color: var(--ink); max-width: 68ch; }

.controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; justify-content: space-between; align-items: center; }
.controls .group { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer; border-radius: 8px; padding: 9px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.btn:hover:not([disabled]) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: var(--panel); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.hint { font-size: 0.78rem; color: var(--muted); margin-top: 12px; }

aside.board { display: grid; gap: 14px; }
.score { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { display: grid; gap: 2px; }
.stat .v { font-family: var(--font-mono); font-size: 1.35rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.bar { height: 8px; border-radius: 4px; background: var(--cell); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .g { background: var(--ok); } .bar .r { background: var(--bad); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.75rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.grid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.cell { font: inherit; font-family: var(--font-mono); font-size: 0.66rem; cursor: pointer; aspect-ratio: 1; max-width: 100%; border-radius: 4px; border: 1px solid transparent; background: var(--cell); color: var(--muted); padding: 0; font-variant-numeric: tabular-nums; }
.cell.ok { background: var(--ok); color: var(--panel); }
.cell.bad { background: var(--bad); color: var(--panel); }
.cell.cur { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.board h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0; font-weight: 600; }
.stack { display: grid; gap: 8px; }

.done { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 8px; }
.done h2 { margin: 0; font-size: 1.1rem; }
.done .big { font-family: var(--font-mono); font-size: 2rem; font-variant-numeric: tabular-nums; }

table.sum { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
table.sum th, table.sum td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.sum th { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
table.sum td.num { font-family: var(--font-mono); }
table.sum tr.total td { font-weight: 700; border-bottom: none; }
.linkbtn { font: inherit; background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Quiz de Inteligencia Artificial <span>UNS · 2026</span></h1>
    <div class="overall" id="overall"></div>

<script>
const UNITS = [{"id":"u1","nombre":"Robótica, roboética y legislación","tp":"TP5","qs":[{"h":"a6c0d3a2","q":"¿Cuál NO es uno de los cuatro aspectos centrales con que la cátedra (citando a COMEST) caracteriza a los robots contemporáneos?","o":["Autonomía","Movilidad","Interactividad","Aprendizaje"],"a":3,"e":"Los cuatro aspectos son movilidad, interactividad, comunicación y autonomía. El aprendizaje aparece al hablar de las máquinas cognitivas, pero no es uno de los cuatro. (Robótica, «Una definición de robot»)"},{"h":"88206f08","q":"Según la definición de robot de la cátedra, la interactividad es posible gracias a…","o":["Interfaces de reconocimiento y de síntesis de voz para hablar con personas","La capacidad de razonar y decidir por sí mismo, sin control externo directo","Ruedas, piernas o hélices para desplazarse por entornos humanos","Sensores que recogen datos del entorno y efectores que actúan sobre él"],"a":3,"e":"Interactividad = sensores + efectores. Las interfaces de voz son la comunicación; razonar sin control externo es la autonomía; desplazarse es la movilidad. (Robótica, «Una definición de robot»)"},{"h":"79356b2e","q":"En la definición de robot de la cátedra, la autonomía es…","o":["La capacidad de funcionar largo tiempo sin recargar su batería ni recibir mantenimiento","La capacidad de aprender de la experiencia sin necesidad de datos etiquetados","La capacidad de moverse en entornos humanos o peligrosos para los humanos","La capacidad de razonar y tomar sus propias decisiones sin control externo directo"],"a":3,"e":"Autonomía, en el sentido de «razonar» por sí mismo y actuar sin control externo directo. Moverse en entornos peligrosos corresponde a la movilidad. (Robótica, «Una definición de robot»)"},{"h":"4e76ac0e","q":"¿Cuál de estos elementos es un efector de un robot?","o":["Un sonar","Un GPS","Un acelerómetro","Una pinza"],"a":3,"e":"Los efectores actúan sobre el mundo (piernas, ruedas, brazos, pinzas, hélices). Sonar, GPS, cámara y acelerómetro son sensores. (Robótica, «Agentes físicos»)"},{"h":"ada0cb4d","q":"¿Cuál es la diferencia principal entre un robot y un agente de software?","o":["La complejidad: el entorno de un agente de software es siempre más simple","La autonomía: un agente de software no toma decisiones propias","El entorno: el robot percibe y actúa sobre el mundo físico","La percepción: un agente de software no tiene sensores"],"a":2,"e":"Los dos son agentes con sensores y efectores; cambia el entorno. Un agente de software en Internet puede tener un entorno tan complejo como el mundo físico. (Robótica, «Agentes físicos»; TP5, ej. 1)"},{"h":"75d160ca","q":"¿Qué limitaciones tiene típicamente el entorno de un robot real?","o":["Es determinista, pero tiene demasiados estados para buscar","Es estático, pero los sensores no tienen suficiente precisión","Es totalmente observable, pero los efectores son lentos","Es parcialmente observable, estocástico, dinámico y continuo"],"a":3,"e":"La cámara no ve detrás de una esquina (parcialmente observable), los motores patinan (estocástico), el mundo cambia mientras el robot decide (dinámico) y las posiciones son continuas. (TP5, ej. 1)"},{"h":"c68cda65","q":"En la definición de robot de la cátedra, ¿para qué es importante la movilidad?","o":["Para razonar y tomar sus propias decisiones sin control externo directo","Para comunicarse con las personas mediante reconocimiento y síntesis de voz","Para funcionar en entornos humanos o en entornos peligrosos para los humanos","Para recopilar información relevante del entorno con sus sensores y efectores"],"a":2,"e":"Movilidad: funcionar en entornos humanos o peligrosos para los humanos. Sensores y efectores son la interactividad; la voz, la comunicación; decidir sin control externo, la autonomía. (Robótica, «Una definición de robot»)"},{"h":"8e415796","q":"En la definición de robot de la cátedra, la comunicación es posible gracias a…","o":["Una conexión permanente con un servidor central en la nube","Interfaces para reconocimiento de voz y sintetizadores de voz","Sensores que recogen información y efectores que actúan","La capacidad de razonar y decidir sin control externo directo"],"a":1,"e":"Comunicación: interfaces de computadora para reconocimiento de voz y sintetizadores de voz. Sensores y efectores corresponden a la interactividad. (Robótica, «Una definición de robot»)"},{"h":"34e14a49","q":"¿Cuál de estos elementos es un sensor de un robot?","o":["Una aleta","Un acelerómetro","Una hélice","Un brazo"],"a":1,"e":"Para percibir su entorno, el robot tiene sensores: sonar, GPS, cámara, acelerómetro. Piernas, ruedas, brazos, pinzas, aletas y hélices son efectores. (Robótica, «Agentes físicos»)"},{"h":"34accd61","q":"Según el reporte de COMEST, ¿cuál es la característica principal de las «máquinas cognitivas»?","o":["Operan solamente en entornos industriales o en aplicaciones militares","Ejecutan un programa fijo, completamente previsto por el fabricante","Deciden de forma impredecible, según el azar y la experiencia","Imitan la apariencia y los gestos de una persona hasta confundirse con ella"],"a":2,"e":"Al basarse en IA, sus decisiones son impredecibles y dependen de situaciones estocásticas y de la experiencia. Un robot determinista, en cambio, está preprogramado. (Robótica, «Máquinas cognitivas que inducen cambios sociales»)"},{"h":"8b20584e","q":"Como las decisiones de las máquinas cognitivas son impredecibles, COMEST considera crucial la cuestión de…","o":["La seguridad informática de sus comunicaciones","La velocidad con que toman decisiones en tiempo real","La responsabilidad por las acciones de los robots","La capacidad de explicar su razonamiento"],"a":2,"e":"Si nadie programó explícitamente una acción, ¿quién responde por ella? Por eso la responsabilidad (accountability) es la cuestión central. (Robótica, «Máquinas cognitivas que inducen cambios sociales»)"},{"h":"87cc1563","q":"¿Qué problemas investiga la robótica cognitiva?","o":["El diseño mecánico de articulaciones, motores y actuadores de precisión","El procesamiento de bajo nivel de las señales que entregan los sensores","Funciones de alto nivel: conocimiento, razonamiento, planificación","La interacción emocional entre los robots y las personas que los usan"],"a":2,"e":"Representación de conocimiento, razonadores, planificadores, razonamiento sobre acciones y cambio, revisión de conocimiento y arquitecturas de agentes: muchos temas de la materia. (Robótica, «Robótica cognitiva»)"},{"h":"5e84a78b","q":"¿Qué propone el reporte de COMEST como respuesta a los problemas éticos de los robots cognitivos?","o":["Concientizar y promover un diálogo público e inclusivo","Dejar la regulación en manos de los fabricantes","Exigir que todo robot sea controlado a distancia","Prohibir el uso de robots autónomos dentro de los hogares"],"a":0,"e":"El reporte busca crear conciencia y promover la consideración pública y el diálogo inclusivo: las decisiones éticas sobre robots no deberían quedar solo en manos de expertos. (TP5, ej. 6)"},{"h":"d9701e38","q":"¿Por qué la sonda OSIRIS-REx fue programada para actuar con autonomía?","o":["Porque la NASA prohíbe el control remoto de las sondas","Porque el polvo del asteroide Bennu bloquea las señales de radio","Porque la comunicación con la Tierra tiene minutos de retardo","Porque no tiene antena para comunicarse con la Tierra"],"a":2,"e":"A esa distancia, una orden desde la Tierra tarda minutos en llegar (la luz tarda unos 8 minutos del Sol a la Tierra), así que la sonda tiene que decidir según su percepción y sus metas. (Robótica, «Dominios de aplicación: exploración»)"},{"h":"35f92a69","q":"Según COMEST, la robótica contemporánea se basa cada vez más en IA, con habilidades humanas en…","o":["Detección, lenguaje, interacción, resolución de problemas, aprendizaje y creatividad","Cálculo, memoria, búsqueda, ordenamiento, compresión y cifrado de la información","Fuerza, velocidad, precisión, resistencia, equilibrio y coordinación de movimientos","Visión, audición, tacto, olfato, gusto y percepción de la posición del propio cuerpo"],"a":0,"e":"La robótica contemporánea incorpora habilidades humanas en la detección, el lenguaje, la interacción, la resolución de problemas, el aprendizaje e incluso la creatividad. (Robótica, «Máquinas cognitivas que inducen cambios sociales»)"},{"h":"71f8ad30","q":"Según COMEST, ¿cómo cambiaron los usos de los robots desde mediados del siglo XX?","o":["De la exploración espacial a la industria, la agricultura y la minería a cielo abierto","De la investigación universitaria a las fábricas automotrices y electrónicas","Del entretenimiento y los juguetes a la industria pesada y la defensa militar","De aplicaciones industriales y militares a transporte, salud, educación y hogar"],"a":3,"e":"Al principio se usaban sobre todo en aplicaciones industriales y militares; hoy surgen en el transporte, la atención médica, la educación y el entorno doméstico. (Robótica, «Máquinas cognitivas que inducen cambios sociales»)"},{"h":"1b72931a","q":"Según COMEST, además de inducir cambios sociales y culturales, la presencia creciente de robots cognitivos genera problemas de…","o":["Velocidad, precisión y confiabilidad técnica","Costos, mantenimiento y consumo de energía","Desempleo, impuestos y comercio internacional","Seguridad, privacidad y dignidad humana"],"a":3,"e":"Los robots cognitivos afectan los comportamientos humanos, inducen cambios sociales y culturales, y generan problemas relacionados con la seguridad, la privacidad y la dignidad humana. (Robótica, «Máquinas cognitivas que inducen cambios sociales»)"},{"h":"2cfb5e96","q":"¿Cuál NO es una de las funciones cognitivas de alto nivel que investiga la robótica cognitiva?","o":["Razonamiento acerca de acciones y cambio","Revisión de conocimiento","Arquitecturas de agentes inteligentes","Control de motores y servomecanismos"],"a":3,"e":"La robótica cognitiva investiga: representación de conocimiento, desarrollo de razonadores, desarrollo de planificadores, razonamiento acerca de acciones y cambio, revisión de conocimiento y arquitecturas de agentes inteligentes. El control de motores es de bajo nivel. (Robótica, «Robótica cognitiva»)"},{"h":"76fce50e","q":"¿Cuál de estas NO es una función que investiga la robótica cognitiva?","o":["Procesamiento de las señales de los sensores","Desarrollo de razonadores","Desarrollo de planificadores","Representación de conocimiento"],"a":0,"e":"Las seis funciones de alto nivel: representación de conocimiento, razonadores, planificadores, acciones y cambio, revisión de conocimiento y arquitecturas de agentes. Procesar señales es de bajo nivel. (Robótica, «Robótica cognitiva»)"},{"h":"5b978444","q":"¿Cuál NO es uno de los dominios de aplicación de robots que enumera la cátedra?","o":["Entornos peligrosos","Human augmentation","Publicidad y marketing","Servicios personales"],"a":2,"e":"Los dominios: industria y agricultura, transporte de personas o cargas, entornos peligrosos, exploración, salud, servicios personales, entretenimiento, human augmentation y esqueletos externos. (Robótica, «Dominios de aplicación»)"},{"h":"388cc8c7","q":"¿Cuál de estos NO figura entre los dominios de aplicación de robots de la cátedra?","o":["Transporte de personas o cargas","Exploración","Gestión financiera","Esqueletos externos"],"a":2,"e":"Los nueve dominios: industria y agricultura, transporte, entornos peligrosos, exploración, salud, servicios personales, entretenimiento, human augmentation y esqueletos externos. (Robótica, «Dominios de aplicación»)"},{"h":"e7fa9b6c","q":"¿Cuál de estos dominios de aplicación de robots NO aparece en la lista de la cátedra?","o":["Industria y agricultura","Entretenimiento","Seguridad informática","Salud"],"a":2,"e":"Industria y agricultura, salud y entretenimiento están en la lista de nueve dominios; la seguridad informática no es un dominio de robots. (Robótica, «Dominios de aplicación»)"},{"h":"35c49e9e","q":"¿Qué es un vehículo de guiado automático (AGV)?","o":["Un vehículo de pasajeros sin conductor que circula por la vía pública guiado por GPS y mapas","Un dron que reparte paquetes guiado a distancia por un operador humano desde una central","Un brazo robot montado sobre rieles que carga y descarga camiones en un depósito logístico","Un robot móvil que transporta cargas solo, guiado por marcas, visión, magnetismo o láser"],"a":3,"e":"AGV: robot móvil que realiza tareas de transporte de manera autónoma, siguiendo marcas en el piso o usando otra percepción (visión, magnetismo o láser). Se usa en la industria para mover materiales pesados o peligrosos. (Robótica, «Dominio de aplicación: transporte de mercaderías»)"},{"h":"10330235","q":"Además de los robots industriales clásicos, ¿qué robots adopta también la industria, según la cátedra?","o":["Robots que solo operan de noche, cuando no hay personal en la planta","Robots que reemplazan por completo a todos los operarios de la planta","Robots que trabajan en el mismo espacio que los empleados, como uno más","Robots que se controlan a distancia desde otra planta de la empresa"],"a":2,"e":"La industria también adopta robots que puedan trabajar en el mismo espacio, como un empleado (humano) más. (Robótica, «Dominios de aplicación: industria»)"},{"h":"b8ad2637","q":"¿En qué tres categorías agrupa la cátedra a la mayoría de los robots actuales?","o":["Industriales, de servicio y militares","Reactivos, deliberativos e híbridos","Terrestres, aéreos y submarinos","Manipuladores, móviles e híbridos"],"a":3,"e":"Manipuladores (anclados a su lugar de trabajo), móviles (se mueven por su entorno) e híbridos (móviles con manipuladores, y humanoides). Reactivo/deliberativo es una clasificación de agentes, no de robots. (Robótica, «Robots – categorías»)"},{"h":"f30a15de","q":"Un robot humanoide pertenece a la categoría de robots…","o":["Móviles","Autónomos","Híbridos","Manipuladores"],"a":2,"e":"Los híbridos son robots móviles con manipuladores, y la cátedra incluye ahí a los humanoides. (Robótica, «Robots – categorías»)"},{"h":"5c4c91c4","q":"Un brazo robot que suelda piezas en una línea de montaje es un robot…","o":["Híbrido","Humanoide","Móvil","Manipulador"],"a":3,"e":"Los manipuladores (brazos robot) están anclados a su lugar de trabajo. (Robótica, «Robots – categorías»)"},{"h":"fde3bbb1","q":"¿Cuál NO es un tipo de robot móvil de los que enumera la cátedra?","o":["Planetary rovers","Brazos robot de soldadura","Unmanned air vehicles (UAV)","Autonomous underwater vehicles (AUV)"],"a":1,"e":"Móviles: domésticos, unmanned land vehicles (ULV), unmanned air vehicles (UAV), autonomous underwater vehicles (AUV) y planetary rovers. Un brazo robot es un manipulador. (Robótica, «Robots – categorías»)"},{"h":"413ea8e0","q":"En la clasificación de robots móviles, un AUV es…","o":["Un vehículo aéreo no tripulado","Un vehículo de exploración planetaria","Un vehículo terrestre no tripulado","Un vehículo submarino autónomo"],"a":3,"e":"AUV = autonomous underwater vehicle. UAV es aéreo (unmanned air vehicle), ULV es terrestre (unmanned land vehicle) y los planetary rovers exploran otros planetas. (Robótica, «Robots – categorías»)"},{"h":"74cccd9f","q":"En la clasificación de robots móviles, un ULV es…","o":["Un vehículo submarino autónomo","Un vehículo aéreo no tripulado","Un vehículo terrestre no tripulado","Un robot doméstico de limpieza"],"a":2,"e":"ULV = unmanned land vehicle. Los otros móviles: domésticos, UAV (aéreos), AUV (submarinos) y planetary rovers. (Robótica, «Robots – categorías»)"},{"h":"e6952d37","q":"En la clasificación de robots móviles, un UAV es…","o":["Un vehículo aéreo no tripulado","Un robot móvil con manipuladores","Un vehículo submarino autónomo","Un vehículo terrestre no tripulado"],"a":0,"e":"UAV = unmanned air vehicle. Un móvil con manipuladores no es un móvil sino un híbrido. (Robótica, «Robots – categorías»)"},{"h":"ac6a6a97","q":"Según la cátedra, ¿qué distingue a la ética de la moral?","o":["La moral busca principios universales; la ética se basa en las costumbres de cada cultura","La ética busca principios universales; la moral se basa en las costumbres de cada cultura","La ética se aplica a las máquinas; la moral se aplica solamente a las personas","La ética la fijan las leyes del Estado; la moral la fija la religión de cada persona"],"a":1,"e":"La ética es la rama de la filosofía que reflexiona críticamente sobre lo correcto y busca principios universales; la moral es el conjunto de normas y valores de una sociedad, basada en costumbres. (Robótica, «Ética y Moral»)"},{"h":"dce552ed","q":"Según la cátedra, la moral es…","o":["Universal y basada en la filosofía","Personal y distinta en cada individuo","Rígida y específica de cada cultura","Flexible y sujeta a revisión crítica"],"a":2,"e":"La moral es conservadora y particular de cada sociedad. Flexible, crítica y universal describe a la ética. (Robótica, «Ética y Moral»)"},{"h":"d45acd5d","q":"Según la cátedra, la ética es…","o":["El conjunto de leyes que regulan la conducta de las personas en un Estado","La rama de la psicología que estudia cómo se forman los valores de cada persona","El conjunto de normas y valores que rigen en una sociedad determinada y en su época","La rama de la filosofía que estudia la conducta humana, lo correcto y lo incorrecto"],"a":3,"e":"Ética: rama de la filosofía que estudia la conducta humana, lo correcto y lo incorrecto; busca principios universales y es flexible, crítica y sujeta a revisión. El conjunto de normas de una sociedad es la moral. (Robótica, «Ética y Moral»)"},{"h":"1d470f05","q":"Según la cátedra, la moral es un conjunto de normas y valores de una sociedad, basada en…","o":["Principios universales","Las leyes escritas del Estado","La reflexión filosófica crítica","Costumbres y tradiciones"],"a":3,"e":"La moral se basa en costumbres y tradiciones y es rígida y específica de cada cultura. Los principios universales y la reflexión crítica son de la ética. (Robótica, «Ética y Moral»)"},{"h":"af7d8530","q":"¿Qué establece la ley «respetar el rechazo de la atención por parte de un robot» del derecho civil europeo?","o":["Que una persona puede negarse a ser cuidada por un robot","Que un hospital puede rechazar robots no certificados","Que un robot puede negarse a cumplir una orden dañina","Que un robot debe detenerse si comete un error médico"],"a":0,"e":"Es el derecho de una persona a negarse a ser cuidada por un robot, por ejemplo cuando su presencia le resulta insoportable (robots que dan de comer a personas mayores). (Robótica, «Ley civil Europea: leyes en robótica»)"},{"h":"60526fdb","q":"Un robot de cuidado le impide a una persona tomar alcohol, «por su bien». ¿Qué ley del derecho civil europeo vulnera?","o":["Proteger contra la manipulación por robots","Evitar la disolución de los vínculos sociales","Proteger a los humanos de los daños de robots","Proteger la libertad humana frente a los robots"],"a":3,"e":"Es el ejemplo de la propia norma: un robot no puede imponer comportamientos, debe respetar la autonomía de decisión de la persona. (Robótica, «Ley civil Europea: leyes en robótica»)"},{"h":"da5da089","q":"Un robot de compañía simula emociones y la persona desarrolla un vínculo afectivo con él. ¿Qué principio del derecho civil europeo apunta a ese riesgo?","o":["Respetar el rechazo de la atención por parte de un robot","Proteger a la humanidad contra la manipulación por robots","Proteger la privacidad frente a los robots","Garantizar la igualdad de acceso al progreso en robótica"],"a":1,"e":"La norma advierte que la empatía artificial es un peligro: cuando un robot simula emociones, la persona puede desarrollar un vínculo y quedar expuesta a ser manipulada. (Robótica, «Ley civil Europea: leyes en robótica»)"},{"h":"27badec3","q":"¿Por qué el derecho civil europeo propone restringir el acceso humano a las tecnologías de mejora?","o":["Para que los exoesqueletos solo se usen bajo estricta supervisión médica","Porque las prótesis robóticas son demasiado caras para la salud pública","Para evitar cyborgs que obliguen a los humanos a mejorarse o desaparecer","Porque los implantes con sensores ponen en riesgo los datos personales"],"a":2,"e":"Parece contradictorio con la igualdad de acceso, pero apunta a la creación de criaturas híbridas (cyborgs) que dejarían en el olvido a los humanos en su forma actual. (Robótica, «Ley civil Europea: leyes en robótica»)"},{"h":"80f28549","q":"¿Por qué el derecho civil europeo considera crucial la gestión de los datos personales que procesan los robots?","o":["Porque al comunicarse entre sí pueden intercambiar datos de forma imperceptible","Porque sus sensores siguen registrando datos aun cuando el robot está apagado","Porque un robot no puede distinguir entre datos personales y datos públicos","Porque la ley exige guardar todos los datos en servidores dentro de la Unión Europea"],"a":0,"e":"Los robots recopilan grandes volúmenes de datos y, cuando se comunican, esa comunicación puede ser imperceptible para los humanos. (Robótica, «Ley civil Europea: leyes en robótica»)"},{"h":"84ba2cd7","q":"Según la ley «evitar la disolución de los vínculos sociales», un robot que asiste a personas mayores debería…","o":["Reemplazar al personal de salud en las tareas de cuidado repetitivas y nocturnas","Ser usado solo cuando la persona no tenga familiares que puedan cuidarla","Ayudarlas a ser más independientes, sin aislarlas ni reemplazar a los humanos","Avisar a la familia cada vez que la persona pase demasiado tiempo sola"],"a":2,"e":"El robot debe mejorar la calidad de vida sin aislar al paciente: actuar como un agente que ayuda a ser más independiente, pero que no puede sustituir a los humanos por completo. (Robótica, «Ley civil Europea: leyes en robótica»)"},{"h":"1bf78da9","q":"Según la Carta de los Derechos Fundamentales de la UE, citada en las normas de derecho civil sobre robótica, ¿qué es el fundamento de todos los derechos?","o":["La protección de la vida","La igualdad ante la ley","La dignidad humana","La libertad individual"],"a":2,"e":"La Carta (7 de diciembre de 2000) establece la dignidad humana como fundamento de todos los derechos; la cátedra la cita junto a la primera ley, proteger a los humanos de los daños causados por robots. (Robótica, «Ley civil Europea: leyes en robótica»)"},{"h":"a8e3d938","q":"Según los considerandos del Parlamento Europeo, ¿cómo debería ser la definición de robot y de inteligencia artificial?","o":["Distinta en cada Estado miembro, según su industria local","Basada en la forma física del robot y en su grado de autonomía","Técnica y precisa, para no dejar lugar a dudas en los tribunales","Generalmente aceptada y flexible, para no frenar la innovación"],"a":3,"e":"Considerando C: crear una definición generalmente aceptada de robot y de IA que sea flexible y no lastre la innovación. (Robótica, «Normas de Derecho civil sobre robótica»)"},{"h":"5006243c","q":"Según el Parlamento Europeo, ante robots y formas de IA que parecen dispuestas a desencadenar una nueva revolución industrial, el legislador debe…","o":["Dejar la regulación en manos de la propia industria de la robótica","Prohibir los androides cuya apariencia los haga indistinguibles de humanos","Frenar el desarrollo de robots hasta contar con una ley completa del tema","Ponderar las consecuencias jurídicas y éticas sin frenar la innovación"],"a":3,"e":"Considerando B: es de vital importancia que el legislador pondere las consecuencias jurídicas y éticas, sin obstaculizar con ello la innovación. (Robótica, «Normas de Derecho civil sobre robótica»)"},{"h":"985fb904","q":"Según el Parlamento Europeo, ¿qué se espera que traigan la robótica y la IA a corto y medio plazo?","o":["Una caída sostenida del empleo en todos los sectores de la economía europea","El reemplazo de los servicios de salud y de educación por sistemas automáticos","Eficiencia, ahorro y que las personas no se expongan a condiciones peligrosas","La superación de la capacidad intelectual humana en la mayoría de las tareas"],"a":2,"e":"Considerando E: eficiencia y ahorro en producción, comercio, transporte, salud, salvamento, educación y agricultura, y evitar que las personas se expongan a condiciones peligrosas (como limpiar lugares con sustancias tóxicas). Superar la capacidad humana es a largo plazo (considerando P). (Robótica, «Normas de Derecho civil sobre robótica»)"},{"h":"14c738c4","q":"Según el Parlamento Europeo, a largo plazo, las máquinas inteligentes y autónomas capaces de pensar y decidir de forma independiente…","o":["Deben prohibirse, porque escapan necesariamente al control de las personas","Solo afectan a la industria y a la producción, no al resto de la sociedad","Solo traen ventajas económicas, porque aumentan la productividad de las empresas","Traen ventajas económicas, pero también preocupaciones por sus efectos sociales"],"a":3,"e":"Considerando G: no solo implican ventajas económicas, sino también distintas preocupaciones sobre sus efectos directos e indirectos en el conjunto de la sociedad. (Robótica, «Normas de Derecho civil sobre robótica»)"},{"h":"8c5dd576","q":"¿Qué posibilidad a largo plazo reconoce el Parlamento Europeo en sus considerandos sobre robótica?","o":["Que los robots obtengan los mismos derechos civiles que los humanos","Que la IA llegue a superar la capacidad intelectual humana","Que los robots dejen de necesitar a sus fabricantes para repararse","Que la IA reemplace por completo a los tribunales de justicia"],"a":1,"e":"Considerando P: existe la posibilidad de que a largo plazo la IA llegue a superar la capacidad intelectual humana. (Robótica, «Normas de Derecho civil sobre robótica»)"},{"h":"3a8e565f","q":"Ante la toma de decisiones automatizada y basada en algoritmos, el Parlamento Europeo considera necesario…","o":["Limitar su uso a las decisiones de carácter comercial y de consumo privado","Exigir que todos los algoritmos se publiquen como software de código abierto","Prohibir su uso en las decisiones de autoridades judiciales y administrativas","Integrar salvaguardias y la posibilidad de control y verificación humanos"],"a":3,"e":"Considerando Q: esas decisiones incidirán en particulares y autoridades, así que hay que integrar salvaguardias y la posibilidad de control y verificación por parte de las personas. (Robótica, «Normas de Derecho civil sobre robótica»)"},{"h":"bcd94f61","q":"Un robot industrial lesiona a un operario por una falla. ¿Qué ley del derecho civil europeo apunta a evitarlo?","o":["Proteger a los humanos de los daños causados por robots","Respetar el rechazo de la atención por parte de un robot","Evitar la disolución de los vínculos sociales","Proteger la libertad humana frente a los robots"],"a":0,"e":"Es la primera ley: proteger a los seres humanos de los daños causados por robots. La cátedra la acompaña con la dignidad humana como fundamento de todos los derechos. (Robótica, «Ley civil Europea: leyes en robótica»)"},{"h":"c1538c48","q":"Según la ley de privacidad del derecho civil europeo, ante los sensores de un robot de cuidado queda expuesta la vida de…","o":["Solo los profesionales de salud que supervisan al robot a distancia","La persona dependiente y la de sus familiares, amigos o ayudantes","Solo la persona dependiente que el robot tiene a su cuidado","Nadie, porque los datos quedan cifrados dentro del propio robot"],"a":1,"e":"Ley 4 (privacidad): con sus muchos sensores, los robots de seguridad o de cuidado acceden a mucha información; queda expuesta la vida de la persona dependiente y también la de sus familiares, amigos o ayudantes. (Robótica, «Ley civil Europea: leyes en robótica»)"},{"h":"d98551d9","q":"¿Qué establece la ley de igualdad de acceso al progreso en robótica del derecho civil europeo?","o":["Que los robots de servicio atiendan por igual a todas las personas que lo pidan","Que el Estado entregue un robot de cuidado a cada persona que lo necesite","Que todos los países europeos tengan la misma cantidad de robots por cada habitante","Que usuarios profesionales y no profesionales tengan las mismas oportunidades de acceso"],"a":3,"e":"Ley 8: la división digital es una realidad, pero usuarios profesionales y no profesionales deben tener las mismas oportunidades de acceso. (Robótica, «Ley civil Europea: leyes en robótica»)"},{"h":"115c3850","q":"¿Cuál NO es una de las nueve leyes de robótica del derecho civil europeo que presenta la cátedra?","o":["Igualdad de acceso al progreso en robótica","Garantizar que todo robot pueda apagarse a distancia","Restringir el acceso humano a las tecnologías de mejora","Proteger la privacidad frente a los robots"],"a":1,"e":"Las nueve: proteger de los daños, respetar el rechazo de la atención, proteger la libertad, proteger la privacidad, gestionar los datos personales, proteger contra la manipulación, evitar la disolución de los vínculos sociales, igualdad de acceso y restringir las tecnologías de mejora. (Robótica, «Ley civil Europea: leyes en robótica»)"},{"h":"e0692887","q":"¿Cuál de estas NO figura entre las leyes de robótica del derecho civil europeo?","o":["Proteger contra la manipulación por robots","Gestionar los datos personales procesados por robots","Exigir que los robots se identifiquen como máquinas","Proteger a los humanos de los daños causados por robots"],"a":2,"e":"Identificarse como máquina no es una de las nueve leyes. Manipulación, datos personales y daños sí lo son. (Robótica, «Ley civil Europea: leyes en robótica»)"},{"h":"13c7a9e0","q":"¿Por qué la Recomendación de la UNESCO interpreta la IA en un sentido amplio?","o":["Porque una definición fija quedaría obsoleta por el rápido cambio tecnológico","Porque los Estados miembros no lograron acordar una definición técnica común","Porque los principios éticos deben aplicarse por igual a cualquier software","Porque así abarca también a los robots físicos y no solamente a los programas"],"a":0,"e":"Define a la IA como sistemas con capacidad de procesar datos de forma similar a un comportamiento inteligente; una definición estrecha haría inviables las políticas a futuro. (Robótica, «Recomendación sobre la ética de la IA»)"},{"h":"f0c29036","q":"¿Cuál NO es uno de los cuatro valores fundamentales de la Recomendación de la UNESCO sobre la ética de la IA?","o":["Derechos humanos y dignidad humana","Florecimiento del medio ambiente y los ecosistemas","Competitividad e innovación tecnológica","Garantizar la diversidad y la inclusión"],"a":2,"e":"Los cuatro valores son: derechos humanos y dignidad humana, vivir en sociedades pacíficas, garantizar la diversidad y la inclusión, y florecimiento del medio ambiente y los ecosistemas. (Robótica, «Recomendación sobre la ética de la IA»)"},{"h":"07a05517","q":"Según el principio de «supervisión y decisión humanas» de la UNESCO…","o":["Todo sistema de IA debe poder apagarse a distancia ante una falla de funcionamiento","Una persona debe aprobar una por una todas las decisiones que tome un sistema de IA","La IA solo puede usarse como apoyo a la decisión, nunca para automatizar tareas","Siempre debe poder atribuirse la responsabilidad a personas físicas o jurídicas"],"a":3,"e":"El principio pide que siempre sea posible atribuir la responsabilidad a personas físicas o a entidades jurídicas existentes; no exige aprobar cada decisión. (Robótica, «Diez principios básicos»)"},{"h":"47f8cf45","q":"¿Qué principio de la UNESCO establece que el uso de un sistema de IA no debe ir más allá de lo necesario para alcanzar un objetivo legítimo?","o":["Seguridad y protección","Proporcionalidad e inocuidad","Sostenibilidad","Responsabilidad y rendición de cuentas"],"a":1,"e":"Proporcionalidad e inocuidad: no ir más allá de lo necesario, y evaluar riesgos para prevenir daños. Seguridad y protección habla de evitar daños no deseados y vulnerabilidades a ataques. (Robótica, «Diez principios básicos»)"},{"h":"a6df54ef","q":"Según la UNESCO, el nivel de transparencia y explicabilidad de un sistema de IA…","o":["Debe adecuarse al contexto, porque puede chocar con la privacidad o la seguridad","Solo es exigible a los sistemas de alto riesgo antes de que se puedan comercializar","Debe ser el máximo posible, porque es la única base de la confianza en un sistema de IA","Queda a criterio de cada empresa, para proteger sus secretos comerciales y algoritmos"],"a":0,"e":"El nivel de T&E debe ser adecuado al contexto: puede haber tensiones entre T&E y otros principios como la privacidad, la seguridad y la protección. (Robótica, «Diez principios básicos»)"},{"h":"598d40d3","q":"¿Qué agrega la Recomendación de la UNESCO, además de valores y principios, para llevarlos a la práctica?","o":["Siete requisitos técnicos que deben certificar los fabricantes","Once ámbitos de acción política, como datos, género o educación","Un calendario de prohibiciones que se aplican entre 6 y 36 meses","Una clasificación de los sistemas de IA en cuatro niveles de riesgo"],"a":1,"e":"Los once ámbitos de acción política permiten traducir los principios en estrategias prácticas. Los niveles de riesgo y el calendario son de la Ley de IA europea; los siete requisitos, de las Directrices Éticas europeas. (Robótica, «Once ámbitos de acción política»)"},{"h":"f97f9f84","q":"¿Cuál es la piedra angular de la Recomendación de la UNESCO sobre la ética de la IA?","o":["La seguridad de los sistemas frente a ataques informáticos","La protección de los derechos humanos y la dignidad","La sostenibilidad ambiental de los centros de datos","La competitividad tecnológica de los Estados miembros"],"a":1,"e":"La protección de los derechos humanos y la dignidad es la piedra angular, con principios como la transparencia y la equidad y la importancia de la supervisión humana. (Robótica, «Recomendación sobre la ética de la IA»)"},{"h":"bbc870ab","q":"Según la UNESCO, ¿qué dilemas éticos plantea el potencial de los sistemas basados en IA?","o":["Encarecer los servicios públicos de salud, de educación y de transporte","Reemplazar a todos los trabajadores en pocos años y paralizar la economía","Volverse conscientes, rebelarse contra sus creadores y escapar al control humano","Reproducir prejuicios, degradar el clima y amenazar los derechos humanos"],"a":3,"e":"Los dilemas surgen del potencial de la IA para reproducir prejuicios, contribuir a la degradación del clima y amenazar los derechos humanos, entre otros. (Robótica, «Ética de la inteligencia artificial»)"},{"h":"99b64bfb","q":"Según la UNESCO, los riesgos asociados a la IA se suman a las desigualdades existentes y perjudican aún más a…","o":["Los grupos históricamente marginados","Los países que más invierten en IA","Los trabajadores más calificados","Las grandes empresas tecnológicas"],"a":0,"e":"Estos riesgos se suman a las desigualdades ya existentes, perjudicando aún más a grupos históricamente marginados. (Robótica, «Ética de la inteligencia artificial»)"},{"h":"302a881e","q":"¿Cuál de estos es uno de los cuatro valores fundamentales de la Recomendación de la UNESCO?","o":["Proporcionalidad e inocuidad de los sistemas de IA","Transparencia y explicabilidad de los sistemas de IA","Gobernanza y colaboración adaptativas y de múltiples partes","Vivir en sociedades pacíficas, justas e interconectadas"],"a":3,"e":"Valores: derechos humanos y dignidad humana; vivir en sociedades pacíficas, justas e interconectadas; garantizar la diversidad y la inclusión; florecimiento del medio ambiente y los ecosistemas. Las otras opciones son principios, no valores. (Robótica, «Recomendación sobre la ética de la IA»)"},{"h":"16b4b098","q":"Según el principio de «seguridad y protección» de la UNESCO, ¿qué debería evitarse y tenerse en cuenta?","o":["Las tensiones entre la transparencia y la privacidad","Los conflictos con las normas de derechos humanos","Los daños no deseados y las vulnerabilidades a los ataques","El uso de la IA más allá de lo necesario para su objetivo"],"a":2,"e":"Seguridad y protección: los daños no deseados (riesgos de seguridad) y las vulnerabilidades a los ataques (riesgos de protección). No ir más allá de lo necesario es proporcionalidad; los conflictos con los derechos humanos, responsabilidad; las tensiones con la privacidad, transparencia. (Robótica, «Diez principios básicos»)"},{"h":"350eb716","q":"Según el principio de «derecho a la intimidad y protección de datos» de la UNESCO, la privacidad debe protegerse…","o":["Solo durante la recolección de los datos de entrenamiento","Solo en los sistemas clasificados de alto riesgo","Solo cuando el sistema procesa datos sensibles","A lo largo de todo el ciclo de vida de la IA"],"a":3,"e":"La privacidad debe protegerse y promoverse a lo largo de todo el ciclo de vida de la IA, con marcos adecuados de protección de datos. (Robótica, «Diez principios básicos»)"},{"h":"f52dedf3","q":"¿Qué establece el principio de «gobernanza y colaboración adaptativas y de múltiples partes interesadas» de la UNESCO?","o":["Que un único organismo internacional gobierne toda la IA, en reemplazo de los Estados","Que los Estados compartan libremente todos sus datos, sin restricciones de soberanía","Que cada empresa fije sus propias reglas para el uso de datos, con supervisión de sus clientes","Respetar el derecho internacional y la soberanía nacional en el uso de datos"],"a":3,"e":"En el uso de datos deben respetarse el derecho internacional y la soberanía nacional; la participación de diversas partes interesadas a lo largo del ciclo de vida es necesaria para una gobernanza inclusiva. (Robótica, «Diez principios básicos»)"},{"h":"5350c472","q":"Según el principio de «responsabilidad y rendición de cuentas» de la UNESCO, los sistemas de IA deben ser…","o":["Explicables en el máximo grado para cualquier persona, sin importar el contexto","Certificados por un organismo internacional antes de poder comercializarse","Auditables y trazables, con mecanismos de supervisión, evaluación y auditoría","Aprobados por una persona antes de ejecutar cada una de sus decisiones"],"a":2,"e":"Deben ser auditables y trazables, con mecanismos de supervisión, evaluación de impacto, auditoría y diligencia debida para evitar conflictos con los derechos humanos y amenazas al medio ambiente. (Robótica, «Diez principios básicos»)"},{"h":"c4930717","q":"Según el principio de «sostenibilidad» de la UNESCO, las tecnologías de IA deben evaluarse en función de…","o":["Su vida útil y la facilidad para reciclar el hardware en el que se ejecutan","Su rentabilidad a largo plazo para las empresas que las desarrollan y comercializan","Su impacto en objetivos en constante evolución, como los ODS de las Naciones Unidas","Su consumo de energía y su huella de carbono durante el entrenamiento de los modelos"],"a":2,"e":"Deben evaluarse según su impacto en la «sostenibilidad», entendida como un conjunto de objetivos en constante evolución, incluidos los Objetivos de Desarrollo Sostenible (ODS). (Robótica, «Diez principios básicos»)"},{"h":"a315e740","q":"¿Qué promueve el principio de «sensibilización y educación» de la UNESCO?","o":["Que las escuelas enseñen programación de IA desde el nivel inicial","Que solo especialistas con certificación puedan desarrollar sistemas de IA","Educación abierta, competencias digitales y alfabetización mediática","Campañas para que la población acepte la automatización de su trabajo"],"a":2,"e":"La comprensión pública de la IA y del valor de los datos debería promoverse con educación abierta y accesible, participación cívica, competencias digitales, capacitación en ética de la IA y alfabetización mediática e informacional. (Robótica, «Diez principios básicos»)"},{"h":"86f604d3","q":"¿Qué pide el principio de «equidad y no discriminación» de la UNESCO?","o":["Promover la justicia social y que los beneficios de la IA lleguen a todos","Que cada país reciba la misma inversión internacional en investigación de IA","Que todos los sistemas de IA se entrenen con los mismos datos de referencia","Que las decisiones de la IA nunca puedan diferenciar entre dos personas"],"a":0,"e":"Los actores de la IA deberían promover la justicia social, salvaguardar la equidad, luchar contra todo tipo de discriminación y adoptar un enfoque inclusivo para que los beneficios sean accesibles para todos. (Robótica, «Diez principios básicos»)"},{"h":"116efb2b","q":"¿Cuál NO es uno de los diez principios básicos de la Recomendación de la UNESCO?","o":["Eficiencia económica","Equidad y no discriminación","Sensibilización y educación","Sostenibilidad"],"a":0,"e":"Los diez: proporcionalidad e inocuidad; seguridad y protección; intimidad y protección de datos; gobernanza y colaboración adaptativas; responsabilidad y rendición de cuentas; transparencia y explicabilidad; supervisión y decisión humanas; sostenibilidad; sensibilización y educación; equidad y no discriminación. (Robótica, «Diez principios básicos»)"},{"h":"5d3082b1","q":"¿Cuál NO es uno de los once ámbitos de acción política de la Recomendación de la UNESCO?","o":["Economía y trabajo","Género","Defensa nacional","Cultura"],"a":2,"e":"Los once: evaluación del impacto ético; gobernanza y administración éticas; política de datos; desarrollo y cooperación internacional; medio ambiente y ecosistemas; género; cultura; educación e investigación; comunicación e información; economía y trabajo; salud y bienestar social. (Robótica, «Once ámbitos de acción política»)"},{"h":"c32a2a0e","q":"¿Cuál de estos NO figura entre los ámbitos de acción política de la UNESCO?","o":["Medio ambiente y ecosistemas","Transporte e infraestructura","Evaluación del impacto ético","Política de datos"],"a":1,"e":"Política de datos, medio ambiente y evaluación del impacto ético son ámbitos; transporte no. (Robótica, «Once ámbitos de acción política»)"},{"h":"7c9d7be3","q":"En el ámbito «política de datos» de la UNESCO, ¿qué deberían garantizar las estrategias de gobernanza de datos de los Estados?","o":["Que los datos de entrenamiento se guarden dentro del propio país","Que los datos se borren apenas termina el entrenamiento del sistema","La evaluación continua de la calidad de los datos de entrenamiento","Que solo se usen datos públicos para entrenar sistemas de IA"],"a":2,"e":"Párrafo 71: evaluación continua de la calidad de los datos de entrenamiento (idoneidad de su recopilación y selección), seguridad y protección de los datos, y mecanismos para aprender de los errores. (Robótica, «Ámbitos de acción política», ejemplo)"},{"h":"a159cadc","q":"Según el ámbito «política de datos» de la UNESCO, las personas deberían conservar sus derechos sobre sus datos personales, incluida la posibilidad de…","o":["Acceder a ellos en los sistemas de IA y borrarlos, salvo excepciones","Anular las decisiones que un sistema de IA tomó a partir de ellos","Venderlos a las empresas que entrenan sistemas de IA comerciales","Impedir que se usen en cualquier estadística pública del Estado"],"a":0,"e":"Párrafo 73: transparencia, salvaguardias para datos sensibles, rendición de cuentas y la posibilidad de acceder a los datos personales en los sistemas de IA y de borrarlos, excepto en determinadas circunstancias. (Robótica, «Ámbitos de acción política», ejemplo)"},{"h":"3596b149","q":"Según las recomendaciones argentinas para una IA fiable, ¿por qué no se le puede atribuir responsabilidad a un algoritmo?","o":["Porque no tiene discernimiento, intención ni libertad para decidir","Porque su código lo escribe un equipo y no una sola persona","Porque no tiene patrimonio propio con el que responder por daños","Porque sus decisiones son estadísticas y pueden equivocarse"],"a":0,"e":"La responsabilidad jurídica requiere discernimiento, intención y libertad. Un algoritmo ejecuta, pero la decisión, y por lo tanto la responsabilidad, debe recaer sobre una persona. (Robótica, «¿Cómo es recomendable concebir a la inteligencia artificial?»)"},{"h":"f220d54e","q":"¿Cómo recomiendan las pautas argentinas concebir a los productos de IA?","o":["Como personas electrónicas, con derechos y obligaciones limitados","Como artificios: una tecnología, un medio para lograr objetivos humanos","Como agentes autónomos, responsables de sus propias decisiones","Como colaboradores con el mismo estatus legal que un empleado"],"a":1,"e":"Para evitar antropomorfismos que dificulten la regulación, la IA se concibe como artificio: una cosa, un medio artificial que no debe confundirse con una persona humana. (Robótica, «¿Cómo es recomendable concebir a la inteligencia artificial?»)"},{"h":"8e5d1be4","q":"En el modelo de adopción «con participación humana» (human in the loop, inteligencia aumentada)…","o":["La máquina reemplaza el trabajo humano y una persona solo verifica que funcione bien","La máquina hace el análisis costoso de los datos y las personas deciden","Las personas etiquetan los datos al principio y después la máquina decide sola","Una persona opera el sistema a distancia y aprueba cada una de sus acciones"],"a":1,"e":"Máquinas y humanos colaboran: la IA aporta, por ejemplo, el pensamiento estadístico sobre grandes volúmenes de datos, y los humanos complementan el análisis y deciden. Sustituir el trabajo humano es el otro modelo, la automatización. (Robótica, «Recomendaciones para una IA Fiable»)"},{"h":"b3d0b9c0","q":"Según las recomendaciones argentinas, en el modelo de automatización la intervención humana…","o":["Sigue siendo indispensable, por ejemplo para detectar si el algoritmo se degrada","Solo hace falta durante el entrenamiento y la validación del modelo","Deja de ser necesaria cuando el sistema alcanza una precisión suficiente","Se limita a reubicar a las personas cuyas tareas fueron automatizadas"],"a":0,"e":"Siempre hace falta: para verificar los procesos, ofrecer una vía personal a quien no tiene medios tecnológicos, evaluar la degradación del algoritmo y detectar solicitudes nuevas. La reubicación es un requisito adicional, previo a automatizar. (Robótica, «Recomendaciones para una IA Fiable»)"},{"h":"6339764c","q":"Antes de adoptar IA para resolver un problema, ¿qué recomiendan las pautas argentinas?","o":["Empezar automatizando los procesos más críticos, que son los de mayor impacto","Explorar otras tecnologías: puede alcanzar una solución más simple","Contratar a un proveedor externo que asuma la responsabilidad por los resultados","Elegir el modelo de IA con mejor precisión entre los disponibles en el mercado"],"a":1,"e":"No conviene empezar con el único propósito de «usar IA»: a veces otras soluciones de software son más simples, menos riesgosas e igual de eficientes. (Robótica, «Recomendaciones para una IA Fiable», 3.2.3)"},{"h":"27850295","q":"Según las recomendaciones argentinas, ¿cómo debería ser el equipo que encara un proyecto de IA?","o":["Reducido, para que las decisiones sobre el modelo se tomen rápido","Diverso y multidisciplinario, que sepa de lo técnico y también de ética","Formado por especialistas en aprendizaje automático y ciencia de datos","Liderado por el proveedor de la tecnología, que conoce mejor sus riesgos"],"a":1,"e":"Recomiendan conformar un equipo humano diverso y multidisciplinario, que sepa del tema técnico y también de ética, control humano, gestión de riesgos e innovación pública. (Robótica, «Recomendaciones para una IA Fiable», 3.2.1)"},{"h":"764f5d54","q":"¿Qué son las «Recomendaciones para una Inteligencia Artificial Fiable» de Argentina?","o":["Un compendio de principios éticos transversales a todo el ciclo de un proyecto de IA","Una ley que clasifica los sistemas de IA por nivel de riesgo y prohíbe los inaceptables","Un estándar técnico para certificar la seguridad informática de los sistemas de IA","Un código de conducta voluntario para las empresas privadas de tecnología del país"],"a":0,"e":"Es un compendio de principios éticos transversales a todas las etapas del ciclo del proyecto de IA, que promueve la definición de riesgos y responsabilidades. Clasificar por riesgo es lo que hace la Ley de IA europea. (Robótica, «Recomendaciones para una IA Fiable»)"},{"h":"8006a7cd","q":"Según las recomendaciones argentinas, una persona es jurídicamente responsable si hay discernimiento, intención y libertad. ¿Qué es el discernimiento?","o":["Pulsión o deseo humano","Actuar de manera calculada y premeditada","Conocimiento de las leyes vigentes","Plenas facultades mentales humanas"],"a":3,"e":"Discernimiento: plenas facultades mentales humanas. Intención: pulsión o deseo humano. Libertad: actuar de manera calculada y premeditada. (Robótica, «¿Cómo es recomendable concebir a la inteligencia artificial?»)"},{"h":"0c4ad5b9","q":"Según las recomendaciones argentinas, entre los requisitos de la responsabilidad jurídica, ¿qué es la intención?","o":["Plenas facultades mentales humanas","Pulsión o deseo humano","Haber previsto las consecuencias del acto","Actuar de manera calculada y premeditada"],"a":1,"e":"Intención: pulsión o deseo humano. Las plenas facultades mentales son el discernimiento; actuar de manera calculada y premeditada, la libertad. (Robótica, «¿Cómo es recomendable concebir a la inteligencia artificial?»)"},{"h":"4fee3d05","q":"Según las recomendaciones argentinas, entre los requisitos de la responsabilidad jurídica, ¿qué es la libertad?","o":["Tener una pulsión o un deseo propio","No estar bajo las órdenes de otra persona","Tener plenas facultades mentales humanas","Poder actuar de manera calculada y premeditada"],"a":3,"e":"Libertad: para actuar de manera calculada y premeditada. Las facultades mentales son el discernimiento y la pulsión o deseo, la intención. (Robótica, «¿Cómo es recomendable concebir a la inteligencia artificial?»)"},{"h":"9d9524ac","q":"Según las recomendaciones argentinas, además de promover la investigación y el desarrollo de IA, el Estado debe…","o":["Garantizar que la IA sea transparente, equitativa y responsable","Limitar la IA a los organismos que pasen una certificación","Financiar a las empresas que automaticen sus procesos","Desarrollar él mismo todos los sistemas de IA de la administración"],"a":0,"e":"El Estado cumple un rol fundamental: promover soluciones de IA para necesidades reales de las personas y garantizar que la IA sea transparente, equitativa y responsable. (Robótica, «Recomendaciones para una IA Fiable», Anexo I)"},{"h":"2a0cea00","q":"Según las recomendaciones argentinas, garantizar una IA transparente, equitativa y responsable implica, entre otras cosas…","o":["Publicar el código fuente de todos los sistemas de IA que use el Estado nacional","Prohibir el uso de datos personales para entrenar modelos en el sector público","Evitar la discriminación algorítmica y gestionar los riesgos del uso de IA","Reemplazar de forma progresiva a los empleados públicos por sistemas automáticos"],"a":2,"e":"Implica reglas claras para que todos los sectores aprovechen la tecnología, responsabilidad en el uso de datos personales, evitar la discriminación algorítmica y gestionar los riesgos para prevenir perjuicios. (Robótica, «Recomendaciones para una IA Fiable», Anexo I)"},{"h":"b35a4633","q":"Según las recomendaciones argentinas, ¿para qué conviene empezar con campañas de comunicación, charlas y capacitaciones en la organización?","o":["Para recolectar datos de los empleados con los que entrenar el modelo","Para no tener que conformar un equipo diverso y multidisciplinario","Para bajar la resistencia a adoptar IA y aumentar las chances de éxito","Para elegir entre los proveedores de IA disponibles en el mercado local"],"a":2,"e":"Punto 3.2.2 (nivel de concientización): comunicar la adhesión a los principios, la capacitación y reubicación según el modelo de adopción y el rol humano de control, para bajar la resistencia y aumentar las probabilidades de éxito, sostenibilidad e innovación. (Robótica, «Recomendaciones para una IA Fiable»)"},{"h":"3abc9ab4","q":"Según las recomendaciones argentinas, ¿qué es el modelo de adopción de IA por automatización?","o":["Sustituir trabajo humano por hardware o software","Reemplazar el software existente por modelos de IA","Hacer que máquinas y humanos colaboren en el problema","Usar la IA solo para analizar grandes volúmenes de datos"],"a":0,"e":"Dos modelos: automatización (sustituir trabajo humano por hardware o software) y con participación humana (máquinas y humanos colaboran: «inteligencia aumentada», human in the loop). (Robótica, «Recomendaciones para una IA Fiable», 3.2.4)"},{"h":"f7d1cbae","q":"En el modelo de automatización, ¿qué deben planificar las recomendaciones argentinas antes de empezar a automatizar procesos?","o":["La redacción de un contrato que libere de responsabilidad al Estado","La capacitación y reubicación de las personas cuyas tareas se automatizan","La compra del hardware necesario y la migración de los datos existentes","La consulta pública a los ciudadanos que usarán el servicio automatizado"],"a":1,"e":"La automatización debe contemplar la capacitación y reubicación de las personas cuyas tareas serán automatizadas, en una planificación anterior al inicio de la automatización. (Robótica, «Recomendaciones para una IA Fiable»)"},{"h":"d5929c51","q":"Según las recomendaciones argentinas, ¿por qué hay que definir el destino de uso de la IA antes de empezar?","o":["Porque el destino define qué empresas pueden proveer la tecnología","Porque el destino fija el presupuesto máximo que puede gastarse en el sistema","Porque el destino determina qué algoritmo de aprendizaje conviene usar","Porque cada destino conlleva distintos niveles de riesgo y de control humano"],"a":3,"e":"Punto 3.2.5: cada destino de uso conlleva distintos niveles de riesgo, de tratamiento del riesgo y de control humano (por ejemplo, auditabilidad y trazabilidad, muy importantes en ciberseguridad). (Robótica, «Recomendaciones para una IA Fiable»)"},{"h":"e6c15f9b","q":"Según las recomendaciones argentinas, para el caso de que las intenciones de quienes ordenan a la tecnología no estén alineadas con el bien común, deben existir…","o":["Comités de ética que aprueben previamente cada una de las órdenes al sistema","Instrumentos de control para identificar responsables y rendir cuentas","Mecanismos para que el sistema de IA se niegue a ejecutar las órdenes recibidas","Seguros obligatorios que cubran los daños que el sistema pueda llegar a causar"],"a":1,"e":"Como la tecnología ejecuta lo que le ordena una persona con intención, discernimiento y libertad, deben existir instrumentos de control diseñados para identificar la responsabilidad y la rendición de cuentas. (Robótica, «Recomendaciones para una IA Fiable», 3.2.5)"},{"h":"ae50745c","q":"¿Cuál NO es una de las cuatro etapas del ciclo de la IA en las recomendaciones argentinas?","o":["Operación y mantenimiento","Comercialización y venta","Diseño y modelado de datos","Verificación/validación"],"a":1,"e":"Etapas: 1) diseño y modelado de datos; 2) verificación/validación; 3) implementación; 4) operación y mantenimiento. (Robótica, «Recomendaciones para una IA Fiable», 3.3)"},{"h":"551c8ac6","q":"En el ciclo de la IA de las recomendaciones argentinas, ¿qué etapa sigue a la verificación/validación?","o":["Diseño y modelado de datos","Implementación","Concientización","Operación y mantenimiento"],"a":1,"e":"El orden es diseño y modelado de datos → verificación/validación → implementación → operación y mantenimiento. La concientización es previa al ciclo. (Robótica, «Recomendaciones para una IA Fiable», 3.3)"},{"h":"81148603","q":"En el esquema de las recomendaciones argentinas, ¿cuál NO es un elemento del «pre ciclo», previo al ciclo de vida de la IA?","o":["Auditoría","Modelo de adopción","Premortem","Concientización"],"a":0,"e":"Pre ciclo: concientización, ¿IA? (si es excluyente usar IA), modelo de adopción, destino de uso y control humano, y premortem. La auditoría está dentro del ciclo, en la implementación. (Robótica, «Recomendaciones para una IA Fiable», esquema)"},{"h":"80c1d1a2","q":"En el esquema de las recomendaciones argentinas, ¿qué elementos tiene la fase de uso, posterior al ciclo de vida de la IA?","o":["Seguridad de la información, trazabilidad, auditoría y accesibilidad","Monitoreo, registro y tratamiento de incidentes éticos y control de usuarios internos","Reversibilidad, responsabilidad del daño y una vía alternativa no tecnológica","Concientización, modelo de adopción, destino de uso y premortem"],"a":2,"e":"Esquema: concepción (el humano decide, la IA ejecuta) → pre ciclo → ciclo de vida (diseño, verificación, implementación, operación) → uso: reversibilidad, responsabilidad del daño y vía alternativa no tecnológica. Monitoreo e incidentes son de operación; seguridad, trazabilidad y auditoría, de implementación. (Robótica, «Recomendaciones para una IA Fiable», esquema)"},{"h":"410cf5bf","q":"Según la Ley de IA de la Unión Europea (2024), ¿qué pasa con los sistemas de riesgo inaceptable?","o":["Se regulan con códigos de conducta voluntarios","Están prohibidos","Deben cumplir requisitos estrictos antes de comercializarse","Tienen obligaciones específicas de transparencia"],"a":1,"e":"Inaceptable: prohibidos. Alto: requisitos estrictos antes de comercializarse. Limitado: obligaciones de transparencia. Mínimo o nulo: autorregulación y códigos de conducta. (Robótica, «Ley europea sobre IA»)"},{"h":"bc2cb667","q":"Según la Ley de IA europea, los sistemas de riesgo limitado…","o":["No tienen ninguna obligación ni recomendación","Deben pasar requisitos estrictos antes de venderse","Están prohibidos desde febrero de 2025","Tienen obligaciones específicas de transparencia"],"a":3,"e":"Riesgo limitado = obligaciones de transparencia. Los requisitos estrictos son para el riesgo alto; incluso el riesgo mínimo tiene obligaciones mínimas y fomento de códigos de conducta. (Robótica, «Ley europea sobre IA»)"},{"h":"35a5eafc","q":"Según la Ley de IA europea, ¿qué pasa con los sistemas de riesgo alto?","o":["Tienen obligaciones mínimas y códigos de conducta","Deben cumplir requisitos estrictos antes de su comercialización","Tienen solo obligaciones específicas de transparencia con usuarios","Están prohibidos en todo el territorio de la Unión Europea"],"a":1,"e":"Alto: requisitos estrictos antes de comercializarse. Inaceptable: prohibidos. Limitado: transparencia. Mínimo o nulo: obligaciones mínimas, autorregulación y códigos de conducta. (Robótica, «Ley europea sobre IA»)"},{"h":"3f53bb06","q":"Según la Ley de IA europea, los sistemas de riesgo mínimo o nulo…","o":["Obligaciones mínimas, con autorregulación y códigos de conducta","No están alcanzados por la ley y pueden usarse sin ninguna regla","Tienen obligaciones específicas de transparencia con los usuarios","Deben cumplir requisitos estrictos antes de su comercialización"],"a":0,"e":"Riesgo mínimo o nulo: obligaciones mínimas, fomentando la autorregulación y los códigos de conducta. Los distintos niveles implican más o menos requisitos de cumplimiento. (Robótica, «Ley europea sobre IA»)"},{"h":"dc65adf0","q":"¿Cuál es el objetivo de la Ley de IA de la Unión Europea?","o":["Que la IA usada en la UE sea segura, transparente, ética, imparcial y esté bajo control humano","Que solo empresas con sede en la UE puedan proveer sistemas de IA dentro del territorio europeo","Que todos los sistemas de IA sean de código abierto y puedan ser auditados por cualquier ciudadano","Que los sistemas de IA se registren en una base de datos pública antes de entrenarse con datos"],"a":0,"e":"Es el primer marco legal integral sobre IA a nivel mundial, y su objetivo es garantizar que los sistemas de IA de la UE sean seguros, transparentes, éticos e imparciales, y que estén bajo control humano. (Robótica, «Ley europea sobre IA»)"},{"h":"9e2afaba","q":"¿Qué establecen las Directrices Éticas para una IA Confiable de la Comisión Europea?","o":["Once ámbitos de acción política para los Estados","Siete requisitos clave para una IA ética","Diez principios centrados en los derechos humanos","Cuatro niveles de riesgo con distintas obligaciones"],"a":1,"e":"Siete requisitos clave: supervisión y agencia humana; robustez técnica y seguridad; privacidad y gobernanza de datos; transparencia; diversidad, no discriminación y equidad; bienestar social y ambiental; y rendición de cuentas. Los niveles de riesgo son de la Ley de IA; los diez principios y los once ámbitos, de la UNESCO. (Robótica, «Ley europea sobre IA»)"},{"h":"08b7bbee","q":"¿Cuál NO es uno de los siete requisitos clave de las Directrices Éticas europeas para una IA confiable?","o":["Robustez técnica y seguridad","Bienestar social y ambiental","Proporcionalidad e inocuidad","Supervisión y agencia humana"],"a":2,"e":"Proporcionalidad e inocuidad es un principio de la UNESCO, no un requisito de las Directrices europeas. (Robótica, «Ley europea sobre IA»)"},{"h":"60cb8f4f","q":"¿Cuál de estos NO figura entre los requisitos clave de las Directrices Éticas europeas para una IA confiable?","o":["Sensibilización y educación","Privacidad y gobernanza de datos","Rendición de cuentas","Transparencia"],"a":0,"e":"Sensibilización y educación es un principio de la UNESCO. Privacidad y gobernanza de datos, transparencia y rendición de cuentas sí son requisitos de las Directrices. (Robótica, «Ley europea sobre IA»)"},{"h":"e0396d2e","q":"¿Cuál es uno de los siete requisitos clave de las Directrices Éticas europeas para una IA confiable?","o":["Proporcionalidad e inocuidad","Gobernanza adaptativa y de múltiples partes","Diversidad, no discriminación y equidad","Sostenibilidad y ODS"],"a":2,"e":"Diversidad, no discriminación y equidad es uno de los siete. Las otras tres opciones son (o se parecen a) principios de la UNESCO. (Robótica, «Ley europea sobre IA»)"},{"h":"fb241bd8","q":"¿Todo robot debe poseer metas?","o":["Sí: tener metas es uno de los aspectos de la definición de robot","No: un robot reactivo actúa con reglas condición–acción, sin metas","No: solo los robots sociales tienen metas, porque se las dan otros agentes","Sí: sin metas no tendría un criterio para elegir qué acción ejecutar"],"a":1,"e":"Un robot aspiradora simple («si choqué, girar; si no, avanzar») no representa ninguna meta. Las metas aparecen en los agentes deliberativos con creencias y metas. (TP5, ej. 3)"},{"h":"e621b42f","q":"¿Todo robot debe poder comunicarse con otros agentes?","o":["No: un robot no puede comunicarse, solo un agente de software puede","Sí: un robot necesita recibir órdenes de otro agente para poder actuar","Sí: la comunicación es uno de los cuatro aspectos que definen a un robot","No: comunicarse es lo que define a un agente social, y no todo robot lo es"],"a":3,"e":"La comunicación caracteriza a los robots contemporáneos, pero no es un requisito: un brazo soldador en una línea de montaje es un robot y no intercambia mensajes con nadie. (TP5, ej. 3)"},{"h":"ebcc0dc1","q":"¿Por qué conviene que un robot combine control reactivo y deliberativo?","o":["El reactivo planifica a largo plazo y el deliberativo resuelve las emergencias","El reactivo responde enseguida pero no anticipa; el deliberativo planifica pero es lento","Hacen lo mismo, y se combinan para tener redundancia en caso de que uno de los dos falle","El deliberativo solo sirve en simulación y el reactivo solo en el mundo real"],"a":1,"e":"Las fortalezas de uno cubren las debilidades del otro: frenar ante un peatón exige reacción inmediata; elegir una ruta alternativa con varios pedidos exige deliberar. (TP5, ej. 4)"},{"h":"d7f4166d","q":"Un robot de delivery tiene tres paquetes para distintos barrios y encuentra la calle principal cortada. ¿Qué control es indispensable en esa situación?","o":["Reactivo: esquivar el corte en el momento con una regla condición–acción","Ninguno: el robot debe esperar a que un operador humano le indique qué hacer","Reactivo: volver al comercio, que es la acción por defecto ante un imprevisto","Deliberativo: revisar creencias, buscar otra ruta y ordenar las entregas"],"a":3,"e":"Ninguna regla sobre lo que percibe en ese momento resuelve el problema: necesita razonar sobre su mapa y sus metas. El reactivo es indispensable, en cambio, ante un peatón que se cruza. (TP5, ej. 4)"},{"h":"cbb280e6","q":"El robot de delivery del TP5 recibe pedidos, se coordina con el empleado para la carga y con el cliente para la entrega. ¿Qué tipo de agente es?","o":["Un agente social, pero sin metas","Un agente reactivo con estado interno","Un agente con metas, pero no social","Un agente con metas y social"],"a":3,"e":"Tiene una meta (que el paquete llegue) y elige cómo lograrla; y es social porque percibe y envía mensajes a otros agentes, sin lo cual no podría cumplir su meta. (TP5, ej. 5)"},{"h":"0042769f","q":"Un robot creía que el pasillo estaba libre y ahora percibe un obstáculo. ¿Qué operador de cambio de creencias necesita?","o":["Contracción","Expansión","Actualización","Revisión"],"a":3,"e":"La información nueva contradice lo que creía: la revisión la incorpora manteniendo la consistencia. La expansión solo agrega sin chequear consistencia, y la contracción solo olvida. (TP5, ej. 2)"},{"h":"d8326e52","q":"¿Qué tema de la materia usa un robot móvil para encontrar la ruta más corta en un mapa?","o":["Dinámica de creencias: revisar su modelo del mundo","Agentes: el ciclo percibir–actuar con sensores y efectores","Planificación: armar una secuencia de acciones con STRIPS","Búsqueda: un camino en un grafo, por ejemplo con A*"],"a":3,"e":"Ir de un lugar a otro es buscar un camino en el mapa; con A* y una heurística como la distancia, encuentra la ruta más corta. (TP5, ej. 2)"},{"h":"45fcdd1e","q":"¿Qué tema de la materia usa un robot para armar la secuencia de acciones que logra su meta, como llevar cajas entre habitaciones?","o":["Agentes reactivos con estado interno","Planificación, por ejemplo con STRIPS","Dinámica de creencias con revisión","Búsqueda de caminos en un grafo con A*"],"a":1,"e":"La cátedra usa un robot de delivery como dominio de STRIPS, con operadores como ir_a, levantar_caja y soltar_caja. (TP5, ej. 2)"},{"h":"c29cd504","q":"Un robot percibe que hay una caja en la habitación, algo que no contradice nada de lo que creía. ¿Qué operador de cambio de creencias usa?","o":["Contracción","Expansión","Revisión","Actualización"],"a":1,"e":"La expansión agrega información nueva sin chequear consistencia; acá no hace falta, porque no contradice nada. Si la contradijera, haría falta revisión; para olvidar, contracción. (TP5, ej. 2)"},{"h":"1cf7aaf4","q":"Un chico cruza corriendo delante del robot de delivery. ¿Qué control es indispensable en esa situación?","o":["Ninguno: debe pedirle instrucciones a un operador humano","Deliberativo: consultar el mapa antes de decidir qué hacer","Reactivo: frenar en el acto con una regla condición–acción","Deliberativo: revisar sus creencias y replanificar la ruta"],"a":2,"e":"Tiene que frenar en el acto; si se pusiera a razonar, lo atropellaría. El reactivo responde casi instantáneamente. (TP5, ej. 4)"},{"h":"114d4cb5","q":"En el robot de delivery del TP5, ¿qué capacidad corresponde al aspecto de comunicación?","o":["Usar GPS y cámaras para ubicarse y detectar a los peatones","Recordar su ubicación, el nivel de su batería y si lleva un pedido","Hacer todo el recorrido sin un operador que lo controle","Recibir pedidos y avisarles al empleado y al cliente que llegó"],"a":3,"e":"Comunicación: recibir pedidos del sistema, avisar al empleado que llegó y saber cuándo terminó de cargar, avisar al cliente y dejarlo abrir el compartimento. GPS y cámaras son interactividad; sin operador, autonomía; recordar, estado interno. (TP5, ej. 5)"},{"h":"ee02a027","q":"En el robot de delivery del TP5, ¿qué capacidad corresponde al aspecto de interactividad?","o":["Hacer todo el recorrido de entrega sin un operador que lo controle a distancia","GPS, cámaras y sensores de distancia, más ruedas y un compartimento con tapa","Ruedas para ir del comercio al cliente por veredas y cruces peatonales","Mensajes con la empresa, con el empleado del comercio y con el cliente"],"a":1,"e":"Interactividad = sensores (GPS, cámaras, sensores de distancia) + efectores (ruedas y compartimento
