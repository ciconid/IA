azado. D defiende a B, no a A. (Ep. X, parte 1)","x":"<div class=\"ctx-tit\">Derrotas entre argumentos<\/div><svg class=\"ctx-svg\" style=\"max-width:102px\" viewBox=\"-10 0 102.0 260\" role=\"img\" aria-label=\"B derrota a A, C derrota a B y D derrota a C.\"><defs><marker id=\"pt\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"punta\"/><\/marker><\/defs><line x1=\"31.0\" y1=\"203\" x2=\"31.0\" y2=\"180\" class=\"ar\" marker-end=\"url(#pt)\"/><line x1=\"31.0\" y1=\"139\" x2=\"31.0\" y2=\"116\" class=\"ar\" marker-end=\"url(#pt)\"/><line x1=\"31.0\" y1=\"75\" x2=\"31.0\" y2=\"52\" class=\"ar\" marker-end=\"url(#pt)\"/><circle cx=\"31.0\" cy=\"222\" r=\"19\" class=\"nodo\"/><text x=\"31.0\" y=\"227\" class=\"tn\">D<\/text><circle cx=\"31.0\" cy=\"158\" r=\"19\" class=\"nodo\"/><text x=\"31.0\" y=\"163\" class=\"tn\">C<\/text><circle cx=\"31.0\" cy=\"94\" r=\"19\" class=\"nodo\"/><text x=\"31.0\" y=\"99\" class=\"tn\">B<\/text><circle cx=\"31.0\" cy=\"30\" r=\"19\" class=\"nodo\"/><text x=\"31.0\" y=\"35\" class=\"tn\">A<\/text><\/svg><p class=\"et2\">La flecha va del derrotador al derrotado.<\/p>"},{"h":"1282d256","q":"B y C derrotan a A; D derrota a B, y nadie derrota a C ni a D. ¿Cómo queda A?","o":["Rechazado, porque C queda aceptado","Aceptado, porque D derrota a B","Aceptado, porque uno de sus dos derrotadores cae","Rechazado, porque tiene dos derrotadores"],"a":0,"e":"D aceptado → B rechazado; pero C no está derrotado, así que queda aceptado, y alcanza con un derrotador aceptado para rechazar a A. (Ep. X, parte 1)","x":"<div class=\"ctx-tit\">Derrotas entre argumentos<\/div><svg class=\"ctx-svg\" style=\"max-width:164px\" viewBox=\"-10 0 164.00000000000003 196\" role=\"img\" aria-label=\"B y C derrotan a A; D derrota a B.\"><defs><marker id=\"pt\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"punta\"/><\/marker><\/defs><line x1=\"31.0\" y1=\"139\" x2=\"31.0\" y2=\"116\" class=\"ar\" marker-end=\"url(#pt)\"/><line x1=\"31.0\" y1=\"75\" x2=\"62.0\" y2=\"52\" class=\"ar\" marker-end=\"url(#pt)\"/><line x1=\"93.0\" y1=\"75\" x2=\"62.0\" y2=\"52\" class=\"ar\" marker-end=\"url(#pt)\"/><circle cx=\"31.0\" cy=\"158\" r=\"19\" class=\"nodo\"/><text x=\"31.0\" y=\"163\" class=\"tn\">D<\/text><circle cx=\"31.0\" cy=\"94\" r=\"19\" class=\"nodo\"/><text x=\"31.0\" y=\"99\" class=\"tn\">B<\/text><circle cx=\"93.0\" cy=\"94\" r=\"19\" class=\"nodo\"/><text x=\"93.0\" y=\"99\" class=\"tn\">C<\/text><circle cx=\"62.0\" cy=\"30\" r=\"19\" class=\"nodo\"/><text x=\"62.0\" y=\"35\" class=\"tn\">A<\/text><\/svg><p class=\"et2\">La flecha va del derrotador al derrotado.<\/p>"},{"h":"3be73c8c","q":"¿Qué aportan los argumentos aceptados de un sistema argumentativo?","o":["Una garantía para las conclusiones que sustentan","Un orden de credibilidad entre sus informantes","La lista de reglas que hay que borrar de la base","Un valor de certeza para cada una de sus reglas"],"a":0,"e":"Los argumentos aceptados determinan una garantía para las conclusiones que sustentan. (Ep. X, parte 1, «Sistema argumentativo»)"}]},{"id":"u7","nombre":"DeLP","tp":"TP8","qs":[{"h":"391a5452","q":"¿Qué provee DeLP?","o":["Un lenguaje para representar información tentativa y potencialmente en conflicto","Un lenguaje para representar información con valores de certeza numéricos","Un intérprete de Prolog que agrega la negación por falla al lenguaje","Un método para mantener la base de conocimiento libre de contradicciones"],"a":0,"e":"DeLP representa información tentativa (reglas generales con excepciones) y potencialmente en conflicto (posturas de distintas fuentes), con una inferencia argumentativa. (Ep. X, parte 2, «Defeasible Logic Programing (DeLP)»)"},{"h":"bc4e83ca","q":"En DeLP, ¿qué permite expresar la representación de información tentativa?","o":["Reglas con un valor de certeza asociado entre −1 y 1","Hechos que el agente todavía no percibió, pero espera percibir","Reglas generales que valen en la mayoría de los casos, y sus excepciones","Opiniones de distintas fuentes, cada una con su propia credibilidad"],"a":2,"e":"Lo tentativo son las reglas generales con excepciones. Las posturas de distintas fuentes se expresan con la información potencialmente en conflicto. (Ep. X, parte 2)"},{"h":"3f4accab","q":"¿Cuál de estas NO es una característica de DeLP según la cátedra?","o":["Es posible dar una explicación detallada de las respuestas","Las conclusiones se sustentan con valores de certeza numéricos","Las respuestas salen de analizar todos los argumentos relacionados","La preferencia entre argumentos puede adaptarse al dominio"],"a":1,"e":"Las conclusiones están sustentadas con argumentos, no con números. El criterio para comparar argumentos se puede adaptar (podría usar CF o informantes). (Ep. X, parte 2, resumen de DeLP)"},{"h":"7572b8ca","q":"¿Cómo está formado un programa lógico rebatible (Π, Δ)?","o":["Π tiene las reglas y Δ los hechos, todos con un informante","Δ tiene las reglas rebatibles; Π, las reglas estrictas y los hechos","Δ tiene las reglas de Prolog y Π el operador de negación fuerte","Π tiene las reglas rebatibles; Δ, las reglas estrictas y los hechos"],"a":1,"e":"Un PLR es un conjunto Δ de reglas rebatibles y un conjunto Π de reglas estrictas y hechos; también se escribe Π ∪ Δ. (Ep. X, parte 2, «Sintaxis del lenguaje»)"},{"h":"8ef3c94a","q":"¿Cómo se lee la regla rebatible «conclusión -< antecedente»?","o":["Si el antecedente es verdadero, entonces la conclusión es verdadera siempre","El antecedente implica la conclusión con una certeza parcial asociada","Si el antecedente no se puede derivar, entonces se asume la conclusión","Si hay razones para creer el antecedente, hay una razón rebatible para la conclusión"],"a":3,"e":"La conexión vale en muchos casos pero puede tener excepciones. «Siempre» describe una regla estricta; «si no se deriva» describe la negación por falla. (Ep. X, parte 2, «Reglas rebatibles»)"},{"h":"44f2c60f","q":"¿Qué diferencia una regla estricta de una rebatible en DeLP?","o":["La estricta no admite excepciones; la rebatible, sí","La estricta pertenece a Δ; la rebatible, a Π","La rebatible no admite excepciones; la estricta, sí","La estricta no puede tener variables; la rebatible, sí"],"a":0,"e":"Sintácticamente solo cambia la flecha (← o -<), pero la estricta representa información segura y la rebatible, información tentativa. (Ep. X, parte 2, «Reglas estrictas»)"},{"h":"f85b6f73","q":"¿Quién decide si una regla se representa como estricta o como rebatible?","o":["El intérprete de DeLP, según aparezcan contradicciones","La persona que codifica el conocimiento, según el dominio","El orden de preferencia que se define entre las reglas","Nadie: las reglas con negación fuerte son siempre estrictas"],"a":1,"e":"Depende del dominio de aplicación y es responsabilidad de quien codifica el conocimiento: si hay excepciones, debe ser rebatible. (Ep. X, parte 2, «Reglas estrictas»)"},{"h":"03759ad7","q":"En este Δc, la segunda regla es…","o":["Una regla que se aplica con cualquier semáforo en rojo","Una excepción a la primera regla","Una regla inválida, porque contradice a la primera","Una regla estricta, por tener más condiciones"],"a":1,"e":"La primera dice que el rojo es una buena razón para no cruzar; la segunda es una excepción (emergencia) y la tercera, una excepción a la excepción. Cuáles se pueden usar depende de los hechos percibidos. (Ep. X, parte 2, «Reglas rebatibles»)","x":"<div class=\"ctx-tit\">Reglas rebatibles<\/div><pre>Δc = { ~cruzar -&lt; semaforo(rojo).\n        cruzar -&lt; semaforo(rojo), emergencia.\n       ~cruzar -&lt; semaforo(rojo), emergencia, hay_peligro. }<\/pre>"},{"h":"e9d71442","q":"En DeLP, ¿qué es un hecho?","o":["Una regla estricta con variables","Una regla rebatible sin cuerpo","Un literal fijo, sin variables","Un literal que puede tener variables"],"a":2,"e":"Los hechos deben estar completamente instanciados, y son los que propagan esas instancias en las derivaciones. (Ep. X, parte 2, «Hechos»)"},{"h":"79cc154c","q":"¿Cómo conviene representar «si es de noche, generalmente no hay luz» en DeLP?","o":["~luz ← noche, una regla estricta","~luz, un hecho del programa","luz -< ~noche, una regla rebatible","~luz -< noche, una regla rebatible"],"a":3,"e":"«Generalmente» indica que puede haber excepciones (por ejemplo, luna llena): es información tentativa. (TP8, ej. 1.d)"},{"h":"36850891","q":"¿Cómo conviene representar «si la linterna está apagada, entonces no está encendida» en DeLP?","o":["~encendida -< apagada, una regla rebatible","encendida -< ~apagada, una regla rebatible","apagada ← ~encendida, una regla estricta","~encendida ← apagada, una regla estricta"],"a":3,"e":"Es una conexión que vale siempre, sin excepciones (apagada y encendida son opuestos): información segura. (TP8, ej. 1.d)"},{"h":"c87fe036","q":"Sintácticamente, ¿cómo se distingue en DeLP una regla estricta de una rebatible?","o":["Por el cuerpo: las rebatibles tienen un único literal","Por una prioridad numérica que se escribe junto a cada regla","Solo por la flecha: ← en la estricta y -< en la rebatible","Por la negación fuerte: las rebatibles llevan ~ en la cabeza"],"a":2,"e":"Sintácticamente solo cambia la flecha (L0 ← L1, …, Ln vs. L0 -< L1, …, Ln), aunque la diferencia semántica es enorme: segura vs. tentativa. (TP8, ej. 1.b)"},{"h":"08f9ba0d","q":"Frente a Prolog estándar, ¿qué agrega DeLP?","o":["Negación fuerte y reglas rebatibles, y decide qué conclusión prevalece","Valores de certeza numéricos para cada regla y cada hecho del programa","Un orden total obligatorio entre todas las reglas y hechos del programa","Negación por falla, que en DeLP sí puede usarse en la cabeza de las reglas"],"a":0,"e":"Prolog solo tiene negación por falla y, si deriva un literal y su opuesto, responde true a los dos. DeLP agrega ~ y reglas rebatibles, y compara argumentos a favor y en contra para decidir. (TP8, ej. 1.c)"},{"h":"b6400eae","q":"Frente a la lógica clásica, ¿qué ventaja tiene DeLP para representar conocimiento?","o":["Sus conclusiones nunca se retractan cuando se agrega información nueva","No necesita reglas, porque todo el conocimiento se representa con hechos","Admite información tentativa y en conflicto; la lógica clásica es monotónica","Garantiza que a partir del programa nunca se derive un literal y su complemento"],"a":2,"e":"La lógica clásica es monotónica: para no concluir contradicciones hay que mantener la base consistente. DeLP admite contradicciones potenciales y una inferencia que decide. (TP8, ej. 1.c)"},{"h":"15040eb4","q":"¿Cómo conviene representar «si la linterna está encendida, entonces no está apagada» en DeLP?","o":["~apagada -< encendida, una regla rebatible","~encendida -< apagada, una regla rebatible","apagada ← ~encendida, una regla estricta","~apagada ← encendida, una regla estricta"],"a":3,"e":"Encendida y apagada son opuestos por definición: no hay excepciones, así que es estricta. (TP8, ej. 1.d.ii)"},{"h":"dbc9df14","q":"Sabiendo que sin batería la linterna no ilumina, ¿cómo conviene representar «si es de noche y tengo una linterna, entonces puedo iluminar»?","o":["ilumina -< de_noche, tengo_linterna, una regla rebatible","tengo_linterna ← de_noche, ilumina, una regla estricta","~ilumina -< de_noche, tengo_linterna, una regla rebatible","ilumina ← de_noche, tengo_linterna, una regla estricta"],"a":0,"e":"No dice «generalmente», pero tiene una excepción (sin batería no ilumina), así que es rebatible. Si fuera estricta, con ~tiene_bateria en Π se derivarían ilumina y ~ilumina solo con información segura. (TP8, ej. 1.d.iv)"},{"h":"70b5782d","q":"¿Cómo conviene representar «si la linterna no tiene batería, entonces no ilumina» en DeLP?","o":["~tiene_bateria -< ~ilumina, una regla rebatible","ilumina ← tiene_bateria, una regla estricta","~ilumina -< ~tiene_bateria, una regla rebatible","~ilumina ← ~tiene_bateria, una regla estricta"],"a":3,"e":"Sin batería, la linterna no ilumina nunca: no hay excepciones, así que es estricta. (TP8, ej. 1.d.v)"},{"h":"00bdcf2e","q":"¿Cómo conviene representar «si es de noche y hay luna llena, entonces hay luz» en DeLP?","o":["~hay_luz -< de_noche, luna_llena, una regla rebatible","hay_luz -< de_noche, luna_llena, una regla rebatible","luna_llena ← de_noche, hay_luz, una regla estricta","hay_luz ← de_noche, luna_llena, una regla estricta"],"a":1,"e":"Es una excepción a «de noche generalmente no hay luz», y a su vez puede tener excepciones (una noche nublada): rebatible. (TP8, ej. 1.d.vi)"},{"h":"76c6556f","q":"Con este programa, ¿cuál es una derivación rebatible de ~comprar_acciones(acme)?","o":["en_fusion(acme,strong), riesgosa(acme), ~comprar_acciones(acme), fusiones_web(acme,strong)","fusiones_web(acme,strong), riesgosa(acme), en_fusion(acme,strong), ~comprar_acciones(acme)","fusiones_web(acme,strong), en_fusion(acme,strong), riesgosa(acme), ~comprar_acciones(acme)","~comprar_acciones(acme), riesgosa(acme), en_fusion(acme,strong), fusiones_web(acme,strong)"],"a":2,"e":"Cada literal debe ser un hecho o la cabeza de una regla instanciada cuyo cuerpo ya apareció antes en la secuencia. Es el ejemplo 3 de la cátedra: usa reglas de los dos tipos. (Ep. X, parte 2, «Derivaciones rebatibles»)","x":"<div class=\"ctx-tit\">Programa (Π, Δ)<\/div><pre>Π = { fusiones_web(acme,strong).\n      en_fusion(X,Y) ← fusiones_web(X,Y). }\n\nΔ = { riesgosa(X) -&lt; en_fusion(X,Y).\n      ~comprar_acciones(X) -&lt; riesgosa(X). }<\/pre>"},{"h":"320dd60d","q":"¿Cuándo una derivación es estricta?","o":["Cuando no hay derivación del complemento","Cuando solo usa hechos y reglas estrictas","Cuando su conclusión es un literal negado","Cuando usa al menos una regla estricta"],"a":1,"e":"Una derivación estricta usa solo elementos de Π; por ejemplo, la de ~riesgosa(strong) con listado_fuertes_web(strong) y dos reglas estrictas. (Ep. X, parte 2, «Derivaciones rebatibles»)"},{"h":"03ad54e8","q":"¿Cuándo un conjunto de hechos y reglas es contradictorio en DeLP?","o":["Cuando tiene dos reglas distintas con la misma cabeza","Cuando tiene reglas rebatibles con la cabeza negada","Cuando permite derivar un literal y también su complemento","Cuando no tiene ningún hecho a partir del cual derivar"],"a":2,"e":"Un conjunto S es contradictorio si de S se obtienen derivaciones rebatibles para p y para ~p. Por ejemplo, Πm ∪ Δm deriva comprar_acciones(acme) y ~comprar_acciones(acme). (Ep. X, parte 2, «Conjunto de reglas contradictorio»)"},{"h":"b11c0dd5","q":"¿Es válido en DeLP este conjunto Π?","o":["Sí: un conjunto con solo dos hechos nunca llega a ser contradictorio","No: Π no puede tener reglas cuya cabeza sea un literal negado","Sí: las contradicciones se resuelven después con árboles de dialéctica","No: Π deriva en_casa y ~en_casa, y Π no puede ser contradictorio"],"a":3,"e":"En todo PLR se asume que Π no es contradictorio: los hechos y las reglas estrictas no pueden inferir conclusiones contradictorias. Solo Π ∪ Δ puede serlo. (Ep. X, parte 2, «Conjunto de reglas contradictorio»)","x":"<div class=\"ctx-tit\">Conjunto Π<\/div><pre>Π = { ~en_casa ← en_supermercado.\n      en_supermercado.\n      en_casa. }<\/pre>"},{"h":"d1a90cdb","q":"En DeLP, ¿qué es una derivación rebatible de un literal L?","o":["Una secuencia de argumentos que empieza con uno para L y en la que cada argumento derrota al anterior","Una secuencia de reglas rebatibles en la que cada regla es preferida a la regla que la precede","Una secuencia de literales fijos que termina en L: cada uno es un hecho o cabeza de una regla con cuerpo ya obtenido","Un conjunto mínimo y no contradictorio de reglas rebatibles que, junto con el conjunto Π, permite obtener L"],"a":2,"e":"Cada literal de la secuencia es un hecho de Π o la cabeza de una instancia de regla (estricta o rebatible) cuyo cuerpo ya apareció antes. El conjunto mínimo y no contradictorio es un argumento; la secuencia de derrotadores, una línea de argumentación. (TP8, ej. 2.a)"},{"h":"23a67183","q":"En P2, ¿cuántas derivaciones distintas tiene vuela(tina)?","o":["Una sola: con R1, a partir de ave(tina)","Ninguna: lo impide la derivación de ~vuela(tina)","Dos: una con R1 y otra con R3","Tres: con R1, con R3 y con R1 y R3 juntas"],"a":2,"e":"D1: gallina(tina), ave(tina) (estricta), vuela(tina) (R1). D2: gallina(tina), asustada(tina), vuela(tina) (R3). Una derivación no controla contradicciones. (TP8, ej. 2.a)","x":"<div class=\"ctx-tit\">Programa P2 = (Π2, Δ2)<\/div><pre>Π2 = { asustada(tina).\n       gallina(tina).\n       gallina(peluche).\n       ~vuela(peluche).\n       ave(X) ← gallina(X). }\n\nΔ2 = { R1: vuela(X) -&lt; ave(X).\n       R2: ~vuela(X) -&lt; gallina(X).\n       R3: vuela(X) -&lt; gallina(X), asustada(X).\n       R4: anida_en_ramas_altas(X) -&lt; vuela(X). }<\/pre>"},{"h":"975c7a9b","q":"En P2, ¿qué derivaciones tiene ~vuela(peluche)?","o":["Dos: el hecho, y R2 con gallina(peluche)","Una sola: con R2, a partir de gallina(peluche)","Una sola: el hecho ~vuela(peluche) de Π2","Ninguna, porque vuela(peluche) también se deriva"],"a":0,"e":"D6: el hecho ~vuela(peluche) (derivación estricta). D7: gallina(peluche), ~vuela(peluche) por R2 (rebatible). (TP8, ej. 2.a)","x":"<div class=\"ctx-tit\">Programa P2 = (Π2, Δ2)<\/div><pre>Π2 = { asustada(tina).\n       gallina(tina).\n       gallina(peluche).\n       ~vuela(peluche).\n       ave(X) ← gallina(X). }\n\nΔ2 = { R1: vuela(X) -&lt; ave(X).\n       R2: ~vuela(X) -&lt; gallina(X).\n       R3: vuela(X) -&lt; gallina(X), asustada(X).\n       R4: anida_en_ramas_altas(X) -&lt; vuela(X). }<\/pre>"},{"h":"cc2b1837","q":"En P2, ¿por qué R3 no sirve para derivar vuela(peluche)?","o":["Porque asustada(peluche) no se puede derivar","Porque ~vuela(peluche) es un hecho de Π2","Porque R3 es preferida a R2 en el orden","Porque R3 solo se instancia con tina"],"a":0,"e":"R3 necesita gallina(X) y asustada(X); asustada(peluche) no es un hecho ni cabeza de ninguna regla. vuela(peluche) sí se deriva, pero con R1. (TP8, ej. 2.a)","x":"<div class=\"ctx-tit\">Programa P2 = (Π2, Δ2)<\/div><pre>Π2 = { asustada(tina).\n       gallina(tina).\n       gallina(peluche).\n       ~vuela(peluche).\n       ave(X) ← gallina(X). }\n\nΔ2 = { R1: vuela(X) -&lt; ave(X).\n       R2: ~vuela(X) -&lt; gallina(X).\n       R3: vuela(X) -&lt; gallina(X), asustada(X).\n       R4: anida_en_ramas_altas(X) -&lt; vuela(X). }<\/pre>"},{"h":"eb191405","q":"En P2, ¿qué tipo de derivación tiene asustada(tina)?","o":["Ninguna: no es cabeza de reglas","Rebatible: sale de la regla R3","Estricta: es un hecho de Π2","Rebatible: sale de la regla R4"],"a":2,"e":"asustada(tina) es un hecho; una derivación que solo usa hechos y reglas estrictas de Π es estricta. (TP8, ej. 2.a)","x":"<div class=\"ctx-tit\">Programa P2 = (Π2, Δ2)<\/div><pre>Π2 = { asustada(tina).\n       gallina(tina).\n       gallina(peluche).\n       ~vuela(peluche).\n       ave(X) ← gallina(X). }\n\nΔ2 = { R1: vuela(X) -&lt; ave(X).\n       R2: ~vuela(X) -&lt; gallina(X).\n       R3: vuela(X) -&lt; gallina(X), asustada(X).\n       R4: anida_en_ramas_altas(X) -&lt; vuela(X). }<\/pre>"},{"h":"f3d4eeb7","q":"¿Para qué sirve que un programa lógico rebatible (Π, Δ) sea contradictorio?","o":["Para detectar errores de carga en los hechos del programa","Para que el intérprete responda siempre yes o no, nunca undecided","Para representar reglas con excepciones y posturas en conflicto","Para que los hechos de Π puedan contradecirse entre sí"],"a":2,"e":"La contradicción es lo que permite representar información tentativa (reglas y sus excepciones) y opiniones distintas; no se evita, la resuelve la inferencia comparando argumentos. Π, en cambio, no puede ser contradictorio. (TP8, ej. 2.c)"},{"h":"9fe9e190","q":"En P2, ¿por qué Π2 ∪ Δ2 es contradictorio pero Π2 no lo es?","o":["Los pares vuela / ~vuela solo aparecen al usar reglas de Δ2","Porque Π2 deriva vuela(peluche) y también ~vuela(peluche)","Porque las reglas rebatibles nunca causan contradicciones","Porque Π2 no tiene ningún literal con negación fuerte"],"a":0,"e":"Con Δ2 se derivan vuela(tina) y ~vuela(tina), y vuela(peluche) y ~vuela(peluche). Solo con Π2 se derivan los hechos y ave(tina), ave(peluche): el único negado, ~vuela(peluche), no tiene su complemento. (TP8, ej. 2.d)","x":"<div class=\"ctx-tit\">Programa P2 = (Π2, Δ2)<\/div><pre>Π2 = { asustada(tina).\n       gallina(tina).\n       gallina(peluche).\n       ~vuela(peluche).\n       ave(X) ← gallina(X). }\n\nΔ2 = { R1: vuela(X) -&lt; ave(X).\n       R2: ~vuela(X) -&lt; gallina(X).\n       R3: vuela(X) -&lt; gallina(X), asustada(X).\n       R4: anida_en_ramas_altas(X) -&lt; vuela(X). }<\/pre>"},{"h":"e3a5963d","q":"¿Qué tres condiciones debe cumplir A para que <A, h> sea un argumento?","o":["Derivación, consistencia y minimalidad","Derivación, completitud y maximalidad","Consistencia, monotonía y minimalidad","Derivación, preferencia y garantía"],"a":0,"e":"(1) A ∪ Π deriva h; (2) A ∪ Π no es contradictorio; (3) ningún subconjunto propio de A cumple (1) y (2). (Ep. X, parte 2, «Argumentos»)"},{"h":"68ba765b","q":"En un argumento <A, h>, el conjunto A contiene…","o":["Reglas rebatibles de Δ con sus variables","Solo reglas rebatibles instanciadas de Δ","Todas las reglas usadas en la derivación de h","Los hechos y las reglas estrictas de Π que usa"],"a":1,"e":"El conjunto solo incluye reglas rebatibles instanciadas; los elementos de Π se usan para derivar pero no forman parte de A. (Ep. X, parte 2, «Observaciones importantes»)"},{"h":"2c6b28e7","q":"¿Cuál es el argumento para un literal que es un hecho del programa?","o":["El que tiene el conjunto vacío de reglas","Ninguno: los hechos no tienen argumentos en DeLP","El que tiene el propio hecho como única regla","El formado por las reglas estrictas que lo derivan"],"a":0,"e":"El argumento para un hecho es el conjunto vacío; por ejemplo <G, ~riesgosa(strong)> con G = { }, porque se deriva solo con Π. (Ep. X, parte 2)"},{"h":"f14196be","q":"¿Por qué R = {en_casa -< de_noche} no es un argumento para en_casa?","o":["Porque R no es mínimo: el conjunto vacío también deriva en_casa","Porque R ∪ Πn es contradictorio: deriva en_casa y ~en_casa","Porque la regla de R tiene un antecedente que es un hecho","Porque R ∪ Πn no permite derivar el literal en_casa"],"a":1,"e":"Falla la condición (2), consistencia: Πn deriva ~en_casa (por en_supermercado) y R agrega en_casa. (Ep. X, parte 2, «Algunos detalles sobre las condiciones de los argumentos»)","x":"<div class=\"ctx-tit\">Programa (Πn, Δn)<\/div><pre>Πn = { ~en_casa ← en_supermercado.\n       en_supermercado.\n       de_noche.\n       festejo. }\n\nΔn = { en_casa -&lt; de_noche.\n       preparo_cena -&lt; de_noche.\n       ~preparo_cena -&lt; festejo.\n       acuesto_tarde -&lt; festejo.\n       en_oficina -&lt; trabajando. }<\/pre>"},{"h":"e240f918","q":"¿Por qué S = {~preparo_cena -< festejo. acuesto_tarde -< festejo.} no es un argumento para ~preparo_cena?","o":["Porque un argumento no puede tener dos reglas con el mismo cuerpo","Porque S ∪ Πn es contradictorio para preparo_cena","Porque no es mínimo: B = {~preparo_cena -< festejo} ya alcanza","Porque S ∪ Πn no permite derivar ~preparo_cena"],"a":2,"e":"Falla la condición (3), minimalidad: B ⊂ S también cumple derivación y consistencia. La regla acuesto_tarde está de más. (Ep. X, parte 2)","x":"<div class=\"ctx-tit\">Programa (Πn, Δn)<\/div><pre>Πn = { ~en_casa ← en_supermercado.\n       en_supermercado.\n       de_noche.\n       festejo. }\n\nΔn = { en_casa -&lt; de_noche.\n       preparo_cena -&lt; de_noche.\n       ~preparo_cena -&lt; festejo.\n       acuesto_tarde -&lt; festejo.\n       en_oficina -&lt; trabajando. }<\/pre>"},{"h":"45c8451c","q":"¿Por qué Q = {en_oficina -< trabajando} no es un argumento para en_oficina?","o":["Porque Q no es mínimo: el conjunto vacío deriva en_oficina","Porque Q ∪ Πn no deriva en_oficina: trabajando no se puede derivar","Porque Q ∪ Πn es contradictorio, ya que deriva ~en_casa","Porque en_oficina no aparece en ninguna regla estricta de Πn"],"a":1,"e":"Falla la condición (1), derivación: no hay ningún hecho trabajando en Πn. (Ep. X, parte 2)","x":"<div class=\"ctx-tit\">Programa (Πn, Δn)<\/div><pre>Πn = { ~en_casa ← en_supermercado.\n       en_supermercado.\n       de_noche.\n       festejo. }\n\nΔn = { en_casa -&lt; de_noche.\n       preparo_cena -&lt; de_noche.\n       ~preparo_cena -&lt; festejo.\n       acuesto_tarde -&lt; festejo.\n       en_oficina -&lt; trabajando. }<\/pre>"},{"h":"8073f79d","q":"En P2, ¿cuántos argumentos tiene vuela(tina)?","o":["Tres: {R1}, {R3} y {R1, R3}","Dos: {R1} y {R3}, instanciadas","Ninguno: lo impide ~vuela(tina)","Uno: {R1, R3}, las dos reglas juntas"],"a":1,"e":"A1 = {vuela(tina) -< ave(tina)} y A2 = {vuela(tina) -< gallina(tina), asustada(tina)}. {R1, R3} no es mínimo. Que ~vuela(tina) también tenga argumento no impide que existan: los vuelve contra-argumentos. (TP8, ej. 3.b)","x":"<div class=\"ctx-tit\">Programa P2 = (Π2, Δ2)<\/div><pre>Π2 = { asustada(tina).\n       gallina(tina).\n       gallina(peluche).\n       ~vuela(peluche).\n       ave(X) ← gallina(X). }\n\nΔ2 = { R1: vuela(X) -&lt; ave(X).\n       R2: ~vuela(X) -&lt; gallina(X).\n       R3: vuela(X) -&lt; gallina(X), asustada(X).\n       R4: anida_en_ramas_altas(X) -&lt; vuela(X). }<\/pre>"},{"h":"76157926","q":"En P2, ¿cuántos argumentos tiene anida_en_ramas_altas(tina)?","o":["Uno: {R4, R1, R3} instanciadas para tina","Ninguno: vuela(tina) no está garantizado","Uno: solo {R4} instanciada para tina","Dos: R4 junto con R1, y R4 junto con R3"],"a":3,"e":"C1 = {R4, R1} y C2 = {R4, R3}, instanciadas para tina. {R4} sola no deriva vuela(tina); {R4, R1, R3} no es mínimo. Un argumento no necesita que sus sub-conclusiones estén garantizadas. (TP8, ej. 3.b)","x":"<div class=\"ctx-tit\">Programa P2 = (Π2, Δ2)<\/div><pre>Π2 = { asustada(tina).\n       gallina(tina).\n       gallina(peluche).\n       ~vuela(peluche).\n       ave(X) ← gallina(X). }\n\nΔ2 = { R1: vuela(X) -&lt; ave(X).\n       R2: ~vuela(X) -&lt; gallina(X).\n       R3: vuela(X) -&lt; gallina(X), asustada(X).\n       R4: anida_en_ramas_altas(X) -&lt; vuela(X). }<\/pre>"},{"h":"b62abdeb","q":"En P2, ¿por qué {R4, R1, R2} instanciadas para tina no es un argumento para anida_en_ramas_altas(tina)?","o":["Porque mezcla reglas rebatibles con la regla estricta de Π2","Porque R4 tiene en el cuerpo un literal que no es un hecho de Π2","Porque un argumento no puede tener más de dos reglas","Con Π2 deriva vuela(tina) y ~vuela(tina), y además R2 sobra"],"a":3,"e":"Falla la consistencia (deriva vuela(tina) y ~vuela(tina)) y también la minimalidad (sin R2 ya se deriva la conclusión). (TP8, ej. 3.b)","x":"<div class=\"ctx-tit\">Programa P2 = (Π2, Δ2)<\/div><pre>Π2 = { asustada(tina).\n       gallina(tina).\n       gallina(peluche).\n       ~vuela(peluche).\n       ave(X) ← gallina(X). }\n\nΔ2 = { R1: vuela(X) -&lt; ave(X).\n       R2: ~vuela(X) -&lt; gallina(X).\n       R3: vuela(X) -&lt; gallina(X), asustada(X).\n       R4: anida_en_ramas_altas(X) -&lt; vuela(X). }<\/pre>"},{"h":"9d73284f","q":"¿Qué relación hay entre los argumentos y las derivaciones en DeLP?","o":["Son la misma noción: un argumento es una derivación escrita como conjunto","Toda derivación da un argumento, pero hay argumentos que no tienen derivación","Un argumento no necesita derivación si sus reglas son mínimas y consistentes","Todo argumento se apoya en una derivación, pero no toda derivación es argumento"],"a":3,"e":"La condición (1) de argumento exige una derivación de h desde A ∪ Π; A son las reglas rebatibles que usa. Pero además hace falta consistencia y minimalidad, así que no toda derivación da un argumento. (TP8, ej. 3.c)"},{"h":"afc0df50","q":"En P2, ¿por qué vuela(peluche) tiene una derivación pero no un argumento?","o":["Porque lo que la derive, unido a Π2, choca con el hecho ~vuela(peluche)","Porque la derivación usa la regla estricta ave(X) ← gallina(X) del conjunto Π2","Porque {vuela(peluche) -< ave(peluche)} no es un conjunto mínimo","Porque peluche no está asustada y R3 es la única regla aplicable"],"a":0,"e":"D5 usa R1 y existe, pero A = {R1 para peluche} ∪ Π2 deriva vuela(peluche) y el hecho ~vuela(peluche): no cumple la consistencia. Agregar reglas no lo arregla. (TP8, ej. 3.d)","x":"<div class=\"ctx-tit\">Programa P2 = (Π2, Δ2)<\/div><pre>Π2 = { asustada(tina).\n       gallina(tina).\n       gallina(peluche).\n       ~vuela(peluche).\n       ave(X) ← gallina(X). }\n\nΔ2 = { R1: vuela(X) -&lt; ave(X).\n       R2: ~vuela(X) -&lt; gallina(X).\n       R3: vuela(X) -&lt; gallina(X), asustada(X).\n       R4: anida_en_ramas_altas(X) -&lt; vuela(X). }<\/pre>"},{"h":"48ef9ffd","q":"¿Cuándo ⟨X, p⟩ es un contra-argumento (ataca) a ⟨Y, h⟩?","o":["Cuando es preferido a ⟨Y, h⟩ según el criterio elegido","Cuando su conclusión p coincide con la conclusión h del otro","Cuando está en desacuerdo con algún sub-argumento de ⟨Y, h⟩","Cuando ⟨Y, h⟩ es un sub-argumento de ⟨X, p⟩"],"a":2,"e":"⟨X, p⟩ ataca a ⟨Y, h⟩ si existe un sub-argumento ⟨S, q⟩ de ⟨Y, h⟩ con el que está en desacuerdo; ⟨S, q⟩ es el sub-argumento de desacuerdo (puede ser el propio ⟨Y, h⟩) y q el punto de ataque. La preferencia decide después si el ataque es derrota. (TP8, ej. 4.a)"},{"h":"6b28c611","q":"¿Cuándo dos argumentos ⟨X, f⟩ y ⟨Y, g⟩ están en desacuerdo?","o":["Cuando f y g son el mismo literal","Cuando X ∪ Y no es un conjunto mínimo","Cuando Π ∪ {f, g} es contradictorio","Cuando no son comparables entre sí"],"a":2,"e":"Desacuerdo: Π ∪ {f, g} es contradictorio, por ejemplo si f y g son complementarios. (TP8, ej. 4.a)"},{"h":"98544dd9","q":"Cuando un argumento ataca a otro, ¿con qué se lo compara para decidir si lo derrota?","o":["Con el sub-argumento de desacuerdo del atacado","Con el argumento atacado completo, de la raíz a la conclusión","Con la raíz del árbol de dialéctica","Con todos los argumentos para h"],"a":0,"e":"La preferencia se evalúa entre el atacante y el sub-argumento de desacuerdo, no contra el argumento atacado completo. Preferido: derrotador propio; no comparable: por bloqueo. (TP8, ej. 4.a)"},{"h":"40101fde","q":"En P2, ¿qué ataques hay entre A1 = {R1}, A2 = {R3} (concluyen vuela(tina)) y B = {R2} (concluye ~vuela(tina))?","o":["Ninguno, porque cada argumento tiene una sola regla rebatible","B y A1 se atacan mutuamente, y B y A2 también; A1 y A2 no","A1 ataca a A2, porque usan reglas distintas para vuela(tina)","Solo B ataca a A1 y a A2, porque concluye un literal negado"],"a":1,"e":"vuela(tina) y ~vuela(tina) están en desacuerdo, en las dos direcciones; el sub-argumento de desacuerdo es el argumento completo. A1 y A2 tienen la misma conclusión: no están en desacuerdo. (TP8, ej. 4.b)","x":"<div class=\"ctx-tit\">Programa P2 = (Π2, Δ2)<\/div><pre>Π2 = { asustada(tina).\n       gallina(tina).\n       gallina(peluche).\n       ~vuela(peluche).\n       ave(X) ← gallina(X). }\n\nΔ2 = { R1: vuela(X) -&lt; ave(X).\n       R2: ~vuela(X) -&lt; gallina(X).\n       R3: vuela(X) -&lt; gallina(X), asustada(X).\n       R4: anida_en_ramas_altas(X) -&lt; vuela(X). }<\/pre><div class=\"ctx-tit\">Argumentos y orden entre reglas<\/div><pre>A1 = { vuela(tina) -&lt; ave(tina) }                      (R1)\nA2 = { vuela(tina) -&lt; gallina(tina), asustada(tina) }  (R3)\nB  = { ~vuela(tina) -&lt; gallina(tina) }                 (R2)\n\nOrden: R3 &gt; R2\n       R2 &gt; R1<\/pre>"},{"h":"b473b4d5","q":"En P2, con R3 > R2 y R2 > R1, ¿qué derrotas hay entre A1 = {R1}, A2 = {R3} y B = {R2}?","o":["B derrota a A1 y a A2, en los dos casos con derrota propia","B derrota a A1 y A2 derrota a B, las dos derrotas propias","A1 y B se bloquean, y A2 derrota a B con una derrota propia","A1 derrota a B y B derrota a A2, en los dos casos propias"],"a":1,"e":"B vs. A1: R2 > R1, B preferido → B es derrotador propio de A1. A2 vs. B: R3 > R2 → A2 es derrotador propio de B. Todos los pares son comparables: no hay bloqueos. (TP8, ej. 4.c)","x":"<div class=\"ctx-tit\">Programa P2 = (Π2, Δ2)<\/div><pre>Π2 = { asustada(tina).\n       gallina(tina).\n       gallina(peluche).\n       ~vuela(peluche).\n       ave(X) ← gallina(X). }\n\nΔ2 = { R1: vuela(X) -&lt; ave(X).\n       R2: ~vuela(X) -&lt; gallina(X).\n       R3: vuela(X) -&lt; gallina(X), asustada(X).\n       R4: anida_en_ramas_altas(X) -&lt; vuela(X). }<\/pre><div class=\"ctx-tit\">Argumentos y orden entre reglas<\/div><pre>A1 = { vuela(tina) -&lt; ave(tina) }                      (R1)\nA2 = { vuela(tina) -&lt; gallina(tina), asustada(tina) }  (R3)\nB  = { ~vuela(tina) -&lt; gallina(tina) }                 (R2)\n\nOrden: R3 &gt; R2\n       R2 &gt; R1<\/pre>"},{"h":"5466480c","q":"En P5, ¿cuáles son los argumentos para ~aire_acond?","o":["{R3, R5, R6} y {R4}","{R3} y {R4}","Solo {R4}","{R3, R5} y {R4}"],"a":3,"e":"A1 = {R3, R5}: abrir_ventana sale de R5 (calor es hecho y viento sale de la regla estricta), y ~aire_acond de R3. A2 = {R4}: ahorrar_energia es hecho. {R3} sola no deriva abrir_ventana. (TP8, ej. 5.a)","x":"<div class=\"ctx-tit\">Programa P5 = (Π5, Δ5)<\/div><pre>Π5 = { viento ← viento_caluroso.\n       calor.\n       caluroso.\n       viento_caluroso.\n       ahorrar_energia. }\n\nΔ5 = { R1: aire_acond -&lt; calor.\n       R2: aire_acond -&lt; sofocante.\n       R3: ~aire_acond -&lt; abrir_ventana.\n       R4: ~aire_acond -&lt; ahorrar_energia.\n       R5: abrir_ventana -&lt; calor, viento.\n       R6: ~abrir_ventana -&lt; viento_caluroso. }\n\nOrden: R2 &gt; R4\n       R4 &gt; R1\n       R6 &gt; R5<\/pre>"},{"h":"e7bdcd0e","q":"En P5, ¿por qué la regla R2 nunca se usa en ningún argumento?","o":["Porque caluroso y sofocante son literales complementarios","Porque sofocante no es un hecho ni la cabeza de ninguna regla","Porque R1 ya concluye aire_acond y R2 sería redundante","Porque R2 es la regla más preferida y no puede ser atacada"],"a":1,"e":"Para usar R2 hay que derivar sofocante, que no aparece en ningún lado; en Π5 está caluroso, que ninguna regla usa. Por eso el único argumento para aire_acond es {R1}. (TP8, ej. 5)","x":"<div class=\"ctx-tit\">Programa P5 = (Π5, Δ5)<\/div><pre>Π5 = { viento ← viento_caluroso.\n       calor.\n       caluroso.\n       viento_caluroso.\n       ahorrar_energia. }\n\nΔ5 = { R1: aire_acond -&lt; calor.\n       R2: aire_acond -&lt; sofocante.\n       R3: ~aire_acond -&lt; abrir_ventana.\n       R4: ~aire_acond -&lt; ahorrar_energia.\n       R5: abrir_ventana -&lt; calor, viento.\n       R6: ~abrir_ventana -&lt; viento_caluroso. }\n\nOrden: R2 &gt; R4\n       R4 &gt; R1\n       R6 &gt; R5<\/pre>"},{"h":"3aee697c","q":"En P5, ¿qué contra-argumentos atacan a A1 = {R3, R5}?","o":["B = {R1} en la conclusión, y C = {R6} en D = {R5}","Solo B = {R1}, que ataca la conclusión ~aire_acond","B = {R1}, C = {R6} y también A2 = {R4}","Solo C = {R6}, que ataca directamente la conclusión ~aire_acond"],"a":0,"e":"B concluye aire_acond (desacuerdo con A1 completo). C concluye ~abrir_ventana, en desacuerdo con el sub-argumento D = ⟨{R5}, abrir_ventana⟩. A2 tiene la misma conclusión que A1: no lo ataca. (TP8, ej. 5.a)","x":"<div class=\"ctx-tit\">Programa P5 = (Π5, Δ5)<\/div><pre>Π5 = { viento ← viento_caluroso.\n       calor.\n       caluroso.\n       viento_caluroso.\n       ahorrar_energia. }\n\nΔ5 = { R1: aire_acond -&lt; calor.\n       R2: aire_acond -&lt; sofocante.\n       R3: ~aire_acond -&lt; abrir_ventana.\n       R4: ~aire_acond -&lt; ahorrar_energia.\n       R5: abrir_ventana -&lt; calor, viento.\n       R6: ~abrir_ventana -&lt; viento_caluroso. }\n\nOrden: R2 &gt; R4\n       R4 &gt; R1\n       R6 &gt; R5<\/pre><div class=\"ctx-tit\">Argumentos de P5<\/div><pre>A1 = {R3, R5}  concluye ~aire_acond\n               (sub-argumento D = {R5}, concluye abrir_ventana)\nA2 = {R4}      concluye ~aire_acond\nB  = {R1}      concluye aire_acond\nC  = {R6}      concluye ~abrir_ventana<\/pre>"},{"h":"200be9e2","q":"En P5, ¿qué tipo de derrotador es B = {R1} de A1 = {R3, R5}?","o":["No lo derrota: A1 es preferido a B por la regla R4","Propio: B tiene menos reglas que A1 y por eso gana","Propio: R1 es preferida a R3 y a R5 en el orden dado","Por bloqueo: R1 no se relaciona con R3 ni con R5"],"a":3,"e":"Se compara B con A1 (el sub-argumento de desacuerdo es A1 completo): {R1} vs. {R3, R5}, sin relación entre ellas → no comparables → derrotador por bloqueo. (TP8, ej. 5.b)","x":"<div class=\"ctx-tit\">Programa P5 = (Π5, Δ5)<\/div><pre>Π5 = { viento ← viento_caluroso.\n       calor.\n       caluroso.\n       viento_caluroso.\n       ahorrar_energia. }\n\nΔ5 = { R1: aire_acond -&lt; calor.\n       R2: aire_acond -&lt; sofocante.\n       R3: ~aire_acond -&lt; abrir_ventana.\n       R4: ~aire_acond -&lt; ahorrar_energia.\n       R5: abrir_ventana -&lt; calor, viento.\n       R6: ~abrir_ventana -&lt; viento_caluroso. }\n\nOrden: R2 &gt; R4\n       R4 &gt; R1\n       R6 &gt; R5<\/pre><div class=\"ctx-tit\">Argumentos de P5<\/div><pre>A1 = {R3, R5}  concluye ~aire_acond\n               (sub-argumento D = {R5}, concluye abrir_ventana)\nA2 = {R4}      concluye ~aire_acond\nB  = {R1}      concluye aire_acond\nC  = {R6}      concluye ~abrir_ventana<\/pre>"},{"h":"70c13263","q":"En P5, ¿qué tipo de derrotador es C = {R6} de A1 = {R3, R5}?","o":["Por bloqueo: C y A1 tienen conclusiones de literales distintos","No lo derrota: ataca a D, que no es la conclusión de A1","Por bloqueo: R6 no se relaciona con R3, la regla de la conclusión","Propio: es preferido a D = {R5}, el sub-argumento atacado"],"a":3,"e":"La preferencia se evalúa contra el sub-argumento de desacuerdo D = {R5}: R6 > R5, así que C es derrotador propio de A1. (TP8, ej. 5.b)","x":"<div class=\"ctx-tit\">Programa P5 = (Π5, Δ5)<\/div><pre>Π5 = { viento ← viento_caluroso.\n       calor.\n       caluroso.\n       viento_caluroso.\n       ahorrar_energia. }\n\nΔ5 = { R1: aire_acond -&lt; calor.\n       R2: aire_acond -&lt; sofocante.\n       R3: ~aire_acond -&lt; abrir_ventana.\n       R4: ~aire_acond -&lt; ahorrar_energia.\n       R5: abrir_ventana -&lt; calor, viento.\n       R6: ~abrir_ventana -&lt; viento_caluroso. }\n\nOrden: R2 &gt; R4\n       R4 &gt; R1\n       R6 &gt; R5<\/pre><div class=\"ctx-tit\">Argumentos de P5<\/div><pre>A1 = {R3, R5}  concluye ~aire_acond\n               (sub-argumento D = {R5}, concluye abrir_ventana)\nA2 = {R4}      concluye ~aire_acond\nB  = {R1}      concluye aire_acond\nC  = {R6}      concluye ~abrir_ventana<\/pre>"},{"h":"8a7c2760","q":"En P5, ¿B = {R1} derrota a A2 = {R4}?","o":["Sí, derrota propia: R1 es preferida a R4","Sí, por bloqueo: R1 y R4 no se pueden comparar","No: lo ataca, pero A2 es preferido (R4 > R1)","No: B ni siquiera ataca a A2"],"a":2,"e":"B concluye aire_acond y A2 ~aire_acond: hay ataque. Pero R4 > R1, así que A2 es preferido a B y el ataque no es derrota. (TP8, ej. 5.b)","x":"<div class=\"ctx-tit\">Programa P5 = (Π5, Δ5)<\/div><pre>Π5 = { viento ← viento_caluroso.\n       calor.\n       caluroso.\n       viento_caluroso.\n       ahorrar_energia. }\n\nΔ5 = { R1: aire_acond -&lt; calor.\n       R2: aire_acond -&lt; sofocante.\n       R3: ~aire_acond -&lt; abrir_ventana.\n       R4: ~aire_acond -&lt; ahorrar_energia.\n       R5: abrir_ventana -&lt; calor, viento.\n       R6: ~abrir_ventana -&lt; viento_caluroso. }\n\nOrden: R2 &gt; R4\n       R4 &gt; R1\n       R6 &gt; R5<\/pre><div class=\"ctx-tit\">Argumentos de P5<\/div><pre>A1 = {R3, R5}  concluye ~aire_acond\n               (sub-argumento D = {R5}, concluye abrir_ventana)\nA2 = {R4}      concluye ~aire_acond\nB  = {R1}      concluye aire_acond\nC  = {R6}      concluye ~abrir_ventana<\/pre>"},{"h":"a54baa0c","q":"¿Por qué no existe un argumento que use la regla b -< h5?","o":["Porque b -< h2 ya deriva b y entonces no sería mínimo","Porque b -< h5 contradice a ~b -< h4, que está en Δ","Porque b -< h5 no tiene prioridad sobre ninguna regla","Porque h5 no es un hecho ni se deriva en el programa"],"a":3,"e":"Sin h5 no hay derivación de b por esa regla: falla la condición de derivación. La minimalidad se evalúa dentro de cada argumento, no entre argumentos distintos. (Resolución con DeLP)","x":"<div class=\"ctx-tit\">Programa de la «Resolución con DeLP»<\/div><pre>Π = { h1.  h2.  h3.  h4. }\n\nΔ = { a -&lt; h1.     b -&lt; h2.     c -&lt; h2.\n      a -&lt; b.      b -&lt; h5.    ~c -&lt; d.\n     ~a -&lt; c.     ~b -&lt; h4.     d -&lt; h3.\n                               ~d -&lt; h4. }\n\nOrden entre reglas:\n  (~a -&lt; c)  &gt; (a -&lt; h1)\n  (b -&lt; h2)  &gt; (~b -&lt; h4)\n  (~c -&lt; d)  &gt; (c -&lt; h2)<\/pre>"},{"h":"ac7acb7b","q":"En DeLP, ¿cuándo <S, q> es un sub-argumento de <A, h>?","o":["Cuando S ∪ A es contradictorio","Cuando q = h","Cuando A ⊆ S","Cuando S ⊆ A"],"a":3,"e":"Un sub-argumento usa una parte de las reglas del argumento; por ejemplo, <F, c> con F = {c -< h2} es sub-argumento de <C, ~a>. (Resolución con DeLP)"},{"h":"5888169a","q":"Con el criterio de prioridad entre reglas, ¿cuándo <B, f> es preferido a <A, g>?","o":["B tiene al menos una regla mejor que alguna de A, sin otra condición","B tiene una regla mejor que alguna de A, y A ninguna mejor que una de B","B tiene más reglas rebatibles que A, y las dos derivan su conclusión","Todas las reglas de B son mejores que todas las reglas de A"],"a":1,"e":"Hacen falta las dos condiciones. Si cada uno tiene alguna regla mejor que el otro, o ninguno tiene, no son comparables. (Resolución con DeLP)"},{"h":"45d72092","q":"<X, p> ataca a <Y, h> en el sub-argumento de desacuerdo <S, q>, y <X, p> no es comparable con <S, q>. ¿Qué es <X, p>?","o":["Un derrotador propio de <Y, h>","Un contra-argumento que no lo derrota","Un sub-argumento de desacuerdo de <Y, h>","Un derrotador por bloqueo de <Y, h>"],"a":3,"e":"Si X es preferido a S, es derrotador propio; si no son comparables, es derrotador por bloqueo. Si S fuera preferido a X, no habría derrota. (Resolución con DeLP)"},{"h":"1a97b39f","q":"Con A = {a -< h1} y C = {~a -< c, c -< h2}, ¿qué relación hay entre <C, ~a> y <A, a>?","o":["Se derrotan por bloqueo uno al otro","<C, ~a> es derrotador por bloqueo de <A, a>","<A, a> es derrotador propio de <C, ~a>","<C, ~a> es derrotador propio de <A, a>"],"a":3,"e":"Están en conflicto (a y ~a), y C tiene la regla ~a -< c, mejor que a -< h1, mientras que A no tiene ninguna regla mejor: C es preferido. (Resolución con DeLP)","x":"<div class=\"ctx-tit\">Programa de la «Resolución con DeLP»<\/div><pre>Π = { h1.  h2.  h3.  h4. }\n\nΔ = { a -&lt; h1.     b -&lt; h2.     c -&lt; h2.\n      a -&lt; b.      b -&lt; h5.    ~c -&lt; d.\n     ~a -&lt; c.     ~b -&lt; h4.     d -&lt; h3.\n                               ~d -&lt; h4. }\n\nOrden entre reglas:\n  (~a -&lt; c)  &gt; (a -&lt; h1)\n  (b -&lt; h2)  &gt; (~b -&lt; h4)\n  (~c -&lt; d)  &gt; (c -&lt; h2)<\/pre>"},{"h":"9eb0fec0","q":"Con B = {a -< b, b -< h2} y C = {~a -< c, c -< h2}, ¿qué relación hay entre <B, a> y <C, ~a>?","o":["<C, ~a> es derrotador propio de <B, a>","Se derrotan por bloqueo uno al otro","Ninguna: no hay prioridad entre sus reglas","<B, a> es derrotador propio de <C, ~a>"],"a":1,"e":"Están en conflicto, pero ninguna regla de uno es mejor que una del otro: no son comparables, así que cada uno es derrotador por bloqueo del otro. (Resolución con DeLP)","x":"<div class=\"ctx-tit\">Programa de la «Resolución con DeLP»<\/div><pre>Π = { h1.  h2.  h3.  h4. }\n\nΔ = { a -&lt; h1.     b -&lt; h2.     c -&lt; h2.\n      a -&lt; b.      b -&lt; h5.    ~c -&lt; d.\n     ~a -&lt; c.     ~b -&lt; h4.     d -&lt; h3.\n                               ~d -&lt; h4. }\n\nOrden entre reglas:\n  (~a -&lt; c)  &gt; (a -&lt; h1)\n  (b -&lt; h2)  &gt; (~b -&lt; h4)\n  (~c -&lt; d)  &gt; (c -&lt; h2)<\/pre>"},{"h":"8ca99bf0","q":"Con C = {~a -< c, c -< h2} (con sub-argumento F = {c -< h2}) y G = {~c -< d, d -< h3}, ¿por qué <G, ~c> derrota a <C, ~a> si no concluye a?","o":["Porque los dos argumentos usan reglas con la cabeza negada","Porque ataca a su sub-argumento <F, c>, con una regla preferida","Porque G tiene más reglas que el argumento C","Porque ~c y ~a son literales que se contradicen entre sí"],"a":1,"e":"El ataque puede ser a un sub-argumento: ~c está en conflicto con c, y (~c -< d) > (c -< h2), así que es derrotador propio. (Resolución con DeLP)","x":"<div class=\"ctx-tit\">Programa de la «Resolución con DeLP»<\/div><pre>Π = { h1.  h2.  h3.  h4. }\n\nΔ = { a -&lt; h1.     b -&lt; h2.     c -&lt; h2.\n      a -&lt; b.      b -&lt; h5.    ~c -&lt; d.\n     ~a -&lt; c.     ~b -&lt; h4.     d -&lt; h3.\n                               ~d -&lt; h4. }\n\nOrden entre reglas:\n  (~a -&lt; c)  &gt; (a -&lt; h1)\n  (b -&lt; h2)  &gt; (~b -&lt; h4)\n  (~c -&lt; d)  &gt; (c -&lt; h2)<\/pre>"},{"h":"9d2f9640","q":"En un árbol de dialéctica de DeLP, todo nodo salvo la raíz es…","o":["Un argumento a favor de la raíz","Un sub-argumento de su padre","Una regla rebatible del programa","Un derrotador de su nodo padre"],"a":3,"e":"DeLP construye un argumento para la consulta, después sus derrotadores, los derrotadores de esos, y así sucesivamente. (Ep. X, parte 2, «Micro-adelanto del proceso de argumentación dialéctica»)"},{"h":"9f3c00a8","q":"En el marcado de un árbol de dialéctica, ¿cuándo un nodo interno se marca D?","o":["Cuando al menos uno de sus hijos está marcado D","Cuando todos sus hijos están marcados U","Cuando al menos uno de sus hijos está marcado U","Cuando tiene más hijos marcados D que U"],"a":2,"e":"Toda hoja es U; un nodo interno es D si tiene al menos un hijo U, y U si todos sus hijos son D. (Ep. X, parte 2, «Árbol de dialéctica marcado»)"},{"h":"b3a700ca","q":"En un árbol de dialéctica, la raíz A tiene un único hijo B, y B tiene un único hijo C, que es hoja. ¿Cómo quedan marcados?","o":["A: D, B: D, C: U","A: U, B: D, C: U","A: D, B: U, C: U","A: U, B: U, C: D"],"a":1,"e":"C es hoja: U. B tiene un hijo U: D. A tiene todos sus hijos D: U. (Ep. X, parte 2)","x":"<div class=\"ctx-tit\">Árbol de dialéctica (sin marcar)<\/div><svg class=\"ctx-svg\" style=\"max-width:102px\" viewBox=\"-10 0 102.0 196\" role=\"img\" aria-label=\"A tiene un hijo B; B tiene un hijo C, que es hoja.\"><defs><marker id=\"pt\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"punta\"/><\/marker><\/defs><line x1=\"31.0\" y1=\"139\" x2=\"31.0\" y2=\"116\" class=\"ar\" marker-end=\"url(#pt)\"/><line x1=\"31.0\" y1=\"75\" x2=\"31.0\" y2=\"52\" class=\"ar\" marker-end=\"url(#pt)\"/><circle cx=\"31.0\" cy=\"158\" r=\"19\" class=\"nodo\"/><text x=\"31.0\" y=\"163\" class=\"tn\">C<\/text><circle cx=\"31.0\" cy=\"94\" r=\"19\" class=\"nodo\"/><text x=\"31.0\" y=\"99\" class=\"tn\">B<\/text><circle cx=\"31.0\" cy=\"30\" r=\"19\" class=\"nodo\"/><text x=\"31.0\" y=\"35\" class=\"tn\">A<\/text><\/svg><p class=\"et2\">La flecha va del derrotador al derrotado.<\/p>"},{"h":"eff5d249","q":"La raíz A tiene dos hijos: B, que es hoja, y C, cuyo único hijo E es hoja. ¿Cómo queda marcada A?","o":["U, porque la mitad de sus hijos queda D","U, porque E derrota a C y así defiende a A","D, porque B es hoja y queda marcada U","D, porque C queda marcado U"],"a":2,"e":"B y E son hojas: U. C tiene un hijo U: D. A tiene un hijo U (B): D. Que E defienda a A frente a C no alcanza, porque B sigue sin ser derrotado. (Ep. X, parte 2)","x":"<div class=\"ctx-tit\">Árbol de dialéctica (sin marcar)<\/div><svg class=\"ctx-svg\" style=\"max-width:164px\" viewBox=\"-10 0 164.00000000000003 196\" role=\"img\" aria-label=\"A tiene dos hijos: B, hoja, y C; C tiene un hijo E, hoja.\"><defs><marker id=\"pt\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"punta\"/><\/marker><\/defs><line x1=\"93.0\" y1=\"139\" x2=\"93.0\" y2=\"116\" class=\"ar\" marker-end=\"url(#pt)\"/><line x1=\"31.0\" y1=\"75\" x2=\"62.0\" y2=\"52\" class=\"ar\" marker-end=\"url(#pt)\"/><line x1=\"93.0\" y1=\"75\" x2=\"62.0\" y2=\"52\" class=\"ar\" marker-end=\"url(#pt)\"/><circle cx=\"31.0\" cy=\"94\" r=\"19\" class=\"nodo\"/><text x=\"31.0\" y=\"99\" class=\"tn\">B<\/text><circle cx=\"93.0\" cy=\"158\" r=\"19\" class=\"nodo\"/><text x=\"93.0\" y=\"163\" class=\"tn\">E<\/text><circle cx=\"93.0\" cy=\"94\" r=\"19\" class=\"nodo\"/><text x=\"93.0\" y=\"99\" class=\"tn\">C<\/text><circle cx=\"62.0\" cy=\"30\" r=\"19\" class=\"nodo\"/><text x=\"62.0\" y=\"35\" class=\"tn\">A<\/text><\/svg><p class=\"et2\">La flecha va del derrotador al derrotado.<\/p>"},{"h":"8d378d19","q":"¿Para qué sirve la «poda» durante el marcado de un árbol de dialéctica?","o":["Para no explorar líneas que no cambian la marca del nodo padre","Para explorar solo los argumentos que están a favor de la consulta","Para descartar los argumentos que no cumplen la minimalidad","Para eliminar del programa las reglas que nunca se usan"],"a":0,"e":"Hay partes del árbol que se pueden podar sin afectar el resultado; qué se poda depende del orden en que se recorre el árbol. (Ep. X, parte 2, «Árbol de dialéctica marcado con poda»)"},{"h":"dca71760","q":"¿Cuándo una conclusión c está garantizada por un programa DeLP?","o":["Si todos los árboles de argumentos para c tienen la raíz marcada U","Si hay más argumentos para c que argumentos para su complemento","Si no existe ningún argumento para el complemento de c","Si algún árbol de un argumento para c tiene la raíz marcada U"],"a":3,"e":"Alcanza con al menos un árbol de dialéctica para un argumento que sustenta c cuya raíz quede U. (Ep. X, parte 2, «Conclusión garantizada»)"},{"h":"a363c699","q":"¿Cuándo responde «unknown» un intérprete DeLP a la consulta c?","o":["Cuando ni c ni ~c están garantizados","Cuando la raíz del árbol de c es D","Cuando c no tiene ningún argumento","Cuando c no pertenece al programa"],"a":3,"e":"c pertenece a P si c o su complemento aparece en alguna regla de P. Si pertenece pero ni c ni su complemento están garantizados, la respuesta es undecided. (Ep. X, parte 2, «Respuesta a una consulta»)"},{"h":"c1cee26a","q":"¿Cuándo responde «undecided» un intérprete DeLP a la consulta c?","o":["Si c y su complemento están garantizados a la vez por el programa","Si c no aparece en ninguna regla ni en ningún hecho del programa","Si c pertenece al programa, pero ni c ni su complemento están garantizados","Si c tiene argumentos, pero todos son derrotados por bloqueo"],"a":2,"e":"Es la situación de indecisión: no hay garantía para c ni para ~c. Si c no aparece en el programa, la respuesta es unknown. (Ep. X, parte 2, «Respuesta a una consulta»)"},{"h":"9f0e6349","q":"Además de determinar la respuesta, ¿para qué sirven los árboles de dialéctica?","o":["Calculan el valor de certeza de c","Dan una explicación de la respuesta","Eliminan las reglas contradictorias","Ordenan las reglas por preferencia"],"a":1,"e":"Los árboles de dialéctica son, además, una explicación para las respuestas: muestran todos los argumentos relacionados y cómo se derrotan. (Ep. X, parte 2, «Respuesta a una consulta»)"},{"h":"c97d8a4f","q":"¿Qué responde el intérprete DeLP a la consulta a?","o":["Undecided: las raíces de <B, a> y <C, ~a> quedan D","No: <C, ~a> es derrotador propio de <A, a>","Yes: el árbol de <A, a> queda con la raíz U","Unknown: a se deriva con reglas sin prioridad"],"a":2,"e":"En el árbol de <A, a>, C derrota a A, pero B derrota a C (bloqueo) y B es hoja: B U, C D, A U. Con un árbol con raíz U, a está garantizado. (Resolución con DeLP)","x":"<div class=\"ctx-tit\">Programa de la «Resolución con DeLP»<\/div><pre>Π = { h1.  h2.  h3.  h4. }\n\nΔ = { a -&lt; h1.     b -&lt; h2.     c -&lt; h2.\n      a -&lt; b.      b -&lt; h5.    ~c -&lt; d.\n     ~a -&lt; c.     ~b -&lt; h4.     d -&lt; h3.\n                               ~d -&lt; h4. }\n\nOrden entre reglas:\n  (~a -&lt; c)  &gt; (a -&lt; h1)\n  (b -&lt; h2)  &gt; (~b -&lt; h4)\n  (~c -&lt; d)  &gt; (c -&lt; h2)<\/pre>"},{"h":"bd874eb2","q":"¿Qué es una línea de argumentación para ⟨A0, h0⟩?","o":["Una secuencia finita de argumentos que empieza en A0, donde cada uno derrota al anterior","El conjunto de todos los argumentos que concluyen h0 o su complemento en el programa","Un camino de la raíz a una hoja en el que se ignoran las derrotas por bloqueo","Una secuencia de literales que empieza con un hecho y termina en la conclusión h0"],"a":0,"e":"Línea: [A0, A1, A2, …] donde, a partir del segundo, cada argumento es un derrotador del anterior. La secuencia de literales es una derivación. (TP8, ej. 6.a)"},{"h":"7628a195","q":"En una línea de argumentación [A0, A1, A2, A3, …], ¿cuáles son los argumentos de soporte para A0?","o":["Todos los que no derrotan a A0","Los de posición impar: A1, A3, …","Los de posición par: A0, A2, A4, …","Solo A0 y su derrotador A1"],"a":2,"e":"A1 derrota a A0, A2 derrota a A1 y así defiende a A0. Soporte: {A0, A2, A4, …}; interferencia: {A1, A3, …}. (TP8, ej. 6.a)"},{"h":"9b52c3a0","q":"¿Qué condición de una línea aceptable evita las líneas circulares (infinitas)?","o":["Que ningún argumento se repita ni sea sub-argumento de desacuerdo previo","Que la línea no tenga más argumentos que reglas rebatibles el programa","Que el conjunto de soporte y el de interferencia no sean contradictorios","Que después de una derrota por bloqueo venga siempre una derrota propia"],"a":0,"e":"Condición (1): sin repeticiones ni sub-argumentos de desacuerdo de un argumento anterior (evita ciclos). (2) evita contradicciones en cada bando; (3), el doble bloqueo. (TP8, ej. 6.a)"},{"h":"17c7d0a6","q":"¿Qué exige la condición de consistencia de una línea de argumentación aceptable?","o":["Que la unión del soporte y la interferencia no sea un conjunto contradictorio","Que el último argumento de la línea no tenga ningún derrotador","Que soporte e interferencia no sean contradictorios, cada uno por separado","Que ningún argumento de la línea sea contradictorio con el conjunto Π"],"a":2,"e":"Condición (2): el conjunto de soporte no es contradictorio, y el de interferencia tampoco. La unión sí puede serlo: los dos bandos se oponen. (TP8, ej. 6.a)"},{"h":"068bf194","q":"Si en una línea aceptable Ak es un derrotador por bloqueo de Ak−1, ¿qué tiene que ser Ak+1?","o":["Un argumento que no derrote a Ak","Otro derrotador por bloqueo de Ak","Cualquier derrotador de Ak","Un derrotador propio de Ak"],"a":3,"e":"Condición (3): no puede haber dos derrotadores por bloqueo consecutivos; después de un bloqueo tiene que venir una derrota propia. (TP8, ej. 6.a)"},{"h":"18ea3035","q":"En P5, ¿cuáles son las líneas de argumentación aceptables maximales con raíz B = {R1}?","o":["[B, A1] y [B, A2, A1]","[B, A2] y [B, A1, B]","[B, A2] y [B, A1, C]","Solo [B, A2]"],"a":2,"e":"A2 derrota a B (propio) y no tiene derrotadores. A1 bloquea a B, y C derrota a A1 en D (propio), sin doble bloqueo. [B, A1, B] repite B. (TP8, ej. 6.b)","x":"<div class=\"ctx-tit\">Programa P5 = (Π5, Δ5)<\/div><pre>Π5 = { viento ← viento_caluroso.\n       calor.\n       caluroso.\n       viento_caluroso.\n       ahorrar_energia. }\n\nΔ5 = { R1: aire_acond -&lt; calor.\n       R2: aire_acond -&lt; sofocante.\n       R3: ~aire_acond -&lt; abrir_ventana.\n       R4: ~aire_acond -&lt; ahorrar_energia.\n       R5: abrir_ventana -&lt; calor, viento.\n       R6: ~abrir_ventana -&lt; viento_caluroso. }\n\nOrden: R2 &gt; R4\n       R4 &gt; R1\n       R6 &gt; R5<\/pre><div class=\"ctx-tit\">Argumentos de P5<\/div><pre>A1 = {R3, R5}  concluye ~aire_acond\n               (sub-argumento D = {R5}, concluye abrir_ventana)\nA2 = {R4}      concluye ~aire_acond\nB  = {R1}      concluye aire_acond\nC  = {R6}      concluye ~abrir_ventana<\/pre>"},{"h":"9cb1c2e8","q":"En P5, ¿por qué [A1, B, A1] no es una línea aceptable?","o":["Porque el soporte {A1} y la interferencia {B} son contradictorios","Repite A1 y, además, tiene dos derrotas por bloqueo seguidas","Porque A1 tiene un sub-argumento y no puede volver a entrar","Porque B no derrota a A1, solo lo ataca en la conclusión"],"a":1,"e":"Viola la condición (1) (A1 aparece dos veces) y la (3): B bloquea a A1 y A1 bloquearía a B. (TP8, ej. 6.b)","x":"<div class=\"ctx-tit\">Programa P5 = (Π5, Δ5)<\/div><pre>Π5 = { viento ← viento_caluroso.\n       calor.\n       caluroso.\n       viento_caluroso.\n       ahorrar_energia. }\n\nΔ5 = { R1: aire_acond -&lt; calor.\n       R2: aire_acond -&lt; sofocante.\n       R3: ~aire_acond -&lt; abrir_ventana.\n       R4: ~aire_acond -&lt; ahorrar_energia.\n       R5: abrir_ventana -&lt; calor, viento.\n       R6: ~abrir_ventana -&lt; viento_caluroso. }\n\nOrden: R2 &gt; R4\n       R4 &gt; R1\n       R6 &gt; R5<\/pre><div class=\"ctx-tit\">Argumentos de P5<\/div><pre>A1 = {R3, R5}  concluye ~aire_acond\n               (sub-argumento D = {R5}, concluye abrir_ventana)\nA2 = {R4}      concluye ~aire_acond\nB  = {R1}      concluye aire_acond\nC  = {R6}      concluye ~abrir_ventana<\/pre>"},{"h":"b3198d4a","q":"¿Es aceptable esta línea de argumentación?","o":["Sí: cada argumento derrota al anterior","Sí, salvo que haya dos bloqueos seguidos","No: el soporte {A0, A1} es contradictorio","No: X aparece dos veces"],"a":3,"e":"X está en las posiciones 2 y 4: viola la condición (1). (TP8, ej. 7.a)","x":"<div class=\"ctx-tit\">Línea<\/div><pre>[A0, X, A1, X]\n\nX derrota a A0\nA1 derrota a X\nX derrota a A1<\/pre>"},{"h":"186fab99","q":"¿Es aceptable esta línea de argumentación, donde A1 derrota a A0 atacando su sub-argumento ⟨X, h4⟩?","o":["No: X es el sub-argumento de desacuerdo de A0","Sí, salvo que A1 y X sean derrotas por bloqueo","No: el soporte {A0, X} es contradictorio","Sí: X es un argumento distinto de A0 y de A1, así que puede entrar"],"a":0,"e":"X ya fue derrotado por A1 como parte de A0; volver a usarlo para derrotar a A1 sería circular. Viola la condición (1). (TP8, ej. 7.b)","x":"<div class=\"ctx-tit\">Línea<\/div><pre>[A0, A1, X]\n\nA1 derrota a A0 en su sub-argumento ⟨X, h4⟩\nX derrota a A1<\/pre>"},{"h":"4dd90c17","q":"¿Es aceptable esta línea, donde A1 ataca la conclusión h0 de A0 y X es un sub-argumento de A0?","o":["Sí, salvo doble bloqueo: X no es el sub-argumento de desacuerdo","No: un sub-argumento de A0 nunca puede volver a aparecer en su línea","No: el soporte {A0, X} es contradictorio porque X está dentro de A0","No: un sub-argumento no puede derrotar a ningún otro argumento"],"a":0,"e":"El desacuerdo es en h0, así que el sub-argumento de desacuerdo es A0 completo, no X: se cumple (1). El soporte {A0, X} no es contradictorio porque X ⊆ A0. (3) depende del tipo de las derrotas. (TP8, ej. 7.c)","x":"<div class=\"ctx-tit\">Línea<\/div><pre>[A0, A1, X]\n\nA1 derrota a A0 en su conclusión h0\nX (sub-argumento de A0) derrota a A1<\/pre>"},{"h":"a493b8a8","q":"Si la raíz de un árbol de dialéctica está marcada U, ¿quedan U todos los argumentos de soporte y D todos los de interferencia?","o":["No: los argumentos de soporte quedan siempre marcados D","Sí, siempre que en el árbol no haya ninguna derrota por bloqueo","Sí: la marca de la raíz se propaga igual a todos los niveles del árbol","No: cada hijo de la raíz necesita un solo hijo U; el resto puede variar"],"a":3,"e":"La raíz U solo exige que sus hijos sean D, y a cada hijo D le alcanza con un hijo U. En el ejemplo de la cátedra, la raíz B es U pero el soporte E2 es D y la interferencia F es U. (TP8, ej. 8.b)"},{"h":"4c399241","q":"¿Qué relación hay entre la garantía de un literal c y la de su complemento ~c?","o":["Si c no está garantizado, entonces ~c tiene que estar garantizado","No pueden estar garantizados los dos; puede no estarlo ninguno","Pueden estar garantizados los dos a la vez, en árboles distintos","Siempre exactamente uno de los dos está garantizado"],"a":1,"e":"c y ~c no pueden estar garantizados a la vez; puede que ninguno lo esté (situación de indecisión, respuesta undecided). (TP8, ej. 8.d)"},{"h":"a1796c0b","q":"¿Cuándo responde «no» un intérprete DeLP a la consulta c?","o":["Cuando todo argumento para c tiene derrotador","Cuando c no pertenece al programa","Cuando c no está garantizado por el programa","Cuando el complemento de c está garantizado"],"a":3,"e":"yes: c garantizado. no: complemento de c garantizado. undecided: c pertenece al programa pero ni c ni su complemento están garantizados. unknown: c no pertenece al programa. (TP8, ej. 8.e)"},{"h":"c17dafc3","q":"En P5, además de los hechos, ¿qué literales están garantizados?","o":["aire_acond y ~abrir_ventana","Ninguno: todos quedan indecisos","~aire_acond y ~abrir_ventana","~aire_acond y abrir_ventana"],"a":2,"e":"~aire_acond: el árbol de A2 = {R4} es una hoja (U). ~abrir_ventana: C = {R6} no tiene derrotadores (U). aire_acond (árbol de B) y abrir_ventana (árbol de D) tienen la raíz D. (TP8, ej. 8.f)","x":"<div class=\"ctx-tit\">Programa P5 = (Π5, Δ5)<\/div><pre>Π5 = { viento ← viento_caluroso.\n       calor.\n       caluroso.\n       viento_caluroso.\n       ahorrar_energia. }\n\nΔ5 = { R1: aire_acond -&lt; calor.\n       R2: aire_acond -&lt; sofocante.\n       R3: ~aire_acond -&lt; abrir_ventana.\n       R4: ~aire_acond -&lt; ahorrar_energia.\n       R5: abrir_ventana -&lt; calor, viento.\n       R6: ~abrir_ventana -&lt; viento_caluroso. }\n\nOrden: R2 &gt; R4\n       R4 &gt; R1\n       R6 &gt; R5<\/pre><div class=\"ctx-tit\">Argumentos de P5<\/div><pre>A1 = {R3, R5}  concluye ~aire_acond\n               (sub-argumento D = {R5}, concluye abrir_ventana)\nA2 = {R4}      concluye ~aire_acond\nB  = {R1}      concluye aire_acond\nC  = {R6}      concluye ~abrir_ventana<\/pre>"},{"h":"a8d5efee","q":"En P5, ¿por qué ~aire_acond está garantizado si el árbol de A1 = {R3, R5} tiene la raíz marcada D?","o":["Porque la raíz D de A1 se compensa con la de B, que también es D","No está garantizado: basta un árbol con raíz D para descartarlo","Porque el árbol de A2 = {R4} tiene la raíz U, y con uno alcanza","Porque A1 tiene más reglas que A2 y por eso pesa más en la respuesta"],"a":2,"e":"Un literal está garantizado si existe al menos un árbol, para algún argumento que lo sustenta, con la raíz marcada U. A2 no tiene derrotadores. (TP8, ej. 8.f)","x":"<div class=\"ctx-tit\">Programa P5 = (Π5, Δ5)<\/div><pre>Π5 = { viento ← viento_caluroso.\n       calor.\n       caluroso.\n       viento_caluroso.\n       ahorrar_energia. }\n\nΔ5 = { R1: aire_acond -&lt; calor.\n       R2: aire_acond -&lt; sofocante.\n       R3: ~aire_acond -&lt; abrir_ventana.\n       R4: ~aire_acond -&lt; ahorrar_energia.\n       R5: abrir_ventana -&lt; calor, viento.\n       R6: ~abrir_ventana -&lt; viento_caluroso. }\n\nOrden: R2 &gt; R4\n       R4 &gt; R1\n       R6 &gt; R5<\/pre><div class=\"ctx-tit\">Argumentos de P5<\/div><pre>A1 = {R3, R5}  concluye ~aire_acond\n               (sub-argumento D = {R5}, concluye abrir_ventana)\nA2 = {R4}      concluye ~aire_acond\nB  = {R1}      concluye aire_acond\nC  = {R6}      concluye ~abrir_ventana<\/pre>"},{"h":"7a3f57f8","q":"¿Puede aparecer el mismo argumento más de una vez en un árbol de dialéctica?","o":["Sí, pero siempre queda con la misma marca en todas","No: la condición (1) lo prohíbe en todo el árbol","Sí, pero solo como hoja del árbol","Sí, en líneas distintas, y no siempre con la misma marca"],"a":3,"e":"La condición (1) prohíbe repetirlo dentro de una misma línea, no en líneas distintas. La marca depende del subárbol de cada aparición: en el ejemplo de la cátedra, X es U en una rama y D en otra. (TP8, ej. 8.g)"},{"h":"789a9b56","q":"¿Podrían N1 y N6 estar etiquetados con el mismo argumento?","o":["No: el programa fija el árbol de cada argumento, y estos difieren","Sí, porque la condición (1) solo vale dentro de una línea","Sí: dos raíces pueden repetirse si están en árboles distintos del programa","No: la raíz de un árbol nunca puede tener marca D"],"a":0,"e":"Los hijos de cada nodo son todos sus derrotadores que forman una línea aceptable, así que un mismo argumento da siempre el mismo árbol. Estos difieren en forma y en la marca de la raíz. (TP8, ej. 9.a)","x":"<div class=\"ctx-tit\">Dos árboles de dialéctica de un mismo programa (con su marcado U / D)<\/div><svg class=\"ctx-svg\" style=\"max-width:325px\" viewBox=\"-10 0 325.20000000000005 260\" role=\"img\" aria-label=\"Árbol 1: N1 (U) con hijos N2 (D) y N4 (D); N2 tiene hijo N3 (U) y N4 tiene hijo N5 (U). Árbol 2: N6 (D) con hijos N7 (U) y N10 (D); N7 tiene hijo N8 (D), que tiene hijo N9 (U); N10 tiene hijo N11 (U).\"><defs><marker id=\"pt\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" class=\"punta\"/><\/marker><\/defs><line x1=\"31.0\" y1=\"139\" x2=\"31.0\" y2=\"116\" class=\"ar\" marker-end=\"url(#pt)\"/><line x1=\"93.0\" y1=\"139\" x2=\"93.0\" y2=\"116\" class=\"ar\" marker-end=\"url(#pt)\"/><line x1=\"31.0\" y1=\"75\" x2=\"62.0\" y2=\"52\" class=\"ar\" marker-end=\"url(#pt)\"/><line x1=\"93.0\" y1=\"75\" x2=\"62.0\" y2=\"52\" class=\"ar\" marker-end=\"url(#pt)\"/><line x1=\"192.20000000000002\" y1=\"203\" x2=\"192.20000000000002\" y2=\"180\" class=\"ar\" marker-end=\"url(#pt)\"/><line x1=\"192.20000000000002\" y1=\"139\" x2=\"192.20000000000002\" y2=\"116\" class=\"ar\" marker-end=\"url(#pt)\"/><line x1=\"254.2\" y1=\"139\" x2=\"254.2\" y2=\"116\" class=\"ar\" marker-end=\"url(#pt)\"/><line x1=\"192.20000000000002\" y1=\"75\" x2=\"223.2\" y2=\"52\" class=\"ar\" marker-end=\"url(#pt)\"/><line x1=\"254.2\" y1=\"75\" x2=\"223.2\" y2=\"52\" class=\"ar\" marker-end=\"url(#pt)\"/><circle cx=\"31.0\" cy=\"158\" r=\"19\" class=\"nodo\"/><text x=\"31.0\" y=\"163\" class=\"tn\">N3<\/text><text x=\"54.0\" y=\"145\" class=\"et2\" style=\"text-anchor:start\">U<\/text><circle cx=\"31.0\" cy=\"94\" r=\"19\" class=\"nodo\"/><text x=\"31.0\" y=\"99\" class=\"tn\">N2<\/text><text x=\"54.0\" y=\"81\" class=\"et2\" style=\"text-anchor:start\">D<\/text><circle cx=\"93.0\" cy=\"158\" r=\"19\" class=\"nodo\"/><text x=\"93.0\" y=\"163\" class=\"tn\">N5<
