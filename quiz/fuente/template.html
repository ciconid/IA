<title>Quiz de IA · UNS 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: unidades como pestañas arriba; a la izquierda la pregunta, a la derecha el tablero
   de la unidad (puntaje y una grilla de celdas tipo Gantt con el estado de cada pregunta). */
:root {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --ink: #17202c;
  --muted: #586374;
  --line: #d9dfe8;
  --accent: #2457a6;
  --accent-soft: #e4ecf8;
  --ok: #1d7a4b;
  --ok-soft: #e2f3ea;
  --bad: #b4382c;
  --bad-soft: #fbe6e3;
  --cell: #e7ebf1;
  --font-ui: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --panel: #1a2029; --ink: #e5e9ef; --muted: #9aa5b5; --line: #2c3542;
    --accent: #7aa7ec; --accent-soft: #1f2c42; --ok: #5cc08c; --ok-soft: #173326;
    --bad: #f08b7e; --bad-soft: #3a1f1c; --cell: #262e3a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --panel: #1a2029; --ink: #e5e9ef; --muted: #9aa5b5; --line: #2c3542;
  --accent: #7aa7ec; --accent-soft: #1f2c42; --ok: #5cc08c; --ok-soft: #173326;
  --bad: #f08b7e; --bad-soft: #3a1f1c; --cell: #262e3a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 span { color: var(--muted); font-weight: 500; }
.overall { font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }

nav.units { display: flex; flex-wrap: wrap; gap: 8px; }
.unit-btn {
  font: inherit; font-size: 0.86rem; cursor: pointer; text-align: left;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 8px; padding: 7px 11px; display: grid; gap: 1px; min-width: 0;
}
.unit-btn .code { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.04em; }
.unit-btn .mini { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.unit-btn[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }
.unit-btn:hover { border-color: var(--accent); }
.unit-btn.off { border-style: dashed; opacity: 0.6; }
.unit-btn.off[aria-current="true"] { opacity: 1; }
.unit-btn .tag { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; }
.offnote { font-size: 0.85rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; margin: 0 0 14px; }
@media (max-width: 640px) {
  nav.units { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
  .unit-btn { flex: 0 0 auto; scroll-snap-align: start; }
}
button:focus-visible, .opt:focus-visible, .sec-btn:focus-visible, .cell:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.unitview { display: grid; gap: 14px; min-width: 0; }
.secs { display: flex; gap: 8px; flex-wrap: wrap; }
.sec-btn {
  font: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-align: left;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 8px; padding: 7px 14px; display: grid; gap: 1px; min-width: 150px;
}
.sec-btn .mini { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.sec-btn .key, .kbd { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 4px; }
.kbd { vertical-align: 1px; }
.sec-btn[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }
.sec-btn:hover:not([disabled]) { border-color: var(--accent); }
.sec-btn[disabled] { opacity: 0.45; cursor: default; }
@media (max-width: 640px) { .sec-btn { flex: 1 1 0; min-width: 0; } }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; min-width: 0; }
.qhead { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); letter-spacing: 0.03em; text-transform: uppercase; }
.qtext { font-family: var(--font-read); font-size: 1.22rem; line-height: 1.45; margin: 12px 0 18px; text-wrap: pretty; max-width: 62ch; }
.opts { display: grid; gap: 10px; }
/* Contexto de la pregunta: tablas, árboles y programas de los ejemplos de la cátedra */
.ctx { margin: 0 0 18px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); display: grid; gap: 12px; min-width: 0; }
.ctx-tit { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: -6px; }
.ctx-scroll { overflow-x: auto; }
.ctx-tabla { border-collapse: collapse; font-family: var(--font-mono); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.ctx-tabla th, .ctx-tabla td { padding: 2px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ctx-tabla th { color: var(--muted); font-weight: 500; }
.ctx-tabla td:first-child { color: var(--muted); }
.ctx-tabla tr.hl td { background: var(--accent-soft); }
.ctx-svg { width: 100%; max-width: 560px; height: auto; font-family: var(--font-mono); }
.ctx-svg.ctx-ancho { max-width: 700px; min-width: 560px; }
.ctx-svg .punta { fill: var(--muted); }
.ctx-svg .arco { stroke: var(--muted); stroke-width: 0.5; opacity: 0.55; }
.ctx-svg .neu { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.3; }
.ctx-svg .tri { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
.ctx-svg .tri2 { fill: var(--panel); stroke: var(--accent); stroke-dasharray: 3 2; }
.ctx-svg .et2 { font-size: 11px; fill: var(--muted); }
.ctx-svg .ar { stroke: var(--muted); stroke-width: 1.2; }
.ctx-svg .nodo { fill: var(--panel); stroke: var(--accent); stroke-width: 1.5; }
.ctx-svg .hoja { fill: var(--accent-soft); stroke: var(--line); }
.ctx-svg text { text-anchor: middle; font-size: 13px; fill: var(--ink); }
.ctx-svg .tn { font-weight: 600; }
.ctx-svg .et { font-size: 11px; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; }
.ctx pre { margin: 0; font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.ctx p { margin: 0; font-size: 0.92rem; }
.opt {
  font: inherit; text-align: left; cursor: pointer; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 11px 12px;
  transition: border-color .15s, background-color .15s;
}
.opt:hover:not([disabled]) { border-color: var(--accent); background: var(--accent-soft); }
.opt .key { font-family: var(--font-mono); font-size: 0.8rem; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; border: 1px solid var(--line); color: var(--muted); }
.opt[disabled] { cursor: default; }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.correct .key { background: var(--ok); border-color: var(--ok); color: var(--panel); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); border-color: var(--bad); color: var(--panel); }
.opt.dim { opacity: 0.6; }

.feedback { margin-top: 16px; border-radius: 8px; padding: 12px 14px; border: 1px solid var(--line); display: grid; gap: 4px; }
.feedback.ok { border-color: var(--ok); background: var(--ok-soft); }
.feedback.bad { border-color: var(--bad); background: var(--bad-soft); }
.feedback strong { font-size: 0.95rem; }
.feedback p { margin: 0; color: var(--ink); max-width: 68ch; }

.controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; justify-content: space-between; align-items: center; }
.controls .group { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer; border-radius: 8px; padding: 9px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.btn:hover:not([disabled]) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: var(--panel); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.hint { font-size: 0.78rem; color: var(--muted); margin-top: 12px; }

aside.board { display: grid; gap: 14px; }
.score { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { display: grid; gap: 2px; }
.stat .v { font-family: var(--font-mono); font-size: 1.35rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.bar { height: 8px; border-radius: 4px; background: var(--cell); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .g { background: var(--ok); } .bar .r { background: var(--bad); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.75rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.grid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.cell { font: inherit; font-family: var(--font-mono); font-size: 0.66rem; cursor: pointer; aspect-ratio: 1; max-width: 100%; border-radius: 4px; border: 1px solid transparent; background: var(--cell); color: var(--muted); padding: 0; font-variant-numeric: tabular-nums; }
.cell.ok { background: var(--ok); color: var(--panel); }
.cell.bad { background: var(--bad); color: var(--panel); }
.cell.cur { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.board h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0; font-weight: 600; }
.stack { display: grid; gap: 8px; }

.done { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 8px; }
.done h2 { margin: 0; font-size: 1.1rem; }
.done .big { font-family: var(--font-mono); font-size: 2rem; font-variant-numeric: tabular-nums; }

table.sum { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
table.sum th, table.sum td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.sum th { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
table.sum td.num { font-family: var(--font-mono); }
table.sum tr.total td { font-weight: 700; border-bottom: none; }
.linkbtn { font: inherit; background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Quiz de Inteligencia Artificial <span>UNS · 2026</span></h1>
    <div class="overall" id="overall"></div>
  </header>
  <nav class="units" id="units" aria-label="Unidades"></nav>
  <main id="main"></main>
</div>

<script>
const UNITS = /*__DATA__*/[];
const KEY = "ia-uns-2026-quiz-v2";   // v2: respuestas por id de pregunta (h), no por posición
const KEY_V1 = "ia-uns-2026-quiz-v1";
const ORDEN_V1 = /*__V1__*/{};        // ids de las preguntas de la v1, en su orden
const LETTERS = ["A", "B", "C", "D"];

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.s) return s; } catch (e) {}
  try {   // migrar el progreso de la v1: posición -> id
    const v = JSON.parse(localStorage.getItem(KEY_V1));
    if (v && v.s) {
      for (const id in v.s) {
        const r = {}, orden = ORDEN_V1[id] || [];
        for (const k in v.s[id].r || {}) if (orden[k]) r[orden[k]] = v.s[id].r[k];
        v.s[id] = { i: 0, r };
      }
      return v;
    }
  } catch (e) {}
  return { u: UNITS[0].id, s: {} };
}
let state = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function us(id) { if (!state.s[id]) state.s[id] = { i: 0, r: {} }; return state.s[id]; }
function unitById(id) { return UNITS.find(u => u.id === id); }
function stats(u) {
  const r = us(u.id).r; let ok = 0, bad = 0;
  for (const q of u.qs) { const c = r[q.h]; if (c === undefined) continue; if (c === q.a) ok++; else bad++; }
  return { ok, bad, ans: ok + bad, total: u.qs.length };
}
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(k));
  return n;
};

function renderNav() {
  const nav = document.getElementById("units"); nav.replaceChildren();
  UNITS.forEach((u, i) => {
    const s = stats(u);
    nav.append(el("button", { class: "unit-btn" + (u.fuera ? " off" : ""), "aria-current": String(state.u === u.id), onclick: () => go(u.id) },
      el("span", { class: "code" }, `U${i + 1} · ${u.tp}`, u.fuera ? el("span", { class: "tag" }, "no entra") : null),
      el("span", {}, u.nombre),
      el("span", { class: "mini" }, `${s.ok}/${s.total} correctas`)));
  });
  nav.append(el("button", { class: "unit-btn", "aria-current": String(state.u === "resumen"), onclick: () => go("resumen") },
    el("span", { class: "code" }, "TODAS"), el("span", {}, "Resumen general"), el("span", { class: "mini" }, "puntaje por unidad")));
  const cur = nav.querySelector('[aria-current="true"]');
  if (cur && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = cur.offsetLeft - nav.offsetLeft - 8;
  let ok = 0, ans = 0, total = 0;
  UNITS.filter(u => !u.fuera).forEach(u => { const s = stats(u); ok += s.ok; ans += s.ans; total += s.total; });
  document.getElementById("overall").textContent = `${ans}/${total} respondidas · ${ok} correctas · ${pct(ok, ans)}% de acierto`;
}
function go(id) { state.u = id; save(); render(); window.scrollTo({ top: 0 }); }

let armed = null, armTimer = null;
function arm(name, fn, btn) {
  if (armed === name) { clearTimeout(armTimer); armed = null; fn(); return; }
  armed = name; render();
  armTimer = setTimeout(() => { armed = null; render(); }, 4000);
}

// Cada unidad se divide en dos secciones: teoría (preguntas que se responden con el conocimiento del tema)
// y práctica (las que requieren algún cálculo; q.p = 1). Cada sección guarda su propia posición
// (st.i teoría, st.ip práctica); las respuestas siguen guardadas por id en st.r, para toda la unidad.
const SECS = { t: "Teoría", p: "Práctica" };
function secQs(u, sec) { return u.qs.filter(q => sec === "p" ? !!q.p : !q.p); }
function statsQs(u, qs) {
  const r = us(u.id).r; let ok = 0, bad = 0;
  for (const q of qs) { const c = r[q.h]; if (c === undefined) continue; if (c === q.a) ok++; else bad++; }
  return { ok, bad, ans: ok + bad, total: qs.length };
}
function view(u) {
  const st = us(u.id);
  let sec = st.sec === "p" ? "p" : "t";
  if (!secQs(u, sec).length) sec = sec === "p" ? "t" : "p";
  const qs = secQs(u, sec), ik = sec === "p" ? "ip" : "i";
  st[ik] = Math.min(Math.max(0, st[ik] | 0), qs.length - 1);
  return { u, st, sec, qs, ik };
}
function setSec(u, sec) { if (!secQs(u, sec).length) return; us(u.id).sec = sec; save(); render(); }

function answer(v, k, choice) {
  const h = v.qs[k].h; if (v.st.r[h] !== undefined) return;
  v.st.r[h] = choice; save(); render();
}
function move(v, d) {
  v.st[v.ik] = Math.min(v.qs.length - 1, Math.max(0, v.st[v.ik] + d)); save(); render();
}
function goTo(v, i) { v.st[v.ik] = i; save(); render(); }

function renderUnit(u) {
  const v = view(u), st = v.st, qs = v.qs, sec = v.sec;
  const k = st[v.ik]; const q = qs[k]; const chosen = st.r[q.h]; const answered = chosen !== undefined;
  const s = statsQs(u, qs);
  const nombreSec = SECS[sec].toLowerCase();
  const resetKey = "reset" + u.id + sec;
  const card = el("section", { class: "card", "aria-live": "polite" });
  if (u.fuera) card.append(el("p", { class: "offnote" }, "Esta unidad no entra en el examen. No cuenta en el puntaje total."));

  if (s.ans === s.total) {
    const p = pct(s.ok, s.total);
    card.append(el("div", { class: "done" },
      el("h2", {}, `Terminaste la ${nombreSec} de la unidad`),
      el("div", { class: "big" }, `${s.ok}/${s.total} · ${p}%`),
      el("p", { style: "margin:0" }, p >= 80 ? "Muy bien. Repasá las incorrectas para cerrar los huecos." : p >= 60 ? "Bien. Volvé sobre las incorrectas y releé esas diapositivas." : "Conviene releer las diapositivas de esta unidad y reintentar las incorrectas."),
      el("div", { class: "group", style: "display:flex;gap:8px;flex-wrap:wrap" },
        el("button", { class: "btn primary", disabled: s.bad === 0, onclick: () => retryWrong(v) }, `Reintentar las ${s.bad} incorrectas`),
        el("button", { class: "btn danger" + (armed === resetKey ? " armed" : ""), onclick: () => arm(resetKey, () => resetSec(v)) }, armed === resetKey ? "Confirmar: borrar respuestas" : `Reiniciar la ${nombreSec}`))));
    card.append(el("div", { style: "height:16px" }));
  }

  card.append(el("div", { class: "qhead" }, el("span", {}, `${SECS[sec]} · pregunta ${k + 1} de ${qs.length}`), el("span", {}, answered ? (chosen === q.a ? "Correcta" : "Incorrecta") : "Sin responder")));
  card.append(el("p", { class: "qtext" }, q.q));
  if (q.x) { const f = el("figure", { class: "ctx" }); f.innerHTML = q.x; card.append(f); }   // contexto del ejemplo (HTML propio)
  const opts = el("div", { class: "opts", role: "group", "aria-label": "Opciones" });
  q.o.forEach((o, j) => {
    let cls = "opt";
    if (answered) { if (j === q.a) cls += " correct"; else if (j === chosen) cls += " wrong"; else cls += " dim"; }
    opts.append(el("button", { class: cls, disabled: answered, onclick: () => answer(v, k, j) }, el("span", { class: "key" }, LETTERS[j]), el("span", {}, o)));
  });
  card.append(opts);
  if (answered) {
    const ok = chosen === q.a;
    card.append(el("div", { class: "feedback " + (ok ? "ok" : "bad") },
      el("strong", {}, ok ? "Correcto" : `Incorrecto. La respuesta correcta es la ${LETTERS[q.a]}.`), el("p", {}, q.e)));
  }
  card.append(el("div", { class: "controls" },
    el("div", { class: "group" },
      el("button", { class: "btn", disabled: k === 0, onclick: () => move(v, -1) }, "← Anterior"),
      el("button", { class: "btn primary", disabled: k === qs.length - 1, onclick: () => move(v, 1) }, "Siguiente →")),
    el("div", { class: "group" },
      answered ? el("button", { class: "btn", onclick: () => { delete st.r[q.h]; save(); render(); } }, "Volver a intentar esta") : null)));
  card.append(el("p", { class: "hint" }, "Atajos: A–D o 1–4 para responder, flechas ← → para moverte, T y P para pasar a teoría o práctica, 0 del teclado numérico para ir a la próxima sin responder, punto para reintentar las incorrectas."));

  const nextOpen = qs.findIndex(qq => st.r[qq.h] === undefined);
  const board = el("aside", { class: "board card", "aria-label": "Tablero de la sección" },
    el("h2", {}, `U${UNITS.indexOf(u) + 1} · ${u.nombre} · ${SECS[sec]}`),
    el("div", { class: "score" },
      el("div", { class: "stat" }, el("span", { class: "v" }, `${s.ok}/${s.ans}`), el("span", { class: "l" }, "correctas")),
      el("div", { class: "stat" }, el("span", { class: "v" }, `${pct(s.ok, s.ans)}%`), el("span", { class: "l" }, "acierto")),
      el("div", { class: "stat" }, el("span", { class: "v" }, `${s.ans}/${s.total}`), el("span", { class: "l" }, "respondidas"))),
    el("div", { class: "bar", role: "img", "aria-label": `${s.ok} correctas y ${s.bad} incorrectas de ${s.total}` },
      el("i", { class: "g", style: `width:${100 * s.ok / s.total}%` }), el("i", { class: "r", style: `width:${100 * s.bad / s.total}%` })),
    el("div", { class: "legend" }, el("span", { style: "--c:var(--ok)" }, "correcta"), el("span", { style: "--c:var(--bad)" }, "incorrecta"), el("span", { style: "--c:var(--cell)" }, "sin responder")),
    el("div", { class: "grid" }, qs.map((qq, i) => {
      const r = st.r[qq.h]; let cls = "cell";
      if (r !== undefined) cls += r === qq.a ? " ok" : " bad";
      if (i === k) cls += " cur";
      return el("button", { class: cls, "aria-label": `Ir a la pregunta ${i + 1}`, onclick: () => goTo(v, i) }, String(i + 1));
    })),
    el("div", { class: "stack" },
      el("button", { class: "btn", disabled: nextOpen < 0, onclick: () => goTo(v, nextOpen) }, "Próxima sin resp. ", el("span", { class: "kbd" }, "0")),
      el("button", { class: "btn", disabled: s.bad === 0, onclick: () => retryWrong(v) }, `Reintentar las incorrectas (${s.bad}) `, el("span", { class: "kbd" }, ".")),
      el("button", { class: "btn danger" + (armed === resetKey ? " armed" : ""), onclick: () => arm(resetKey, () => resetSec(v)) }, armed === resetKey ? "Confirmar: borrar respuestas" : `Reiniciar la ${nombreSec}`)));

  const tabs = el("div", { class: "secs", role: "tablist", "aria-label": "Secciones de la unidad" }, ["t", "p"].map(x => {
    const xq = secQs(u, x), xs = statsQs(u, xq);
    return el("button", { class: "sec-btn", role: "tab", "aria-selected": String(x === sec), disabled: !xq.length, onclick: () => setSec(u, x) },
      el("span", {}, `${SECS[x]} `, el("span", { class: "key" }, x.toUpperCase())),
      el("span", { class: "mini" }, xq.length ? `${xs.ok}/${xs.total} correctas` : "sin preguntas"));
  }));
  return el("div", { class: "unitview" }, tabs, el("div", { class: "layout" }, card, board));
}
function retryWrong(v) {
  const st = v.st, qs = v.qs;
  const wrong = qs.map((q, i) => i).filter(i => { const c = st.r[qs[i].h]; return c !== undefined && c !== qs[i].a; });
  wrong.forEach(i => delete st.r[qs[i].h]); if (wrong.length) st[v.ik] = Math.min(...wrong); save(); render();
}
function resetSec(v) { for (const q of v.qs) delete v.st.r[q.h]; v.st[v.ik] = 0; save(); render(); }

function renderSummary() {
  let tot = { ok: 0, bad: 0, ans: 0, total: 0 };
  const rows = UNITS.map((u, i) => {
    const s = stats(u); if (!u.fuera) for (const k in tot) tot[k] += s[k];
    return el("tr", { style: u.fuera ? "opacity:0.6" : null },
      el("td", {}, el("button", { class: "linkbtn", onclick: () => go(u.id) }, `U${i + 1} · ${u.nombre}`), u.fuera ? " (no entra)" : null),
      el("td", { class: "num" }, `${s.ans}/${s.total}`), el("td", { class: "num" }, String(s.ok)), el("td", { class: "num" }, String(s.bad)),
      el("td", { class: "num" }, s.ans ? `${pct(s.ok, s.ans)}%` : "—"), el("td", { class: "num" }, `${pct(s.ok, s.total)}%`));
  });
  const table = el("table", { class: "sum" },
    el("thead", {}, el("tr", {}, ["Unidad", "Respondidas", "Correctas", "Incorrectas", "Acierto", "Nota sobre el total"].map(h => el("th", {}, h)))),
    el("tbody", {}, rows, el("tr", { class: "total" }, el("td", {}, "Total"), el("td", { class: "num" }, `${tot.ans}/${tot.total}`),
      el("td", { class: "num" }, String(tot.ok)), el("td", { class: "num" }, String(tot.bad)),
      el("td", { class: "num" }, tot.ans ? `${pct(tot.ok, tot.ans)}%` : "—"), el("td", { class: "num" }, `${pct(tot.ok, tot.total)}%`))));
  return el("section", { class: "card" },
    el("div", { class: "qhead" }, el("span", {}, "Resumen general"), el("span", {}, `${UNITS.length} unidades`)),
    el("p", { class: "qtext" }, "Puntaje acumulado de todas las unidades. \"Acierto\" es sobre las respondidas; \"nota sobre el total\" cuenta las no respondidas como incorrectas. Las unidades que no entran en el examen no suman al total."),
    el("div", { class: "tablewrap" }, table),
    el("div", { class: "controls" }, el("span", {}),
      el("button", { class: "btn danger" + (armed === "resetall" ? " armed" : ""), onclick: () => arm("resetall", () => { state.s = {}; save(); render(); }) }, armed === "resetall" ? "Confirmar: borrar todo" : "Reiniciar todas las unidades")));
}

function render() {
  if (state.u !== "resumen" && !unitById(state.u)) state.u = UNITS[0].id;
  renderNav();
  const main = document.getElementById("main");
  main.replaceChildren(state.u === "resumen" ? renderSummary() : renderUnit(unitById(state.u)));
}
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || state.u === "resumen") return;
  const u = unitById(state.u); if (!u) return; const v = view(u);
  const map = { a: 0, b: 1, c: 2, d: 3, "1": 0, "2": 1, "3": 2, "4": 3 };
  const key = e.key.toLowerCase();
  if (e.code === "Numpad0") { const n = v.qs.findIndex(qq => v.st.r[qq.h] === undefined); if (n >= 0) goTo(v, n); }
  else if (e.code === "NumpadDecimal" || e.key === ".") retryWrong(v);
  else if (key === "t" || key === "p") setSec(u, key);
  else if (key in map) { answer(v, v.st[v.ik], map[key]); }
  else if (e.key === "ArrowRight") move(v, 1);
  else if (e.key === "ArrowLeft") move(v, -1);
});
render();
</script>
