atado"],"a":3,"e":"Cada una tiene sus propias dificultades."},{"q":"¿Qué caracteriza al equipo central?","o":["Solo participa del cierre","Es externo a la organización","Se incorpora en el kick-off y no se elige","Está desde el comienzo y participa de la JPPS, aunque no siempre a tiempo completo"],"a":3,"e":"Cuesta conseguirlo porque la gente buena ya está sobrecargada."},{"q":"¿Qué caracteriza al equipo del cliente?","o":["Es externo y con contrato rígido","Trabaja full time","Se elige por concurso","No se elige, participa desde el kick-off y tiene dedicación parcial"],"a":3,"e":"Hay que ser cauteloso."},{"q":"¿Cuál es un desafío del equipo contratado?","o":["El tiempo del contrato no se puede variar y requiere más supervisión","No se puede despedir","No necesita capacitación","Siempre tiene más compromiso"],"a":0,"e":"Si la tarea se atrasa y el contrato vence, se pierde el recurso."},{"q":"Según Kolb, ¿qué estilo es orientado a resultados, práctico y adaptable?","o":["Divergente","Asimilador","Acomodador","Convergente"],"a":2,"e":"Es el que ejecuta y hace que las cosas pasen."},{"q":"Según Kolb, ¿qué estilo resuelve problemas y encuentra soluciones pero no las implementa?","o":["Divergente","Convergente","Acomodador","Asimilador"],"a":1,"e":"Un equipo solo de convergentes encuentra soluciones que nadie implementa."},{"q":"Según Kolb, ¿qué estilo ve alternativas desde varias perspectivas?","o":["Asimilador","Convergente","Acomodador","Divergente"],"a":3,"e":"Aporta ideas y brainstorming."},{"q":"¿Cuándo deben acordarse las reglas de trabajo en grupo?","o":["Antes de que aparezcan los problemas","En el cierre del proyecto","Cuando surge el primer conflicto","Solo si el cliente lo pide"],"a":0,"e":"Discutir cómo resolver un conflicto en medio del conflicto es mucho más difícil."},{"q":"¿Cuál NO es una de las seis situaciones que cubren las reglas de trabajo en grupo?","o":["Resolución de conflictos","Brainstorming","Facturación al cliente","Toma de decisiones"],"a":2,"e":"Son: solución de problemas, decisiones, conflictos, consenso, brainstorming y reuniones."},{"q":"¿Qué modelo de decisión es \"políticamente una buena estrategia\"?","o":["Consultativo: decide la autoridad después de consultar al equipo","Participativo","Por votación","Directivo"],"a":0,"e":"La gente se siente escuchada y la decisión no se demora."},{"q":"¿Qué desventaja tiene el modelo de decisión directivo?","o":["Es muy lento","Diluye la responsabilidad","Requiere consenso","Puede faltarle información y genera resistencia en quienes no están de acuerdo"],"a":3,"e":"Su ventaja es que es expeditivo."},{"q":"¿Qué ventaja tiene el modelo de decisión participativo?","o":["Es el más rápido","Lo decide el cliente","Genera confianza y compromiso","No requiere información"],"a":2,"e":"Es lento y relega parte de la responsabilidad del LP en el equipo."},{"q":"¿Cuál es la estrategia constructiva para resolver conflictos?","o":["Colaborar, buscando soluciones win-win","Votar","Evitar el conflicto","Combatir"],"a":0,"e":"Evitar no es tolerable y combatir eleva el estrés."},{"q":"¿Por qué \"evitar\" no es una estrategia tolerable ante un conflicto?","o":["Porque el desacuerdo sigue ahí y explota más tarde; hay que hacer salir las opiniones","Porque cuesta dinero","Porque es demasiado lenta","Porque la prohíbe el contrato"],"a":0,"e":"Es no hacer nada."},{"q":"¿Qué es el consenso?","o":["Un acuerdo en el que nadie tiene desacuerdos serios con la decisión","La decisión del LP","La unanimidad absoluta","Una votación por mayoría"],"a":0,"e":"No es una elección democrática."},{"q":"¿Cuál es una regla del brainstorming?","o":["Criticar cada idea apenas se dice","Terminar en 5 minutos","Presentar las ideas sin discusión ni crítica, y combinarlas después","Que solo hablen los expertos"],"a":2,"e":"No hay que apurar el proceso."},{"q":"¿Cuáles son los pasos de Couger para resolver problemas?","o":["Planificar, hacer, verificar y actuar","Identificar, evaluar, estimar y planificar riesgos","Requerimiento, clarificación, respuesta y acuerdo","Definir el problema, juntar información, generar ideas, evaluarlas y desarrollar un plan"],"a":3,"e":"Un problema mal definido produce soluciones al problema equivocado."},{"q":"¿Qué tipo de reunión es formal, se hace en hitos y puede incluir revisores externos?","o":["Reunión de resolución de problemas","Reunión diaria de estado","Brainstorming","Reunión de revisión del proyecto"],"a":3,"e":"Las diarias son cortas; las de problemas, solo con los involucrados."},{"q":"¿Cómo debe manejarse un pedido que modifica el alcance?","o":["Rechazándolo siempre","Aceptándolo de palabra para no demorar","Por escrito, con una ronda de COS, un análisis de impacto con alternativas y la decisión del cliente","Decidiéndolo el equipo en la daily"],"a":2,"e":"Ningún cambio entra sin que se reconozca su costo en tiempo y recursos."},{"q":"¿Qué inicia un pedido de cambio documentado?","o":["El cierre del proyecto","Una ronda de COS (condiciones de satisfacción)","Una auditoría","Una nueva JPPS"],"a":1,"e":"Recién cuando el cambio se entiende claramente se evalúa su impacto."},{"q":"¿Quién elige la alternativa en el análisis de impacto de un cambio?","o":["El cliente","El gerente de línea","El equipo","El LP"],"a":0,"e":"El LP presenta alternativas y su costo; el cliente controla el alcance."},{"q":"El cambio requiere más recursos manteniendo el cronograma. ¿Cuál de los seis resultados es?","o":["Revisión completa de los entregables","Extensión del cronograma","Recursos adicionales","No puede acomodarse"],"a":2,"e":"Los seis: sin impacto, extensión, recursos, ambos, revisión de entregables, no puede acomodarse."},{"q":"Para que entre el cambio se saca otra funcionalidad del alcance. ¿Qué resultado es?","o":["Recursos adicionales","Extensión del cronograma","Revisión completa de los entregables","Se incorpora sin impacto"],"a":2,"e":"Se repriorizan los entregables: entra uno, sale otro."},{"q":"¿Qué error típico hay que evitar con los pedidos de cambio?","o":["Mostrarle al cliente las alternativas","Analizar su impacto","Documentarlos","Aceptar cambios chicos de palabra"],"a":3,"e":"Diez cambios chicos pueden ser un mes de atraso que nadie autorizó."},{"q":"¿Qué es un paquete de trabajo?","o":["La descripción, hecha por el responsable de una tarea, de cómo planea completarla","Un conjunto de tareas del WBS sin dueño","El presupuesto de una fase","El contrato con un proveedor"],"a":0,"e":"Puede ser un listado de acciones o un mini-proyecto."},{"q":"¿Por qué el paquete de trabajo es un seguro para el LP?","o":["Porque si el responsable no está, otro puede tomar la tarea y seguir el plan escrito","Porque reemplaza al cronograma","Porque obliga al cliente a pagar","Porque cubre los daños económicos"],"a":0,"e":"Además obliga a pensar la tarea antes de empezarla."},{"q":"¿Qué implica finalizar el cronograma en el lanzamiento?","o":["Firmar el POS","Calcular por primera vez el camino crítico","Definir los requerimientos","Pasar de perfiles a personas concretas con su disponibilidad real"],"a":3,"e":"Si alguien queda sobreasignado, se nivela."},{"q":"¿Cuáles son las tres matrices del método de la matriz por perfil?","o":["Riesgo × Impacto, Riesgo × Probabilidad y su producto","Requerimiento × Solución, Solución × Costo y su razón","Persona × Perfil, Actividad × Perfil y su combinación Persona × Actividad","Tarea × Duración, Tarea × Costo y Tarea × Recurso"],"a":2,"e":"La combinación da los candidatos de cada actividad."},{"q":"¿Qué es un recurso crítico?","o":["El recurso más caro","La persona más experta","El recurso asignado al camino crítico","La única persona del equipo capaz de cubrir un perfil necesario"],"a":3,"e":"No tiene reemplazo dentro del equipo."},{"q":"En el ejercicio de la cátedra (TP5), ¿quiénes eran recursos críticos?","o":["Rosario Bléfari y Luis Hamilton","Dillom y Nina Suarez","Carlos Leclerc y Tigre Ulli","Carlos Busqued (especialista IT) y Lali Espósito (ingeniera de procesos)"],"a":3,"e":"Eran los únicos de su perfil."},{"q":"Cuando una actividad tiene dos candidatos con distinto costo, ¿a quién eligió la cátedra en su ejemplo?","o":["Al de mayor costo","A los dos","Al de menor costo","Al más experto"],"a":2,"e":"Con ese criterio el equipo costaba $68.800 por semana."},{"q":"Un perfil tiene dos personas, pero dos actividades en paralelo lo necesitan a la vez. ¿Es crítico?","o":["Solo si son caras","No, porque tiene dos personas","Nunca","Sí, durante ese período no queda nadie de respaldo"],"a":3,"e":"\"Crítico\" depende de cuántas personas se necesitan al mismo tiempo."},{"q":"¿Qué se recomienda hacer con un recurso crítico?","o":["Asignarle todas las tareas","Pedirle paquetes de trabajo bien escritos, capacitar a otro y no asignarle tareas simultáneas","Ignorarlo hasta que falte","Despedirlo"],"a":1,"e":"Detectarlo es identificar un riesgo."},{"q":"¿Qué es la reunión de kick-off?","o":["La reunión de cierre","El anuncio formal de que el proyecto fue planeado y aprobado para su ejecución","Una daily extendida","La primera reunión con el cliente para relevar requisitos"],"a":1,"e":"Se hace después de planificar y antes de cualquier trabajo efectivo."},{"q":"¿Cuáles son las dos partes del kick-off?","o":["La de riesgos y la de costos","La técnica y la comercial","La dirigida por el sponsor y la dirigida por el LP","La del cliente y la del auditor"],"a":2,"e":"La del sponsor es breve; la del LP ocupa el resto del día."},{"q":"¿Qué se presenta en la parte del kick-off dirigida por el sponsor?","o":["La auditoría post-implementación","El POS, ante gerentes senior e interesados","El código fuente","Los paquetes de trabajo"],"a":1,"e":"Es una exhibición que muestra el respaldo de la dirección."},{"q":"¿Qué es el PDS?","o":["El enunciado de definición del proyecto: el POS reescrito por y para el equipo","El primer sprint","El plan de seguridad","El presupuesto detallado"],"a":0,"e":"Verifica que todos entiendan lo mismo."},{"q":"¿Cuál NO es un propósito del kick-off?","o":["Establecer las reglas de trabajo","Aprobar el presupuesto del proyecto","Escribir los paquetes de trabajo","Presentar a los miembros del equipo"],"a":1,"e":"El presupuesto ya se aprobó con la Propuesta de Proyecto."},{"q":"¿Por qué vale la pena dedicar tiempo al kick-off?","o":["Porque reemplaza la planificación","Legitima el proyecto, alinea al equipo, fija reglas y genera compromiso","Porque es facturable","Porque elimina los riesgos"],"a":1,"e":"Convierte el plan del LP en el plan del equipo."}]},{"id":"u6","nombre":"Monitoreo, control y cierre","tp":"TP6","qs":[{"q":"¿Qué diferencia hay entre monitorear y controlar?","o":["Monitorear lo hace el cliente y controlar el equipo","Son sinónimos","Monitorear es medir y comparar con el plan; controlar es actuar ante los desvíos","Controlar es medir; monitorear es actuar"],"a":2,"e":"El control incluye acciones correctivas, replanificación y pedidos de cambio."},{"q":"¿Qué establece un programa de métricas?","o":["El sueldo de quien mide","Solo los valores objetivo","El quién, qué, dónde, cuándo, cómo y porqué de cada métrica","Las herramientas de programación"],"a":2,"e":"Como un artículo periodístico."},{"q":"¿Por qué se empieza el programa de métricas por el porqué?","o":["Porque define el costo","Para no medir cosas que nadie va a usar: se fija qué controlar según los objetivos","Porque lo pide ISO 9001","Porque es lo más fácil"],"a":1,"e":"Después se definen qué, dónde, cuándo, quién y cómo."},{"q":"¿Cuál NO es una característica deseable del sistema de reportes?","o":["Rápida aceptación","Agregar mucha sobrecarga de trabajo","Información completa, precisa y a tiempo","Fácil de entender"],"a":1,"e":"Si reportar cuesta más que trabajar, es contraproducente."},{"q":"¿Qué muestra un reporte acumulativo?","o":["Solo el color del semáforo","Solo las variaciones respecto del plan","La historia del proyecto desde el comienzo, con las tendencias","Solo la información del último período"],"a":2,"e":"Sirve para detectar tendencias."},{"q":"¿Qué muestra un reporte de excepción?","o":["Solo las variaciones respecto del plan","Los datos del cliente","Toda la historia del proyecto","El detalle de todas las tareas"],"a":0,"e":"Pensado para gerentes senior que leen rápido."},{"q":"En un reporte semáforo, ¿qué significa rojo?","o":["El proyecto está fuera de control y no hay un plan correctivo: hay que analizarlo","Hay un problema y se describe cómo se trata","Todo va según lo planificado","El proyecto terminó"],"a":0,"e":"Amarillo: hay un problema descrito; verde: todo según el plan."},{"q":"En un reporte semáforo, verde significa que…","o":["El proyecto terminó","Hay un riesgo nuevo","Todo va según lo planificado y los gerentes pueden no leer el informe","Hay que renegociar el cronograma"],"a":2,"e":"Es una forma de que los gerentes sepan si tienen que leer el resto."},{"q":"¿Qué grafica una carta de tendencia de hitos?","o":["La cantidad de defectos","La diferencia entre lo planeado y lo realizado (o estimado) para cada hito","El costo acumulado","El esfuerzo restante por día"],"a":1,"e":"Muestra cuántos días antes o después de lo planeado se cumple cada hito."},{"q":"En la carta de hitos, ¿cuántos retrasos sucesivos piden una acción correctiva?","o":["1","2","4 o más","7 o más"],"a":2,"e":"Indican que el proyecto se está yendo de control."},{"q":"En la carta de hitos, ¿qué indican 7 o más hitos seguidos del mismo lado de la línea?","o":["Que el proyecto va perfecto","Un cambio radical","Un error de medición","Corridas sucesivas: un cambio permanente en el cronograma (tendencia)"],"a":3,"e":"No es casualidad: hay que replanificar."},{"q":"En la carta de hitos, ¿qué pide un cambio radical (un salto grande)?","o":["Cambiar de LP","Ignorarlo","Renegociar el cronograma","Cancelar el proyecto"],"a":2,"e":"Puede ser en más o en menos."},{"q":"¿Qué combina la gestión del valor obtenido (EVM)?","o":["Alcance, cronograma y presupuesto en una misma unidad","Riesgos y calidad","Personas y perfiles","Requerimientos y soluciones"],"a":0,"e":"Permite medir el progreso objetivamente y pronosticar."},{"q":"¿Por qué comparar solo lo planeado (PV) con lo gastado (AC) no alcanza?","o":["Porque PV siempre es mayor","Porque PV y AC se miden en unidades distintas","Porque no dice cuánto trabajo se hizo: gastar menos puede ser hacer menos","Porque AC no se puede medir"],"a":2,"e":"Sin el valor ganado (EV) no se sabe si gastar menos es ahorrar o atrasarse."},{"q":"¿Qué es el EV (valor obtenido)?","o":["Lo que debería estar hecho a la fecha","El presupuesto total","El valor, a precio de presupuesto, del trabajo efectivamente realizado","Lo que se gastó realmente"],"a":2,"e":"Se puede tomar como la suma de los PV de las tareas terminadas."},{"q":"¿Qué es el AC?","o":["El presupuesto a la conclusión","El costo real del trabajo realizado","El valor obtenido","El valor planificado"],"a":1,"e":"Actual cost."},{"q":"¿Cómo se calcula el SPI?","o":["PV / AC","AC / EV","EV / PV","EV / AC"],"a":2,"e":"Schedule performance index."},{"q":"¿Cómo se calcula el CPI?","o":["PV / EV","EV / AC","AC / PV","EV / PV"],"a":1,"e":"Cost performance index."},{"q":"Un proyecto tiene SPI = 0,84. ¿Qué significa?","o":["Tiene sobrecosto","Gastó el 84% del presupuesto","Va atrasado: hizo el 84% de lo planeado","Va adelantado"],"a":2,"e":"SPI menor que 1 es atraso."},{"q":"Un proyecto tiene CPI = 0,875. ¿Qué significa?","o":["Terminará antes","Está por debajo del presupuesto","Lo hecho cuesta más de lo que vale: hay sobrecosto","Va atrasado"],"a":2,"e":"Cada peso gastado produce 87,5 centavos de trabajo."},{"q":"SPI = 1,1 y CPI = 0,8. ¿Qué pasa?","o":["Va atrasado y con sobrecosto","Va perfecto","Va atrasado y con ahorro","Va adelantado, pero gastando más de lo que vale lo hecho"],"a":3,"e":"Quizás está comprando el adelanto con horas extra."},{"q":"PV = 50, EV = 42, AC = 48. ¿Cuánto vale la variación de cronograma SV?","o":["2","8","-8","-6"],"a":2,"e":"SV = EV - PV = 42 - 50."},{"q":"PV = 50, EV = 42, AC = 48. ¿Cuánto vale la variación de costo CV?","o":["-8","6","-6","2"],"a":2,"e":"CV = EV - AC = 42 - 48."},{"q":"¿Por qué conviene medir el EV contando solo las tareas terminadas (regla 0/100)?","o":["Porque el EV no puede tener decimales","Porque el porcentaje que informa el responsable suele ser optimista (hope creep)","Porque lo exige el cliente","Porque es más rápido"],"a":1,"e":"Contar solo lo terminado es objetivo y verificable."},{"q":"¿Qué es la bitácora de pendientes (issues log)?","o":["La lista de riesgos potenciales","El registro de horas trabajadas","El registro de los problemas ya ocurridos que todavía no se resolvieron","La lista de requerimientos"],"a":2,"e":"Registra el problema, la solución propuesta, el impacto y el estado."},{"q":"¿Qué diferencia hay entre un riesgo y un pendiente (issue)?","o":["Son lo mismo","El pendiente es más probable","El riesgo puede ocurrir; el pendiente ya ocurrió y hay que resolverlo","El riesgo lo resuelve el cliente"],"a":2,"e":"Un riesgo materializado pasa a la bitácora de pendientes."},{"q":"¿Qué es un stakeholder?","o":["El accionista mayoritario","Solo los miembros del equipo","Solo el cliente que paga","Alguien con interés o influencia en el proyecto, o que resulta afectado por él"],"a":3,"e":"Individuo, organización u otra entidad."},{"q":"¿Cuáles son las cuatro etapas de la gestión de stakeholders?","o":["Planificar, hacer, verificar y actuar","Identificación, análisis, planificación y comunicación y gestión","Requerimiento, clarificación, respuesta y acuerdo","Reducción, supervisión, gestión y cierre"],"a":1,"e":"En el análisis se usa la matriz de impacto."},{"q":"En la matriz de impacto de stakeholders, alguien de alto impacto y alto interés requiere…","o":["Ninguna acción","Mantener el interés","Fuerte compromiso","Mantenerlo informado"],"a":2,"e":"Bajo impacto y bajo interés: mantener informado."},{"q":"¿Cuál es un factor crítico de éxito de la gestión de stakeholders?","o":["Que no participen","Que se apropien del proyecto (posesión)","Que paguen por adelantado","Que firmen el WBS"],"a":1,"e":"Participación, compromiso, posesión y apoyo."},{"q":"¿Qué describe un plan de comunicación?","o":["El organigrama de la empresa","Los riesgos priorizados","Las tareas del WBS","Qué se comunicará, cómo, quién y cuándo"],"a":3,"e":"Es el instrumento central para planificar y monitorear la comunicación."},{"q":"¿Con qué frecuencia se hacen típicamente las reuniones de avance del proyecto?","o":["Semanalmente","Cada hora","Solo al final","Una vez al año"],"a":0,"e":"En proyectos ágiles se suman dailies de 15 minutos."},{"q":"En una reunión de avance, ¿quién informa la salud del proyecto?","o":["El auditor","El cliente","El tester","El LP"],"a":3,"e":"Antes, el gerente o el cliente informan cambios que afectan al proyecto."},{"q":"¿Quién decide cuándo el proyecto está terminado, en la aceptación de entregables?","o":["El equipo","El cliente","El LP","El gerente de línea"],"a":1,"e":"El LP debe demostrar que los entregables cumplen la especificación."},{"q":"¿Cuál es la función del LP en la aceptación de entregables?","o":["Decidir cuándo se termina","Demostrar que los entregables cumplen la especificación del cliente","Firmar la aceptación en nombre del cliente","Auditar al cliente"],"a":1,"e":"Por eso son útiles los criterios de aceptación definidos al principio."},{"q":"¿Qué estrategia de instalación es la más riesgosa?","o":["En paralelo","En un corte (big bang)","Por unidad de negocio","En fases"],"a":1,"e":"Si falla, no hay vuelta atrás fácil."},{"q":"¿Qué estrategia de instalación es la más segura pero la más cara?","o":["Por unidad de negocio","En fases","En un corte","En paralelo"],"a":3,"e":"Se opera dos veces y se comparan resultados."},{"q":"¿Cuándo conviene instalar por unidad de negocio?","o":["Cuando hay distancias geográficas, como sucursales","Cuando no hay tiempo de probar","Nunca","Cuando el sistema es muy chico"],"a":0,"e":"La primera unidad funciona como piloto."},{"q":"¿Cuál NO es un motivo para documentar el proyecto en el cierre?","o":["Aumentar la facturación al cliente","Fuente de entrenamiento para nuevos LP","Registro histórico para estimaciones futuras","Referencia para futuros cambios"],"a":0,"e":"También sirve para evaluar la performance del equipo."},{"q":"¿Qué evalúa la auditoría post-implementación?","o":["La calidad del código","Las metas y logros del proyecto frente a lo planeado y presupuestado","El cumplimiento de ISO 9001","Los controles de seguridad del sistema"],"a":1,"e":"Puede incluir satisfacción del cliente y lecciones aprendidas."},{"q":"¿Por qué en general no se hace la auditoría post-implementación?","o":["Porque no tiene utilidad","Porque es ilegal","Porque no es una tarea facturable","Porque la hace el cliente"],"a":2,"e":"Aunque la organización puede aprender mucho de ella."},{"q":"¿Qué es el reporte final del proyecto?","o":["La factura final","Una historia de la ejecución: éxito logrado, organización, técnicas, fortalezas y debilidades","El manual de usuario","El último informe semáforo"],"a":1,"e":"Es una de las seis actividades del cierre."},{"q":"¿Cuál es la última actividad del cierre según el apunte?","o":["La aceptación de entregables","La celebración del éxito","La instalación","La auditoría post-implementación"],"a":1,"e":"Reconocer al equipo por la finalización."},{"q":"¿Cuáles son las seis actividades del cierre, en orden?","o":["Aceptación, instalación, documentación, auditoría post-implementación, reporte final y celebración","Planificación, ejecución, control, aceptación, pago y cierre","Identificación, análisis, planificación, comunicación, gestión y cierre","Requerimientos, diseño, código, prueba, instalación y mantenimiento"],"a":0,"e":"Así las propone Wysocki."},{"q":"¿Qué es la línea base (baseline) del proyecto?","o":["La versión aprobada del cronograma y el presupuesto, contra la que se mide el avance","El presupuesto mínimo","El primer borrador del plan","La última versión del plan, siempre actualizada"],"a":0,"e":"Solo cambia por un procedimiento formal de control de cambios."},{"q":"¿Qué es el BAC en valor ganado?","o":["La variación de costo","El valor obtenido","El presupuesto total (budget at completion)","El costo real acumulado"],"a":2,"e":"Es el valor final de la curva PV."},{"q":"¿Qué herramienta permite ver el avance marcando dentro de cada barra la proporción realizada?","o":["El Gantt de avance","El WBS","El diagrama PERT","La matriz por perfil"],"a":0,"e":"Se compara con la fecha de corte."},{"q":"¿Qué reporte muestra las diferencias entre lo planeado y lo ocurrido en un período, en tabla o gráfico?","o":["El reporte final","El reporte semáforo","El reporte de variantes","El reporte acumulativo"],"a":2,"e":"Típicamente sobre presupuesto y cronograma."},{"q":"¿Qué incluye un reporte periódico?","o":["Toda la historia del proyecto","La información de un período: lo planificado contra lo realizado, con razones y medidas correctivas","Solo los costos","Solo los riesgos"],"a":1,"e":"Lo usan el equipo y el LP en el seguimiento semanal."},{"q":"¿Qué objetivo tiene la comunicación con stakeholders según el apunte?","o":["Que se haga solo al final","Que sea de doble vía, alentando la retroalimentación","Que sea solo del LP hacia ellos","Que la maneje el cliente"],"a":1,"e":"También: concientizar, comprometer y mantener a todos informados."},{"q":"¿Qué es un pronóstico de duración simple con valor ganado?","o":["PV dividido EV por el costo","Plazo por CPI","Plazo planificado dividido SPI","BAC dividido AC"],"a":2,"e":"Con 12 semanas y SPI = 0,84, unas 14,3 semanas."},{"q":"En la matriz de impacto de stakeholders, un área de bajo impacto y bajo interés requiere…","o":["Consulta activa","Fuerte compromiso","Mantenerla informada","Excluirla del proyecto"],"a":2,"e":"Es la esquina de menor prioridad."},{"q":"¿Qué es el TCPI en valor ganado (ampliación)?","o":["La cantidad de tareas pendientes","La  del usuario","La visión del auditor","La trascendental"],"a":2,"e":"Trascendental, del usuario, de manufactura, del producto y basada en el valor."},{"q":"La visión de manufactura define la calidad como…","o":["Algo que se reconoce pero no se define","Conformidad con la especificación","Adecuación al propósito del usuario","Lo que el cliente está dispuesto a pagar"],"a":1,"e":"Hacerlo bien la primera vez, pocos defectos."},{"q":"¿Qué visión de la calidad adoptó mayormente la industria, según Fenton?","o":["Una visión basada en defectos","La visión trascendental","La visión basada en el valor","Ninguna"],"a":0,"e":"Útil pero parcial."},{"q":"¿Cuáles son los dos enfoques para monitorear la calidad?","o":["Medir antes o después de la entrega","Usar ISO o CMM","Auditar o certificar","Adoptar un modelo fijo o definir un modelo propio"],"a":3,"e":"Modelo fijo: McCall o ISO 9126. Propio: Gilb."},{"q":"¿Qué propone el enfoque de modelo propio (Gilb)?","o":["Adoptar siempre ISO 9126","Acordar con el cliente qué atributos importan y medirlos con escala, nivel planeado y mínimo","Usar solo métricas internas","No medir la calidad"],"a":1,"e":"Es la misma idea de la especificación de atributos con niveles."},{"q":"¿Qué estructura tiene el modelo de McCall?","o":["Factor, criterio y métrica","Riesgo, impacto y plan","Característica y subcaracterística","Nivel, área y práctica"],"a":0,"e":"Los factores son externos; los criterios, internos; las métricas los miden."},{"q":"¿Cuáles son las tres perspectivas del modelo de McCall?","o":["Operación, revisión y transición del producto","Diseño, código y prueba","Interna, externa y en uso","Proyecto, proceso y producto"],"a":0,"e":"Agrupan los 11 factores de calidad."},{"q":"¿Qué factor de McCall pertenece a la operación del producto?","o":["Mantenibilidad","Confiabilidad","Portabilidad","Reusabilidad"],"a":1,"e":"Operación: corrección, confiabilidad, eficiencia, integridad y usabilidad."},{"q":"¿Qué factor de McCall pertenece a la revisión del producto?","o":["Interoperabilidad","Eficiencia","Mantenibilidad","Integridad"],"a":2,"e":"Revisión: mantenibilidad, flexibilidad y facilidad de prueba."},{"q":"¿Qué factor de McCall pertenece a la transición del producto?","o":["Usabilidad","Flexibilidad","Portabilidad","Corrección"],"a":2,"e":"Transición: portabilidad, reusabilidad e interoperabilidad."},{"q":"En McCall, el factor integridad (¿es seguro?) se descompone en…","o":["Operabilidad y entrenamiento","Modularidad y simplicidad","Exactitud y consistencia","Control de acceso y auditoría de acceso"],"a":3,"e":"Mide la protección contra accesos no autorizados."},{"q":"¿Cómo se analiza cada criterio de calidad en McCall?","o":["Con métricas (sobre todo checklists puntuadas) combinadas con pesos obtenidos por regresión","Con la opinión del cliente","Con una auditoría externa","Con COCOMO"],"a":0,"e":"F = c1·m1 + … + cn·mn, y se valida que prediga el factor."},{"q":"¿Cuál es una desventaja de tener un único modelo de calidad?","o":["Sirve como checklist","Da vocabulario común","Permite comparar productos","Ningún modelo fijo sirve igual para todos los dominios"],"a":3,"e":"Además los pesos son arbitrarios y puede dar falsa objetividad."},{"q":"¿Cuál es una ventaja de tener un único modelo de calidad?","o":["No requiere métricas","Elimina la subjetividad","Se adapta solo a cada dominio","Permite comparar productos y proveedores sobre la misma base"],"a":3,"e":"Es el objetivo de ISO 9126."},{"q":"Un programador escribe < en lugar de <=. ¿Qué es eso en la terminología de Fenton?","o":["Una falla (failure)","Un pendiente","Una falta (fault) producida por un error humano","Un riesgo"],"a":2,"e":"Si se ejecuta con el valor límite y calcula mal, eso es una falla."},{"q":"¿Qué es una falla (failure)?","o":["La marca en el código","Un comportamiento incorrecto observado al ejecutar el sistema","La equivocación humana","Un requisito ambiguo"],"a":1,"e":"Error → falta → falla."},{"q":"¿Qué diferencia hay entre bug acción","Contando pantallas de ayuda","Con la complejidad ciclomática","Con COCOMO"],"a":0,"e":"Los sustitutos internos no probaron predecirla."},{"q":"Adaptar el sistema a una nueva alícuota de un impuesto es mantenimiento…","o":["Perfectivo","Correctivo","Adaptativo","Preventivo"],"a":2,"e":"Adapta a cambios del entorno: leyes, SO, hardware."},{"q":"Agregar la exportación a Excel que pidieron los usuarios es mantenimiento…","o":["Preventivo","Correctivo","Perfectivo","Adaptativo"],"a":2,"e":"Mejoras o funciones pedidas."},{"q":"Refactorizar un módulo difícil de entender es mantenimiento…","o":["Preventivo","Perfectivo","Adaptativo","Correctivo"],"a":0,"e":"Mejora la estructura para facilitar el mantenimiento futuro."},{"q":"¿Qué atributos hay que considerar para medir la mantenibilidad?","o":["Solo el costo","Solo la satisfacción del usuario","Externos (tiempo medio de reparación) e internos como predictores (complejidad, legibilidad)","Solo la cantidad de líneas de código"],"a":2,"e":"La medida externa central es el MTTR."},{"q":"¿Qué mide el índice Fog?","o":["La legibilidad de un texto: años de educación necesarios para entenderlo","La niebla en el servidor","La complejidad del código","La densidad de defectos"],"a":0,"e":"Fog = 0,4 × (palabras/oraciones + % de palabras de 3 o más sílabas)."},{"q":"¿Por qué el índice Fog en castellano infla los valores?","o":["Porque la fórmula no admite tildes","Porque las palabras en castellano tienen en promedio más sílabas que en inglés","Porque el castellano tiene oraciones más cortas","Porque no se cuentan los artículos"],"a":1,"e":"Sirve para comparar versiones de un texto, no como valor absoluto."},{"q":"¿Cómo se define la productividad?","o":["Costo por persona","Lo producido dividido el esfuerzo (por ejemplo, PF por persona-mes)","Horas trabajadas por día","Defectos por KLOC"],"a":1,"e":"Es un atributo externo de un recurso."},{"q":"¿Cuál es un problema de medir la productividad en líneas de código?","o":["Penaliza a function unitById(id) { return UNITS.find(u => u.id === id); }
function stats(u) {
  const r = us(u.id).r; let ok = 0, bad = 0;
  for (const k in r) { if (r[k] === u.qs[k].a) ok++; else bad++; }
  return { ok, bad, ans: ok + bad, total: u.qs.length };
}
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(k));
  return n;
};

function renderNav() {
  const nav = document.getElementById("units"); nav.replaceChildren();
  UNITS.forEach((u, i) => {
    const s = stats(u);
    nav.append(el("button", { class: "unit-btn", "aria-current": String(state.u === u.id), onclick: () => go(u.id) },
      el("span", { class: "code" }, `U${i} · ${u.tp}`),
      el("span", {}, u.nombre),
      el("span", { class: "mini" }, `${s.ok}/${s.total} correctas`)));
  });
  nav.append(el("button", { class: "unit-btn", "aria-current": String(state.u === "resumen"), onclick: () => go("resumen") },
    el("span", { class: "code" }, "TODAS"), el("span", {}, "Resumen general"), el("span", { class: "mini" }, "puntaje por unidad")));
  const cur = nav.querySelector('[aria-current="true"]');
  if (cur && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = cur.offsetLeft - nav.offsetLeft - 8;
  let ok = 0, ans = 0, total = 0;
  UNITS.forEach(u => { const s = stats(u); ok += s.ok; ans += s.ans; total += s.total; });
  document.getElementById("overall").textContent = `${ans}/${total} respondidas · ${ok} correctas · ${pct(ok, ans)}% de acierto`;
}
function go(id) { state.u = id; save(); render(); window.scrollTo({ top: 0 }); }

let armed = null, armTimer = null;
function arm(name, fn, btn) {
  if (armed === name) { clearTimeout(armTimer); armed = null; fn(); return; }
  armed = name; render();
  armTimer = setTimeout(() => { armed = null; render(); }, 4000);
}

function answer(u, k, choice) {
  const st = us(u.id); if (st.r[k] !== undefined) return;
  st.r[k] = choice; save(); render();
}
function move(u, d) {
  const st = us(u.id); st.i = Math.min(u.qs.length - 1, Math.max(0, st.i + d)); save(); render();
}

function renderUnit(u) {
  const st = us(u.id); const k = st.i; const q = u.qs[k]; const chosen = st.r[k]; const answered = chosen !== undefined;
  const s = stats(u);
  const card = el("section", { class: "card", "aria-live": "polite" });

  if (s.ans === s.total) {
    const p = pct(s.ok, s.total);
    card.append(el("div", { class: "done" },
      el("h2", {}, "Terminaste la unidad"),
      el("div", { class: "big" }, `${s.ok}/${s.total} · ${p}%`),
      el("p", { style: "margin:0" }, p >= 80 ? "Muy bien. Repasá las incorrectas para cerrar los huecos." : p >= 60 ? "Bien. Volvé sobre las incorrectas y releé esas secciones del resumen." : "Conviene releer esta unidad en el resumen y reintentar las incorrectas."),
      el("div", { class: "group", style: "display:flex;gap:8px;flex-wrap:wrap" },
        el("button", { class: "btn primary", disabled: s.bad === 0, onclick: () => retryWrong(u) }, `Reintentar las ${s.bad} incorrectas`),
        el("button", { class: "btn danger" + (armed === "reset" + u.id ? " armed" : ""), onclick: () => arm("reset" + u.id, () => resetUnit(u)) }, armed === "reset" + u.id ? "Confirmar: borrar respuestas" : "Reiniciar la unidad"))));
    card.append(el("div", { style: "height:16px" }));
  }

  card.append(el("div", { class: "qhead" }, el("span", {}, `Pregunta ${k + 1} de ${u.qs.length}`), el("span", {}, answered ? (chosen === q.a ? "Correcta" : "Incorrecta") : "Sin responder")));
  card.append(el("p", { class: "qtext" }, q.q));
  const opts = el("div", { class: "opts", role: "group", "aria-label": "Opciones" });
  q.o.forEach((o, j) => {
    let cls = "opt";
    if (answered) { if (j === q.a) cls += " correct"; else if (j === chosen) cls += " wrong"; else cls += " dim"; }
    opts.append(el("button", { class: cls, disabled: answered, onclick: () => answer(u, k, j) }, el("span", { class: "key" }, LETTERS[j]), el("span", {}, o)));
  });
  card.append(opts);
  if (answered) {
    const ok = chosen === q.a;
    card.append(el("div", { class: "feedback " + (ok ? "ok" : "bad") },
      el("strong", {}, ok ? "Correcto" : `Incorrecto. La respuesta correcta es la ${LETTERS[q.a]}.`), el("p", {}, q.e)));
  }
  card.append(el("div", { class: "controls" },
    el("div", { class: "group" },
      el("button", { class: "btn", disabled: k === 0, onclick: () => move(u, -1) }, "← Anterior"),
      el("button", { class: "btn primary", disabled: k === u.qs.length - 1, onclick: () => move(u, 1) }, "Siguiente →")),
    el("div", { class: "group" },
      answered ? el("button", { class: "btn", onclick: () => { delete st.r[k]; save(); render(); } }, "Volver a intentar esta") : null)));
  card.append(el("p", { class: "hint" }, "Atajos: A–D o 1–4 para responder, flechas ← → para moverte."));

  const nextOpen = u.qs.findIndex((_, i) => st.r[i] === undefined);
  const board = el("aside", { class: "board card", "aria-label": "Tablero de la unidad" },
    el("h2", {}, `U${UNITS.indexOf(u)} · ${u.nombre}`),
    el("div", { class: "score" },
      el("div", { class: "stat" }, el("span", { class: "v" }, `${s.ok}/${s.ans}`), el("span", { class: "l" }, "correctas")),
      el("div", { class: "stat" }, el("span", { class: "v" }, `${pct(s.ok, s.ans)}%`), el("span", { class: "l" }, "acierto")),
      el("div", { class: "stat" }, el("span", { class: "v" }, `${s.ans}/${s.total}`), el("span", { class: "l" }, "respondidas"))),
    el("div", { class: "bar", role: "img", "aria-label": `${s.ok} correctas y ${s.bad} incorrectas de ${s.total}` },
      el("i", { class: "g", style: `width:${100 * s.ok / s.total}%` }), el("i", { class: "r", style: `width:${100 * s.bad / s.total}%` })),
    el("div", { class: "legend" }, el("span", { style: "--c:var(--ok)" }, "correcta"), el("span", { style: "--c:var(--bad)" }, "incorrecta"), el("span", { style: "--c:var(--cell)" }, "sin responder")),
    el("div", { class: "grid" }, u.qs.map((qq, i) => {
      const r = st.r[i]; let cls = "cell";
      if (r !== undefined) cls += r === qq.a ? " ok" : " bad";
      if (i === k) cls += " cur";
      return el("button", { class: cls, "aria-label": `Ir a la pregunta ${i + 1}`, onclick: () => { st.i = i; save(); render(); } }, String(i + 1));
    })),
    el("div", { class: "stack" },
      el("button", { class: "btn", disabled: nextOpen < 0, onclick: () => { st.i = nextOpen; save(); render(); } }, "Ir a la próxima sin responder"),
      el("button", { class: "btn", disabled: s.bad === 0, onclick: () => retryWrong(u) }, `Reintentar las incorrectas (${s.bad})`),
      el("button", { class: "btn danger" + (armed === "reset" + u.id ? " armed" : ""), onclick: () => arm("reset" + u.id, () => resetUnit(u)) }, armed === "reset" + u.id ? "Confirmar: borrar respuestas" : "Reiniciar la unidad")));

  return el("div", { class: "layout" }, card, board);
}
function retryWrong(u) {
  const st = us(u.id); const wrong = Object.keys(st.r).map(Number).filter(i => st.r[i] !== u.qs[i].a);
  wrong.forEach(i => delete st.r[i]); if (wrong.length) st.i = Math.min(...wrong); save(); render();
}
function resetUnit(u) { state.s[u.id] = { i: 0, r: {} }; save(); render(); }

function renderSummary() {
  let tot = { ok: 0, bad: 0, ans: 0, total: 0 };
  const rows = UNITS.map((u, i) => {
    const s = stats(u); for (const k in tot) tot[k] += s[k];
    return el("tr", {},
      el("td", {}, el("button", { class: "linkbtn", onclick: () => go(u.id) }, `U${i} · ${u.nombre}`)),
      el("td", { class: "num" }, `${s.ans}/${s.total}`), el("td", { class: "num" }, String(s.ok)), el("td", { class: "num" }, String(s.bad)),
      el("td", { class: "num" }, s.ans ? `${pct(s.ok, s.ans)}%` : "—"), el("td", { class: "num" }, `${pct(s.ok, s.total)}%`));
  });
  const table = el("table", { class: "sum" },
    el("thead", {}, el("tr", {}, ["Unidad", "Respondidas", "Correctas", "Incorrectas", "Acierto", "Nota sobre el total"].map(h => el("th", {}, h)))),
    el("tbody", {}, rows, el("tr", { class: "total" }, el("td", {}, "Total"), el("td", { class: "num" }, `${tot.ans}/${tot.total}`),
      el("td", { class: "num" }, String(tot.ok)), el("td", { class: "num" }, String(tot.bad)),
      el("td", { class: "num" }, tot.ans ? `${pct(tot.ok, tot.ans)}%` : "—"), el("td", { class: "num" }, `${pct(tot.ok, tot.total)}%`))));
  return el("section", { class: "card" },
    el("div", { class: "qhead" }, el("span", {}, "Resumen general"), el("span", {}, `${UNITS.length} unidades`)),
    el("p", { class: "qtext" }, "Puntaje acumulado de todas las unidades. \"Acierto\" es sobre las respondidas; \"nota sobre el total\" cuenta las no respondidas como incorrectas."),
    el("div", { class: "tablewrap" }, table),
    el("div", { class: "controls" }, el("span", {}),
      el("button", { class: "btn danger" + (armed === "resetall" ? " armed" : ""), onclick: () => arm("resetall", () => { state.s = {}; save(); render(); }) }, armed === "resetall" ? "Confirmar: borrar todo" : "Reiniciar todas las unidades")));
}

function render() {
  if (state.u !== "resumen" && !unitById(state.u)) state.u = UNITS[0].id;
  renderNav();
  const main = document.getElementById("main");
  main.replaceChildren(state.u === "resumen" ? renderSummary() : renderUnit(unitById(state.u)));
}
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || state.u === "resumen") return;
  const u = unitById(state.u); if (!u) return; const st = us(u.id);
  const map = { a: 0, b: 1, c: 2, d: 3, "1": 0, "2": 1, "3": 2, "4": 3 };
  const key = e.key.toLowerCase();
  if (key in map) { answer(u, st.i, map[key]); }
  else if (e.key === "ArrowRight") move(u, 1);
  else if (e.key === "ArrowLeft") move(u, -1);
});
render();
</script>
