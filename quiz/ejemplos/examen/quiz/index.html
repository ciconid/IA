<script>
const UNITS = [{"id":"u0","nombre":"Ágiles y Scrum","tp":"TP0","qs":[{"q":"¿Qué se conoce como la crisis del software (1968)?","o":["La falta de lenguajes de alto nivel","Demanda y complejidad crecientes frente a la misma gente, métodos y herramientas","El fracaso del modelo ágil en proyectos grandes","La caída de los precios del hardware en los años 60"],"a":1,"e":"La demanda, la complejidad y los desafíos crecían más rápido que la capacidad de construir, con la misma gente, los mismos métodos y las mismas herramientas."},{"q":"¿Cuál es el principal problema del modelo en cascada cuando el negocio cambia rápido?","o":["No permite documentar los requerimientos","El cliente ve el producto recién al final y corregir un requisito tarde es muy caro","No tiene etapa de verificación","Obliga a trabajar sin plan"],"a":1,"e":"En cascada cada etapa termina antes de la siguiente; un requisito mal entendido se descubre tarde, cuando corregirlo obliga a rehacer diseño e implementación."},{"q":"¿Dónde y cuándo se firmó el Manifiesto Ágil?","o":["En Boston, en 1995","En Londres, en 2005","En Garmisch (Alemania), en 1968","En Snowbird (Utah), en febrero de 2001"],"a":3,"e":"Diecisiete referentes se reunieron en el Lodge at Snowbird en febrero de 2001."},{"q":"El agilismo es…","o":["Una herramienta de gestión de proyectos","Un estándar de la IEEE","Una metodología con roles y artefactos definidos","Un conjunto de valores y principios, que metodologías como Scrum o XP implementan"],"a":3,"e":"Ágil es el paraguas de valores y principios; Scrum, XP, Kanban o Lean son implementaciones concretas."},{"q":"¿Cuál de estos es uno de los cuatro valores del Manifiesto Ágil?","o":["Documentación extensiva sobre software funcionando","Seguir un plan sobre responder al cambio","Procesos y herramientas sobre individuos e interacciones","Software funcionando sobre documentación extensiva"],"a":3,"e":"Los valores priorizan individuos e interacciones, software funcionando, colaboración con el cliente y respuesta al cambio."},{"q":"Según el Manifiesto Ágil, ¿la documentación no tiene valor?","o":["Solo vale en proyectos tipo A","Sí tiene valor, pero se valora más el software funcionando","Solo la escribe el Scrum Master","No, el manifiesto la elimina"],"a":1,"e":"La frase final dice: aunque valoramos los elementos de la derecha, valoramos más los de la izquierda."},{"q":"¿Cada cuánto recomiendan los principios ágiles entregar software funcional?","o":["Entre dos semanas y dos meses, prefiriendo el período más corto","Solo cuando el cliente lo pide","Una vez al final del proyecto","Cada seis meses"],"a":0,"e":"Es uno de los doce principios: entrega frecuente, con preferencia por el período más corto."},{"q":"¿Cuál es, según los principios ágiles, la medida principal de progreso?","o":["El software funcionando","La cantidad de reuniones realizadas","El porcentaje de horas consumidas","La cantidad de documentación producida"],"a":0,"e":"El principio dice explícitamente que el software funcionando es la medida principal de progreso."},{"q":"El principio de simplicidad se define como…","o":["Usar siempre la tecnología más simple","Evitar las reuniones","Escribir la menor cantidad de código","El arte de maximizar la cantidad de trabajo no realizado"],"a":3,"e":"Significa no construir lo que nadie pidió (lo opuesto al feature creep)."},{"q":"Según Boehm y Turner, ¿qué proyecto es más adecuado para un enfoque ágil?","o":["Requisitos estables y personal mayormente junior","Software de control de vuelo con vidas en juego","Equipo chico y senior, requisitos que cambian mucho y baja criticidad","Cientos de personas distribuidas en varios países"],"a":2,"e":"Cerca del centro del gráfico (equipos chicos, senior, requisitos cambiantes, baja criticidad) es terreno ágil."},{"q":"¿Quiénes crearon Scrum?","o":["Jeff Sutherland y Ken Schwaber","Kent Beck y Martin Fowler","Barry Boehm y Richard Turner","Allan Albrecht y Tom Gilb"],"a":0,"e":"Sutherland lo aplicó en 1993 y Schwaber lo formalizó en 1995."},{"q":"Scrum es…","o":["Un estándar de documentación de requerimientos","Un framework de gestión que define roles, reuniones y artefactos","Un modelo de madurez de procesos","Una metodología completa que define cómo programar y probar"],"a":1,"e":"Scrum no dice qué técnica de testing usar: el equipo elige sus prácticas técnicas dentro del framework."},{"q":"¿Qué es un timebox?","o":["La estimación en horas de una tarea","Una reunión sin duración fija","Un intervalo de tiempo fijo y no negociable asignado a una actividad","El tiempo que sobra al final de un sprint"],"a":2,"e":"Se trabaja exactamente ese tiempo y después se evalúa; todas las reuniones y ciclos de Scrum tienen timebox."},{"q":"En la analogía de la Mona Lisa, terminar al 100% la cara y después una mano representa el desarrollo…","o":["Iterativo","En cascada","Incremental","Exploratorio"],"a":2,"e":"Incremental agrega piezas terminadas; iterativo sería bocetar todo y refinar en cada pasada."},{"q":"¿Quién prioriza el Product Backlog?","o":["El Scrum Master","El cliente directamente, sin intermediarios","El Product Owner","El Development Team"],"a":2,"e":"El PO consolida lo que piden los stakeholders y prioriza según el valor."},{"q":"¿Quién acepta o rechaza los entregables en Scrum?","o":["El Scrum Master","El tester del equipo","El gerente de línea","El Product Owner"],"a":3,"e":"Aceptar o rechazar entregables es responsabilidad del PO."},{"q":"¿Cuál es una responsabilidad del Scrum Master?","o":["Definir el business value de las historias","Eliminar impedimentos y proteger al equipo de interferencias","Aceptar los entregables del sprint","Asignar tareas individuales a cada desarrollador"],"a":1,"e":"El SM es un facilitador, no un jefe: protege el proceso y remueve obstáculos."},{"q":"El Development Team es…","o":["Formado solo por programadores","Responsable de priorizar el backlog","Multidisciplinario y autoorganizado","Dirigido por el Scrum Master, que le asigna tareas"],"a":2,"e":"Tiene todas las especialidades necesarias y nadie de afuera le asigna tareas individuales."},{"q":"¿Quién estima los story points?","o":["El Product Owner","El Development Team","El cliente","El Scrum Master"],"a":1,"e":"Estima quien hace el trabajo; el PO aporta el business value."},{"q":"¿Qué es un PBI?","o":["La unidad de trabajo del backlog: una funcionalidad, un defecto, un refactor o una tarea técnica","Un informe de avance del sprint","La reunión de planificación","Un indicador de productividad"],"a":0,"e":"Product Backlog Item; en las diapositivas aparecen como Feature A, Defect 23, Refactor X."},{"q":"En el Product Backlog, ¿qué ítems están más detallados?","o":["Los que propuso el Scrum Master","Los de abajo, que se harán más tarde","Todos tienen el mismo detalle","Los de arriba, que tienen más prioridad"],"a":3,"e":"Los de arriba se trabajarán pronto y necesitan granularidad fina; los de abajo pueden ser gruesos."},{"q":"Una vez empezado el sprint, el PO quiere agregar un ítem urgente. ¿Qué corresponde?","o":["No se agrega: el alcance del sprint está congelado y el ítem va al backlog para el próximo","Se agrega reemplazando el ítem de menor valor","Lo decide el Scrum Master en la daily","Se agrega si el equipo hace horas extra"],"a":0,"e":"Una vez que empezó el sprint no se pueden agregar ni quitar tareas del alcance acordado."},{"q":"¿Qué pasa con los ítems que no se terminaron al final del sprint?","o":["Se pasan automáticamente al sprint siguiente","Se cuentan como terminados al 50%","Se eliminan","Vuelven al Product Backlog para repriorizarse"],"a":3,"e":"Pueden quedar tareas sin hacer; vuelven al Product Backlog."},{"q":"La Sprint Planning tiene dos partes. ¿Cuáles?","o":["El análisis de riesgos y el cronograma","La demo y la retrospectiva","El qué (alcance, con el PO) y el cómo (tareas estimadas en horas)","La estimación y la facturación"],"a":2,"e":"Primero se negocia el alcance; después el equipo descompone cada ítem en tareas."},{"q":"¿Cuánto dura la Daily Scrum?","o":["15 minutos","1 hora","30 minutos","Lo que haga falta para resolver los problemas"],"a":0,"e":"Es corta y puntual; los problemas se resuelven después de la reunión."},{"q":"¿Cuáles son las tres preguntas de la Daily Scrum?","o":["¿Qué riesgos hay?, ¿qué probabilidad tienen?, ¿qué impacto?","¿Qué hice?, ¿qué voy a hacer?, ¿qué problemas tengo?","¿Cuánto gasté?, ¿cuánto falta?, ¿quién es responsable?","¿Qué pidió el cliente?, ¿qué entendimos?, ¿qué podemos ofrecer?"],"a":1,"e":"Cada miembro responde esas tres preguntas frente al tablero."},{"q":"¿Qué se muestra en la Sprint Review?","o":["Diapositivas con el avance","Software funcionando, a PO y stakeholders","El burndown de horas","El plan de riesgos actualizado"],"a":1,"e":"Se muestra el incremento real y se recoge feedback, que va al backlog."},{"q":"¿Sobre qué reflexiona el equipo en la retrospectiva?","o":["Sobre el presupuesto del proyecto","Sobre el producto y sus defectos","Sobre la priorización del backlog","Sobre su proceso de trabajo"],"a":3,"e":"Qué se hizo bien, qué mejorar y qué acciones tomar en el próximo sprint."},{"q":"Las acciones de una retrospectiva deberían ser SMART. ¿Qué significa la T?","o":["Transversales","Acotadas en el tiempo (con plazo)","Técnicas","Testeadas"],"a":1,"e":"Specific, Measurable, Attainable, Relevant, Timely."},{"q":"¿Cuál es el formato de una historia de usuario?","o":["Tarea: [verbo], Responsable: [persona]","Como [rol], quiero [objetivo], para [beneficio]","El sistema debe [función] en [tiempo]","Dado [contexto], cuando [acción], entonces [resultado]"],"a":1,"e":"El rol dice quién se beneficia, el objetivo qué se necesita y el beneficio por qué."},{"q":"¿Qué significa la S de INVEST?","o":["Segura","Small: menos de tres semanas-persona de trabajo","Simple de programar","Sencilla de explicar al cliente"],"a":1,"e":"Independent, Negotiable, Valuable, Estimable, Small, Testable."},{"q":"¿Qué cualidad INVEST aportan los criterios de aceptación?","o":["Independent","Testable","Negotiable","Valuable"],"a":1,"e":"Los criterios de aceptación son las condiciones verificables que vuelven testeable a la historia."},{"q":"¿Qué combinan típicamente los criterios de aceptación de una historia bien escrita?","o":["Solo la descripción técnica de la implementación","Lo que el usuario puede hacer, reglas según el caso y una confirmación visible","La estimación, el responsable y la fecha","El costo, el riesgo y la prioridad"],"a":1,"e":"Ej.: puede buscar por autor; si ya está en el carrito se aumenta la cantidad; luego se muestra el carrito."},{"q":"\"Actualizar todos los servidores a Apache 2.2\" es…","o":["Un criterio de aceptación","Un impedimento","Una historia de usuario del administrador","Un ítem técnico del equipo, no una historia de usuario"],"a":3,"e":"Está en infinitivo, no tiene rol de usuario y beneficia al sistema; ningún usuario lo pediría así."},{"q":"¿Qué mide el business value de una historia?","o":["El beneficio que trae al cliente realizarla","La cantidad de días que dura","El esfuerzo que le lleva al equipo","El riesgo técnico"],"a":0,"e":"Lo aporta el PO; el esfuerzo se mide en story points."},{"q":"Los story points son…","o":["El valor de negocio de la historia","Estimaciones relativas de esfuerzo","Horas de trabajo exactas","La cantidad de personas necesarias"],"a":1,"e":"Se pregunta si una historia es más grande o más chica que otra, no cuántas horas lleva."},{"q":"¿Por qué se usa una escala tipo Fibonacci para estimar?","o":["Porque la distancia entre valores crece con la incertidumbre y evita falsa precisión","Porque simplifica la facturación","Porque lo exige el Manifiesto Ágil","Porque los equipos rinden en proporción áurea"],"a":0,"e":"Discutir si algo grande vale 37 o 38 sería precisión falsa; la escala obliga a decisiones claras."},{"q":"¿Qué indica la carta ∞ (infinito) al estimar?","o":["Que la historia no tiene valor","Que el equipo necesita un descanso","Que la historia es demasiado grande o confusa y hay que partirla","Que no hace falta estimarla"],"a":2,"e":"Marca historias que no se pueden estimar en su estado actual."},{"q":"¿Qué es la velocity?","o":["Las horas trabajadas por día","El business value entregado por mes","La cantidad de story points que el equipo completa por sprint","La cantidad de historias del backlog"],"a":2,"e":"Funciona como un presupuesto: la suma de puntos del sprint no puede superarla."},{"q":"Con velocity 20, ¿entran historias de 8, 8 y 5 puntos?","o":["No, suman 21; entran dos de ellas","Entran si el PO lo aprueba","Solo entra una","Sí, entran las tres"],"a":0,"e":"La suma de esfuerzos no puede superar la velocity."},{"q":"¿Qué heurística da la cátedra para ordenar los ítems de un sprint?","o":["El ratio valor/esfuerzo, de mayor a menor","El valor, sin considerar el esfuerzo","El orden de alta en el backlog","El esfuerzo, de menor a mayor"],"a":0,"e":"Prioriza lo que da más valor por punto invertido, sin superar la velocity."},{"q":"Un ítem tiene ratio valor/esfuerzo bajo pero el PO lo prioriza igual. ¿Es válido?","o":["Sí, el ratio orienta; el PO puede priorizar por dependencias, riesgos o compromisos","No, el ratio es obligatorio","Solo en el primer sprint","Solo si lo aprueba el Scrum Master"],"a":0,"e":"El ratio es el criterio por defecto cuando no hay otra información."},{"q":"En un burndown chart, la línea real está por encima de la ideal. ¿Qué significa?","o":["Que el sprint va adelantado","Que la velocity aumentó","Que el equipo agregó historias","Que el sprint va atrasado"],"a":3,"e":"Por encima de la ideal queda más trabajo del previsto."},{"q":"Una línea real plana durante varios días en el burndown indica…","o":["Que el trabajo no avanza o no se está actualizando","Que se redujo el alcance","Que el equipo va adelantado","Que el sprint terminó"],"a":0,"e":"Es una alarma: el esfuerzo restante no baja."},{"q":"En Planning Poker, ¿por qué todos muestran la carta a la vez?","o":["Para que el PO pueda votar","Para que el promedio sea exacto","Para ahorrar tiempo","Para evitar el anclaje en la primera opinión expresada"],"a":3,"e":"La revelación simultánea evita que la opinión del más senior arrastre a los demás."},{"q":"En Planning Poker, si los valores no coinciden…","o":["Se toma el valor más alto por seguridad","Se toma el promedio","Decide el Scrum Master","Explican sus razones el que puso el valor más alto y el que puso el más bajo, y se vuelve a votar"],"a":3,"e":"La discusión de los extremos saca a la luz información que tenía uno solo."},{"q":"Planning Poker es una adaptación ágil de…","o":["El método del camino crítico","Los Puntos de Función","La técnica Delphi (y Delphi de banda ancha)","COCOMO"],"a":2,"e":"Ambas son técnicas grupales que discuten los extremos y reestiman."},{"q":"¿Qué enseña el desafío del malvavisco?","o":["Que los equipos grandes rinden más","Que conviene iterar y probar el supuesto crítico desde el principio","Que el timebox es opcional","Que hay que planificar todo antes de construir"],"a":1,"e":"Los que ponen el malvavisco arriba desde el inicio y prueban, ganan; los que lo dejan para el final, fracasan."},{"q":"¿Qué reunión prepara el backlog para la próxima planificación, estimando y dividiendo ítems grandes?","o":["Backlog Refinement (grooming)","Retrospectiva","Daily Scrum","Sprint Review"],"a":0,"e":"En el refinamiento los ítems grandes se dividen, se aclaran, se estiman y se repriorizan."},{"q":"¿Cuánto dura típicamente un sprint?","o":["Entre 1 y 4 semanas (típicamente 2 a 4)","Lo que tarde la historia más grande","Un día","Seis meses"],"a":0,"e":"Es un timebox corto y fijo."},{"q":"¿Cuál NO es un objetivo de Scrum?","o":["Maximizar la ganancia sobre la inversión de trabajo","Congelar los requerimientos al inicio del proyecto","Priorizar entregas por valor para el cliente","Detectar y eliminar obstáculos"],"a":1,"e":"Scrum busca ser flexible ante cambios técnicos y de negocio."},{"q":"El nombre Scrum viene…","o":["De una sigla en inglés","De la formación del rugby en que todo el equipo empuja junto","Del nombre de su creador","De un juego de cartas"],"a":1,"e":"La melé del rugby: todo el equipo empuja hacia un objetivo común."},{"q":"¿Qué es el Sprint Backlog?","o":["Los ítems que el equipo se comprometió a completar en el sprint actual","La lista de impedimentos del SM","Los defectos encontrados en la review","Todo lo que podría hacerse en el producto"],"a":0,"e":"Se define en la Sprint Planning; las tareas en que se descompone cada ítem son el cómo."}]},{"id":"u1","nombre":"Proyectos, POS y riesgos","tp":"TP1","qs":[{"q":"¿Qué es un proyecto según la cátedra?","o":["Un plan de trabajo sin fecha de fin","Cualquier operación repetitiva de una organización","Una secuencia de actividades con propósito, a completar en un tiempo, con un presupuesto y según una especificación","Un conjunto de programas de software"],"a":2,"e":"Dicho corto: cualquier actividad que dé como resultado un producto o entregable."},{"q":"¿Qué característica distingue a un proyecto de una operación rutinaria?","o":["Usa tecnología","Lo hace un equipo","Sus actividades son únicas: nunca se hicieron exactamente igual","Tiene un presupuesto"],"a":2,"e":"Las actividades de un proyecto son únicas, complejas y conectadas."},{"q":"Todo proyecto comienza con…","o":["El diagrama de Gantt","La compra de herramientas","El enunciado de un problema","La contratación del equipo"],"a":2,"e":"Antes de construir hay que decir qué problema u oportunidad lo motiva; de esa idea nace el POS."},{"q":"¿Cuáles son los cinco parámetros de un proyecto?","o":["Ámbito, calidad, costo, tiempo y recursos","Alcance, riesgo, valor, duración y costo","Planificación, ejecución, control, cierre y lanzamiento","Personas, procesos, tecnología, datos y clientes"],"a":0,"e":"Son también sus restricciones."},{"q":"¿Cuáles son los vértices del triángulo de alcance?","o":["Tiempo, costo y alcance/calidad","Cliente, gerente y líder","Requerimientos, diseño e implementación","Riesgo, valor y complejidad"],"a":0,"e":"Mover un vértice obliga a mover al menos otro."},{"q":"El cliente pide dos funcionalidades más sin mover la fecha. Según el triángulo…","o":["Algo tiene que ceder: sube el costo (más recursos) o baja la calidad","Se reduce el riesgo","Se alarga automáticamente el plazo","No cambia nada si el equipo se esfuerza"],"a":0,"e":"El triángulo sirve para escalar problemas y definir el impacto de un cambio."},{"q":"¿Quién controla el alcance, la calidad y las fechas de entrega?","o":["El equipo de desarrollo","El cliente","El gerente","El líder de proyecto"],"a":1,"e":"El LP controla recursos y cronograma; el gerente, niveles de recursos y costos."},{"q":"¿Qué controla el líder de proyecto?","o":["La utilización de los recursos y el cronograma de trabajo","El alcance y la calidad","Los niveles de recursos y los costos","Las fechas de entrega"],"a":0,"e":"Así lo establece la tabla de la cátedra."},{"q":"¿Qué es el hope creep?","o":["Informar que no hay demoras esperando recuperar el atraso antes del próximo informe","Agregar funcionalidades que nadie pidió","Cambiar el alcance sin autorización","Trabajar sin avanzar"],"a":0,"e":"Se combate verificando los informes, por ejemplo con controles aleatorios."},{"q":"El equipo agrega por su cuenta características que cree que el usuario querría. Es…","o":["Effort creep","Feature creep (corrimiento de rasgos)","Scope creep","Hope creep"],"a":1,"e":"Cada característica agregada consume pruebas, documentación y capacitación sin autorización."},{"q":"Cada semana el informe muestra avance pero la tarea nunca termina. Es…","o":["Hope creep","Scope creep","Effort creep (corrimiento de esfuerzo)","Feature creep"],"a":2,"e":"Se trabaja, pero el trabajo no representa progreso proporcional."},{"q":"¿Qué es el scope creep?","o":["Un atraso en el cronograma","La pérdida de un recurso","Un sobrecosto por inflación","Cualquier cambio de alcance que no estaba en el plan original"],"a":3,"e":"Es responsabilidad del LP acomodar el proyecto para tenerlo en cuenta."},{"q":"Síntoma clásico de un proyecto que fracasa al comienzo por no planificar:","o":["Tiene demasiada documentación","El cliente participa demasiado","Termina antes de tiempo","Avanza rápido hasta el 90% y se queda ahí"],"a":3,"e":"Planificar es saber a dónde ir, cómo llegar y cómo probar que se llegó."},{"q":"¿Cuál es una causa de fracaso durante el desarrollo?","o":["Tener un plan detallado","Usar estándares de desarrollo","Codificación prematura: programar antes de saber qué construir","Hacer revisiones frecuentes"],"a":2,"e":"Otras: mala documentación, roles confusos, falta de revisiones y estándares, deserciones, fuerza bruta."},{"q":"¿Cuál es una característica de un proyecto exitoso?","o":["Empezar a programar el primer día","Un costo exactamente igual al estimado","Procedimientos para detectar problemas en lugar de esperar que alguien se dé cuenta","No tener reuniones de revisión"],"a":2,"e":"También: comienzo claro con plan, criterios medibles, monitoreo, documentación y costo razonablemente cercano."},{"q":"¿Para qué se clasifican los proyectos?","o":["Para aplicar políticas de gestión por grupos de proyectos similares","Para calcular el sueldo del LP","Para elegir la metodología ágil","Para decidir el lenguaje de programación"],"a":0,"e":"No es viable inventar un proceso para cada proyecto."},{"q":"Un proyecto de más de 18 meses, riesgo alto y tecnología de avanzada es de tipo…","o":["D","B","C","A"],"a":3,"e":"A: más de 18 meses; B: 9 a 18; C: 3 a 9; D: menos de 3."},{"q":"Un proyecto de 3 a 9 meses, riesgo bajo y tecnología conocida es de tipo…","o":["B","A","C","D"],"a":2,"e":"Los C son los más frecuentes: un equipo de unas 5 personas hasta 6 meses."},{"q":"¿Qué proceso es requerido en los cuatro tipos de proyecto (A a D)?","o":["Las condiciones de satisfacción","El POS","La sesión de planificación (JPPS)","La reunión de kick-off"],"a":1,"e":"El COS, la sesión de planificación y el kick-off son opcionales en C y D."},{"q":"¿Qué es un hito?","o":["Una reunión semanal","Un riesgo materializado","Un evento que prueba claramente que una etapa se concluyó satisfactoriamente","Una tarea de duración larga"],"a":2,"e":"Ej.: entrega del documento de requerimientos, del código, el deploy."},{"q":"¿Qué etapa define QUÉ se hará e incluye el POS?","o":["Monitoreo y control","Concepción","Lanzamiento","Planificación"],"a":1,"e":"La planificación define CÓMO se hará."},{"q":"¿En qué etapa se escribe el plan de contención de riesgos?","o":["Lanzamiento","Planificación","Cierre","Concepción"],"a":1,"e":"Es una de las tareas típicas de la planificación."},{"q":"¿En qué etapa se establece el proceso de cambio de alcance y se recluta al equipo?","o":["Concepción","Cierre","Planificación","Lanzamiento"],"a":3,"e":"El lanzamiento prepara la ejecución."},{"q":"La auditoría post-implementación pertenece a la etapa de…","o":["Monitoreo y control","Lanzamiento","Planificación","Cierre"],"a":3,"e":"Junto con la aprobación del cliente, la instalación y el reporte final."},{"q":"¿Qué es un atributo crítico?","o":["Una calidad o recurso que puede hacer colapsar el sistema si supera ciertos límites","El riesgo de mayor probabilidad","El recurso más caro del proyecto","La funcionalidad más importante"],"a":0,"e":"Se especifica con niveles medibles, como el peor caso aceptable."},{"q":"¿Por qué un atributo crítico se especifica con varios niveles?","o":["Porque cada nivel corresponde a un tipo de proyecto","Porque una sola cifra no dice el límite de fracaso (peor caso) ni la meta (nivel planificado)","Para poder negociar el precio","Porque lo exige ISO 9001"],"a":1,"e":"Peor caso, nivel planificado y mejor caso."},{"q":"¿Cuál es un principio de administración de proyectos de la cátedra?","o":["Especificar los atributos al final","Planificar solo los proyectos tipo A","Nunca intentar entregar grandes sistemas complejos de una sola vez (big-bang)","Seguir siempre el mismo método sin adaptarlo"],"a":2,"e":"También: \"si no se sabe lo que se está haciendo, no hacerlo en gran escala\"."},{"q":"¿Qué tres cosas especifica el POS?","o":["Qué se hará, por qué y qué valor comercial tendrá","Quién, cuándo y cuánto cuesta","El cronograma, el presupuesto y los recursos","Los riesgos, los controles y los hitos"],"a":0,"e":"El tercer punto hace del POS también un argumento de negocio."},{"q":"El campo Problema/Oportunidad del POS debe…","o":["Describir la situación actual insatisfactoria sin proponer la solución","Listar los objetivos medibles","Describir la solución técnica elegida","Indicar el presupuesto aprobado"],"a":0,"e":"Ej.: el instituto usa planillas Excel, lo que genera información dispersa."},{"q":"¿En qué se diferencia una meta de un objetivo?","o":["La meta es cualitativa (para qué); el objetivo es medible y con plazo","Son sinónimos","La meta la escribe el equipo; el objetivo, el cliente","La meta tiene fecha; el objetivo no"],"a":0,"e":"\"Facilitar el acceso a los datos\" es meta; \"80% de usuarios accede en menos de una semana\" es objetivo."},{"q":"\"El 80% de los usuarios accede a sus datos a menos de una semana de la puesta en producción\" es…","o":["Un riesgo","Un objetivo","Una meta","Un problema"],"a":1,"e":"Tiene métrica (80%) y plazo (una semana)."},{"q":"¿Qué son los criterios de éxito del POS?","o":["El cronograma de hitos","La lista de funcionalidades","Las condiciones o métricas que determinan si el proyecto fue exitoso, que pueden mirar también al equipo u organización","Los riesgos priorizados"],"a":2,"e":"No necesariamente están asociados a la meta."},{"q":"¿Qué es un riesgo?","o":["Un problema potencial: puede ocurrir o no","Una restricción conocida del proyecto","Un defecto en el código","Un problema que ya ocurrió"],"a":0,"e":"Implica incertidumbre y pérdida."},{"q":"¿Por qué no existe un riesgo 100% probable?","o":["Porque siempre se puede evitar","Porque la probabilidad máxima es 90%","Porque sin incertidumbre ya no es un riesgo, es una restricción","Porque lo prohíbe la norma ISO"],"a":2,"e":"Algo seguro se planifica desde el principio como restricción."},{"q":"¿Cuáles son las tareas del análisis y gestión de riesgos, en orden?","o":["Reducir, supervisar, gestionar y cerrar","Identificar, evaluar probabilidad, estimar impacto y elaborar el plan RSGR","Planificar, ejecutar, controlar y cerrar","Estimar, priorizar, delegar y archivar"],"a":1,"e":"Y los planes de contingencia deben ser realistas."},{"q":"Según Pressman, los riesgos que amenazan la viabilidad del proyecto o producto son…","o":["Riesgos del negocio","Riesgos técnicos","Riesgos impredecibles","Riesgos del proyecto"],"a":0,"e":"Mercado, estrategia, ventas, dirección, presupuesto."},{"q":"\"El problema resulta más difícil de lo que suponíamos\" describe un riesgo…","o":["Conocido","Del negocio","Del proyecto","Técnico"],"a":3,"e":"Diseño, implementación, interfaces, mantenimiento o tecnología incierta."},{"q":"La clasificación de Charette distingue riesgos…","o":["De rendimiento, costo, soporte y calendario","Genéricos y específicos","Conocidos, predecibles e impredecibles","Del proyecto, técnicos y del negocio"],"a":2,"e":"Conocidos: del análisis; predecibles: de otros proyectos; impredecibles: difíciles de anticipar."},{"q":"¿Qué es una lista de comprobación de elementos de riesgo?","o":["La tabla ordenada de riesgos con su plan","Un recorrido por categorías genéricas de riesgos conocidos y predecibles para ver cuáles aplican","Un registro de problemas ya ocurridos","Una lista de tareas del WBS"],"a":1,"e":"Las categorías de Pressman: tamaño, negocio, cliente, proceso, entorno, tecnología y plantilla."},{"q":"¿Cuál NO es una categoría de la lista de comprobación de Pressman?","o":["Características del cliente","Tamaño del producto","Tamaño y experiencia de la plantilla","Calidad del código fuente"],"a":3,"e":"Las siete son: tamaño, impacto en el negocio, cliente, proceso, entorno de desarrollo, tecnología y plantilla."},{"q":"¿Qué son los conductores de riesgo (Wysocki)?","o":["Los riesgos ya ocurridos","Condiciones o situaciones que pueden afectar desfavorablemente el éxito del proyecto","Las personas responsables de cada riesgo","Los controles para mitigar riesgos"],"a":1,"e":"Ej.: planificación demasiado ambiciosa, subestimación del presupuesto."},{"q":"¿Cuál es un conductor de riesgo de Wysocki?","o":["Equipo con mucha experiencia","Exceso de documentación","Requerimientos definidos pobremente","Clientes muy disponibles"],"a":2,"e":"Otros: expectativas poco realistas, procesos o tecnologías poco familiares."},{"q":"En la escala de impacto del TP1, ¿qué significa el valor 1?","o":["Crítico","Catastrófico","Marginal","Despreciable"],"a":1,"e":"1 catastrófico, 2 crítico, 3 marginal, 4 despreciable: el número bajo es el más grave."},{"q":"¿Cómo se ordena la tabla de riesgos?","o":["Por categoría de Pressman","Primero por probabilidad (descendente) y, a igual probabilidad, por impacto (el más grave primero)","Alfabéticamente","Primero por impacto y luego por probabilidad"],"a":1,"e":"Arriba quedan los que requieren mayor atención."},{"q":"¿Qué es la línea de corte de la tabla de riesgos?","o":["Un umbral justificado: los de arriba reciben plan RSGR, los de abajo se monitorean","El presupuesto máximo para riesgos","La fecha límite del proyecto","El riesgo de mayor impacto"],"a":0,"e":"En la resolución de la cátedra del caso de salud: probabilidad mayor o igual al 50%."},{"q":"¿Qué exige la cátedra sobre los valores de probabilidad e impacto?","o":["Justificarlos con datos del enunciado","Copiarlos de Pressman","Usar siempre 50%","Que los defina el cliente"],"a":0,"e":"La presentación del caso de salud dice \"¡Justificar!\"."},{"q":"¿Qué significa RSGR?","o":["Reducción, Seguro, Garantía y Reparación","Reducción, Supervisión y Gestión del Riesgo","Registro, Seguimiento, Gestión y Revisión","Riesgo, Severidad, Grado y Respuesta"],"a":1,"e":"Acciones para antes, durante y después de que ocurra el riesgo."},{"q":"¿Qué parte del plan RSGR se ejecuta cuando el riesgo ya ocurrió?","o":["Supervisión","Gestión","Identificación","Reducción"],"a":1,"e":"Gestión: manejar la situación y minimizar el impacto."},{"q":"\"Determinar puntos de avance y montos de referencia para control\" es una acción de…","o":["Supervisión","Identificación","Reducción","Gestión"],"a":0,"e":"La supervisión fija puntos de control y compara con lo planificado."},{"q":"\"Énfasis en la documentación para poder reasignar tareas\" frente al riesgo de pérdida de personal es una acción de…","o":["Reducción","Supervisión","Aceptación","Gestión"],"a":0,"e":"Se hace antes de que ocurra, para mitigar sus efectos."},{"q":"En el caso de salud resuelto por la cátedra, ¿cuál fue el riesgo de mayor probabilidad?","o":["Poca experiencia con las tecnologías (20%)","Pérdida de soporte político (10%)","Costo del proyecto demasiado alto en función de los resultados (75%)","Problemas de comunicación con el cliente (10%)"],"a":2,"e":"Le siguieron la pérdida de personal (70%) y las interfaces poco atractivas (60%)."},{"q":"Una matriz de riesgo 4x4 cruza…","o":["Probabilidad de amenaza y magnitud de daño","Riesgos y responsables","Categorías y conductores","Costo y tiempo"],"a":0,"e":"Cada celda es el producto de ambos valores."},{"q":"En la matriz 4x4, un producto de 12 a 16 corresponde a riesgo…","o":["Alto (rojo)","Medio (amarillo)","Bajo (verde)","Despreciable"],"a":0,"e":"1 a 6 bajo, 8 a 9 medio, 12 a 16 alto."},{"q":"¿Cuál es la herramienta típica para construir la tabla de riesgos?","o":["La red PERT","El diagrama de Gantt","El burndown chart","Una planilla de cálculo"],"a":3,"e":"El TP2 lo indica explícitamente."},{"q":"¿Cómo se combinan las listas de Pressman y Wysocki al identificar riesgos?","o":["Se suman las probabilidades de ambas","Las categorías de Pressman son las carpetas; los conductores y los riesgos del enunciado van adentro","Wysocki reemplaza a Pressman","Se usa solo una de las dos"],"a":1,"e":"En la tabla se anota el riesgo concreto, no la categoría."}]},{"id":"u2","nombre":"Concepción y requerimientos","tp":"TP2","qs":[{"q":"Según la unidad de Concepción, ¿cuál es la causa más común de fracaso de un proyecto?","o":["La elección del lenguaje","La falta de presupuesto","Una falla de comunicación: se construye algo distinto de lo que el cliente necesitaba","Un error técnico de programación"],"a":2,"e":"Hay dos supuestos sin verificar: que el LP entendió y que el cliente pidió lo que necesita."},{"q":"¿Qué debería preguntar el LP al cliente para detectar necesidades reales?","o":["Cuánto está dispuesto a pagar","Por qué quiere lo que quiere, no solo qué quiere","Cuándo necesita la primera demo","Qué tecnología prefiere"],"a":1,"e":"Preguntar el por qué permite detectar necesidades reales detrás de pedidos mal formulados."},{"q":"¿Qué es el COS (Condiciones de Satisfacción)?","o":["Un documento de una página con metas y objetivos","Una conversación estructurada entre el requiriente y el LP para llegar a un entendimiento compartido","Una lista de criterios de aceptación de historias","Un contrato firmado por la gerencia"],"a":1,"e":"El COS es un proceso, no un documento; su resultado tangible es el POS."},{"q":"¿Cuáles son las cuatro etapas del COS, en orden?","o":["Planificación, ejecución, control y cierre","Elicitación, especificación, validación y administración","Requerimiento, clarificación, respuesta y acuerdo","Pedido, cotización, aprobación y entrega"],"a":2,"e":"Es un ciclo: si no hay acuerdo, se repite."},{"q":"En la etapa de clarificación del COS…","o":["El proveedor explica con sus palabras lo que entendió, en el lenguaje del requiriente","El proveedor dice qué puede proveer","El cliente firma el POS","El cliente explica lo que entendió que se le ofrece"],"a":0,"e":"Es el LP quien traduce su comprensión al vocabulario del cliente."},{"q":"En la etapa de acuerdo del COS…","o":["Se aprueba el presupuesto","El proveedor parafrasea el pedido","El proveedor estima los costos","El requiriente describe con sus palabras lo que entendió que el proveedor le ofrece"],"a":3,"e":"Es simétrico a la clarificación, pero quien verifica ahora es el cliente."},{"q":"¿Por qué el COS obliga a ambas partes a parafrasear?","o":["Para cumplir con ISO 9001","Para dilatar la negociación","Para generar documentación extensa","Para que los malentendidos se vean cuando corregirlos todavía es barato"],"a":3,"e":"Corregir una conversación es barato; corregir un sistema mal construido es caro."},{"q":"¿Qué extensión debe tener el POS resultante del COS?","o":["Lo que haga falta","Media página sin adjuntos","Una página","Diez páginas"],"a":2,"e":"La brevedad obliga a sintetizar; puede llevar adjuntos."},{"q":"¿Quiénes deben firmar el POS?","o":["Solo el LP","El equipo de desarrollo","Solo el gerente senior","El requiriente y el proveedor"],"a":3,"e":"La firma es evidencia de que ambas partes están de acuerdo."},{"q":"¿Cuándo se considera concluida la etapa de concepción?","o":["Cuando un gerente senior aprueba el POS","Cuando el cliente y el LP se ponen de acuerdo","Cuando se termina el WBS","Cuando empieza la programación"],"a":0,"e":"Hace falta una autorización organizacional, porque implica comprometer recursos."},{"q":"¿Para qué tipo de proyectos se adapta mejor el COS?","o":["Proyectos grandes con requisitos complejos","Solo proyectos ágiles","Pequeños y medianos","Solo proyectos tipo A"],"a":2,"e":"En proyectos grandes conviene aplicar métodos formales de especificación."},{"q":"¿Qué campo del POS conecta el documento con el análisis de riesgos?","o":["Metas","Suposiciones, riesgos y obstáculos","Problema/oportunidad","Preparado por"],"a":1,"e":"Por eso los riesgos forman parte de la unidad de Concepción."},{"q":"Los objetivos de un POS deben formar un conjunto…","o":["Abierto y flexible","Necesario y suficiente","Cualitativo y general","Mínimo y opcional"],"a":1,"e":"Necesarios: todos aportan a la meta; suficientes: entre todos alcanzan para lograrla."},{"q":"¿Cuál NO es una de las cinco características de un buen objetivo?","o":["Específico","Asignable","Limitado en el tiempo","Opcional"],"a":3,"e":"Específicos, medibles, asignables, realistas y limitados en el tiempo."},{"q":"¿Cuáles son los cuatro componentes de un enunciado de objetivo?","o":["Escala, test, peor caso y nivel planificado","Problema, meta, riesgo y costo","Salida, marco de tiempo, medida y acción","Rol, objetivo, beneficio y criterio"],"a":2,"e":"Qué se entrega, cuándo, con qué métrica y cómo se logra."},{"q":"¿Qué responde un Factor Crítico de Éxito (FCE)?","o":["¿Qué riesgos tienen mayor probabilidad?","¿Quién es el responsable de cada tarea?","¿Qué debería sucedernos a nosotros y al cliente para decir que el proyecto fue un éxito?","¿Cuánto cuesta el proyecto?"],"a":2,"e":"Son pocas condiciones decisivas, medibles y en términos de negocio."},{"q":"¿Qué relación hay entre los FCE y los criterios de éxito?","o":["Los FCE se calculan a partir de los criterios","Los criterios de éxito reemplazan a los FCE en proyectos chicos","Los criterios de éxito son la operacionalización medible de los FCE","Son lo mismo con otro nombre"],"a":2,"e":"El FCE dice qué condición define el éxito; el criterio, con qué número se comprueba."},{"q":"Si se dan estimaciones de costo en la meta del POS, ¿qué hay que aclarar?","o":["Que las fijó el cliente","Que son definitivas y contractuales","Que son preliminares y se corregirán con más información","Que incluyen la reserva gerencial"],"a":2,"e":"Así se evita que una cifra tentativa se convierta en un compromiso rígido."},{"q":"¿Qué implica la aprobación del POS por la gerencia?","o":["Aprobar la ejecución completa del proyecto","Asignar recursos para planificar el proyecto en detalle","Contratar al equipo de desarrollo","Firmar el contrato con el cliente"],"a":1,"e":"La aprobación del proyecto en sí viene después, con el plan detallado."},{"q":"¿Cuál NO es un resultado posible de la aprobación del POS?","o":["Postergado","Reformulación","Ejecutado","Derivado a un portafolio"],"a":2,"e":"Los cinco son: aprobado, rechazado, reformulación, postergado y derivado a un portafolio."},{"q":"¿Qué es un requerimiento, en su definición más útil para la gestión?","o":["Lo que el programador cree que el sistema debe hacer","Un enunciado acordado por los stakeholders que debe satisfacerse para resolver el problema del cliente","Una línea del código fuente","Cualquier pedido de un usuario"],"a":1,"e":"Introduce dos ideas: nace de un acuerdo y existe para resolver un problema."},{"q":"¿Cuáles son las cinco actividades del proceso de requerimientos?","o":["Elicitación, especificación, modelamiento y análisis, validación y administración","Concepción, planificación, lanzamiento, control y cierre","Requerimiento, clarificación, respuesta, acuerdo y firma","Análisis, diseño, codificación, prueba y mantenimiento"],"a":0,"e":"Y el proceso no es lineal: las actividades se realimentan."},{"q":"¿Qué busca la validación de requerimientos?","o":["Confirmar con los stakeholders que los requerimientos documentados son los correctos","Calcular el costo de cada requerimiento","Verificar que el código compile","Asignar responsables"],"a":0,"e":"No alcanza con que esté bien escrito: tiene que ser el requerimiento correcto."},{"q":"Un requerimiento funcional se caracteriza porque…","o":["Se mide en una escala y se negocia","Limita las soluciones posibles","Está presente o ausente en un plan o sistema (binario)","Solo lo define el equipo técnico"],"a":2,"e":"Describe la interacción entre el sistema y su entorno."},{"q":"Un requerimiento no funcional se caracteriza porque…","o":["Solo aplica a sistemas embebidos","Tiene una escala de demanda y admite negociación","Describe una función del sistema","Está presente o ausente"],"a":1,"e":"Describe restricciones que limitan la selección de soluciones."},{"q":"\"El registro de un usuario debe completarse en menos de 2 segundos\" es un requerimiento…","o":["Una solución","No funcional","Funcional","De datos"],"a":1,"e":"Expresa una cualidad medible en una escala (tiempo)."},{"q":"¿Cuál NO es una cualidad de una buena especificación de requerimientos?","o":["Verificable","Extensa","Correcta","Trazable"],"a":1,"e":"Correcta, consistente, factible, verificable, completa y trazable."},{"q":"Que cada requerimiento se pueda rastrear hasta su origen y hasta el diseño y las pruebas es…","o":["Factibilidad","Trazabilidad","Completitud","Consistencia"],"a":1,"e":"Permite responder por qué existe una función y qué pasa si se elimina."},{"q":"¿Qué estándar define cómo redactar una SRS?","o":["IEEE 830","CMMI","ISO 9126","ISO 9001"],"a":0,"e":"Es uno de los estándares que listan las diapositivas, junto con IEEE 1233, ISO/IEC 12119 e IEEE 1362 (ConOps)."},{"q":"\"Redactar un manual de usuario legible\" mezcla…","o":["Dos funciones","Dos atributos","Una solución y un riesgo","Una función (redactar el manual) y un atributo (legibilidad)"],"a":3,"e":"Hay que separarlos para poder verificar cada parte."},{"q":"Un usuario pide \"construir estándares\". ¿Qué técnica recomienda la cátedra?","o":["Preguntar ¿por qué? o ¿para qué? para llegar al requerimiento real","Registrarlo tal cual como requerimiento funcional","Estimarlo con Planning Poker","Rechazarlo"],"a":0,"e":"Respuestas posibles: facilitar el mantenimiento, posibilitar la rotación de personal."},{"q":"En \"queremos escribir un manual de desarrollo para mejorar la productividad\", ¿cuál es el requerimiento no funcional?","o":["El manual en sí","Mejorar sustancialmente la productividad del personal","Escribir el manual","La organización XX"],"a":1,"e":"La productividad se mide en una escala y es el objetivo real; el manual es la solución."},{"q":"¿Por qué es peligroso registrar una solución del usuario como requerimiento funcional?","o":["Porque impide buscar soluciones alternativas, quizás mejores","Porque viola ISO 9001","Porque no se puede estimar","Porque aumenta la documentación"],"a":0,"e":"El equipo queda atado a lo que el usuario imaginó."},{"q":"En la ficha de requerimiento funcional, ¿qué campo asegura que sea verificable?","o":["Verificación","Términos","Prioridad","Documentos"],"a":0,"e":"Describe cómo se comprueba que el requerimiento se cumplió."},{"q":"¿Qué es un atributo, según el apunte de requerimientos?","o":["Un concepto de calidad o de recurso que describe un sistema cuantitativamente","Una función del sistema","Un riesgo técnico","Un campo de una tabla"],"a":0,"e":"Los atributos de calidad constituyen los requerimientos no funcionales."},{"q":"¿Qué define la escala de un atributo?","o":["El procedimiento para medir","La unidad de medida: qué se mide","El valor del sistema actual","El peor valor aceptable"],"a":1,"e":"Ej.: voltios (escala) frente a voltímetro (test)."},{"q":"¿Qué define el test de un atributo?","o":["El nivel de la competencia","El nivel comprometido","El procedimiento concreto para medirlo","La unidad de medida"],"a":2,"e":"Conviene usar tests que ya estén en uso."},{"q":"¿Qué es el peor caso de un atributo?","o":["El nivel del sistema actual","El mejor nivel posible","El nivel que se compromete a alcanzar","El peor nivel aceptable; por debajo, el proyecto fracasa en ese atributo"],"a":3,"e":"Puede ser la base de un contrato legal."},{"q":"¿Qué es el nivel planificado de un atributo?","o":["El valor del sistema anterior","El peor nivel aceptable","El límite de la ingeniería","El nivel que el proyecto se compromete a alcanzar (éxito formal)"],"a":3,"e":"Realista pero ambicioso; nunca la perfección."},{"q":"El mejor caso de un atributo es…","o":["El nivel mínimo aceptable","Solo informativo: el límite de la ingeniería","El compromiso contractual","El nivel del sistema actual"],"a":1,"e":"Muestra hasta dónde podría llegarse, pero no es exigible."},{"q":"¿Para qué sirve el nivel actual de un atributo?","o":["Para definir la escala","Para calcular el costo","Para comparar: la diferencia con el planificado mide la mejora prometida","Para fijar el contrato"],"a":2,"e":"Es el valor en un sistema existente; hay que citar la fuente."},{"q":"Si cuesta definir una medida para un atributo como \"amigable\", significa que…","o":["Es un atributo de alto nivel y hay que descomponerlo en subatributos medibles","Hay que eliminarlo","Es un requerimiento funcional","No es un requerimiento"],"a":0,"e":"Ej.: horas de aprendizaje, tareas por hora."},{"q":"¿Cuándo debe hacerse la especificación inicial de atributos?","o":["Al principio del proyecto, antes de especificar soluciones, y sin congelarla","Solo si el cliente lo pide","Al final, durante las pruebas","Después de elegir la arquitectura"],"a":0,"e":"Si primero se elige la solución, se pierde la posibilidad de evaluar alternativas."},{"q":"¿Qué es una solución, según la cátedra?","o":["Cualquier idea del equipo técnico","Un requerimiento funcional aprobado","Un conjunto de ideas cuya implementación impacta positivamente en al menos una parte del problema","El código fuente del sistema"],"a":2,"e":"Una idea sin efectos positivos en los requerimientos no es una solución."},{"q":"¿Cuál es la cadena causal entre funciones, atributos y soluciones?","o":["Las soluciones determinan las funciones","Los atributos determinan las funciones","Las funciones determinan los atributos y los atributos determinan las soluciones","No hay relación entre ellas"],"a":2,"e":"Primero qué función cubrir, luego con qué calidad, y eso decide qué soluciones sirven."},{"q":"Una solución non-sancta es…","o":["Una solución prohibida","Una solución fijada como requerimiento funcional","Una solución impuesta por el cliente","Una solución sujeta a cambios o eliminación si aparecen requerimientos más prioritarios"],"a":3,"e":"Es el caso por defecto y el más flexible."},{"q":"¿Quiénes son responsables de enunciar los problemas en términos de objetivos?","o":["Los usuarios finales","Los testers","Los problem solvers","Los gerentes"],"a":3,"e":"Los problem solvers son los responsables de encontrar las soluciones."},{"q":"¿Cómo se calcula la razón de impactos?","o":["Suma de impactos de calidad dividida por suma de impactos de recursos","Probabilidad por costo","Calidad menos recursos","Impacto de recursos dividido por impacto de calidad"],"a":0,"e":"Cuanto mayor, más calidad por unidad de recurso."},{"q":"En la comparación de soluciones, para los atributos de recursos…","o":["Se multiplican por la calidad","Más es mejor","Menos es mejor","No se consideran"],"a":2,"e":"En calidad, más es mejor; en recursos, menos."},{"q":"¿Qué indica el paso 3 del proceso de búsqueda de soluciones?","o":["Congelar los requerimientos","Elegir la solución más barata","Eliminar las soluciones que producen el peor caso en algún atributo","Contratar un experto"],"a":2,"e":"Aunque resuelvan bien el atributo objetivo, si perjudican gravemente otro, se descartan."},{"q":"En la comparación de soluciones, un atributo es determinante si…","o":["Tiene escala en milisegundos","Tiene el impacto más alto de la tabla","Lo define el cliente","Al excluirlo cambia la solución preferida"],"a":3,"e":"Se recalcula excluyendo un atributo por vez."},{"q":"¿Cómo conviene expresar la estimación del impacto de una solución?","o":["Con una palabra (alto, bajo)","Como estimación o rango de valores, mostrando la incertidumbre","Con un número exacto","No se estima"],"a":1,"e":"Ej.: entre 20% y 35% de mejora."},{"q":"¿Quiénes NO participan de una inspección de Fagan?","o":["Colegas de distintos niveles","El gerente","Un moderador entrenado","Inspectores con roles asignados"],"a":1,"e":"Se excluye al gerente para que la crítica técnica sea honesta."},{"q":"¿Cuánto duran como máximo las reuniones de inspección de Fagan?","o":["No tienen límite","2 horas","Un día completo","15 minutos"],"a":1,"e":"Pasado ese tiempo la atención decae."},{"q":"¿Qué ventaja tienen las etiquetas mnemotécnicas de soluciones frente a las numéricas?","o":["Son más cortas","No sufren obsolescencia: siguen siendo comprensibles con el tiempo","Se ordenan solas","Las genera la herramienta"],"a":1,"e":"Ej.: SOL-CACHE-CONSULTAS frente a S-014."},{"q":"¿Qué subtipo de riesgo de negocio es \"el producto es excelente pero nadie lo quiere\"?","o":["Riesgo estratégico","Riesgo de ventas","Riesgo de presupuesto","Riesgo de mercado"],"a":3,"e":"Estratégico: no encaja en la estrategia; ventas: no se sabe venderlo."},{"q":"¿Qué es la Exposición al Riesgo (ER)?","o":["Impacto dividido probabilidad","El costo del plan RSGR","La suma de todos los riesgos","Probabilidad por costo"],"a":3,"e":"Sirve para ajustar la estimación de costos o asegurar riesgos."},{"q":"¿Por qué se aplica la regla de Pareto en la gestión de riesgos?","o":["Porque reduce la probabilidad a cero","Porque lo exige el cliente","Porque los riesgos se reparten en partes iguales","Porque gestionar todos los riesgos se vuelve otro proyecto; pocos concentran la mayor parte del impacto"],"a":3,"e":"30 a 40 riesgos con 3 a 7 pasos cada uno son demasiadas tareas."},{"q":"Los componentes del riesgo según qué amenazan son…","o":["Rendimiento, costo, soporte y planificación temporal","Reducción, supervisión y gestión","Proyecto, técnico y negocio","Conocidos, predecibles e impredecibles"],"a":0,"e":"Clasificación por la dimensión del proyecto afectada."},{"q":"Un riesgo de gran impacto pero muy poca probabilidad…","o":["No demanda demasiada gestión","Se convierte en restricción","Debe eliminarse de la tabla","Requiere siempre un plan RSGR completo"],"a":0,"e":"Sí requieren gestión activa: gran impacto con probabilidad moderada o impacto medio con probabilidad alta."},{"q":"¿Cuál es la estrategia de riesgos de la \"escuela Indiana Jones\"?","o":["Reactiva: \"no te preocupes, pensaré en algo\"","De transferencia","Proactiva","Preventiva"],"a":0,"e":"Es la menos deseable; la recomendada es la proactiva."},{"q":"¿Quiénes pueden identificar los riesgos específicos de un proyecto?","o":["Personas con amplia experiencia en la tecnología, el personal y el entorno del proyecto","Cualquiera con la lista de Pressman","Solo el cliente","Solo el auditor"],"a":0,"e":"Por eso no se anticipan con una lista genérica."}]},{"id":"u3","nombre":"Planificación","tp":"TP3","qs":[{"q":"¿Qué es la JPPS?","o":["Una sesión grupal en la que se genera el plan detallado del proyecto","Un software de planificación","La reunión de cierre","Un documento de una página con metas y objetivos"],"a":0,"e":"Joint Project Planning Session: su objetivo es un plan que satisfaga el COS y describa el POS."},{"q":"¿Por qué el facilitador de la JPPS no debería ser el LP?","o":["Porque el LP no conoce el proyecto","Porque el LP no puede asistir","Porque lo prohíbe ISO 9001","Porque el LP tiene intereses en el resultado y tendería a imponer su visión"],"a":3,"e":"El LP se concentra en el contenido del plan."},{"q":"En la JPPS, ¿qué hace el tecnógrafo?","o":["Representa al cliente","Vende el proyecto a la gerencia","Ayuda con las herramientas de software y documenta el proyecto mientras se construye","Estima los costos"],"a":2,"e":"Es uno de los roles de la sesión."},{"q":"¿Por qué el representante del cliente en la JPPS puede ser problemático?","o":["Puede presionar por plazos irreales o reabrir discusiones de alcance cerradas","Porque no entiende de tecnología","Porque no puede firmar","Porque no puede opinar"],"a":0,"e":"Igual es necesario, porque valida que el plan satisfaga el COS."},{"q":"¿Cuál es el entregable final de la JPPS?","o":["El primer incremento","El acta de cierre","La Propuesta de Proyecto","El POS"],"a":2,"e":"Se envía a los gerentes senior para su aprobación."},{"q":"¿Qué es el WBS (EDT)?","o":["Una lista de riesgos","Un diagrama de barras del cronograma","Una descripción jerárquica del trabajo a realizar para completar el proyecto","El presupuesto del proyecto"],"a":2,"e":"La meta se divide en actividades y estas en tareas."},{"q":"Según la convención de la cátedra, ¿qué es una tarea?","o":["Sinónimo de proyecto","Una unidad de nivel intermedio que se sigue descomponiendo","Un hito del cronograma","Una unidad del último nivel del WBS: se estima, asigna y controla"],"a":3,"e":"Otros autores intercambian actividad y tarea."},{"q":"Según la convención de la cátedra, ¿qué es una actividad?","o":["Un entregable al cliente","Una reunión de equipo","Una unidad de nivel intermedio del WBS que se sigue descomponiendo","La unidad mínima que se estima"],"a":2,"e":"Ej.: \"Diseñar la aplicación\"; la tarea sería \"Diseñar la base de datos\"."},{"q":"¿Cuál NO es un uso del WBS?","o":["Calcular el camino crítico","Planificar el trabajo","Informar el estado del proyecto","Estimar en el último nivel y agregar hacia arriba"],"a":0,"e":"El camino crítico sale del diagrama de red, no del WBS."},{"q":"¿Quién es responsable de confeccionar el WBS?","o":["El cliente","El Scrum Master","El gerente de línea","El LP"],"a":3,"e":"Tiene que quedar definido de modo que el LP pueda administrar el proyecto con él."},{"q":"¿Qué desventaja tiene construir el WBS bottom-up?","o":["No permite estimar","Es el más lento","Solo lo puede hacer el LP","Suele producir tareas con granularidad despareja"],"a":3,"e":"Se mitiga con metodologías que proveen listados de tareas típicas."},{"q":"¿Qué ventaja tiene el WBS top-down con subequipos frente al equipo completo?","o":["No requiere acordar el primer nivel","Todos ven todo el WBS","Demanda menos tiempo","Da estimaciones más exactas"],"a":2,"e":"Cada subequipo descompone la actividad en que tiene más experiencia."},{"q":"¿Cuál es la duración aceptable de una tarea según los criterios de completitud?","o":["En lo posible no más de 10 días","No más de 1 día","No más de 3 meses","No hay límite"],"a":0,"e":"Una tarea larga se puede atrasar mucho antes de que alguien lo note."},{"q":"\"Hay 4 componentes codificados y aprobados de 10\" ilustra el criterio de…","o":["Duración aceptable","Tarea acotada","Independencia","Estado medible"],"a":3,"e":"\"Está al 40%\" no es verificable; \"4 de 10 aprobados\" sí."},{"q":"Una tarea que a mitad de camino debe esperar un insumo externo viola el criterio de…","o":["Entregable","Estado medible","Independencia","Tiempo y costo estimables"],"a":2,"e":"Una vez iniciada debería continuar sin interrupciones; conviene partirla."},{"q":"¿Qué relación hay entre duración, esfuerzo y dedicación?","o":["No están relacionados","Duración = esfuerzo / porcentaje de dedicación","Esfuerzo = duración / dedicación","Duración = esfuerzo × dedicación"],"a":1,"e":"Las herramientas cargan dos variables y calculan la tercera."},{"q":"Una tarea de 40 horas-persona la hace una persona al 50% (jornada de 8 h). ¿Cuánto dura?","o":["2,5 días","10 días","20 días","5 días"],"a":1,"e":"40 / (8 × 0,5) = 10."},{"q":"¿De qué depende el costo de una tarea y de qué su fecha de fin?","o":["Ambos de la duración","Ambos del esfuerzo","El costo, del esfuerzo; la fecha, de la duración","El costo, de la duración; la fecha, del esfuerzo"],"a":2,"e":"Dos personas pueden hacer en 5 días lo que una en 10: misma cantidad de esfuerzo."},{"q":"¿Qué es el crash point de una actividad?","o":["Su duración mínima: a partir de ahí agregar recursos no la acorta","El costo máximo permitido","El momento en que la tarea fracasa","La fecha de inicio más tardía"],"a":0,"e":"Pasado ese punto los recursos extra solo suman costo y coordinación."},{"q":"En la técnica Delphi, ¿quiénes justifican su estimación?","o":["Los que quedaron en los cuartiles exteriores","El LP","Los que estimaron igual que el promedio","Todos los estimadores"],"a":0,"e":"En los extremos suele estar la información que los demás no tienen."},{"q":"En Delphi, ¿cuál es la estimación final del grupo?","o":["El promedio de la tercera pasada","La mediana de la primera pasada","El valor más alto de la primera pasada","El valor que elige el LP"],"a":0,"e":"Se hacen tres pasadas con justificación de los extremos."},{"q":"¿Cuál es la fórmula de la estimación de 3 puntos?","o":["(O + M + P) / 3","(O + 4M + P) / 6","(O + 2M + P) / 4","(4O + M + P) / 6"],"a":1,"e":"El más probable pesa cuatro veces más que los extremos."},{"q":"Con O = 2, M = 5 y P = 14, ¿cuál es la estimación de 3 puntos?","o":["5","7,5","7","6"],"a":3,"e":"(2 + 20 + 14) / 6 = 36 / 6 = 6."},{"q":"¿Por qué la estimación de 3 puntos suele quedar por encima del valor más probable?","o":["Porque se suma la reserva gerencial","Porque el optimista pesa más","Porque la distribución es asimétrica: las cosas pueden salir mucho peor, rara vez mucho mejor","Por un error de la fórmula"],"a":2,"e":"El pesimista suele estar mucho más lejos de M que el optimista, y la fórmula lo refleja."},{"q":"La técnica Delphi de banda ancha combina…","o":["Delphi con la estimación de 3 puntos","Planning Poker con PERT","Juicio experto con datos históricos","Delphi con COCOMO"],"a":0,"e":"Cada uno da O, M y P; se eliminan extremos, se promedia y se aplica la fórmula."},{"q":"¿Cuál es el riesgo del juicio experto cuando el experto es un vendedor?","o":["Que sea muy cara","Que sea demasiado pesimista","Que tarde mucho","Que la estimación no sea objetiva"],"a":3,"e":"Al vendedor le conviene que su producto parezca fácil de implementar."},{"q":"¿En qué se diferencian similitud y datos históricos como técnicas de estimación?","o":["Son técnicas idénticas","En la similitud los datos están en la memoria de las personas; en los históricos, registrados en una base","Los datos históricos solo sirven en ágil","La similitud usa fórmulas"],"a":1,"e":"Los datos históricos requieren disciplina para registrar lo real."},{"q":"¿Qué recursos son los más difíciles de estimar en un proyecto de software?","o":["Los materiales","El equipamiento","Los humanos","Las facilidades"],"a":2,"e":"Las personas se planifican por perfil y después se personalizan."},{"q":"¿Cómo se estiman los costos laborales?","o":["Con la fórmula de 3 puntos","Con un porcentaje fijo del presupuesto","Por precio de compra","Por perfil, multiplicando horas por el valor horario de cada perfil"],"a":3,"e":"Los costos de materiales se estiman por precio o por uso."},{"q":"¿Cuál es un problema político de la estimación de costos en software?","o":["Que no haya datos históricos","Que las estimaciones se conviertan en objetivos o se ajusten para ganar una licitación","Que no existan herramientas","Que el software sea intangible"],"a":1,"e":"La falta de datos históricos es un problema técnico."},{"q":"¿Qué es un diagrama de red del proyecto?","o":["Una representación gráfica de la secuencia en que se van a realizar las tareas","Un mapa de la red informática","La lista de stakeholders","El organigrama del equipo"],"a":0,"e":"Muestra qué tarea depende de cuál y cuáles van en paralelo."},{"q":"En un diagrama AON (PDM), ¿qué representa el nodo?","o":["Una dependencia","La tarea","Un evento o hito","Un recurso"],"a":1,"e":"Las flechas representan las relaciones de precedencia."},{"q":"En un diagrama AOA (PERT), ¿qué representa la flecha?","o":["Un hito de pago","Una persona","La tarea","Un evento"],"a":2,"e":"Los nodos son los eventos de inicio y fin."},{"q":"¿Qué ventaja tiene AON sobre AOA?","o":["Representa los cuatro tipos de dependencias sin tareas ficticias","No necesita dependencias","Destaca mejor los hitos","Tiene escala de tiempo"],"a":0,"e":"Es el estándar de las herramientas actuales."},{"q":"¿Por qué AOA necesita tareas ficticias?","o":["Porque entre dos vértices no puede haber más de un vector","Porque no admite tareas en paralelo","Para representar los recursos","Para marcar el camino crítico"],"a":0,"e":"Las ficticias tienen duración 0."},{"q":"¿Cuál es la principal ventaja del diagrama de Gantt?","o":["Muestra claramente las dependencias","Es muy sencillo de construir y de entender: ideal para comunicar","Indica cómo acortar el proyecto","Calcula el camino crítico"],"a":1,"e":"No muestra bien dependencias ni si la asignación de recursos es efectiva."},{"q":"En PERT, ¿cómo se valora un vértice al que llegan varias flechas?","o":["Con el promedio","Con el menor de esos valores","Con la suma de todos","Con el mayor de (valor del vértice previo + duración de la tarea)"],"a":3,"e":"El evento ocurre cuando terminaron todas las tareas que llegan a él."},{"q":"Codificar el módulo A y luego testearlo es una dependencia…","o":["Comienzo a comienzo (CC)","Fin a comienzo (FC)","Comienzo a fin (CF)","Fin a fin (FF)"],"a":1,"e":"La predecesora debe terminar antes de que empiece la sucesora."},{"q":"Codificar un módulo y generar sus datos de prueba en cuanto empieza la codificación es una dependencia…","o":["Fin a comienzo (FC)","Fin a fin (FF)","Comienzo a fin (CF)","Comienzo a comienzo (CC)"],"a":3,"e":"La sucesora puede empezar una vez que la predecesora empezó."},{"q":"\"No se puede discontinuar el sistema viejo hasta que el nuevo comenzó a funcionar\" es una dependencia…","o":["Comienzo a comienzo (CC)","Fin a fin (FF)","Comienzo a fin (CF)","Fin a comienzo (FC)"],"a":2,"e":"La sucesora (apagar el viejo) no puede terminar antes de que empiece la predecesora (el nuevo)."},{"q":"\"El diseño de los módulos no termina hasta que termina el diseño de las interfaces\" es una dependencia…","o":["Fin a comienzo (FC)","Fin a fin (FF)","Comienzo a comienzo (CC)","Comienzo a fin (CF)"],"a":1,"e":"La sucesora no puede terminar antes de que termine la predecesora."},{"q":"¿Qué diferencia a una restricción gerencial de una técnica?","o":["La gerencial siempre genera dependencias FC","La técnica la decide la gerencia","La gerencial surge de decisiones políticas y puede revertirse","No hay diferencia"],"a":2,"e":"Una restricción técnica no se puede revertir: no se puede probar código inexistente."},{"q":"Un único experto que necesitan varias tareas obliga a secuenciarlas con FC. Es una restricción técnica por…","o":["Mejores prácticas","Requerimiento único","Discrecional","Fecha impuesta"],"a":1,"e":"Existe un recurso crítico compartido."},{"q":"¿Cuál es la restricción de fecha más grave?","o":["No después de","Todas son igual de graves","No antes que","En esta fecha"],"a":3,"e":"No deja ningún margen."},{"q":"Un lag negativo entre dos tareas se llama…","o":["Adelanto (lead)","Reserva","Margen libre","Holgura"],"a":0,"e":"La sucesora empieza antes de lo que permitiría la dependencia sin desfase."},{"q":"Con la convención de la cátedra, ¿cómo se calcula el CTe de una tarea con predecesoras FC?","o":["El mínimo de los FTe de las predecesoras más 1","Siempre es 1","El máximo de los CTe de las predecesoras","El máximo de los FTe de las predecesoras más 1"],"a":3,"e":"Manda la predecesora que termina más tarde."},{"q":"Una tarea de 20 días empieza como muy temprano el día 45. ¿Cuál es su FTe?","o":["45","65","64","66"],"a":2,"e":"FTe = CTe + d - 1 = 45 + 20 - 1."},{"q":"¿Cómo se calcula el FTa de una tarea que tiene sucesoras FC?","o":["El fin del proyecto","El mínimo de los CTa de las sucesoras menos 1","El máximo de los CTa de las sucesoras menos 1","El FTe más el margen libre"],"a":1,"e":"Manda la sucesora más urgente."},{"q":"¿Cuál es el FTa de una tarea sin sucesoras?","o":["Su propio FTe","El CTa de la última tarea","La fecha de fin del proyecto","El día 1"],"a":2,"e":"Así lo resuelve la cátedra en el ejercicio 3 del TP3."},{"q":"Una tarea tiene CTe = 5, FTa = 14 y dura 6 días. ¿Cuál es su ventana?","o":["9 días","4 días","6 días","10 días"],"a":3,"e":"V = FTa - CTe + 1 = 14 - 5 + 1."},{"q":"Una tarea tiene ventana 10 y duración 6. ¿Cuál es su margen total?","o":["6","16","10","4"],"a":3,"e":"MT = V - d."},{"q":"¿Qué es el margen libre?","o":["Lo que puede demorarse una tarea sin atrasar el comienzo temprano de ninguna sucesora","Lo que puede demorarse sin atrasar el proyecto","El tiempo libre del equipo","La reserva gerencial"],"a":0,"e":"El margen total es el que no atrasa el fin del proyecto."},{"q":"¿Qué relación hay siempre entre el margen libre y el total?","o":["El margen libre es menor o igual que el total","Son siempre iguales","No hay relación","El libre es mayor que el total"],"a":0,"e":"El total incluye el margen que la tarea comparte con sus sucesoras."},{"q":"¿Cuál NO es una definición del camino crítico?","o":["Las tareas con margen cero","Las tareas cuya planificación temprana y tardía coinciden","El camino de duración más larga","El camino con más tareas"],"a":3,"e":"Lo que importa es la duración, no la cantidad de tareas."},{"q":"Se acorta en 3 días una tarea con margen total 5. ¿Se acorta el proyecto?","o":["Sí, 3 días","No, porque la tarea no es crítica","Sí, 2 días","Sí, 5 días"],"a":1,"e":"Solo acortar tareas críticas acorta el proyecto."},{"q":"Con una dependencia CC, ¿cómo se restringe el comienzo de la sucesora?","o":["FTe(sucesora) ≥ FTe(predecesora)","No se restringe","CTe(sucesora) ≥ CTe(predecesora), sin sumar 1","CTe(sucesora) ≥ FTe(predecesora) + 1"],"a":2,"e":"Pueden empezar el mismo día."},{"q":"Según la convención de la cátedra, una tarea cuya única predecesora es FF tiene CTe…","o":["Igual al CTe de la predecesora","Igual a 1, y su FTe queda empujado por la FF","Igual al FTe de la predecesora más 1","Igual al fin del proyecto"],"a":1,"e":"La FF restringe el fin, no el comienzo."},{"q":"En una tarea con predecesora FF o CF, ¿por qué la cátedra usa MT = V - d y no FTa - FTe?","o":["Porque su ventana temprana es más larga que su duración y FTa - FTe ya no mide el margen total","Porque así lo pide el cliente","Porque esas tareas no tienen ventana","Porque FTa - FTe da negativo"],"a":0,"e":"En el ejercicio 3 del TP3, la tarea I da MT = 43, no 11."},{"q":"¿Qué consecuencia puede tener comprimir el cronograma?","o":["Elimina la necesidad de coordinación","Puede cambiar el camino crítico y aumentar el riesgo","Reduce el costo","Reduce siempre la cantidad de trabajo"],"a":1,"e":"El trabajo total no baja; incluso puede subir."},{"q":"¿Cuánto dura típicamente la reserva gerencial?","o":["El 1%","El 50% de la duración","Entre el 5% y el 10% de la duración total","Un día"],"a":2,"e":"Es una tarea ficticia al final; se administra para no usarla."},{"q":"¿Cuánto tiempo de planificación corresponde a un proyecto tipo A?","o":["Hasta dos días","Cinco días o más","Menos de un día","Tres o cuatro días"],"a":1,"e":"D: menos de un día; C: hasta dos; B: tres o cuatro."},{"q":"Una Propuesta de Proyecto vuelve para revisión porque su costo excede el financiamiento. ¿Qué se puede hacer?","o":["Eliminar la reserva gerencial sin avisar","Ocultar costos en los apéndices","Empezar igual sin aprobación","Revisar el triángulo de alcance o descomponer el proyecto en fases"],"a":3,"e":"Una propuesta rechazada por costo suele volver con menos funcionalidad o en fases."},{"q":"En la matriz por perfil, ¿qué se obtiene al combinar Actividad × Perfil con Persona × Perfil?","o":["La matriz Persona × Actividad","El WBS","El camino crítico","El presupuesto"],"a":0,"e":"Indica quién trabaja en qué."}]},{"id":"u4","nombre":"Puntos de Función y COCOMO","tp":"TP4","qs":[{"q":"¿Qué describe la especificación de un sistema?","o":["El presupuesto aprobado","Cómo está programado internamente","El cronograma del proyecto","Qué debe hacer: sus funciones, datos, interfaces y restricciones"],"a":3,"e":"Describe el qué, no el cómo."},{"q":"¿Qué se busca medir al medir los modelos de especificación?","o":["El tamaño funcional, la complejidad y la calidad de la especificación","La cantidad de reuniones","La productividad de cada programador","El costo de las licencias"],"a":0,"e":"El objetivo es estimar temprano esfuerzo, costo y plazo."},{"q":"¿Por qué las líneas de código son una mala medida para estimar al principio?","o":["No se pueden contar","Son demasiado precisas","Las prohíbe COCOMO","Se conocen recién al final y dependen del lenguaje"],"a":3,"e":"Además penalizan a los lenguajes y programadores concisos."},{"q":"¿Quién propuso los Puntos de Función?","o":["Barry Boehm, en TRW","Tom Gilb","Watts Humphrey, en el SEI","Allan Albrecht"],"a":3,"e":"Por eso se los llama Puntos de Función de Albrecht."},{"q":"¿Qué miden los Puntos de Función?","o":["El tamaño funcional desde el punto de vista del usuario, independientemente del lenguaje","Las líneas de código","La complejidad ciclomática","El tiempo de respuesta"],"a":0,"e":"Se pueden contar a partir de la especificación."},{"q":"¿Cuáles son los cinco tipos de componentes de los Puntos de Función?","o":["Entradas, salidas y consultas externas, archivos internos y archivos externos","Requisitos, diseños, códigos, pruebas y manuales","Pantallas, reportes, componentes 3GL, tablas y servicios","Clases, métodos, atributos, paquetes y módulos"],"a":0,"e":"Tres transaccionales y dos de datos."},{"q":"Un proceso que ingresa datos y mantiene un archivo interno (por ejemplo, alta de alumno) es…","o":["Una salida externa (SE)","Un archivo externo (AE)","Una entrada externa (EE)","Una consulta externa (CE)"],"a":2,"e":"Cada alta, baja o modificación cuenta como una EE."},{"q":"¿Qué distingue una salida externa de una consulta externa?","o":["La salida es en pantalla y la consulta impresa","No hay diferencia","La consulta modifica archivos","La salida contiene información derivada (cálculos, totales); la consulta muestra los datos tal cual"],"a":3,"e":"\"Ver el promedio del alumno\" es salida; \"ver la ficha\" es consulta."},{"q":"\"Listado de alumnos con su promedio\" es…","o":["Una consulta externa","Una entrada externa","Un archivo interno","Una salida externa"],"a":3,"e":"Tiene datos derivados: el promedio calculado."},{"q":"\"Buscar un alumno por DNI y ver sus datos\" es…","o":["Una consulta externa","Una salida externa","Un archivo externo","Una entrada externa"],"a":0,"e":"Entrada más salida sin modificar archivos ni calcular nada."},{"q":"¿Qué diferencia un archivo interno de uno externo?","o":["Si tiene clave primaria","Su tamaño en bytes","Dónde está físicamente la tabla","Quién lo mantiene: el interno lo mantiene el sistema; el externo, otro sistema"],"a":3,"e":"Si nuestro sistema solo lo lee, es externo."},{"q":"¿Qué componente tiene los pesos más altos en Puntos de Función?","o":["Las consultas externas","Los archivos internos (7, 10, 15)","Las entradas externas","Las salidas externas"],"a":1,"e":"Cada grupo de datos mantenido implica altas, bajas, modificaciones e integridad."},{"q":"¿Cuál es el peso de una salida externa de complejidad media?","o":["4","7","10","5"],"a":3,"e":"SE: 4, 5, 7 (baja, media, alta)."},{"q":"¿Cuál es el peso de un archivo externo de complejidad alta?","o":["10","15","6","7"],"a":0,"e":"AE: 5, 7, 10."},{"q":"En el ejercicio, \"simple\" y \"promedio\" corresponden a la complejidad…","o":["Baja y media","Media y alta","Baja y alta","Alta y media"],"a":0,"e":"Simple = baja, promedio = media, complejo = alta."},{"q":"Un sistema tiene 2 archivos internos de complejidad alta y 3 entradas simples. ¿Cuántos PFNA suman?","o":["36","45","29","39"],"a":3,"e":"2 × 15 + 3 × 3 = 30 + 9."},{"q":"El sistema S1 de la cátedra (4 EE, 7 SE, 4 CE, 3 AI y 2 AE, todos medios) tiene PFNA…","o":["83","113,22","111","105"],"a":2,"e":"16 + 35 + 16 + 30 + 14 = 111."},{"q":"¿Cuántos factores de complejidad técnica se evalúan en los Puntos de Función?","o":["14","10","5","15"],"a":0,"e":"Cada uno de 0 (irrelevante) a 5 (esencial)."},{"q":"¿Cuál es la fórmula del Factor de Complejidad Técnica?","o":["FCT = TI / 70","FCT = 0,65 × 0,01 × TI","FCT = 1 + 0,01 × TI","FCT = 0,65 + 0,01 × TI"],"a":3,"e":"Una diapositiva tiene la errata del producto; es una suma."},{"q":"¿Entre qué valores puede variar el FCT?","o":["0,65 y 1,35","1 y 70","0,5 y 1,5","0 y 1"],"a":0,"e":"TI va de 0 a 70: el ajuste es de ±35%."},{"q":"¿Con qué total de influencias el FCT vale exactamente 1?","o":["35","70","0","42"],"a":0,"e":"35 equivale a un promedio de 2,5 por factor."},{"q":"Si todos los factores valen 3, ¿cuánto vale el FCT?","o":["1,07","0,95","1,35","1,00"],"a":0,"e":"TI = 42, FCT = 0,65 + 0,42."},{"q":"S1 tiene PFNA = 111 y TI = 37. ¿Cuántos PFA tiene?","o":["148","111","107,10","113,22"],"a":3,"e":"FCT = 1,02; 111 × 1,02 = 113,22."},{"q":"Al desplegar \"F6–F8\" en la tabla de factores, ¿cuántos factores son?","o":["Uno","Cuatro","Tres","Dos"],"a":2,"e":"F6, F7 y F8; hay que verificar que el total sea 14."},{"q":"¿Cuál es una crítica a los Puntos de Función?","o":["Dependen del lenguaje de programación","El conteo es subjetivo y fueron pensados para sistemas de información","No sirven para estimar","Solo se conocen al final"],"a":1,"e":"Capturan mal los sistemas de tiempo real o con algoritmos complejos."},{"q":"¿Quién desarrolló COCOMO?","o":["Fred Brooks","Lawrence Putnam","Barry Boehm","Allan Albrecht"],"a":2,"e":"Lo desarrolló en la década del 70; COCOMO II se publicó en 2000."},{"q":"¿Cuál es la forma de la ecuación de esfuerzo de COCOMO?","o":["E = S / productividad","E = (O + 4M + P) / 6","E = a + b × S","E = a × S^b × F"],"a":3,"e":"Y la duración D = c × E^d."},{"q":"¿En qué unidad expresa COCOMO el esfuerzo?","o":["Puntos de función","Días calendario","Personas-mes","Horas"],"a":2,"e":"La duración se expresa en meses."},{"q":"¿Qué significa KDSI?","o":["Kilobytes de software","Miles de días de soporte","Miles de datos del sistema","Miles de instrucciones fuente entregadas"],"a":3,"e":"No cuentan comentarios ni código que el cliente no recibe."},{"q":"¿Qué valor toma F en COCOMO básico?","o":["1","El producto de 15 conductores","0","El FCT de los Puntos de Función"],"a":0,"e":"En el intermedio es el producto de los multiplicadores de los conductores de costo."},{"q":"¿Qué indica que el exponente b sea mayor que 1?","o":["Economía de escala","Que el proyecto es orgánico","Deseconomía de escala: el esfuerzo crece más que proporcionalmente con el tamaño","Que la duración crece más que el esfuerzo"],"a":2,"e":"Más tamaño implica más comunicación e integración."},{"q":"¿Cuándo se usa COCOMO intermedio?","o":["Al terminar el diseño de los módulos","Solo en proyectos ágiles","Cuando no se sabe casi nada del proyecto","Luego de la especificación de requerimientos, cuando se sabe algo del lenguaje, herramientas y equipo"],"a":3,"e":"El básico es para cuando se sabe muy poco; el avanzado, con el diseño terminado."},{"q":"¿Qué agrega COCOMO avanzado (detallado) respecto del intermedio?","o":["Aplica el modelo por componente y con multiplicadores por fase","Usa solo el tamaño","Elimina los conductores de costo","Usa puntos objeto"],"a":0,"e":"Se usa cuando se identificaron los módulos del sistema."},{"q":"¿Cuántos conductores de costo usa COCOMO intermedio?","o":["5","14","15","17"],"a":2,"e":"Agrupados en atributos de producto, hardware, personal y proyecto."},{"q":"¿Qué modo de COCOMO corresponde a un sistema de facturación con un equipo chico y requisitos flexibles?","o":["Semi-embebido","Orgánico","Detallado","Embebido"],"a":1,"e":"Procesamiento de datos, entorno familiar, requisitos negociables."},{"q":"¿Qué modo corresponde al software de control de un marcapasos?","o":["Embebido","Semi-embebido","Básico","Orgánico"],"a":0,"e":"Tiempo real, integrado con hardware y con restricciones rígidas."},{"q":"Un sistema de reservas en línea con experiencia mixta y algunos requisitos rígidos es…","o":["Embebido","Orgánico","Avanzado","Semi-embebido"],"a":3,"e":"Es el modo intermedio."},{"q":"¿Cuáles son los coeficientes a y b de COCOMO básico en modo orgánico?","o":["a = 3,0 y b = 1,12","a = 2,5 y b = 0,38","a = 3,6 y b = 1,20","a = 2,4 y b = 1,05"],"a":3,"e":"Semi-embebido 3,0 y 1,12; embebido 3,6 y 1,20."},{"q":"De orgánico a embebido, ¿qué pasa con a y b?","o":["Disminuyen","Crecen: a igual tamaño el esfuerzo es mayor y la deseconomía más fuerte","Se mantienen iguales","a crece y b disminuye"],"a":1,"e":"Por eso el embebido es el más caro."},{"q":"¿Qué indica que el exponente d (duración) sea menor que 1?","o":["Economía de escala en el esfuerzo","Que la duración crece mucho más lento que el esfuerzo","Que el proyecto termina antes","Que hay menos personas"],"a":1,"e":"Se trabaja con más gente en paralelo."} nos para resolver problemas pequeños."},{"q":"¿Cómo se estima el tamaño del equipo a partir de COCOMO?","o":["Con los Puntos de Función ajustados","No se puede estimar","Dividiendo el esfuerzo por la duración","Multiplicando el esfuerzo por la duración"],"a":2,"e":"COCOMO da una idea del esfuerzo y de ahí la cantidad de recursos."},{"q":"¿Qué propone la construcción gradual del equipo?","o":["Incorporar a todos desde el primer día","Empezar con un grupo chico para requerimientos y diseño y agrandarlo para la implementación","Reducir el equipo en la implementación","Contratar solo externos"],"a":1,"e":"Diez programadores esperando especificaciones son diez sueldos sin producción."},{"q":"¿Cuál NO es uno de los objetivos que el gerente debe equilibrar al organizar?","o":["Minimizar la cantidad de reuniones","Permitir el crecimiento individual","Mantener al personal motivado","Cumplir el cronograma y el presupuesto"],"a":0,"e":"Los cuatro: cronograma y presupuesto, calidad, motivación y crecimiento individual."},{"q":"¿Por qué conviene pensar bien la estructura inicial del equipo?","o":["Porque reorganizar es molesto y choca con la necesidad de seguridad y la inercia de las personas","Porque lo exige ISO 9001","Porque el cliente la aprueba","Porque no se puede cambiar por contrato"],"a":0,"e":"Cada reorganización cuesta productividad y confianza."},{"q":"¿Cuántos programadores puede supervisar como máximo un LP?","o":["3","5","Sin límite","10"],"a":1,"e":"Con más se intercalan líderes de equipo."},{"q":"En la estructura I, ¿cuál es la mayor responsabilidad del líder de proyecto?","o":["El presupuesto","La calidad del producto","La planificación y el control","La comunicación con el exterior"],"a":1,"e":"El LP da la conducción técnica."},{"q":"En la estructura I, ¿cuál es la mayor responsabilidad del gerente de proyecto?","o":["La planificación y el control","La calidad del producto","Programar los módulos críticos","Probar el sistema"],"a":0,"e":"El GP da la conducción
